<script type="application/json" id="unit-data">{"schema_version":1,"group_id":"01_foundations_switching","module_number":"1–2","title":"التكوين الأساسي للأجهزة ومفاهيم التحويل","title_en":"Basic Device Configuration & Switching Concepts","summary":"من بدء تشغيل الجهاز وإدارته والتحقق منه إلى تعلّم عناوين MAC واتخاذ قرار إعادة توجيه الإطارات.","lecture":{"duration":"الوحدتان ١–٢ · ٨٥ + ٧٥ دقيقة","steps":[{"time":"10 د","topic":"الوحدة 1 · تمهيد Switch (المحوّل)، مؤشرات الحالة والوصول للإدارة."},{"time":"15 د","topic":"الوحدة 1 · المنافذ: السرعة، الازدواج وAuto-MDIX (الكشف التلقائي عن نوع توصيل الكابل)."},{"time":"15 د","topic":"الوحدة 1 · أوامر التحقق وأخطاء طبقة الوصول وخطوات التشخيص."},{"time":"15 د","topic":"الوحدة 1 · Telnet مقابل SSH وإعداد الوصول الآمن والتحقق منه."},{"time":"15 د","topic":"الوحدة 1 · الإعداد الأساسي لـ Router (الموجّه) وواجهات IPv4 وIPv6 وLoopback."},{"time":"15 د","topic":"الوحدة 1 · التحقق من الواجهات والمسارات المتصلة وفلترة المخرجات وسجل الأوامر."},{"time":"10 د","topic":"الوحدة 2 · مقارنة Hub وSwitch وآلية CSMA/CD، ثم منفذ الدخول والخروج وقرار المحوّل."},{"time":"20 د","topic":"الوحدة 2 · بناء MAC Address Table (جدول عناوين MAC): التعلّم، المؤقت، Forwarding (إعادة التوجيه) وFlooding (الإغراق)."},{"time":"15 د","topic":"الوحدة 2 · Store-and-Forward (التخزين ثم إعادة التوجيه) مقابل Cut-Through (المرور المباشر)."},{"time":"20 د","topic":"الوحدة 2 · Collision Domain (مجال الاصطدام) مقابل Broadcast Domain (مجال البث)."},{"time":"10 د","topic":"الوحدة 2 · خصائص Switch (المحوّل) التي تقلل الازدحام + مراجعة."}]},"modules":[{"module_number":1,"title":"الوحدة 1 — التكوين الأساسي للجهاز","title_en":"Basic Device Configuration","summary":"كيف يبدأ Switch (المحوّل)، وكيف نجهزه للإدارة ونضبط منافذه، ونؤمّن الوصول إليه، ثم نهيئ Router (الموجّه) بعناوين IPv4 وIPv6 ونتحقق من الواجهات والشبكات المتصلة مباشرة.","official_objective":"إعداد الأجهزة باستخدام أفضل الممارسات الأمنية.","duration":"≈ 85 دقيقة","section_ids":["u1s1","u1s2","u1s3","u1s4","u1s5","u1s6","u1s7","u1s8","u1s9","u1s10","u1s11","u1s12"]},{"module_number":2,"title":"الوحدة 2 — Switching Concepts (مفاهيم التحويل)","title_en":"Switching Concepts","summary":"كيف يتعلم Switch (المحوّل) عناوين MAC، وكيف يقرر Forwarding (إعادة التوجيه) أو Flooding (الإغراق)، وما الفرق بين طرق التحويل ومجالات الاصطدام والبث وخصائص تقليل الازدحام.","official_objective":"شرح كيفية قيام محولات الطبقة الثانية بإعادة توجيه البيانات.","duration":"≈ 75 دقيقة","section_ids":["u2s0","u2s1","u2s2","u2s3","u2s4","u2s5","u2s6"]}],"sections":[{"id":"u1s1","number":"01","toc_title":"تمهيد Switch (المحوّل)","title":"كيف يبدأ Switch (المحوّل)؟","subtitle":"قبل ظهور واجهات الشبكة أو أوامر IOS، يمر Switch (المحوّل) بتسلسل تمهيد منظم.","body_html":"<p class=\"core\">الفكرة الأساسية: <strong>Switch (المحوّل) لا ينتقل مباشرة إلى IOS.<\/strong> يبدأ عمل <strong>Boot Loader (محمّل الإقلاع)<\/strong> عند التشغيل، فيهيئ المعالج أولًا، ثم ينفّذ POST (اختبار التشغيل الذاتي)، ويهيئ نظام ملفات Flash Memory (ذاكرة فلاش)، ثم يحمّل صورة IOS إلى الذاكرة ويسلّمها التحكم.<\/p>\n<div class=\"timeline5\">\n<div class=\"tstep\" data-n=\"1\"><b>Boot Loader (محمّل الإقلاع)<\/b><span>تشغيل برنامج التحميل الموجود في ROM.<\/span><\/div>\n<div class=\"tstep\" data-n=\"2\"><b>تهيئة المعالج CPU<\/b><span>تهيئة السجلات والذاكرة الأساسية.<\/span><\/div>\n<div class=\"tstep\" data-n=\"3\"><b>POST (اختبار التشغيل الذاتي)<\/b><span>اختبار CPU وDRAM وجزء من Flash.<\/span><\/div>\n<div class=\"tstep\" data-n=\"4\"><b>Flash Memory (ذاكرة فلاش)<\/b><span>تهيئة نظام ملفات Flash Memory (ذاكرة فلاش).<\/span><\/div>\n<div class=\"tstep\" data-n=\"5\"><b>Cisco IOS<\/b><span>العثور على صورة نظام التشغيل وتحميلها وتسليم التحكم لها.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية التسلسل<\/div>\n<div class=\"keyline\"><strong>لماذا يهم؟<\/strong> لأن فهم التسلسل يفسر أين يمكن أن يتوقف الجهاز عند وجود مشكلة في العتاد، أو Boot Loader (محمّل الإقلاع)، أو صورة IOS.<\/div>\n<div class=\"grid2 study-detail\">\n<div class=\"card\"><div class=\"micro\">مرجع CLI<\/div><h4>اختيار صورة Cisco IOS وعرض الإعداد<\/h4><div class=\"cmd\">boot system flash:&lt;path&gt;<br/>show boot<\/div><\/div>\n<div class=\"card\"><div class=\"micro\">تفصيل مرجعي<\/div><h4>مؤشرات LED في Switch (المحوّل)<\/h4><p>SYST وRPS وSTAT وDUPLX وSPEED وPoE تساعد في قراءة حالة الجهاز والمنافذ بسرعة.<\/p><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>إذا تعذر تشغيل IOS: ما فائدة Boot Loader (محمّل الإقلاع)؟<\/summary><div class=\"expand-body\">يوفر Boot Loader (محمّل الإقلاع) وصولًا إلى ملفات Flash Memory (ذاكرة فلاش) من خلال منفذ Console (وحدة التحكم)، ويمكن استخدامه عند فقدان أو تلف ملفات النظام، وكذلك في بعض سيناريوهات الاستعادة.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا نجح POST (اختبار التشغيل الذاتي) لكن تعذر العثور على صورة IOS، فأي جزء من التسلسل وصل إليه الجهاز؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">نفّذ Boot Loader (محمّل الإقلاع) تهيئة المعالج وPOST، ثم وصل إلى مرحلة البحث عن صورة IOS بعد تهيئة نظام ملفات Flash Memory (ذاكرة فلاش)، لكنه لم ينجح في تحميل الصورة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Switch (المحوّل)<\/span><span class=\"term\">Boot Loader (محمّل الإقلاع)<\/span><span class=\"term\">IOS<\/span><span class=\"term\">Flash Memory (ذاكرة فلاش)<\/span><\/div>","module_number":1},{"id":"u1s2","number":"02","toc_title":"إدارة Switch (المحوّل) وSVI","title":"كيف نجهز Switch (المحوّل) للإدارة عبر الشبكة؟","subtitle":"الإدارة تحتاج SVI (واجهة VLAN الافتراضية) بعنوان مناسب، وبوابة افتراضية عند الوصول من شبكة أخرى.","body_html":"<p class=\"core\">لإدارة <strong>Switch (المحوّل)<\/strong> عبر الشبكة نستخدم <strong>SVI (واجهة VLAN الافتراضية)<\/strong>. يمكن إعطاؤها عنوان IPv4 وقناع الشبكة، ويمكن أيضًا تكوين عنوان IPv6 إذا كان ذلك مطلوبًا. وإذا كانت الإدارة عبر IPv4 ستأتي من شبكة أخرى، نحدد <strong>Default Gateway (البوابة الافتراضية)<\/strong>.<\/p>\n<div class=\"diagram\">\n<div class=\"diagram-title\">عنوان الإدارة يوجد على SVI (واجهة VLAN الافتراضية)، وليس على منفذ Layer 2 (الطبقة الثانية) عادي.<\/div>\n<div class=\"network-row\">\n<div class=\"dev\">PC<br/><small>Admin<\/small><\/div><div class=\"wire\"><span class=\"label\">شبكة الإدارة<\/span><\/div><div class=\"dev switch\">Switch (المحوّل)<br/><small>SVI على VLAN 99<\/small><\/div><div class=\"wire\"><span class=\"label\">عند الإدارة من شبكة أخرى<\/span><\/div><div class=\"dev router\">R1<\/div>\n<\/div>\n<\/div>\n<div class=\"grid3\">\n<div class=\"card\"><h4>1 · SVI (واجهة VLAN الافتراضية)<\/h4><p>واجهة منطقية مرتبطة بـ VLAN وتستخدم هنا للوصول الإداري إلى Switch (المحوّل).<\/p><\/div>\n<div class=\"card\"><h4>2 · IPv4 وIPv6<\/h4><p>يمكن تكوين عنوان IPv4، ويمكن إضافة عنوان IPv6 إلى SVI عند الحاجة.<\/p><\/div>\n<div class=\"card\"><h4>3 · Default Gateway (البوابة الافتراضية)<\/h4><p>تحتاجها إدارة IPv4 عندما يكون جهاز الإدارة في شبكة غير متصلة مباشرة بشبكة SVI.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة مهمة:<\/strong> عنوان IP على SVI مخصص للإدارة؛ ولا يجعل Switch (المحوّل) من Layer 2 (الطبقة الثانية) قادرًا تلقائيًا على Routing (التوجيه) بين الشبكات.<\/div>\n<p class=\"study-detail\"><strong>مقتطف إعداد SVI:<\/strong> يفترض إنشاء VLAN 99 مسبقًا، وربط منفذ نشط بها؛ لا تكفي الأوامر الآتية وحدها لبلوغ حالة up/up.<\/p>\n<div class=\"cmd study-detail\">interface vlan 99<br/> ip address 172.17.99.11 255.255.255.0<br/> ipv6 address 2001:db8:acad:99::1/64<br/> no shutdown<br/>exit<br/>ip default-gateway 172.17.99.1<br/>copy running-config startup-config<\/div>\n<details class=\"expand study-detail\"><summary>ملاحظات مهمة حول SVI وIPv6<\/summary><div class=\"expand-body\"><ul><li>يوصي عرض Cisco باستخدام VLAN للإدارة غير VLAN 1 كأفضل ممارسة أمنية.<\/li><li>لن تظهر SVI الخاصة بـ VLAN 99 في حالة up/up حتى تكون VLAN موجودة ويكون هناك منفذ مرتبط بها في حالة تشغيل.<\/li><li>في المثال، Switch (المحوّل) لا يحتاج بوابة افتراضية منفصلة لـ IPv6 لأنه يتلقى معلومات البوابة من Router Advertisement (RA).<\/li><li>في بعض إصدارات Catalyst 2960 القديمة قد يلزم اختيار قالب SDM يدعم IPv4 وIPv6 ثم إعادة التشغيل قبل تكوين IPv6.<\/li><\/ul><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا كان جهاز الإدارة وSwitch (المحوّل) في نفس شبكة IPv4، هل نحتاج Default Gateway (البوابة الافتراضية) حتى يتواصلا مباشرة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. نحتاج Default Gateway (البوابة الافتراضية) عندما نريد إدارة Switch (المحوّل) من شبكة IPv4 أخرى غير متصلة مباشرة بشبكة الإدارة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">SVI (واجهة VLAN الافتراضية)<\/span><span class=\"term\">Management VLAN (شبكة VLAN للإدارة)<\/span><span class=\"term\">Default Gateway (البوابة الافتراضية)<\/span><span class=\"term\">IPv4<\/span><span class=\"term\">IPv6<\/span><\/div>","module_number":1},{"id":"u1s3","number":"03","toc_title":"المنافذ والازدواج","title":"السرعة والازدواج في منافذ Switch (المحوّل)","subtitle":"مشكلة صغيرة في السرعة أو الازدواج قد تجعل الرابط يعمل، لكن بأداء سيئ.","body_html":"<p class=\"core\"><strong>Full-Duplex (الازدواج الكامل)<\/strong> يسمح للطرفين بالإرسال والاستقبال في الوقت نفسه، بينما <strong>Half-Duplex (نصف الازدواج)<\/strong> يسمح باتجاه واحد في اللحظة نفسها وقد تظهر معه الاصطدامات.<\/p>\n<div class=\"duplex\">\n<div class=\"duplex-box\"><h4>Full-Duplex (الازدواج الكامل)<\/h4><div class=\"lane\"><div class=\"end\">A<\/div><div class=\"signal two\"><\/div><div class=\"end\">B<\/div><\/div><p class=\"sub\">إرسال واستقبال متزامنان. وفي الرابط الذي يعمل Full-Duplex لا توجد اصطدامات.<\/p><\/div>\n<div class=\"duplex-box\"><h4>Half-Duplex (نصف الازدواج)<\/h4><div class=\"lane\"><div class=\"end\">A<\/div><div class=\"signal one\"><\/div><div class=\"end\">B<\/div><\/div><p class=\"sub\">اتجاه واحد في كل لحظة، ومع المنافسة على الوسط يمكن أن تحدث الاصطدامات.<\/p><\/div>\n<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><h4>Auto-Negotiation (التفاوض التلقائي)<\/h4><p>الإعداد الافتراضي للسرعة والازدواج في أمثلة Catalyst 2960 و3560 هو auto. يفيد عندما تكون إعدادات الطرف الآخر غير معروفة أو قابلة للتغير؛ وفشل التفاوض قد يسبب عدم تطابق في السرعة أو الازدواج.<\/p><\/div>\n<div class=\"card\"><h4>Auto-MDIX (الكشف التلقائي عن نوع توصيل الكابل)<\/h4><p>يحدد تلقائيًا ما إذا كان الاتصال يحتاج Straight-Through Cable (كابل مستقيم) أو Crossover Cable (كابل متقاطع). لكي يعمل، يجب أن تكون السرعة والازدواج على auto.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>ملاحظة:<\/strong> منافذ الألياف الضوئية تعمل بسرعة محددة مسبقًا وتكون Full-Duplex (الازدواج الكامل). يُفضَّل التفاوض التلقائي عندما يدعمه الطرفان. قد يلزم الضبط اليدوي في حالة خاصة؛ اضبط السرعة والازدواج على الطرفين ضبطًا متطابقًا وتحقق من الرابط.<\/div>\n<p class=\"study-detail\">المثال اليدوي لحالة تتطلبه، ويجب مطابقة الطرف المقابل؛ إعداد auto هو المسار المعتاد عندما يدعمه الطرفان.<\/p>\n<div class=\"cmd study-detail\">interface FastEthernet0/1<br/> speed 100<br/> duplex full<br/><br/><span class=\"muted\">! أو عند استخدام Auto-MDIX<\/span><br/> speed auto<br/> duplex auto<br/> mdix auto<br/><br/>show controllers ethernet-controller &lt;interface&gt; phy | include Auto-MDIX<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: رابط يعمل لكن الأداء سيئ وتظهر أخطاء غير متوقعة. ما أول إعدادين يجب مقارنتهما على الطرفين؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">السرعة والازدواج، لأن عدم التطابق بين الطرفين من الأسباب الشائعة لمشكلات الاتصال والأداء.<\/div><\/div>","module_number":1},{"id":"u1s4","number":"04","toc_title":"التحقق وأخطاء المنافذ","title":"اقرأ حالة المنفذ قبل أن تغيّر الإعدادات","subtitle":"أوامر show ليست للحفظ فقط؛ ابدأ بالحالة، ثم العدادات، ثم الوسط الفيزيائي والإعدادات.","body_html":"<p class=\"core\">البدء الجيد في استكشاف المشكلة هو تنفيذ <strong>show interfaces<\/strong> وقراءة حالة الواجهة ثم عدادات الأخطاء. عبارة <strong>up/up<\/strong> تعني أن الطبقة الفيزيائية وبروتوكول طبقة ربط البيانات يعملان.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><div class=\"micro\">الحالة<\/div><h4>up / up<\/h4><p>الواجهة تعمل فعليًا وبروتوكول الخط يعمل.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">مشكلة محتملة<\/div><h4>up / down<\/h4><p>الطبقة الفيزيائية موجودة لكن توجد مشكلة في طبقة ربط البيانات أو الطرف الآخر.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">تعطيل يدوي<\/div><h4>administratively down<\/h4><p>الواجهة مغلقة بأمر shutdown.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n<div class=\"compare-box\"><span class=\"tag\">أخطاء الإدخال<\/span><h4>Input Errors<\/h4><ul><li><strong>Runts:<\/strong> إطارات أقصر من 64 بايت.<\/li><li><strong>Giants:<\/strong> إطارات أكبر من الحد المسموح للوسط.<\/li><li><strong>CRC:<\/strong> غالبًا مشكلة في الوسط أو الكابل أو التداخل أو التوصيلات.<\/li><\/ul><\/div>\n<div class=\"compare-box\"><span class=\"tag\">أخطاء الإخراج<\/span><h4>Output Errors<\/h4><ul><li><strong>Collisions:<\/strong> طبيعية في Half-Duplex، ولا ينبغي ظهورها على رابط Full-Duplex.<\/li><li><strong>Late Collisions:<\/strong> قد تنتج عن طول كابل زائد أو سوء ضبط الازدواج.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"flow\">\n<div class=\"step\"><b>1 · show interfaces<\/b><span>حدد هل الواجهة up أم لا.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>2 · إذا كانت Down<\/b><span>تحقق من الكابل والموصلات والسرعة.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>3 · إذا كانت Up لكن الأداء سيئ<\/b><span>ابحث عن EMI/Noise وتحقق من الازدواج على الطرفين.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>4 · أعد الاختبار<\/b><span>إن بقيت المشكلة وثّق العمل وصعّدها.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية خطوات التشخيص<\/div>\n<details class=\"expand study-detail\"><summary>أوامر تحقق مفيدة في Switch (المحوّل)<\/summary><div class=\"expand-body\"><div class=\"cmd\">show interfaces [interface-id]<br/>show startup-config<br/>show running-config<br/>show flash<br/>show version<br/>show history<br/>show ip interface [interface-id]<br/>show ipv6 interface [interface-id]<br/>show mac address-table<\/div><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لديك عدد كبير من أخطاء CRC. أين تنظر أولًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">إلى الوسط الفيزيائي: الكابل، الوصلات، التداخل الكهربائي، وصحة التوصيل.<\/div><\/div>","module_number":1},{"id":"u1s5","number":"05","toc_title":"Telnet وSSH","title":"الوصول الآمن عن بُعد: لماذا SSH؟","subtitle":"الفرق ليس في القدرة على إدارة الجهاز، بل في حماية بيانات الجلسة.","body_html":"<div class=\"compare\">\n<div class=\"compare-box\"><span class=\"tag\">Telnet · TCP 23<\/span><h4>إدارة عن بُعد دون تشفير<\/h4><p>يرسل بيانات الدخول ومحتوى الجلسة كنص صريح، لذلك يمكن التقاطها عند مراقبة الشبكة.<\/p><\/div>\n<div class=\"compare-box\"><span class=\"tag\">SSH · TCP 22<\/span><h4>إدارة آمنة ومشفّرة<\/h4><p>يوفر تشفيرًا للمصادقة وللبيانات المنقولة، ولهذا يجب أن يحل محل Telnet في اتصالات الإدارة.<\/p><\/div>\n<\/div>\n<p class=\"core\">إعداد SSH يحتاج <strong>اسم جهاز مناسب + اتصال شبكي صحيح + اسم نطاق + مفاتيح RSA + مستخدم محلي + خطوط VTY + SSH الإصدار 2<\/strong>.<\/p>\n<div class=\"flow\">\n<div class=\"step\"><b>1 · تحقق من الدعم<\/b><span>استخدم show version وshow ip ssh.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>2 · اسم النطاق<\/b><span>حدد اسم النطاق.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>3 · RSA<\/b><span>أنشئ زوج مفاتيح RSA.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>4 · المستخدم المحلي<\/b><span>أنشئ اسم مستخدم وكلمة مرور.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>5 · VTY<\/b><span>اسمح بـ SSH واستخدم login local.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>6 · الإصدار 2<\/b><span>فعّل SSH version 2.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<div class=\"cmd study-detail\">show version<br/>show ip ssh<br/>ip domain-name example.local<br/>crypto key generate rsa<br/>username admin secret &lt;password&gt;<br/>line vty 0 15<br/> login local<br/> transport input ssh<br/>ip ssh version 2<\/div>\n<details class=\"expand study-detail\"><summary>التحقق والصيانة<\/summary><div class=\"expand-body\"><ul><li>وجود <strong>k9<\/strong> في اسم صورة IOS يدل في العرض على دعم الميزات التشفيرية.<\/li><li>استخدم <strong>show ip ssh<\/strong> لعرض إصدار SSH وبيانات الإعداد والتحقق من تشغيله.<\/li><li>الأمر <strong>crypto key zeroize rsa<\/strong> يحذف زوج مفاتيح RSA، وعندها يتوقف خادم SSH تلقائيًا.<\/li><\/ul><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا يكفي وضع كلمة مرور على Telnet ليصبح آمنًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن Telnet ينقل بيانات المصادقة ومحتوى الجلسة كنص صريح؛ المشكلة في غياب التشفير.<\/div><\/div>","module_number":1},{"id":"u1s6","number":"06","toc_title":"الإعداد الأساسي لـ Router (الموجّه)","title":"إعداد Router (الموجّه) يبدأ من الأساسيات","subtitle":"Cisco Router وSwitch يشتركان في بنية IOS وفي كثير من خطوات الإعداد الأولي.","body_html":"<p class=\"core\">قبل إعداد الواجهات، يوضح العرض مجموعة من المهام الأساسية التي ينبغي تنفيذها على Router (الموجّه): <strong>تسمية الجهاز، حماية الوصول بكلمات مرور، تشفير كلمات المرور الظاهرة، وضع Banner للتنبيه، ثم حفظ الإعدادات.<\/strong><\/p>\n<div class=\"grid2\">\n<div class=\"card\"><h4>هوية الجهاز والحماية<\/h4><p>اسم واضح للجهاز يميزه عن بقية أجهزة الشبكة، مع كلمات مرور لوضع Privileged EXEC وخطوط Console وVTY.<\/p><\/div>\n<div class=\"card\"><h4>Banner والحفظ<\/h4><p>Banner يقدم إشعارًا قانونيًا عن الوصول غير المصرح به، ثم تحفظ التغييرات من running-config إلى startup-config.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">configure terminal<br/>hostname R1<br/>enable secret class<br/>line console 0<br/> password cisco<br/> login<br/>exit<br/>line vty 0 4<br/> password cisco<br/> login<br/>exit<br/>service password-encryption<br/>banner motd $ Authorized Access Only! $<br/>copy running-config startup-config<\/div>\n<div class=\"keyline\"><strong>فكرة مهمة:<\/strong> تشابه أوامر IOS بين Switch (المحوّل) وRouter (الموجّه) يقلل منحنى التعلم؛ الاختلاف الأهم يبدأ في وظيفة الواجهات وطريقة ربط الشبكات.<\/div>\n<div class=\"keyline\"><strong>تنبيه للمختبر:<\/strong> كلمتا المرور class وcisco في المثال قيم تعليمية فقط. الأمر service password-encryption يخفي عرضها في الإعداد، لكنه لا يوفر حماية قوية؛ استخدم كلمات سرية فريدة وإدارة SSH في التطبيق الفعلي.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الذي يحافظ على الإعداد بعد إعادة تشغيل Router (الموجّه)؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">حفظ running-config في startup-config باستخدام copy running-config startup-config.<\/div><\/div>","module_number":1},{"id":"u1s7","number":"07","toc_title":"واجهات Router (الموجّه) وIPv4/IPv6","title":"واجهة Router (الموجّه): عنوان + تفعيل + اتصال","subtitle":"لكي تصبح الواجهة متاحة، يجب أن تكون مهيأة بعناوين مناسبة ومفعلة ومتصلة فعليًا.","body_html":"<p class=\"core\">Router (الموجّه) يدعم أنواعًا متعددة من الواجهات لأنه يربط LAN وWAN وشبكات مختلفة. في سيناريو <strong>IPv4 وIPv6 معًا<\/strong> يمكن للواجهة نفسها حمل عنوان من كل بروتوكول.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><h4>1 · العنوان<\/h4><p>استخدم <strong>ip address<\/strong> لـ IPv4 و<strong>ipv6 address<\/strong> لـ IPv6.<\/p><\/div>\n<div class=\"card\"><h4>2 · التفعيل<\/h4><p>واجهات LAN وWAN تكون shutdown افتراضيًا في العرض؛ استخدم <strong>no shutdown<\/strong>.<\/p><\/div>\n<div class=\"card\"><h4>3 · الاتصال والوصف<\/h4><p>يجب وجود اتصال فعلي حتى تعمل الطبقة الفيزيائية. ويعد وصف الواجهة ممارسة مفيدة في التوثيق واستكشاف الأعطال.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">interface GigabitEthernet0/0/0<br/> ip address 192.168.10.1 255.255.255.0<br/> ipv6 address 2001:db8:acad:1::1/64<br/> description Link to LAN 1<br/> no shutdown<\/div>\n<div class=\"diagram\"><div class=\"diagram-title\">كل واجهة فعالة في Router (الموجّه) تمثل اتصالًا بشبكة؛ ويمكن أن تحمل IPv4 وIPv6 معًا.<\/div><div class=\"network-row\"><div class=\"lan-zone\"><span class=\"zone-title\">LAN 1<\/span><div class=\"dev\">PC<\/div><div class=\"dev switch\">Switch (المحوّل)<\/div><\/div><div class=\"wire\"><\/div><div class=\"dev router\">R1<\/div><div class=\"wire\"><\/div><div class=\"lan-zone\"><span class=\"zone-title\">LAN 2<\/span><div class=\"dev switch\">Switch (المحوّل)<\/div><div class=\"dev\">PC<\/div><\/div><\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: تم تكوين عنوان IP على واجهة Router (الموجّه) لكنها ما زالت down. ما الشرطان الآخران اللذان تفحصهما؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تحقق من تفعيل الواجهة بأمر no shutdown ومن وجود اتصال فعلي بالطرف الآخر.<\/div><\/div>","module_number":1},{"id":"u1s8","number":"08","toc_title":"Loopback Interface (واجهة الاسترجاع)","title":"واجهة منطقية مستقرة داخل Router (الموجّه)","subtitle":"Loopback Interface لا ترتبط بمنفذ فيزيائي وتفيد في الاختبار والإدارة ومحاكاة شبكات إضافية.","body_html":"<p class=\"core\"><strong>Loopback Interface (واجهة الاسترجاع)<\/strong> واجهة برمجية داخل Router (الموجّه). لا يمكن توصيلها بجهاز آخر ماديًا، وتكون في حالة up ما دام Router (الموجّه) يعمل.<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><h4>الاختبار والإدارة<\/h4><p>توفر واجهة ثابتة يمكن الاعتماد عليها في اختبارات العمليات الداخلية وإدارة الجهاز.<\/p><\/div>\n<div class=\"card\"><h4>المختبرات<\/h4><p>يمكن إنشاء أكثر من Loopback Interface لمحاكاة شبكات إضافية دون الحاجة إلى منافذ أو أجهزة فعلية إضافية.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">interface loopback 0<br/> ip address &lt;ip-address&gt; &lt;subnet-mask&gt;<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا تستخدم Loopback Interface (واجهة الاسترجاع) كثيرًا في المختبر؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنها تسمح بمحاكاة شبكة أو عنوان إضافي داخل Router (الموجّه) دون الاعتماد على منفذ فيزيائي أو جهاز آخر.<\/div><\/div>","module_number":1},{"id":"u1s9","number":"09","toc_title":"التحقق من الواجهات وIPv6","title":"تحقق من الحالة والعناوين قبل فحص Routing Table (جدول التوجيه)","subtitle":"أوامر التحقق السريع تعطيك حالة كل واجهة وعناوين IPv4 وIPv6.","body_html":"<div class=\"grid2\">\n<div class=\"card\"><div class=\"micro\">IPv4<\/div><h4>show ip interface brief<\/h4><p>يعرض ملخص الواجهات وعنوان IPv4 وحالتي Status وProtocol.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">IPv6<\/div><h4>show ipv6 interface brief<\/h4><p>يعرض حالة الواجهات وعناوين IPv6، ومنها Link-Local Address الذي يبدأ عادةً بـ FE80.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">إعداد واجهة محددة<\/div><h4>show running-config interface<\/h4><p>يعرض الأوامر الحالية المطبقة على واجهة بعينها.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">تفاصيل أوسع<\/div><h4>show interfaces / show ip interface / show ipv6 interface<\/h4><p>تعرض تفاصيل الحالة، تدفق الحزم، والمعلومات الخاصة بـ IPv4 أو IPv6.<\/p><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>ماذا أبحث عنه في IPv6؟<\/summary><div class=\"expand-body\">عند تعيين Global Unicast Address لواجهة IPv6 يظهر معها Link-Local Address يبدأ بـ <strong>FE80<\/strong>. ويعرض <strong>show ipv6 interface<\/strong> كذلك عناوين Multicast المرتبطة بالواجهة، والتي تبدأ في المثال بالبادئة <strong>FF02<\/strong>.<\/div><\/details>\n<div class=\"cmd study-detail\">show ip interface brief<br/>show ipv6 interface brief<br/>show running-config interface GigabitEthernet0/0/0<br/>show interfaces<br/>show ip interface<br/>show ipv6 interface GigabitEthernet0/0/0<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي أمر تستخدمه للحصول على نظرة سريعة على حالة جميع واجهات IPv6؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">show ipv6 interface brief.<\/div><\/div>","module_number":1},{"id":"u1s10","number":"10","toc_title":"تمهيد: المسارات المتصلة والمحلية","title":"ماذا يضيف Router (الموجّه) إلى Routing Table (جدول التوجيه)؟","subtitle":"تمهيد لفهم ما يظهر تلقائيًا في جدول التوجيه؛ الشرح الكامل لآلية التوجيه يأتي في الوحدة 14.","body_html":"<p class=\"core\">عندما تكون واجهة Router (الموجّه) مهيأة وعاملة، تظهر الشبكة المتصلة مباشرة في <strong>Routing Table (جدول التوجيه)<\/strong>. في IOS 15 يعرض المثال إدخالين مرتبطين بالواجهة: <strong>C = Connected<\/strong> للشبكة و<strong>L = Local<\/strong> لعنوان الواجهة نفسه.<\/p>\n<div class=\"compare\">\n<div class=\"compare-box\"><span class=\"tag\">C · Connected<\/span><h4>الشبكة المتصلة مباشرة<\/h4><p>يمثل Prefix الشبكة الموجودة على الواجهة الفعالة.<\/p><\/div>\n<div class=\"compare-box\"><span class=\"tag\">L · Local<\/span><h4>عنوان Router (الموجّه) نفسه<\/h4><p>مسار مضيف لعنوان الواجهة؛ /32 في IPv4 و/128 في IPv6، وتكون المسافة الإدارية له 0 في المثال.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">show ip route<br/>show ipv6 route<\/div>\n<div class=\"keyline\"><strong>IPv6:<\/strong> عندما تكون الواجهة ذات Global Unicast Address في حالة up/up، يضاف Prefix الشبكة كمسار Connected، ويضاف عنوان الواجهة نفسه كمسار Local بطول /128.<\/div>\n<div class=\"keyline\"><strong>حدود هذا القسم:<\/strong> المطلوب هنا فقط التعرف على C وL الناتجتين عن الواجهات المفعّلة. اختيار أفضل المسارات وLongest Match وAD وMetric سيأتي تفصيليًا في الوحدة 14.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: الواجهة لها عنوان IP لكن الشبكة لا تظهر بالحرف C داخل Routing Table. ما أول حالة تتحقق منها؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تحقق أن الواجهة فعالة وفي حالة up/up؛ عندها تصبح الشبكة المتصلة مباشرة مسارًا فعالًا.<\/div><\/div>","module_number":1},{"id":"u1s11","number":"11","toc_title":"فلترة show وسجل الأوامر","title":"اجعل مخرجات CLI أسرع في القراءة","subtitle":"فلترة المخرجات وسجل الأوامر أدوات عملية لتقليل الوقت أثناء التحقق والتشخيص.","body_html":"<div class=\"grid2\">\n<div class=\"card\"><h4>فلترة مخرجات show<\/h4><p>ضع الرمز <strong>|<\/strong> بعد أمر show ثم استخدم أحد المعاملات: <strong>section<\/strong> أو <strong>include<\/strong> أو <strong>exclude<\/strong> أو <strong>begin<\/strong>.<\/p><\/div>\n<div class=\"card\"><h4>Command History<\/h4><p>سجل الأوامر مفعّل افتراضيًا في العرض ويحفظ آخر 10 أوامر. استخدم <strong>show history<\/strong> لعرضه، ويمكن تغيير حجم السجل للجلسة الحالية.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">show running-config | section interface<br/>show interfaces | include protocol<br/>show interfaces | exclude down<br/>show running-config | begin line vty<br/><br/>show history<br/>terminal history size &lt;number&gt;<br/>terminal length 0<\/div>\n<details class=\"expand study-detail\"><summary>اختصارات الاستدعاء من السجل<\/summary><div class=\"expand-body\"><strong>Ctrl+P<\/strong> أو السهم للأعلى يستدعي أوامر أقدم، و<strong>Ctrl+N<\/strong> أو السهم للأسفل يعود إلى أوامر أحدث.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: تريد إظهار الأسطر التي تحتوي كلمة محددة فقط من مخرجات show. أي معامل فلترة تستخدم؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">include.<\/div><\/div>","module_number":1},{"id":"u1s12","number":"✓","toc_title":"خلاصة الوحدة 1","title":"ماذا يجب أن يبقى في ذهنك؟","subtitle":"العلاقات الأساسية التي تغطي أهداف الوحدة الخمسة.","body_html":"<div class=\"summary-box\"><h4>خلاصة الوحدة<\/h4><div class=\"summary-list\">\n<div class=\"summary-item\">Switch (المحوّل) يمر بخمس مراحل تمهيد رئيسية، ويمكن الاستفادة من Boot Loader (محمّل الإقلاع) عند فقدان أو تلف ملفات النظام.<\/div>\n<div class=\"summary-item\">إدارة Switch (المحوّل) تعتمد على SVI (واجهة VLAN الافتراضية) بعنوان IP، وبوابة افتراضية لـ IPv4 عند الإدارة من شبكة أخرى.<\/div>\n<div class=\"summary-item\">السرعة والازدواج وAuto-MDIX عناصر أساسية في ضبط منافذ Switch (المحوّل)، ويجب فحصها عند مشكلات الاتصال.<\/div>\n<div class=\"summary-item\">show interfaces يكشف حالة الرابط وأخطاء الوسط مثل runts وgiants وCRC وcollisions وlate collisions.<\/div>\n<div class=\"summary-item\">SSH عبر TCP 22 يوفر اتصالًا مشفرًا ويجب أن يحل محل Telnet عبر TCP 23 في الإدارة عن بُعد.<\/div>\n<div class=\"summary-item\">الإعداد الأساسي لـ Router (الموجّه) يشمل الهوية والحماية وBanner وحفظ الإعداد، ثم إعداد الواجهات بعناوين IPv4 وIPv6 وتفعيلها.<\/div>\n<div class=\"summary-item\">Loopback Interface (واجهة الاسترجاع) واجهة منطقية مفيدة للاختبار والإدارة ومحاكاة الشبكات.<\/div>\n<div class=\"summary-item\">أوامر show تؤكد حالة IPv4 وIPv6، بينما C وL في Routing Table يوضحان الشبكات المتصلة وعناوين الواجهات المحلية.<\/div>\n<div class=\"summary-item\">فلترة مخرجات show وسجل الأوامر يسرّعان العمل في CLI أثناء التحقق واستكشاف الأعطال.<\/div>\n<\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: لماذا تظهر C وL في الوحدة 1 دون الدخول في تفاصيل اختيار أفضل Route؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن الوحدة 1 تركز على إعداد الجهاز والتحقق منه؛ C وL تمهيد لما ينتجه إعداد الواجهات، أما منطق التوجيه الكامل فيأتي لاحقًا.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Switch (المحوّل)<\/span><span class=\"term\">Router (الموجّه)<\/span><span class=\"term\">SVI (واجهة VLAN الافتراضية)<\/span><span class=\"term\">Full-Duplex (الازدواج الكامل)<\/span><span class=\"term\">Auto-MDIX<\/span><span class=\"term\">SSH<\/span><span class=\"term\">IPv4<\/span><span class=\"term\">IPv6<\/span><span class=\"term\">Loopback Interface (واجهة الاسترجاع)<\/span><span class=\"term\">Routing Table (جدول التوجيه)<\/span><\/div>","module_number":1},{"id":"u2s0","number":"تمهيد","toc_title":"من Hub إلى Switch","title":"لماذا حلّ Switch محل Hub؟","subtitle":"قارن الوسط المشترك بالتوجيه بحسب عنوان MAC قبل دراسة آلية التحويل.","body_html":"<p class=\"core\">قبل دراسة <strong>Switch (المحوّل)<\/strong>، تخيّل ثلاثة أجهزة A وB وC. يعمل <strong>Hub (الموزّع)<\/strong> في الطبقة الفيزيائية ويكرر الإشارة إلى المنافذ الأخرى؛ تتشارك الأجهزة سعة المقطع ووسطه. أما Switch فيفحص الإطار في الطبقة الثانية ويتعلم عناوين MAC ليوجه الوجهة الأحادية المعروفة إلى منفذها.<\/p>\n<div class=\"compare\"><div class=\"compare-box\"><h4>Hub · وسط مشترك<\/h4><ul><li>السعة المتاحة مشتركة بين الأجهزة المتصلة بالمقطع.<\/li><li>تصل الإشارة إلى جميع المنافذ الأخرى، حتى عندما يقصد A الجهاز B وحده.<\/li><li>في التشغيل Half-Duplex تستخدم أجهزة Ethernet آلية <strong>CSMA/CD<\/strong>: تستمع إلى الوسط قبل الإرسال، وتكشف التصادم إن وقع، ثم تنتظر مدة عشوائية قبل إعادة المحاولة.<\/li><\/ul><\/div><div class=\"compare-box\"><h4>Switch · منافذ مستقلة<\/h4><ul><li>لكل جهاز رابط بسعته المحددة، مع بقاء قيود وصلات الرفع وقدرة الجهاز.<\/li><li>إذا عُرف عنوان MAC الوجهة، يخرج الإطار من منفذها فقط.<\/li><li>على الروابط Full-Duplex السليمة لا يحدث تصادم الوسط المشترك ولا تُستخدم CSMA/CD. وقد يعمل منفذ Switch في Half-Duplex في سياقات قديمة، فتظل الآلية ذات صلة هناك.<\/li><\/ul><\/div><\/div>\n<div class=\"keyline\"><strong>حدود التحسين:<\/strong> إذا كانت الوجهة مجهولة أو كان الإطار Broadcast، يغرقه Switch عبر المنافذ المناسبة في VLAN نفسها عدا منفذ الدخول؛ ولا يزيل البث بمجرد استبدال Hub.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: يرسل A إطارًا أحادي الوجهة إلى B المعروف في جدول MAC، بينما C على المنفذ الثالث. من يستقبل نسخة عبر Hub، ومن يستقبلها عبر Switch؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يكرر Hub الإشارة نحو B وC. يوجه Switch الإطار إلى منفذ B وحده عندما يعرف موقع عنوانه. أما الوجهة المجهولة والبث فيعاملان بإغراق مناسب داخل VLAN.<\/div><\/div>","module_number":2},{"id":"u2s1","number":"01","toc_title":"كيف يقرر Switch (المحوّل)؟","title":"من أين يدخل Frame (الإطار)، ومن أين يخرج؟","subtitle":"منفذ الدخول هو المنفذ الذي يستقبل Frame (الإطار)، و منفذ الخروج هو المنفذ الذي يغادر منه.","body_html":"<p class=\"core\">يطلق Cisco على اتجاه دخول Frame (الإطار) إلى الواجهة اسم <strong>Ingress<\/strong>، وعلى خروجه اسم <strong>Egress<\/strong>. يتخذ Switch (المحوّل) قرار Forwarding (إعادة التوجيه) باستخدام منفذ الدخول وعنوان MAC الوجهة، ويعتمد على <strong>MAC Address Table (جدول عناوين MAC)<\/strong>.<\/p>\n<div class=\"flow\"><div class=\"step\"><b>Ingress · منفذ الدخول<\/b><span>استقبال Frame (الإطار) على منفذ محدد.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>عنوان MAC المصدر<\/b><span>تعلّم عنوان المصدر وربطه بمنفذ الدخول.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>عنوان MAC الوجهة<\/b><span>البحث عن الوجهة داخل MAC Address Table (جدول عناوين MAC).<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Egress · منفذ الخروج<\/b><span>اختيار المنفذ المناسب أو اللجوء إلى Flooding (الإغراق).<\/span><\/div><\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية المسار<\/div>\n<div class=\"keyline\"><strong>قاعدة:<\/strong> Switch (المحوّل) لا يعيد إرسال Frame (الإطار) من نفس الواجهة التي استلمه منها.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي عنوان يتعلم منه Switch (المحوّل) موقع الجهاز: عنوان MAC المصدر أم عنوان MAC الوجهة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">عنوان MAC المصدر؛ لأنه يعرف أن الجهاز صاحب هذا العنوان موجود خلف منفذ الدخول الذي وصل منه Frame (الإطار).<\/div><\/div>","module_number":2},{"id":"u2s2","number":"02","toc_title":"MAC Address Table (جدول عناوين MAC)","title":"التعلم أولًا، ثم Forwarding (إعادة التوجيه)","subtitle":"MAC Address Table (جدول عناوين MAC) هو ذاكرة Switch (المحوّل) عن موقع الأجهزة داخل الشبكة المحلية.","body_html":"<p class=\"core\">عند وصول Frame (الإطار)، يسجل Switch (المحوّل) <strong>عنوان MAC المصدر + منفذ الدخول<\/strong>. ثم يبحث عن <strong>عنوان MAC الوجهة<\/strong>. إذا وجد الوجهة، يرسل Frame إلى المنفذ المعروف. وإذا لم يجدها، يستخدم <strong>Flooding (الإغراق)<\/strong>.<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><div class=\"micro\">Learn · التعلّم<\/div><h4>افحص المصدر<\/h4><p>إذا لم يكن عنوان MAC المصدر موجودًا، يضاف إلى الجدول. وإذا كان موجودًا، يعاد ضبط مؤقته.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">Forward · القرار<\/div><h4>افحص الوجهة<\/h4><p>وجهة معروفة → منفذ محدد. وجهة غير معروفة → Flooding (الإغراق) إلى جميع المنافذ المناسبة ما عدا منفذ الدخول.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>MAC Aging:<\/strong> يُجدَّد مؤقت الإدخال الديناميكي عند استخدامه أو تحديثه. في بعض طرازات Catalyst تكون القيمة الافتراضية 300 ثانية، ويمكن تغييرها؛ تحقق من إعداد الجهاز الفعلي.<\/div>\n<div class=\"diagram\"><div class=\"diagram-title\">سيناريو سريع: PC-A يرسل إلى PC-B والوجهة غير موجودة بعد في الجدول.<\/div><div class=\"network-row\"><div class=\"dev\">PC-A<\/div><div class=\"wire\"><span class=\"label\">منفذ الدخول<\/span><\/div><div class=\"dev switch\">Switch (المحوّل)<\/div><div class=\"wire\"><span class=\"label\">Flooding (الإغراق)<\/span><\/div><div class=\"dev\">PC-B<\/div><div class=\"dev\">PC-C<\/div><\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا يمكن لـ Switch (المحوّل) إرسال إطار أحادي الإرسال مجهول الوجهة إلى منفذ واحد فقط؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنه لا يعرف بعد أي منفذ يقود إلى عنوان MAC الوجهة، لذلك يستخدم Flooding (الإغراق) إلى بقية المنافذ المناسبة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">MAC Address Table (جدول عناوين MAC)<\/span><span class=\"term\">CAM<\/span><span class=\"term\">Flooding (الإغراق)<\/span><\/div>","module_number":2},{"id":"u2s3","number":"03","toc_title":"Forwarding Methods (طرق إعادة التوجيه)","title":"هل ينتظر Switch (المحوّل) Frame (الإطار) كاملًا؟","subtitle":"هنا يظهر الفرق بين Store-and-Forward (التخزين ثم إعادة التوجيه) و Cut-Through (المرور المباشر) .","body_html":"<p class=\"core\">تستخدم Switches دوائر <strong>ASIC<\/strong> لاتخاذ قرارات سريعة. وبعد استقبال Frame (الإطار) تعتمد إحدى طريقتين أساسيتين: <strong>Store-and-Forward (التخزين ثم إعادة التوجيه)<\/strong> أو <strong>Cut-Through (المرور المباشر)<\/strong>.<\/p>\n<div class=\"compare\">\n<div class=\"compare-box\"><span class=\"tag\">Store-and-Forward (التخزين ثم إعادة التوجيه)<\/span><h4>استقبل Frame كاملًا ثم قرر<\/h4><ul><li>يفحص FCS بحثًا عن أخطاء CRC.<\/li><li>يتخلص من الإطارات التالفة.<\/li><li>يستخدم Buffering (التخزين المؤقت).<\/li><li>يمكنه التعامل مع اختلاف السرعة بين منفذ الدخول ومنفذ الخروج.<\/li><li>يتحدد أسلوب التحويل المتاح حسب طراز المحوّل؛ لا تفترض طريقة افتراضية واحدة لكل أجهزة Cisco.<\/li><\/ul><\/div>\n<div class=\"compare-box\"><span class=\"tag\">Cut-Through (المرور المباشر)<\/span><h4>ابدأ بعد معرفة الوجهة<\/h4><ul><li>يبدأ Forwarding بعد قراءة عنوان MAC الوجهة وتحديد منفذ الخروج.<\/li><li>مناسب عندما يكون زمن التأخير المنخفض جدًا مطلوبًا.<\/li><li>لا يفحص FCS كاملًا، لذلك قد يمرر الأخطاء.<\/li><li>التعامل مع اختلاف سرعة منفذ الدخول والخروج يعتمد على طراز الجهاز وآلية التخزين؛ لا تعمم هذه المقارنة على كل المحولات.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"keyline\"><strong>على Catalyst 2960:<\/strong> يستخدم Store-and-Forward دائمًا؛ تُعرض Cut-Through للمقارنة المفاهيمية مع طرازات أخرى.<\/div>\n<div class=\"keyline\"><strong>Fragment-Free:<\/strong> نوع من Cut-Through ينتظر أول <strong>64 بايت<\/strong> للتأكد من أن Frame ليس Runt قبل بدء Forwarding.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا كان الهدف منع تمرير الإطارات ذات CRC غير صحيح، أي طريقة تختار؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Store-and-Forward (التخزين ثم إعادة التوجيه) لأنها تستقبل Frame كاملًا وتتحقق من FCS قبل Forwarding.<\/div><\/div>","module_number":2},{"id":"u2s4","number":"04","toc_title":"Collision Domain (مجال الاصطدام)","title":"Collision Domain (مجال الاصطدام)","subtitle":"السؤال ليس فقط: هل هناك Switch (المحوّل)؟ بل أيضًا: هل الرابط يعمل في وضع Full-Duplex (الازدواج الكامل) أم Half-Duplex (نصف الازدواج)؟","body_html":"<p class=\"core\">في رابط <strong>Full-Duplex (الازدواج الكامل)<\/strong> تختفي الاصطدامات. أما إذا كان هناك طرف واحد أو أكثر يعمل في وضع <strong>Half-Duplex (نصف الازدواج)<\/strong> فينشأ تنافس على عرض النطاق وتصبح الاصطدامات ممكنة.<\/p>\n<div class=\"grid2\"><div class=\"card\"><h4>المشكلة التقليدية<\/h4><p>أجهزة Layer 1 (الطبقة الأولى) وHalf-Duplex (نصف الازدواج) تجعل الأجهزة تتنافس على الوسط المشترك.<\/p><\/div><div class=\"card\"><h4>مع Switch (المحوّل)<\/h4><p>Microsegmentation (التقسيم الدقيق) مع Full-Duplex يعزل الاتصالات ويزيل الاصطدامات على الروابط العاملة بالازدواج الكامل.<\/p><\/div><\/div>\n<div class=\"keyline\"><strong>ملاحظة:<\/strong> يذكر العرض أن Auto-Negotiation (التفاوض التلقائي) هو الإعداد الافتراضي الشائع للسرعة والازدواج في كثير من الأجهزة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل وجود Switch (المحوّل) وحده يضمن عدم وجود Collision Domain (مجال الاصطدام) مهما كان إعداد الازدواج؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. إذا كان الرابط يعمل Half-Duplex (نصف الازدواج) يمكن أن تصبح الاصطدامات ممكنة.<\/div><\/div>","module_number":2},{"id":"u2s5","number":"05","toc_title":"Broadcast Domain (مجال البث)","title":"Broadcast Domain (مجال البث)","subtitle":"Switch (المحوّل) يقلل الاصطدامات، لكنه لا يوقف Broadcast (البث) داخل نفس Broadcast Domain (مجال البث).","body_html":"<p class=\"core\">عندما يستقبل Switch (المحوّل) Frame بث، يقوم بإرساله إلى جميع المنافذ المناسبة ما عدا منفذ الدخول. لذلك يمتد <strong>Broadcast Domain (مجال البث)<\/strong> عبر أجهزة Layer 1 وLayer 2 داخل LAN، وتشكّل كل VLAN نطاق بث مستقلًا؛ ولا تُمرَّر إطارات البث بين VLANs بواسطة التوجيه في الظروف المعتادة.<\/p>\n<div class=\"diagram\"><div class=\"diagram-title\">يمكن تقسيم مجال البث بواسطة VLANs، ويتيح جهاز Layer 3 مثل Router أو Multilayer Switch الاتصال بين الشبكات من دون تمرير بث Layer 2 بينها.<\/div><div class=\"network-row\"><div class=\"lan-zone\"><span class=\"zone-title\">Broadcast Domain A<\/span><div class=\"dev\">PC<\/div><div class=\"dev switch\">Switch (المحوّل)<\/div><\/div><div class=\"wire\"><\/div><div class=\"dev router\">Router (الموجّه)<\/div><div class=\"wire\"><\/div><div class=\"lan-zone\"><span class=\"zone-title\">Broadcast Domain B<\/span><div class=\"dev switch\">Switch (المحوّل)<\/div><div class=\"dev\">PC<\/div><\/div><\/div><\/div>\n<div class=\"keyline\"><strong>أثر التوسع:<\/strong> زيادة أجهزة Layer 1 وLayer 2 توسع Broadcast Domain، وكثرة Broadcasts قد تسبب ازدحامًا وضعفًا في أداء الشبكة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل يمكن لمحوّل واحد أن يحتوي أكثر من Broadcast Domain (مجال بث)؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">نعم؛ تقسيم منافذه إلى VLANs مختلفة ينشئ مجالات بث منفصلة. ويمكن لجهاز Layer 3 توجيه الحركة بينها دون تمرير بث Layer 2.<\/div><\/div>","module_number":2},{"id":"u2s6","number":"06","toc_title":"تقليل الازدحام","title":"كيف يساعد Switch (المحوّل) في تقليل الازدحام؟","subtitle":"MAC Address Table وFull-Duplex مهمان، لكن الأداء يستفيد أيضًا من سرعة المنافذ والبنية الداخلية والذاكرة وكثافة المنافذ.","body_html":"<div class=\"flow\">\n<div class=\"step\"><b>1 · Learn<\/b><span>تعلّم Source MAC وربطه بمنفذ الدخول.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>2 · Lookup<\/b><span>ابحث عن Destination MAC في جدول MAC.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>3 · Decide<\/b><span>Forward إذا كانت الوجهة معروفة، Flood إذا كانت غير معروفة أوBroadcast، ولا يعيد الإطار من منفذ الدخول نفسه.<\/span><\/div>\n<\/div>\n<div class=\"compare\">\n<div class=\"compare-box\"><div class=\"micro\">Broadcast<\/div><h4>Flooding مقصود<\/h4><p>عنوان الوجهة Broadcast، لذلك يُرسل إلى المنافذ المناسبة داخل VLAN ما عدا منفذ الدخول.<\/p><\/div>\n<div class=\"compare-box\"><div class=\"micro\">Unknown Unicast<\/div><h4>Flooding بسبب عدم المعرفة<\/h4><p>الوجهة Unicast لكن عنوانها غير موجود بعد في MAC Address Table.<\/p><\/div>\n<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><h4>Fast Port Speeds<\/h4><p>المنافذ الأسرع ترفع قدرة Switch (المحوّل) على تمرير الحركة؛ ويذكر العرض أن السرعات قد تصل حسب الطراز إلى 100Gbps.<\/p><\/div>\n<div class=\"card\"><h4>Fast Internal Switching<\/h4><p>استخدام ناقل داخلي سريع أو ذاكرة مشتركة يرفع أداء التحويل داخل الجهاز.<\/p><\/div>\n<div class=\"card\"><h4>Large Frame Buffers<\/h4><p>توفر مساحة تخزين مؤقت لمعالجة كميات كبيرة من Frames (الإطارات).<\/p><\/div>\n<div class=\"card\"><h4>High Port Density<\/h4><p>توفر عددًا أكبر من المنافذ لربط أجهزة LAN مع إبقاء قدر أكبر من الحركة محليًا وتقليل الازدحام.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>معًا:<\/strong> MAC Address Table (جدول عناوين MAC) + Full-Duplex (الازدواج الكامل) + موارد Switch الداخلية تساعد في تقليل الاصطدامات والازدحام وتحسين الأداء.<\/div>\n<div class=\"summary-box\"><h4>الخلاصة الذهنية<\/h4><div class=\"summary-list\">\n<div class=\"summary-item\">Ingress هو الدخول وEgress هو الخروج؛ وSwitch (المحوّل) يتعلم من عنوان MAC المصدر ويقرر باستخدام عنوان MAC الوجهة.<\/div>\n<div class=\"summary-item\">عنوان الوجهة المجهول وBroadcast (البث) يؤديان إلى Flooding (الإغراق) إلى جميع المنافذ المناسبة ما عدا منفذ الدخول.<\/div>\n<div class=\"summary-item\">Store-and-Forward (التخزين ثم إعادة التوجيه) يفحص FCS ويمكنه موازنة اختلاف السرعات؛ Cut-Through (المرور المباشر) يقلل زمن التأخير لكنه قد يمرر الأخطاء.<\/div>\n<div class=\"summary-item\">Full-Duplex (الازدواج الكامل) يزيل الاصطدامات، بينما Half-Duplex (نصف الازدواج) يعيد إمكانية الاصطدام والتنافس على الوسط.<\/div>\n<div class=\"summary-item\">يمتد Broadcast Domain داخل VLAN الواحدة عبر المحولات، وتفصل VLANs مجالات البث؛ ولا يمرر Router أو واجهة Layer 3 بث Layer 2 بينها عادةً.<\/div>\n<div class=\"summary-item\">سرعة المنافذ، التحويل الداخلي السريع، Frame Buffers الكبيرة وكثافة المنافذ عوامل إضافية لتقليل الازدحام.<\/div>\n<\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: ما الفرق بين Broadcast Flooding وUnknown Unicast Flooding؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">الأول يحدث لأن الوجهة Broadcast أصلًا، والثاني لأن الوجهة Unicast لكن المحوّل لا يعرف منفذها بعد.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Ingress<\/span><span class=\"term\">Egress<\/span><span class=\"term\">MAC Address Table (جدول عناوين MAC)<\/span><span class=\"term\">Store-and-Forward (التخزين ثم إعادة التوجيه)<\/span><span class=\"term\">Cut-Through (المرور المباشر)<\/span><span class=\"term\">Collision Domain (مجال الاصطدام)<\/span><span class=\"term\">Broadcast Domain (مجال البث)<\/span><\/div>","module_number":2}],"presentation":{"template_version":"group-2.1-html-motion","animations":[{"id":"switch_boot","after_section_id":"u1s1","title":"رحلة تشغيل المحوّل","scene":"animations/switch_boot/scene.json","source_label":"Cisco Catalyst 2960 — بدء تشغيل المحوّل","source_url":"https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-0_2_se/configuration/guide/scg2960/swipaddr.html"},{"id":"mac_learning","after_section_id":"u2s2","title":"رحلة الإطار: تعلّم MAC ثم الإغراق والتوجيه","scene":"animations/mac_learning/scene.json","source_label":"Cisco Catalyst 2960 — MAC address table","source_url":"https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_1_e/configuration/guide/2960_scg/swadmin.html"}],"challenges":[{"id":"duplex_diagnosis","after_section_id":"u1s3","title":"شخّص رابطًا بطيئًا","scenario":"خادم ثابت متصل بمحوّل Catalyst. على الخادم 100 Mbps / Full-Duplex يدويًا، وعلى منفذ المحوّل Auto. الرابط يعمل لكن تظهر أخطاء ويتدهور الأداء. ما الإجراء الأول؟","options":["رفع سرعة الطرفين إلى 1 Gbps دون فحص","فحص السرعة والازدواج على الطرفين، ثم توحيد الإعداد أو تفعيل Auto على الطرفين إن دعماه","تغيير عنوان SVI فقط"],"correct_index":1,"explanation":"عدم تطابق الازدواج سبب محتمل. افحص حالة الطرفين وعدّادات الأخطاء، ثم استخدم Auto على الطرفين عندما يدعمانه أو طابق الضبط اليدوي عند الحاجة.","discussion_seconds":60},{"id":"mac_prediction","after_section_id":"u2s2","title":"تنبأ بمسار الإطار","scenario":"PC-A على Fa0/1 يرسل إطارًا إلى B، ولم يتعلم المحوّل عنوان B بعد. PC-B على Fa0/2 وPC-C على Fa0/3 ضمن VLAN نفسها. ماذا يحدث قبل تشغيل المشهد؟","options":["يتعلم المحوّل A من عنوان المصدر ثم يغرق الإطار عبر Fa0/2 وFa0/3","يسقط الإطار لأن B غير معروف","يرسل الإطار إلى Fa0/2 فقط"],"correct_index":0,"explanation":"يتعلم المحوّل عنوان المصدر A على Fa0/1، ويغرق الإطار مجهول الوجهة إلى المنافذ الملائمة في VLAN نفسها عدا منفذ الدخول. عند رد B يتعلم موضعه.","discussion_seconds":75},{"id":"vlan_boundary","after_section_id":"u2s5","title":"اتخذ قرار العزل","scenario":"محطة ضمن VLAN 10 ترسل بثًا Layer 2. على المحوّل نفسه محطة ضمن VLAN 20. هل يصل إليها البث مباشرة؟","options":["نعم، لأن المحطتين على المحوّل نفسه","لا، لأن لكل VLAN مجال بث مستقل","نعم، إذا كان للمحوّل SVI للإدارة"],"correct_index":1,"explanation":"لا يمر بث Layer 2 من VLAN 10 إلى VLAN 20 لمجرد اشتراكهما في المحوّل. يمكن التوجيه بين الشبكتين عبر Layer 3 دون نقل إطار البث بينهما.","discussion_seconds":60}],"opening_comparison":{"id":"hub_vs_switch","title":"لماذا حلّ المحوّل محل Hub؟","placement":"بداية الوحدة ٢ بعد شريحة عنوان الوحدة وقبل القسم الأول","target":"ثلاثة أجهزة A وB وC على شبكة Ethernet واحدة؛ روابط المحوّل Full-Duplex، وجدول MAC معلوم أو غير معلوم حسب السيناريو.","scenarios":[{"id":"known","label":"وجهة معروفة","question":"A يرسل إطارًا أحادي الوجهة إلى B، وعنوان B معروف لدى المحوّل. أي المنافذ تستقبل النسخة؟","hub_ports":["B","C"],"switch_ports":["B"],"hub_explanation":"Hub يكرر الإشارة على جميع منافذه الأخرى، فيرى C الإشارة أيضًا.","switch_explanation":"Switch يقرأ عنوان MAC الوجهة ويوجه الإطار إلى منفذ B فقط.","benefit":"خفض الإرسال غير الضروري للوجهة الأحادية المعروفة."},{"id":"unknown","label":"وجهة مجهولة","question":"A يرسل إطارًا أحادي الوجهة إلى B، لكن عنوان B غير موجود في جدول MAC. ماذا يحدث؟","hub_ports":["B","C"],"switch_ports":["B","C"],"hub_explanation":"Hub يكرر الإشارة إلى B وC دون فحص عنوان MAC.","switch_explanation":"Switch يغرق الإطار المجهول إلى المنافذ الأخرى في VLAN نفسها، ويستثني منفذ A.","benefit":"لم يُحلّ الإغراق في حالة الوجهة المجهولة؛ يتغير القرار بعد تعلّم العنوان."},{"id":"broadcast","label":"إطار بث","question":"A يرسل إطار Broadcast ضمن VLAN واحدة. هل يمنع المحوّل وصوله إلى بقية المنافذ؟","hub_ports":["B","C"],"switch_ports":["B","C"],"hub_explanation":"Hub يكرر الإشارة إلى بقية منافذه.","switch_explanation":"Switch يرسل البث إلى المنافذ الأخرى ضمن VLAN نفسها، ويستثني منفذ الدخول.","benefit":"المحوّل وحده لا يلغي بث VLAN؛ تُفصل مجالات البث باستخدام VLANs."},{"id":"simultaneous","label":"إرسال متزامن","question":"A يرسل إلى B وC يرسل إلى A في الوقت نفسه. كيف تختلف بيئة المشاركة؟","hub_ports":["A","B","C"],"switch_ports":["A","B"],"hub_explanation":"على Hub تتشارك الأجهزة وسطًا Half-Duplex؛ قد يقع تصادم عند محاولة الإرسال معًا. تستمع الأجهزة وفق CSMA/CD وتكشف التصادم إن وقع، ثم تتراجع عشوائيًا وتعيد المحاولة. بعد نجاح الإرسال يكرر Hub إشارة A إلى B وC، وإشارة C إلى A وB.","switch_explanation":"لكل جهاز وصلة مستقلة إلى المحوّل؛ يتجه إرسال A إلى B وإرسال C إلى A. في روابط Full-Duplex لا يقع تصادم وسط مشترك ولا تُستخدم CSMA/CD.","benefit":"تقليل التنافس على الوسط وإتاحة سعة مستقلة لكل منفذ؛ تبقى CSMA/CD ذات صلة إذا عمل رابط Ethernet بنمط Half-Duplex."}],"rows":[{"aspect":"طبقة العمل","hub":"الطبقة الفيزيائية L1؛ يكرر الإشارة","switch":"الطبقة الثانية L2؛ يفحص الإطار وعنوان MAC"},{"aspect":"سعة الرابط","hub":"مشتركة بين أجهزة المقطع","switch":"رابط مستقل لكل جهاز؛ لا تعني سعة كلية غير محدودة"},{"aspect":"CSMA/CD والتصادم","hub":"وسط Half-Duplex مشترك؛ تستمع الأجهزة، وتكشف التصادم إن وقع، ثم تتراجع قبل إعادة الإرسال","switch":"في رابط Full-Duplex لا يحدث تصادم وسط مشترك ولا تُستخدم CSMA/CD؛ قد تعمل منافذ قديمة Half-Duplex"},{"aspect":"وجهة أحادية معروفة","hub":"تصل الإشارة لكل المنافذ الأخرى","switch":"يخرج الإطار عبر منفذ الوجهة فقط"},{"aspect":"مجهول الوجهة أو Broadcast","hub":"تكرار للمنافذ الأخرى","switch":"إغراق داخل VLAN نفسها عدا منفذ الدخول"}],"source_url":"https://www.cisco.com/c/en/us/support/docs/lan-switching/ethernet/12006-chapter22.html"}},"review":{"approved":false,"status":"pending_scientific_and_classroom_review","notes":["البيانات مشتقة من ملفي الوحدة المرفقين؛ تصحيحات موثقة في review/changes.md.","الرابط في JSON؛ إدراجه في الصفحة النظرية الأم ينتظر ملف الصفحة."]}}</script>

<script>
(()=>{'use strict';
const unit=JSON.parse(document.getElementById('unit-data').textContent),slides=[];
const moduleByNumber=new Map((unit.modules||[]).map(m=>[m.module_number,m]));
const animations=unit.presentation?.animations||[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
slides.push({type:'cover',title:unit.title,sub:unit.title_en,html:unit.summary});

for(const section of unit.sections){
 if(section.module_number!==lastModule){const module=moduleByNumber.get(section.module_number);if(!module)throw Error('بيانات الوحدة غير مكتملة');slides.push({type:'module_intro',module,title:module.title});lastModule=section.module_number}
 if(section.id==='u2s0'&&unit.presentation?.opening_comparison){slides.push({type:'hub_compare',section,title:'من Hub إلى Switch: شاهد الفرق'});slides.push({type:'hub_summary',section,title:'ما الذي عالجه Switch؟'});continue}
 const box=document.createElement('div');box.innerHTML=section.body_html;
 const quiz=box.querySelector('.quiz');let question='',answer='';
 if(quiz){question=quiz.querySelector('.quiz-row b')?.textContent||'';answer=quiz.querySelector('.answer')?.innerHTML||'';quiz.remove()}
 box.querySelectorAll('[onclick]').forEach(el=>el.removeAttribute('onclick'));
 const pieces=[...box.children].filter(x=>!x.matches('.swipe-hint,.terms'));
 const primary=[],extra=[];
 for(const piece of pieces){
   if(piece.matches('.core,.timeline5,.diagram,.duplex,.compare,.flow,.summary-box,.summary-list'))primary.push(piece.outerHTML);
   else if(piece.matches('.keyline')&&primary.join('').length<2000)primary.push(piece.outerHTML);
   else extra.push(piece.outerHTML);
 }
 if(!primary.length&&extra.length)primary.push(extra.shift());
 if(primary.length)slides.push({type:'content',section,title:section.title,sub:section.subtitle,html:primary.join('')});
 for(const challenge of challenges.filter(item=>item.after_section_id===section.id))slides.push({type:'challenge',section,title:challenge.title,challenge});
 for(const motion of animations.filter(item=>item.after_section_id===section.id))slides.push({type:'journey',section,title:motion.title,motion});
 if(extra.length)slides.push({type:'detail',section,title:section.number==='✓'?'خلاصة الوحدة':`تطبيق وتفاصيل: ${section.toc_title}`,html:extra.join('')});
 if(question)slides.push({type:'question',section,title:'سؤال فهم',question,answer});
}
const $=id=>document.getElementById(id);
const themeKey='ccna2-lecture-theme';let theme='dark';

 $('themeBtn').innerHTML=light?'☾ <span class="desktop-label">ليلي</span>':'☀ <span class="desktop-label">نهاري</span>';
 $('themeBtn').setAttribute('aria-label',light?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري');$('themeBtn').setAttribute('aria-pressed',String(light));
 document.querySelector('meta[name="theme-color"]').content=light?'#edf4f7':'#071a29'}
applyTheme();$('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem(themeKey,theme)}catch{}applyTheme()};
let at=0,largeText=false,answered=false,build=1,timerSeconds=0,timerId=null;
const savedKey='ccna2-lecture-module-'+unit.module_number+'-marks';let marks=new Set();
try{marks=new Set(JSON.parse(localStorage.getItem(savedKey)||'[]'))}catch{}
function stopTimer(){clearInterval(timerId);timerId=null;timerSeconds=0}
function loadIndex(){const m=location.hash.match(/slide-(\d+)/);if(m)at=Math.max(0,Math.min(slides.length-1,+m[1]-1))}loadIndex();
function currentBuilds(){return [...$('stage').querySelectorAll('.slide-content > *')].filter(el=>!el.matches('.build-control'))}
function applyBuild(){const els=currentBuilds();els.forEach((el,i)=>el.classList.toggle('build-hidden',i>=build));const label=$('buildState');if(label)label.textContent=`${Math.min(build,els.length)} / ${els.length}`;const btn=$('allBuild');if(btn)btn.style.display=build>=els.length?'none':'';const next=$('next');next.textContent=build<els.length?'أظهر التالي':'التالي';next.disabled=at===slides.length-1&&build>=els.length}
function makeExplore(){
 const container=$('stage');
 container.querySelectorAll('.timeline5').forEach(list=>{
  const steps=[...list.querySelectorAll('.tstep')];steps.forEach((el,i)=>{
   el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label',`الخطوة ${i+1}: ${el.querySelector('b')?.textContent||''}`);
   const select=()=>{steps.forEach((x,j)=>{x.classList.toggle('selected',j===i);x.setAttribute('aria-pressed',String(j===i))})};
   el.onclick=select;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}};
  });steps[0]?.click();
 });
 container.querySelectorAll('.grid2,.grid3,.compare,.duplex').forEach(group=>{
  const cards=[...group.children].filter(el=>el.matches('.card,.compare-box,.duplex-box'));
  if(cards.length<2)return;
  cards.forEach(card=>{card.classList.add('explore-card');card.setAttribute('role','button');card.tabIndex=0;
   const choose=()=>{cards.forEach(x=>{x.classList.toggle('selected',x===card);x.setAttribute('aria-pressed',String(x===card))})};
   card.onclick=e=>{if(e.target.closest('a,button,summary'))return;choose()};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};
  });cards[0].classList.add('selected');cards[0].setAttribute('aria-pressed','true');
 });
}

/* Interactive, offline scene engine. Source scenes are embedded in the final HTML. */
let sceneState=null,sceneTimer=null;
function currentMotion(){return slides[at]?.motion}
function currentScene(){const motion=currentMotion();return motion?JSON.parse($('scene-'+motion.id).textContent):null}
function stopBootJourney(){if(sceneTimer){clearInterval(sceneTimer);sceneTimer=null}sceneState=null}
function bootJourneyMarkup(){
 const scene=currentScene(),isMac=scene.kind==='mac_switching';
 const options=isMac?`<div class="scene-settings"><label>الوجهة <select id="sceneDest"><option value="B">PC-B · Fa0/2</option><option value="C">PC-C · Fa0/3</option></select></label><label class="scene-check"><input type="checkbox" id="sceneKnown"> الوجهة معروفة مسبقًا في جدول MAC</label></div>`:'';
 const prediction=!isMac?`<div class="scene-prediction" id="scenePrediction"><strong>${esc(scene.prompt)}</strong><div class="scene-choices">${scene.prediction_options.map((x,i)=>`<button type="button" data-predict="${i}">${esc(x)}</button>`).join('')}</div><span id="predictionFeedback" role="status" aria-live="polite">اختر توقعك قبل كشف الخطوة الثانية.</span></div>`:`<div class="scene-prediction" id="scenePrediction"><strong>بعد تعلّم عنوان المصدر، ماذا سيفعل المحوّل؟</strong><div class="scene-choices"><button type="button" data-predict="flood">إغراق عبر المنافذ الأخرى</button><button type="button" data-predict="forward">توجيه إلى منفذ واحد</button></div><span id="predictionFeedback" role="status" aria-live="polite">اختر توقعك قبل كشف القرار.</span></div>`;
 return `${options}<div class="scene-controls" aria-label="التحكم بالمشهد"><button id="sceneBack" type="button">السابق</button><button id="scenePlay" type="button">تشغيل ▶</button><button id="sceneNext" type="button">الخطوة التالية</button><button id="sceneReset" type="button">إعادة ↺</button><label>السرعة <select id="sceneSpeed"><option value="4500">هادئة</option><option value="2700" selected>عادية</option><option value="1400">سريعة</option></select></label></div>
 <div class="scene-frame" id="sceneFrame"><div class="scene-target">${esc(scene.target)}</div><div class="scene-visual" id="sceneVisual" aria-label="تمثيل الحالة الحالية"></div><div class="scene-description" aria-live="polite"><strong id="sceneTitle"></strong><span id="sceneBody"></span></div></div>${prediction}
 <div class="scene-steps" aria-label="مراحل المشهد">${scene.steps.map((x,i)=>`<button type="button" data-scene-step="${i}" aria-label="انتقل إلى ${esc(x.title)}">${i+1} · ${esc(x.label)}</button>`).join('')}</div><p class="scene-assumption">محاكاة تعليمية: ${esc(scene.assumptions)}</p>`;
}
function macModel(scene,dest,known,step){
 const hosts=scene.hosts,source=hosts.find(x=>x.id==='A'),target=hosts.find(x=>x.id===dest);
 const table=[];if(known)table.push({id:dest,port:target.port,vlan:target.vlan});
 if(step>=1)table.push({id:'A',port:source.port,vlan:source.vlan});
 const outputs=step>=3?(known?[target.port]:hosts.filter(x=>x.vlan===source.vlan&&x.port!==source.port).map(x=>x.port)):[];
 return {table,outputs,source,target,mode:known?'توجيه معروف الوجهة':'إغراق وجهة مجهولة'};
}
function paintMac(scene,step){
 const dest=sceneState.dest,known=sceneState.known,m=macModel(scene,dest,known,step);
 const hosts=scene.hosts.map(x=>`<div class="scene-host ${x.id==='A'&&step>=0?'sending':''} ${m.outputs.includes(x.port)?'receiving':''}" aria-label="PC-${x.id} المنفذ ${x.port}"><b>PC-${x.id}</b><small>${x.port}</small>${m.outputs.includes(x.port)?'<span>استقبل نسخة</span>':''}</div>`).join('');
 const rows=m.table.map(x=>`<tr><td dir="ltr">${esc(x.id)}</td><td dir="ltr">${esc(x.port)}</td><td>${x.vlan}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد إدخالات بعد</td></tr>';
 const decision=step>=3?`<div class="scene-decision"><b>${m.mode}</b><span>${m.outputs.map(esc).join(' + ')}</span></div>`:step>=2?`<div class="scene-decision">هل الوجهة ${esc(dest)} معروفة في جدول VLAN 10؟ ${known?'نعم':'لا'}</div>`:'';
 const flow=step===0?'<div class="scene-signal ingress" aria-hidden="true"><i></i></div>':step===3?'<div class="scene-signal egress" aria-hidden="true"><i></i></div>':'';
 $('sceneVisual').innerHTML=`<div class="scene-network"><div class="scene-hosts">${hosts}</div>${flow}<div class="scene-switch">محوّل Layer 2<small>VLAN 10</small></div>${decision}</div><table class="scene-table"><caption>جدول MAC في هذه الحالة</caption><thead><tr><th>العنوان</th><th>المنفذ</th><th>VLAN</th></tr></thead><tbody>${rows}</tbody></table>`;
 let body=scene.steps[step].body;
 if(step===2)body=`يفحص المحوّل عنوان الوجهة ${dest} داخل VLAN 10: ${known?'معروف على '+m.target.port:'غير موجود في الجدول'}.`;
 if(step===3)body=known?`الوجهة ${dest} معروفة؛ يرسل الإطار إلى ${m.target.port} فقط.`:`الوجهة ${dest} مجهولة؛ يرسل نسخة إلى ${m.outputs.join(' و')} داخل VLAN 10، عدا منفذ الدخول Fa0/1.`;
 if(step===4)body=`جرّب تغيير الوجهة أو حالة الجدول، ثم قارن القرار. تعلّم المحوّل A من عنوان المصدر؛ ولم يتعلم ${dest} من الإطار المرسل إليه قبل وصول رد منه.`;
 return body;
}
function scenePaint(){
 const scene=currentScene();if(!scene||!sceneState||!$('sceneVisual'))return;
 const step=sceneState.step,detail=scene.steps[step];
 $('sceneTitle').textContent=`${step+1} / ${scene.steps.length} · ${detail.title}`;
 $('sceneBody').textContent=scene.kind==='mac_switching'?paintMac(scene,step):detail.body;
 if(scene.kind==='boot_sequence')$('sceneVisual').innerHTML=`<div class="boot-path">${scene.steps.map((x,i)=>`<div class="boot-node ${i<step?'done':''} ${i===step?'current':''}"><span>${i+1}</span><b>${esc(x.label)}</b></div>`).join('')}</div><div class="boot-symbol" dir="ltr">${esc(detail.visual)}</div>`;
 $('sceneFrame').classList.remove('scene-animate');void $('sceneFrame').offsetWidth;$('sceneFrame').classList.add('scene-animate');
 $('sceneBack').disabled=step===0;$('sceneNext').disabled=step===scene.steps.length-1;
 $('scenePlay').textContent=sceneTimer?'إيقاف مؤقت ❚❚':'تشغيل ▶';
 $('stage').querySelectorAll('[data-scene-step]').forEach((b,i)=>{b.classList.toggle('active',i===step);b.setAttribute('aria-current',i===step?'step':'false')});
 const predict=$('scenePrediction');predict.hidden=step>=3;
}
function sceneAdvance(delta){const scene=currentScene();if(!sceneState||!scene)return;sceneState.step=Math.max(0,Math.min(scene.steps.length-1,sceneState.step+delta));if(sceneState.step===scene.steps.length-1)scenePause();scenePaint()}
function scenePause(){if(sceneTimer){clearInterval(sceneTimer);sceneTimer=null}const b=$('scenePlay');if(b)b.textContent='تشغيل ▶'}
function resetPrediction(){sceneState.predicted=false;$('stage').querySelectorAll('[data-predict]').forEach(x=>{x.disabled=false;x.classList.remove('correct')});$('predictionFeedback').textContent='اختر توقعك قبل كشف القرار.'}
function initBootJourney(){
 const scene=currentScene();if(!scene)return;
 sceneState={step:0,dest:'B',known:false,predicted:false};
 const dest=$('sceneDest'),known=$('sceneKnown');
 if(dest)dest.onchange=()=>{scenePause();sceneState.dest=dest.value;sceneState.step=0;resetPrediction();scenePaint()};
 if(known)known.onchange=()=>{scenePause();sceneState.known=known.checked;sceneState.step=0;resetPrediction();scenePaint()};
 $('sceneBack').onclick=()=>{scenePause();sceneAdvance(-1)};
 $('sceneNext').onclick=()=>{scenePause();sceneAdvance(1)};
 $('sceneReset').onclick=()=>{scenePause();sceneState.step=0;resetPrediction();scenePaint()};
 $('scenePlay').onclick=()=>{if(sceneTimer){scenePause();return}if(sceneState.step===scene.steps.length-1)sceneState.step=0;sceneAdvance(0);sceneTimer=setInterval(()=>sceneAdvance(1),+$('sceneSpeed').value);$('scenePlay').textContent='إيقاف مؤقت ❚❚'};
 $('sceneSpeed').onchange=()=>{if(sceneTimer){scenePause();$('scenePlay').click()}};
 $('stage').querySelectorAll('[data-scene-step]').forEach(b=>b.onclick=()=>{scenePause();sceneState.step=+b.dataset.sceneStep;scenePaint()});
 $('stage').querySelectorAll('[data-predict]').forEach(b=>b.onclick=()=>{const answer=scene.kind==='mac_switching'?(sceneState.known?'forward':'flood'):String(scene.prediction_correct);const correct=b.dataset.predict===answer;sceneState.predicted=true;$('predictionFeedback').textContent=(correct?'توقع صحيح. ':'توقع مختلف؛ راجع حالة الجدول. ')+(scene.kind==='mac_switching'?(sceneState.known?'الوجهة معروفة؛ يرسل إلى منفذها فقط.':'الوجهة مجهولة؛ يغرق داخل VLAN عدا منفذ الدخول.'):'بعد Boot Loader تُهيّأ CPU والذاكرة الأساسية.');$('stage').querySelectorAll('[data-predict]').forEach(x=>{x.disabled=true;x.classList.toggle('correct',x.dataset.predict===answer)});$('scenePrediction').hidden=false});
 scenePaint();
}

/* Hub and switch comparison at the opening of module 2. */
const comparison=unit.presentation?.opening_comparison;
function comparisonMarkup(){
 return `<div class="kicker">الوحدة ٢ · مدخل مفاهيم التحويل</div><h2>من Hub إلى Switch: شاهد الفرق</h2><p class="sub">اختر حالة، توقع ما يصل إلى الأجهزة، ثم اكشف النتيجة.</p>
 <div class="compare-tabs" role="group" aria-label="اختر حالة المقارنة">${comparison.scenarios.map((x,i)=>`<button type="button" data-compare="${i}" aria-pressed="${i===0}">${esc(x.label)}</button>`).join('')}</div>
 <div class="compare-question" id="compareQuestion"></div><div class="compare-visuals"><section class="compare-device hub"><h3>Hub <small>الطبقة ١</small></h3><div class="compare-hosts" id="hubHosts"></div><p id="hubResult"></p></section><section class="compare-device switch"><h3>Switch <small>الطبقة ٢</small></h3><div class="compare-hosts" id="switchHosts"></div><p id="switchResult"></p></section></div>
 <p class="compare-progress" id="compareProgress" role="status" aria-live="polite">اكشف الحالات الأربع، ومنها الإرسال المتزامن لفهم CSMA/CD.</p><div class="compare-reveal"><button id="compareReveal" type="button" aria-expanded="false">اكشف النتيجة</button><strong id="compareBenefit" role="status" aria-live="polite"></strong></div><div class="csma-steps" id="csmaSteps" hidden><b>CSMA/CD على وسط Hub المشترك</b><span>استماع للوسط ← إرسال ← كشف التصادم إن وقع ← تراجع عشوائي ← إعادة المحاولة</span></div><div class="source-note">المرجع: <a href="${esc(comparison.source_url)}" target="_blank" rel="noopener noreferrer">Cisco — Troubleshoot LAN Switching Environments</a></div>`;
}
function comparisonSummaryMarkup(){
 return `<div class="kicker">الوحدة ٢ · خلاصة المقارنة</div><h2>ما الذي عالجه Switch؟</h2><div class="slide-content comparison-summary"><table><thead><tr><th>الجانب</th><th>Hub</th><th>Switch</th></tr></thead><tbody>${comparison.rows.map(r=>`<tr><th>${esc(r.aspect)}</th><td>${esc(r.hub)}</td><td>${esc(r.switch)}</td></tr>`).join('')}</tbody></table><p class="compare-note"><b>الدقة المهمة:</b> لا يلغي المحوّل إغراق الوجهة المجهولة أو بث الشبكة داخل VLAN. ولا تعني منافذه المنفصلة عزلًا أمنيًا كاملًا. في الروابط Full-Duplex السليمة يزول تصادم الوسط المشترك، وقد تظهر مشكلات مختلفة مثل عدم تطابق الازدواج.</p></div>`;
}
let compareIndex=0,compareRevealed=false,compareVisited=new Set();
function compareHosts(outputs,revealed,collision,hub){
 const simultaneous=hub?{A:'يرسل ويتلقى C بعد الإعادة',B:'يتلقى A بعد الإعادة',C:'يرسل ويرى A بعد الإعادة'}:{A:'يرسل ويتلقى C',B:'يتلقى A',C:'يرسل إلى A'};
 return ['A','B','C'].map(id=>`<div class="compare-host ${id==='A'||collision&&id==='C'?'origin':''} ${revealed&&(collision?hub||outputs.includes(id):outputs.includes(id))?'hit':''}"><b>PC-${id}</b><span>${revealed?(collision?simultaneous[id]:outputs.includes(id)?'تصل نسخة':id==='A'?'منفذ الدخول':'لا تصل نسخة'):'؟'}</span></div>`).join('');
}
function paintComparison(){
 const x=comparison.scenarios[compareIndex],collision=x.id==='simultaneous';
 $('compareQuestion').textContent=x.question;
 $('hubHosts').innerHTML=compareHosts(x.hub_ports,compareRevealed,collision,true);
 $('switchHosts').innerHTML=compareHosts(x.switch_ports,compareRevealed,collision,false);
 $('hubResult').textContent=compareRevealed?x.hub_explanation:'توقع سلوك الجهاز قبل الكشف.';
 $('switchResult').textContent=compareRevealed?x.switch_explanation:'توقع سلوك الجهاز قبل الكشف.';
 $('compareBenefit').textContent=compareRevealed?x.benefit:'';
 $('compareProgress').textContent=compareVisited.size===comparison.scenarios.length?'اكتملت الحالات الأربع؛ ناقش الآن متى تُستخدم CSMA/CD.':`استعرضت ${compareVisited.size} من ${comparison.scenarios.length} حالات. اكشف الحالات كلها، ومنها الإرسال المتزامن لفهم CSMA/CD.`;
 $('csmaSteps').hidden=!(compareRevealed&&collision);
 $('compareReveal').textContent=compareRevealed?'أخفِ النتيجة':'اكشف النتيجة';$('compareReveal').setAttribute('aria-expanded',String(compareRevealed));
 $('stage').querySelectorAll('[data-compare]').forEach((b,i)=>{b.classList.toggle('active',i===compareIndex);b.classList.toggle('visited',compareVisited.has(i));b.setAttribute('aria-pressed',String(i===compareIndex))});
}
function initComparison(){compareIndex=0;compareRevealed=false;compareVisited=new Set();$('stage').querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>{compareIndex=+b.dataset.compare;compareRevealed=false;paintComparison()});$('compareReveal').onclick=()=>{compareRevealed=!compareRevealed;if(compareRevealed)compareVisited.add(compareIndex);paintComparison()};paintComparison()}

function timerRender(){const clock=$('clock');if(clock)clock.textContent=timerSeconds?`${Math.floor(timerSeconds/60)}:${String(timerSeconds%60).padStart(2,'0')}`:'—';$('stage').querySelectorAll('[data-timer]').forEach(b=>b.classList.toggle('timer-active',timerId!==null&&+b.dataset.timer===+(b.dataset.selected||0)))}
function startTimer(seconds,button){stopTimer();timerSeconds=seconds;button.dataset.selected=seconds;timerId=setInterval(()=>{timerSeconds--;timerRender();if(timerSeconds<=0){stopTimer();timerRender();const prompt=$('questionPrompt');if(prompt)prompt.textContent='انتهى وقت التفكير. ناقش الإجابة ثم اكشفها.'}},1000);timerRender()}
function render(){const s=slides[at],n=at+1;
 const kicker=s.section?`الوحدة ${esc(s.section.module_number)} · القسم ${esc(s.section.number)} · ${esc(s.section.toc_title)}`:esc(unit.title_en);
 let main='';
 if(s.type==='cover')main=`<div class="kicker">الوحدة ${esc(unit.module_number)} · ${esc(unit.lecture.duration)}</div><h1>${esc(s.title)}</h1><div class="sub">${esc(s.sub)}</div><p class="lead">${esc(s.html)}</p><p class="sub">تنقل بالأسهم أو اللمس، واضغط «التالي» لإظهار كل فكرة بالتدريج</p>`;
 else if(s.type==='agenda')main=`<div class="kicker">${kicker}</div><h2>${esc(s.title)}</h2><div class="slide-content overview">${s.html}</div>`;
 else if(s.type==='module_intro')main=`<div class="kicker">الوحدة ${esc(s.module.module_number)} · ${esc(s.module.duration)}</div><h1>${esc(s.module.title)}</h1><div class="sub">${esc(s.module.title_en)}</div><p class="lead">${esc(s.module.summary)}</p><div class="objective"><b>هدف الوحدة:</b> ${esc(s.module.official_objective)}</div>`;
 else if(s.type==='hub_compare')main=comparisonMarkup();
 else if(s.type==='hub_summary')main=comparisonSummaryMarkup();
 else if(s.type==='journey')main=`<div class="kicker">${kicker} · عرض حركي تفاعلي</div><h2>${esc(s.title)}</h2><div class="boot-journey" id="bootJourney">${bootJourneyMarkup()}</div><div class="source-note">المرجع: <a href="${esc(s.motion.source_url)}" target="_blank" rel="noopener noreferrer">${esc(s.motion.source_label)}</a></div>`;
 else if(s.type==='challenge')main=`<div class="kicker">${kicker} · قرار قبل الكشف</div><h2>${esc(s.title)}</h2><div class="slide-content challenge-wrap"><div class="challenge-scenario">${esc(s.challenge.scenario)}</div><div class="think-controls"><span class="question-prompt" id="questionPrompt">اطلب توقعًا من القاعة ثم اختر الإجابة</span><button data-timer="${s.challenge.discussion_seconds}">ابدأ نقاش ${s.challenge.discussion_seconds} ثانية</button><span class="clock" id="clock">—</span></div><div class="challenge-options">${s.challenge.options.map((option,i)=>`<button type="button" data-choice="${i}" aria-pressed="false">${esc(option)}</button>`).join('')}</div><div class="challenge-feedback" id="challengeFeedback" role="status" aria-live="polite" hidden></div></div>`;
 else if(s.type==='question')main=`<div class="kicker">${kicker}</div><h2>سؤال فهم</h2><div class="slide-content answer-cover"><div class="question-text">${esc(s.question)}</div><div class="think-controls"><span class="question-prompt" id="questionPrompt">وقت للتفكير والنقاش</span><button data-timer="30">٣٠ ثانية</button><button data-timer="60">٦٠ ثانية</button><span class="clock" id="clock">—</span></div><button class="reveal" id="reveal" aria-expanded="${answered}">${answered?'إخفاء الإجابة':'اكشف الإجابة'}</button><div class="answer-text ${answered?'visible':''}" id="answer">${s.answer}</div></div>`;
 else main=`<div class="kicker">${kicker}</div><h2>${esc(s.title)}</h2>${s.type==='content'?`<p class="sub">${esc(s.sub)}</p>`:''}<div class="slide-content">${s.html}</div><div class="build-control"><span class="build-state" id="buildState"></span><button id="allBuild">عرض كل العناصر</button><span class="stage-hint">اضغط على المراحل والبطاقات لاستكشافها</span></div>`;
 $('stage').innerHTML=`<article class="slide ${s.type==='cover'?'cover':''} ${s.type==='module_intro'?'module-intro':''} ${largeText?'notes':''}">${main}<footer class="slide-footer"><span>${esc(s.module?.title_en||unit.title_en)}</span><span>${n} / ${slides.length}</span></footer></article>`;
 $('counter').textContent=`${n} / ${slides.length}`;$('bar').style.width=(100*n/slides.length)+'%';$('prev').disabled=at===0;$('next').disabled=at===slides.length-1;
 $('notesBtn').classList.toggle('active',largeText);$('notesBtn').setAttribute('aria-pressed',String(largeText));
 $('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=`${marks.has(at)?'★':'☆'} <span class="desktop-label">${marks.has(at)?'أزل العلامة':'للمراجعة'}</span>`;
 if(s.type==='question'){
  $('reveal').onclick=()=>{answered=!answered;$('answer').classList.toggle('visible',answered);$('reveal').textContent=answered?'إخفاء الإجابة':'اكشف الإجابة';$('reveal').setAttribute('aria-expanded',String(answered));$('next').textContent=answered?'التالي':'اكشف الإجابة'};
  $('stage').querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.timer,b));
 } else if(s.type==='challenge'){
  $('stage').querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.timer,b));
  $('stage').querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{const correct=+btn.dataset.choice===s.challenge.correct_index;btn.classList.add(correct?'correct':'incorrect');btn.setAttribute('aria-pressed','true');const feedback=$('challengeFeedback');feedback.hidden=false;feedback.textContent=(correct?'إجابة صحيحة. ':'راجع القرار. ')+s.challenge.explanation;stopTimer();timerRender()});$('next').textContent='التالي';
 } else if(s.type==='content'||s.type==='detail'){
  build=1;applyBuild();$('allBuild').onclick=()=>{build=currentBuilds().length;applyBuild()};makeExplore();
 }else if(s.type==='journey'){initBootJourney();$('next').textContent='التالي'}else if(s.type==='hub_compare'){initComparison();$('next').textContent='التالي'}else $('next').textContent='التالي';
 if(s.type==='question')$('next').textContent=answered?'التالي':'اكشف الإجابة';
 updateMenuMarks();history.replaceState(null,'',`#slide-${n}`);
}
function updateMenuMarks(){$('menuList').querySelectorAll('[data-slide]').forEach(b=>b.classList.toggle('marked',marks.has(+b.dataset.slide)))}
function go(n){if(n<0||n>=slides.length)return;stopTimer();stopBootJourney();at=n;answered=false;render()}
function forward(){const s=slides[at];if(s.type==='question'&&!answered){$('reveal').click();$('next').textContent='التالي';return}if(s.type==='content'||s.type==='detail'){if(build<currentBuilds().length){build++;applyBuild();return}}go(at+1)}
$('prev').onclick=()=>go(at-1);$('next').onclick=forward;
$('markBtn').onclick=()=>{if(marks.has(at))marks.delete(at);else marks.add(at);try{localStorage.setItem(savedKey,JSON.stringify([...marks]))}catch{}$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=`${marks.has(at)?'★':'☆'} <span class="desktop-label">${marks.has(at)?'أزل العلامة':'للمراجعة'}</span>`;updateMenuMarks()};
$('notesBtn').onclick=()=>{largeText=!largeText;const el=$('stage').querySelector('.slide');el.classList.toggle('notes',largeText);$('notesBtn').classList.toggle('active',largeText);$('notesBtn').setAttribute('aria-pressed',String(largeText))};
$('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
function menu(open){$('menu').classList.toggle('open',open)}$('menuBtn').onclick=()=>menu(true);$('closeMenu').onclick=()=>menu(false);$('menu').onclick=e=>{if(e.target===$('menu'))menu(false)};
$('menuList').innerHTML=slides.map((s,i)=>`<button data-slide="${i}">${i+1}. ${s.section?`الوحدة ${esc(s.section.module_number)} · `:''}${esc(s.title)}</button>`).join('');$('menuList').onclick=e=>{const b=e.target.closest('[data-slide]');if(b){menu(false);go(+b.dataset.slide)}};
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable="true"]'))return;if(e.target.closest('button,summary')&&[' ','Enter'].includes(e.key))return;if($('menu').classList.contains('open')){if(e.key==='Escape')menu(false);return}if(['ArrowLeft','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();forward()}else if(['ArrowRight','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(at-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);else if(e.key.toLowerCase()==='m')$('markBtn').click();else if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});
let touchX=0,touchY=0,touchInteractive=false;$('stage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY;touchInteractive=!!e.target.closest('.boot-journey,.compare-tabs')},{passive:true});$('stage').addEventListener('touchend',e=>{if(touchInteractive)return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.4){dx<0?go(at-1):forward()}},{passive:true});
window.addEventListener('hashchange',()=>{loadIndex();stopTimer();stopBootJourney();answered=false;render()});render();
})();
</script></body></html>
