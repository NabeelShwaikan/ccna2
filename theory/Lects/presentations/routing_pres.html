">←<\/div>\n  <div class=\"step\"><b>Forward<\/b><span>يرسل الحزمة عبر Egress Interface.<\/span><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل جدول التوجيه يحدد عنوان MAC للوجهة أم يحدد المسار نحو شبكة الوجهة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يحدد المسار نحو شبكة الوجهة. بعد ذلك تُستخدم آليات Layer 2 مثل ARP أوNeighbor Discovery لتحديد عنوان الطبقة الثانية المناسب للوصلة التالية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Routing<\/span><span class=\"term\">Forwarding<\/span><span class=\"term\">Routing Table<\/span><span class=\"term\">Ingress Interface<\/span><span class=\"term\">Egress Interface<\/span><\/div>"}, {"id": "u14s2", "number": "02", "toc_title": "Longest Match", "title": "أفضل Route هي الأكثر تحديدًا: أطول تطابق للبادئة", "subtitle": "إذا تطابقت عدة Routes مع عنوان الوجهة، يفوز Prefix ذو أكبر عدد من البتات المتطابقة.", "body_html": "<p class=\"core\"><strong>Longest Match (أطول تطابق)<\/strong> يعني اختيار Route التي تملك أطول Prefix مطابق لعنوان IP للوجهة. المسار الأكثر تحديدًا يفوز حتى لو وُجدت Routes أوسع تشمل الوجهة نفسها.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">IPv4 Example<\/div><h4>172.16.0.10<\/h4><p>إذا طابقت الوجهة مسارات <code>/12<\/code> و<code>/18<\/code> و<code>/26<\/code>، يختار الموجّه <strong>/26<\/strong> لأنه أطول تطابق.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">IPv6 Example<\/div><h4>2001:db8:c000::99<\/h4><p>إذا طابقت <code>/40<\/code> و<code>/48<\/code> فقط، فإن <strong>/48<\/strong> هو المسار المستخدم.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة ذهبية:<\/strong> لا يعني Prefix أكبر أن الشبكة أكبر؛ كلما زاد Prefix Length أصبحت Route أكثر تحديدًا وأصغر نطاقًا.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أيهما يفوز لوجهة تطابق المسارين 10.0.0.0/8 و10.20.30.0/24؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">المسار 10.20.30.0/24 لأنه أكثر تحديدًا ويملك Longest Prefix Match.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Best Path<\/span><span class=\"term\">Longest Match<\/span><span class=\"term\">Prefix<\/span><span class=\"term\">Prefix Length<\/span><\/div>"}, {"id": "u14s3", "number": "03", "toc_title": "بناء جدول التوجيه", "title": "جدول التوجيه يبدأ بالمتصل مباشرة ثم يتعلم الشبكات البعيدة", "subtitle": "Connected وStatic وDynamic وDefault هي المصادر الأساسية التي يحتاج الطالب لتمييزها.", "body_html": "<div class=\"grid4\">\n  <div class=\"card\"><h4>Directly Connected<\/h4><p>تدخل تلقائيًا عندما تكون الواجهة مكوّنة بعنوان IP وحالتها <strong>up/up<\/strong>.<\/p><\/div>\n  <div class=\"card\"><h4>Static Route<\/h4><p>يضيفها مسؤول الشبكة يدويًا للوصول إلى Remote Network.<\/p><\/div>\n  <div class=\"card\"><h4>Dynamic Route<\/h4><p>يتعلمها الموجّه عبر Routing Protocol يتبادل معلومات الوصول مع موجّهات أخرى.<\/p><\/div>\n  <div class=\"card\"><h4>Default Route<\/h4><p>تُستخدم عندما لا يوجد مسار أكثر تحديدًا يطابق الوجهة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Default Route:<\/strong> في IPv4 هي <code>0.0.0.0/0<\/code> وفي IPv6 هي <code>::/0<\/code>. Prefix /0 لا يتطلب تطابق أي بت، ولذلك هو أقل Route تحديدًا ويعمل كـGateway of Last Resort.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: متى تظهر شبكة Connected في جدول التوجيه؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">عندما تُضبط واجهة محلية بعنوان IP وPrefix وتكون الواجهة فعالة up/up.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Directly Connected Route<\/span><span class=\"term\">Static Route<\/span><span class=\"term\">Dynamic Route<\/span><span class=\"term\">Default Route<\/span><span class=\"term\">Gateway of Last Resort<\/span><\/div>"}, {"id": "u14s4", "number": "04", "toc_title": "قرار Forwarding", "title": "كل حزمة تمر بقرار محدد: Route مطابقة ثم Next Hop أووجهة مباشرة أوDrop", "subtitle": "الموجّه لا ينظر إلى كامل المسار من البداية للنهاية؛ كل موجّه يتخذ قراره مستقلًا.", "body_html": "<div class=\"flow\">\n  <div class=\"step\"><b>1 · Decapsulate<\/b><span>يستقبل Frame ويكشف حزمة IP داخلها.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Destination IP<\/b><span>يفحص عنوان الوجهة في IP Header.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Longest Match<\/b><span>يبحث عن Route الأكثر تحديدًا.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · Re-encapsulate<\/b><span>يبني Frame جديدة للوصلة التالية.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>5 · Forward / Drop<\/b><span>يرسل عبر Egress أويسقط الحزمة إذا لا توجد Route.<\/span><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Directly Connected Destination<\/div><h4>إلى الجهاز النهائي<\/h4><p>يحدد MAC للوجهة المحلية باستخدام ARP في IPv4 أوNeighbor Discovery في IPv6.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Remote Destination<\/div><h4>إلى Next-Hop Router<\/h4><p>يحدد MAC الخاص بالموجّه التالي على وصلة Ethernet، وليس MAC الخاص بالمضيف البعيد.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>مبدأ مهم:<\/strong> وجود Route للذهاب لا يضمن وجود Return Route للعودة. كل Router يقرر مستقلًا اعتمادًا على جدول التوجيه الخاص به.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا كانت الوجهة Remote Network، لأي MAC يعيد الموجّه تغليف الإطار على وصلة Ethernet؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">MAC الخاص بالـNext-Hop على الوصلة التالية، وليس MAC للمضيف البعيد.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Next-Hop Router<\/span><span class=\"term\">ARP<\/span><span class=\"term\">Neighbor Discovery<\/span><span class=\"term\">Return Route<\/span><\/div>"}, {"id": "u14s5", "number": "05", "toc_title": "CEF", "title": "آليات Forwarding تطورت من Process Switching إلى CEF", "subtitle": "المهم في المنهج فهم لماذا CEF أكثر كفاءة، لا حفظ التاريخ التفصيلي لكل آلية.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>Process Switching<\/h4><p>آلية قديمة؛ CPU يعالج كل Packet ويبحث في جدول التوجيه في كل مرة.<\/p><\/div>\n  <div class=\"card\"><h4>Fast Switching<\/h4><p>يستخدم Cache لمعلومات Next Hop؛ أول Packet قد تُعالج بواسطة CPU ثم يعاد استخدام النتيجة للحزم التالية.<\/p><\/div>\n  <div class=\"card\"><h4>CEF<\/h4><p><strong>Cisco Express Forwarding<\/strong> هو آلية Cisco IOS الافتراضية والأكثر كفاءة في هذا المنهج، ويعتمد على FIB وAdjacency Table.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">FIB<\/div><h4>Forwarding Information Base<\/h4><p>نسخة محسّنة من معلومات التوجيه المستخدمة لاتخاذ قرار Forwarding بسرعة.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Adjacency Table<\/div><h4>معلومات الطبقة الثانية<\/h4><p>تحتفظ بالمعلومات اللازمة لبناء Frame للوصلة التالية.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>الفكرة المطلوبة في هذا المقرر:<\/strong> CEF يجهز معلومات Forwarding مسبقًا باستخدام FIB وAdjacency Table، لذلك لا نحتاج التوسع في بنائه الداخلي أكثر من هذا المستوى.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما العنصران اللذان يعتمد عليهما CEF في الشرح الأساسي؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">FIB وAdjacency Table.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Process Switching<\/span><span class=\"term\">Fast Switching<\/span><span class=\"term\">Cisco Express Forwarding (CEF)<\/span><span class=\"term\">FIB<\/span><span class=\"term\">Adjacency Table<\/span><\/div>"}, {"id": "u14s6", "number": "06", "toc_title": "التحقق والفلترة", "title": "استخدم أوامر show لمعرفة ما يعرفه الموجّه بدل إعادة تكوينه من الصفر", "subtitle": "هذه مراجعة مختصرة لما يخدم Routing فقط.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>Interfaces<\/h4><p><code>show ip interface brief<\/code><br><code>show interfaces<\/code><br><code>show ip interface<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Routing<\/h4><p><code>show ip route<\/code><br><code>show ipv6 route<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Reachability<\/h4><p><code>ping<\/code> لاختبار Layer 3 Connectivity.<\/p><\/div>\n<\/div>\n<pre class=\"cmd\">show ip route | begin Gateway\nshow ip route | include 10.0.\nshow running-config | section interface<\/pre>\n<div class=\"grid4\">\n  <div class=\"card\"><h4>section<\/h4><p>يعرض القسم كاملًا بدءًا من النص المطابق.<\/p><\/div>\n  <div class=\"card\"><h4>include<\/h4><p>يعرض السطور التي تطابق التعبير.<\/p><\/div>\n  <div class=\"card\"><h4>exclude<\/h4><p>يستبعد السطور المطابقة.<\/p><\/div>\n  <div class=\"card\"><h4>begin<\/h4><p>يبدأ العرض من أول سطر مطابق إلى النهاية.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي أمر يعطي نظرة سريعة على حالة الواجهات وعناوين IPv4؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">show ip interface brief.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">show ip route<\/span><span class=\"term\">show ip interface brief<\/span><span class=\"term\">Output Filtering<\/span><\/div>"}, {"id": "u14s7", "number": "07", "toc_title": "قراءة Routing Table", "title": "كل سطر في جدول التوجيه يجيب: كيف تعلّمنا المسار؟ وإلى أين نرسل؟", "subtitle": "Route Source وPrefix وAD وMetric وNext-Hop وExit Interface هي مفاتيح القراءة.", "body_html": "<div class=\"grid4\">\n  <div class=\"card\"><h4>L<\/h4><p>Local Route لعنوان الواجهة نفسها: /32 في IPv4 و/128 في IPv6.<\/p><\/div>\n  <div class=\"card\"><h4>C<\/h4><p>Connected Network متصلة مباشرة بالموجّه.<\/p><\/div>\n  <div class=\"card\"><h4>S<\/h4><p>Static Route أضافها المسؤول يدويًا.<\/p><\/div>\n  <div class=\"card\"><h4>O<\/h4><p>Route تعلمها OSPF ديناميكيًا؛ تكوين OSPF خارج نطاق المقرر.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>مبادئ Routing Table الثلاثة:<\/strong> كل Router يقرر وحده؛ جداول الموجّهات ليست بالضرورة متطابقة؛ ومعرفة طريق الذهاب لا تعني وجود طريق العودة.<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Route Entry<\/div><h4>ما الذي أقرأه؟<\/h4><p>Source → Destination Prefix → [AD/Metric] → Next Hop → Age → Exit Interface.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Local vs Connected<\/div><h4>L ليست C<\/h4><p>C تمثل الشبكة المتصلة، بينما L تمثل عنوان الواجهة نفسها لتحديد الحزم الموجهة إلى الموجّه.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال تطبيق: في سطر Route، ما الذي يخبرك بكيف تعلم الموجّه المسار؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Route Source code مثل C أوS أوO.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Route Source<\/span><span class=\"term\">Local Route<\/span><span class=\"term\">Connected Route<\/span><span class=\"term\">Next Hop<\/span><span class=\"term\">Exit Interface<\/span><\/div>"}, {"id": "u14s8", "number": "08", "toc_title": "AD مقابل Metric", "title": "Longest Match وAD وMetric ثلاث مفاضلات مختلفة", "subtitle": "ترتيب الأسئلة أهم من حفظ الأرقام.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">بناء Routing Table<\/div><h4>Metric ثم AD<\/h4><p><strong>Metric<\/strong> يستخدمه Routing Protocol لاختيار أفضل Candidate Route من المسارات التي تعلمها لذلك الـPrefix. وإذا وصلت Routes لنفس Prefix من مصادر مختلفة، تستخدم Cisco IOS <strong>Administrative Distance<\/strong> للمفاضلة بين مصادرها وتحديد ما يُثبت في Routing Table.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Forwarding Packet<\/div><h4>Longest Prefix Match<\/h4><p>بعد أن تصبح Routes مثبتة في Routing Table، يستخدم الموجّه عنوان Destination IP ويختار أكثر Route تحديدًا عبر <strong>Longest Prefix Match<\/strong>.<\/p><\/div>\n<\/div>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>Connected AD = 0<\/h4><p>الأكثر موثوقية ضمن المصادر المدرجة.<\/p><\/div>\n  <div class=\"card\"><h4>Static AD = 1<\/h4><p>افتراضيًا أكثر تفضيلًا من كثير من Dynamic Routes لنفس Prefix.<\/p><\/div>\n  <div class=\"card\"><h4>OSPF AD = 110<\/h4><p>مثال على مصدر ديناميكي، بينما Metric الخاص به هو Cost.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>لا تتعامل معها كسلسلة تُنفذ على كل Packet:<\/strong> Metric وAD يدخلان في بناء Routing Table، بينما Longest Prefix Match يدخل في قرار Forwarding باستخدام الجدول الناتج.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل Route /24 ذات AD=110 تخسر أمام Route /16 ذات AD=1 للوجهة نفسها؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. في Forwarding تُستخدم Route /24 لأنها Longest Prefix Match. AD يُقارن عندما توجد Routes لنفس Prefix من مصادر مختلفة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Administrative Distance (AD)<\/span><span class=\"term\">Metric<\/span><span class=\"term\">Longest Prefix Match<\/span><\/div>"}, {"id": "u14s9", "number": "09", "toc_title": "Static vs Dynamic", "title": "الشبكات الواقعية تجمع بين Static وDynamic Routing", "subtitle": "الثابت يمنح التحكم والبساطة، والديناميكي يمنح التوسع والتكيف.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Static Routing<\/div><h4>تحكم مباشر<\/h4><p>مناسب للشبكات الصغيرة وStub Networks وDefault Route والمسارات التي يريد المسؤول تحديدها صراحةً. يتطلب تعديلًا يدويًا عند تغير Topology.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Dynamic Routing<\/div><h4>تعلم وتكيف<\/h4><p>مناسب للشبكات الأكبر؛ يكتشف الشبكات ويحافظ على معلومات محدثة ويبحث عن مسار جديد عند تغير Topology.<\/p><\/div>\n<\/div>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>IGP<\/h4><p>بروتوكولات داخل Routing Domain لمنظمة واحدة؛ مثل RIP وEIGRP وOSPF وIS-IS.<\/p><\/div>\n  <div class=\"card\"><h4>EGP<\/h4><p>BGP يستخدم لتبادل Routing بين Autonomous Systems ومنظمات مختلفة.<\/p><\/div>\n  <div class=\"card\"><h4>Load Balancing<\/h4><p>عند وجود مسارات متساوية Metric يمكن استخدام عدة Paths في الوقت نفسه.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Equal-Cost Load Balancing:<\/strong> يمكن أن يظهر مع Dynamic Routing، ويمكن تحقيقه أيضًا بمسارات ثابتة متعددة لنفس الوجهة عبر Next-Hops مختلفة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: متى يكون Dynamic Routing أنسب من Static Routing غالبًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">عندما تكبر الشبكة أوتحتاج التكيف تلقائيًا مع تغيرات Topology.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Static Routing<\/span><span class=\"term\">Dynamic Routing<\/span><span class=\"term\">IGP<\/span><span class=\"term\">EGP<\/span><span class=\"term\">Equal-Cost Load Balancing<\/span><\/div>"}]}, {"schema_version": 1, "module_number": 15, "group_id": "08_Routing", "title": "الوحدة 15 — IP Static Routing (التوجيه الثابت لـIP)", "title_en": "IP Static Routing", "badge": "Static Routing", "summary": "كيفية تكوين المسارات الثابتة في IPv4 وIPv6 وفهم تصنيفين مختلفين لها: حسب الغرض Standard/Default/Floating/Summary، وحسب طريقة تحديد الخطوة التالية Next-Hop/Exit-Interface/Fully-Specified؛ ثم التحقق من المسارات، واستخدام Default Route وFloating Static Route وHost Routes، مع تنبيه خاص لاستخدام IPv6 Link-Local كـNext-Hop.", "official_objective": "تكوين مسارات IPv4 وIPv6 الثابتة، بما في ذلك المسارات الثابتة القياسية والافتراضية والعائمة ومسارات المضيف، والتحقق منها.", "lecture": {"duration": "≈ 90 دقيقة", "steps": [{"time": "10 د", "topic": "لماذا نستخدم Static Routes؟ وتصنيفها حسب الغرض."}, {"time": "12 د", "topic": "تصنيفها حسب تحديد Next Hop: Next-Hop / Exit Interface / Fully Specified."}, {"time": "15 د", "topic": "صيغة ip route وipv6 route وأمثلة IPv4 وIPv6."}, {"time": "8 د", "topic": "التحقق باستخدام show route وping وtraceroute."}, {"time": "12 د", "topic": "Default Static Route في IPv4 وIPv6 وGateway of Last Resort."}, {"time": "12 د", "topic": "Floating Static Route وعلاقتها بـAdministrative Distance."}, {"time": "11 د", "topic": "Host Routes: /32 و/128 وLocal Host Route."}, {"time": "10 د", "topic": "الخريطة النهائية ومقارنة الأنواع والتنبيهات المهمة."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/routing_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة المحتوى مع المحاور الرسمية الخمسة: Static Routes، Configure IP Static Routes، Configure IP Default Static Routes، Configure Floating Static Routes، Configure Static Host Routes.", "تم فصل تصنيف Static Routes حسب الغرض عن تصنيفها حسب طريقة تحديد Next Hop حتى لا تُخلط مفاهيم مثل Floating وFully Specified.", "تم إبقاء Summary Static Route كمفهوم ضمن أنواع المسارات كما يورده المصدر دون اختراع قسم تكوين غير موجود في الوحدة.", "تم الحفاظ على تنبيه المصدر بأن Exit-Interface-only يُستخدم مع Point-to-Point Serial Links، وأن Next-Hop Address هو الخيار الموصى به عمومًا.", "في IPv6، تم إبراز وجوب تحديد Exit Interface عند استخدام Link-Local Address كـNext-Hop.", "تم تصحيح خطأ مطبعي في ملخص المصدر [ip=address] إلى [ip-address]، مع تسجيله كملاحظة مصدر.", "جولة المراجعة المتقاطعة: صُححت أمثلة Fully Specified لتتسق مع وصلة R1–R2 في الطوبولوجيا، وسُجل تعارض المصدر بدل تمريره بصمت، وزيدت أسئلة الفهم."], "cross_review_corrections_applied": true}, "sections": [{"id": "u15s1", "number": "01", "toc_title": "أنواع Static Routes", "title": "Static Route ليست نوعًا واحدًا؛ الغرض يحدد شكل استخدامها", "subtitle": "Standard وDefault وFloating وSummary كلها Static Routes لكن لكل منها وظيفة.", "body_html": "<p class=\"core\"><strong>Static Route (المسار الثابت)<\/strong> يضيفه مسؤول الشبكة يدويًا إلى الموجّه. وهو شائع حتى في الشبكات التي تستخدم Dynamic Routing لأنه يمنح تحكمًا مباشرًا في بعض الوجهات.<\/p>\n<div class=\"grid4\">\n  <div class=\"card\"><h4>Standard<\/h4><p>مسار ثابت إلى شبكة بعيدة محددة.<\/p><\/div>\n  <div class=\"card\"><h4>Default<\/h4><p>يمثل أي شبكة لا توجد لها Route أكثر تحديدًا.<\/p><\/div>\n  <div class=\"card\"><h4>Floating<\/h4><p>مسار احتياطي له AD أعلى من المسار الأساسي.<\/p><\/div>\n  <div class=\"card\"><h4>Summary<\/h4><p>Route واحدة تمثل مجموعة Prefixes عندما يسمح تصميم العناوين بذلك.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>تنبيه:<\/strong> هذا تصنيف حسب <em>الغرض<\/em>. في القسم التالي سنرى تصنيفًا آخر حسب الطريقة التي نحدد بها Next Hop داخل الأمر.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل Standard/Default/Floating/Summary تصف طريقة كتابة Next Hop؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. هذه تصف الغرض من Route، بينما Next-Hop/Exit-Interface/Fully-Specified تصف طريقة تحديد الخطوة التالية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Standard Static Route<\/span><span class=\"term\">Default Static Route<\/span><span class=\"term\">Floating Static Route<\/span><span class=\"term\">Summary Static Route<\/span><\/div>"}, {"id": "u15s2", "number": "02", "toc_title": "Next-Hop Options", "title": "طريقة كتابة Next Hop تنتج ثلاثة أشكال مختلفة للمسار الثابت", "subtitle": "عنوان الخطوة التالية، أوواجهة الخروج، أوالاثنان معًا.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>Next-Hop Route<\/h4><p>نكتب عنوان IP للموجّه التالي فقط، والموجّه يحدد Exit Interface للوصول إليه.<\/p><\/div>\n  <div class=\"card\"><h4>Directly Connected Static<\/h4><p>نكتب Exit Interface فقط. يوصي المصدر بقصر هذا الشكل على Point-to-Point Serial Interfaces.<\/p><\/div>\n  <div class=\"card\"><h4>Fully Specified<\/h4><p>نكتب Exit Interface وNext-Hop Address معًا؛ مفيد على Multi-Access Networks، وضروري في حالة IPv6 Link-Local Next Hop.<\/p><\/div>\n<\/div>\n<pre class=\"cmd\">ip route network-address subnet-mask { ip-address | exit-intf [ip-address] } [distance]\nipv6 route ipv6-prefix/prefix-length { ipv6-address | exit-intf [ipv6-address] } [distance]<\/pre>\n<div class=\"keyline\"><strong>التصنيفان مستقلان:<\/strong> يمكن أن يكون Default Route مثلًا Next-Hop Route أوFully Specified حسب كيفية كتابته.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل Floating Route عكس Fully Specified Route؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. Floating تصف وظيفة المسار كاحتياطي، أما Fully Specified فتصف كيفية تحديد Next Hop وExit Interface في الأمر.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Next-Hop Route<\/span><span class=\"term\">Directly Connected Static Route<\/span><span class=\"term\">Fully Specified Static Route<\/span><\/div>"}, {"id": "u15s3", "number": "03", "toc_title": "IPv4 وIPv6 Static", "title": "الفكرة واحدة في IPv4 وIPv6، لكن صيغة Prefix تختلف", "subtitle": "IPv4 يستخدم Network Address + Subnet Mask، وIPv6 يستخدم Prefix/Length.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">IPv4<\/div><h4>Next-Hop Static<\/h4><pre class=\"cmd\">ip route 192.168.2.0 255.255.255.0 172.16.2.2<\/pre><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">IPv6<\/div><h4>Next-Hop Static<\/h4><pre class=\"cmd\">ipv6 route 2001:db8:cafe:2::/64 2001:db8:acad:2::2<\/pre><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Exit Interface Only<\/div><h4>Point-to-Point<\/h4><pre class=\"cmd\">ip route 192.168.2.0 255.255.255.0 s0/1/0<\/pre><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Fully Specified<\/div><h4>واجهة + Next Hop<\/h4><pre class=\"cmd\">ip route 192.168.2.0 255.255.255.0 s0/1/0 172.16.2.2<\/pre><\/div>\n<\/div>\n<div class=\"keyline\"><strong>ملاحظة مصدر:<\/strong> توجد في Instructor Materials أمثلة واجهات غير متسقة بين بعض الشرائح والطوبولوجيا. هنا جرى توحيد المثال مع وصلة R1–R2 المستخدمة في الطوبولوجيا وشرح IPv6: <code>s0/1/0<\/code>.<\/div>\n<div class=\"keyline\"><strong>IPv6 Link-Local:<\/strong> إذا كان Next-Hop هو Link-Local Address فيجب كتابة Exit Interface أيضًا، لأن Link-Local قد يتكرر على روابط مختلفة ولا يكون فريدًا إلا داخل وصلة محددة.<\/div>\n<pre class=\"cmd study-detail\">ipv6 route 2001:db8:acad:1::/64 s0/1/0 fe80::2<\/pre>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: متى يصبح Exit Interface إلزاميًا مع IPv6 Static Route؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">عند استخدام IPv6 Link-Local Address كـNext-Hop، لأن العنوان فريد فقط على الوصلة المحلية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">ip route<\/span><span class=\"term\">ipv6 route<\/span><span class=\"term\">Link-Local Next Hop<\/span><\/div>"}, {"id": "u15s4", "number": "04", "toc_title": "التحقق", "title": "لا تعتبر Route ناجحة لمجرد قبول IOS للأمر", "subtitle": "تحقق من دخولها جدول التوجيه ثم اختبر الوصول والمسار.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>Routing Table<\/h4><p><code>show ip route<\/code><br><code>show ipv6 route<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Static Only<\/h4><p><code>show ip route static<\/code><br><code>show ipv6 route static<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Connectivity<\/h4><p><code>ping<\/code> و<code>traceroute<\/code> لاختبار الوصول والمسار.<\/p><\/div>\n<\/div>\n<pre class=\"cmd\">show ip route 192.168.2.0\nshow running-config | section ip route<\/pre>\n<div class=\"keyline\"><strong>سؤالان دائمًا:<\/strong> هل Route موجودة في Running Config؟ وهل تم تثبيتها فعلًا في Routing Table؟ وجود الأمر وحده لا يضمن أن Route قابلة للاستخدام.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق بين وجود أمر ip route في Running Config ووجود Route في Routing Table؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">الأول يعني أن الأمر مكوّن، أما الثاني فيعني أن IOS استطاع تثبيت Route قابلة للاستخدام وفق شروطها.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">show ip route static<\/span><span class=\"term\">show ipv6 route static<\/span><span class=\"term\">ping<\/span><span class=\"term\">traceroute<\/span><\/div>"}, {"id": "u15s5", "number": "05", "toc_title": "Default Static Route", "title": "Default Route هي Route الملاذ الأخير وليست المسار الأول", "subtitle": "تطابق أي Destination فقط عندما لا توجد Route أكثر تحديدًا.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">IPv4<\/div><h4>Quad-Zero Route<\/h4><pre class=\"cmd\">ip route 0.0.0.0 0.0.0.0 172.16.2.2<\/pre><p>تظهر في الجدول كـ<code>S*<\/code> عندما تكون Candidate Default Route.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">IPv6<\/div><h4>::/0<\/h4><pre class=\"cmd\">ipv6 route ::/0 2001:db8:acad:2::2<\/pre><p>Prefix /0 يعني عدم اشتراط أي بت مطابق.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Gateway of Last Resort:<\/strong> إذا لم يجد الموجّه Prefix أطول من /0، يستخدم Default Route. لذلك فهي خيار أخير بعد فشل كل المسارات الأكثر تحديدًا.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا Default Route لا تتغلب على Route /24؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن Longest Match يفضل /24 الأكثر تحديدًا على /0.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Default Static Route<\/span><span class=\"term\">Quad-Zero Route<\/span><span class=\"term\">Gateway of Last Resort<\/span><\/div>"}, {"id": "u15s6", "number": "06", "toc_title": "Floating Static Route", "title": "Floating Static Route تبقى احتياطية لأنها أقل تفضيلًا", "subtitle": "نرفع Administrative Distance للمسار الاحتياطي حتى لا يُستخدم ما دام المسار الأساسي موجودًا.", "body_html": "<p class=\"core\">المسار الثابت له <strong>AD = 1<\/strong> افتراضيًا. لإنشاء Backup Route نضبط مسارًا ثانيًا إلى الوجهة نفسها بقيمة AD أعلى من المسار الأساسي. لذلك يظل المسار الاحتياطي خارج الاختيار الطبيعي ويظهر عند فشل المسار الأفضل.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>Primary Route<\/b><span>AD أقل → مفضلة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Floating Route<\/b><span>AD أعلى → تنتظر.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Primary Fails<\/b><span>المسار الأساسي يختفي.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Backup Installed<\/b><span>Floating Route تصبح المسار المستخدم.<\/span><\/div>\n<\/div>\n<pre class=\"cmd\">ip route 0.0.0.0 0.0.0.0 172.16.2.2\nip route 0.0.0.0 0.0.0.0 10.10.10.2 5\n\nipv6 route ::/0 2001:db8:acad:2::2\nipv6 route ::/0 2001:db8:feed:10::2 5<\/pre>\n<div class=\"keyline\"><strong>الفكرة ليست الرقم 5 تحديدًا:<\/strong> المطلوب أن تكون AD للمسار الاحتياطي أعلى من AD للمسار الأساسي الذي نريد الاحتفاظ به.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا تستخدم Floating Static Route ما دام المسار الأساسي موجودًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنها مكوّنة بـAdministrative Distance أعلى، فتكون أقل تفضيلًا.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Floating Static Route<\/span><span class=\"term\">Administrative Distance<\/span><span class=\"term\">Backup Route<\/span><\/div>"}, {"id": "u15s7", "number": "07", "toc_title": "Host Routes", "title": "Host Route تستهدف جهازًا واحدًا لا شبكة كاملة", "subtitle": "IPv4 يستخدم /32 وIPv6 يستخدم /128.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Local Host Route<\/div><h4>يضيفها IOS تلقائيًا<\/h4><p>عند تكوين عنوان على واجهة، يضيف IOS Route محلية <code>L<\/code> لعنوان الواجهة نفسها لتحديد الحزم الموجهة إلى الموجّه.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Static Host Route<\/div><h4>يضيفها المسؤول<\/h4><p>Route يدوية إلى جهاز محدد باستخدام /32 في IPv4 أو/128 في IPv6.<\/p><\/div>\n<\/div>\n<pre class=\"cmd\">ip route 209.165.200.238 255.255.255.255 198.51.100.2\nipv6 route 2001:db8:acad:2::238/128 2001:db8:acad:1::2<\/pre>\n<div class=\"keyline\"><strong>Link-Local Next Hop في IPv6:<\/strong> عند استخدامه مع Static Host Route يجب كتابة Exit Interface بالإضافة إلى عنوان Link-Local.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما Prefix Length لمسار مضيف واحد في IPv4 وIPv6؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">/32 في IPv4 و/128 في IPv6.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Host Route<\/span><span class=\"term\">Local Host Route<\/span><span class=\"term\">Static Host Route<\/span><span class=\"term\">/32<\/span><span class=\"term\">/128<\/span><\/div>"}, {"id": "u15s8", "number": "08", "toc_title": "الخريطة النهائية", "title": "اختر نوع Route بسؤالين: لماذا أحتاجها؟ وكيف سأحدد Next Hop؟", "subtitle": "هذه الشاشة تجمع الوحدة كلها دون خلط التصنيفين.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">السؤال الأول<\/div><h4>ما الغرض؟<\/h4><p>Standard للشبكة المحددة، Default لأي وجهة غير معروفة، Floating كاحتياط، Summary لتجميع Prefixes.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">السؤال الثاني<\/div><h4>كيف أحدد الخطوة التالية؟<\/h4><p>Next-Hop Address فقط، أوExit Interface فقط على Point-to-Point، أوFully Specified بالاثنين معًا.<\/p><\/div>\n<\/div>\n<div class=\"grid4\">\n  <div class=\"card\"><h4>Default IPv4<\/h4><p><code>0.0.0.0 0.0.0.0<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Default IPv6<\/h4><p><code>::/0<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Host IPv4<\/h4><p><code>/32<\/code><\/p><\/div>\n  <div class=\"card\"><h4>Host IPv6<\/h4><p><code>/128<\/code><\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال مراجعة: تريد Backup Default Route لا تعمل إلا عند فشل المسار الأساسي. أي خاصية أساسية تضبط؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تجعلها Floating Static Route عبر Administrative Distance أعلى من المسار الأساسي.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Static Route<\/span><span class=\"term\">Default Route<\/span><span class=\"term\">Floating Route<\/span><span class=\"term\">Host Route<\/span><span class=\"term\">Fully Specified<\/span><\/div>"}]}, {"schema_version": 1, "module_number": 16, "group_id": "08_Routing", "title": "الوحدة 16 — Troubleshoot Static and Default Routes (استكشاف أخطاء المسارات الثابتة والافتراضية وإصلاحها)", "title_en": "Troubleshoot Static and Default Routes", "badge": "Troubleshooting", "summary": "منهجية عملية لفهم أين تتوقف الحزمة عند وجود مشكلة في Static أوDefault Route: كيف يبحث الموجّه عن Specific Route ثم Default Route ثم يسقط الحزمة، كيف تتغير الإطارات عبر الموجّهات، كيف نستخدم ping وtraceroute وshow ip route وshow ip interface brief وCDP لعزل المشكلة، ثم تطبيق ذلك على سيناريو Route خاطئة وتصحيحها.", "official_objective": "استكشاف أخطاء تكوين المسارات الثابتة والافتراضية وإصلاحها، مع شرح معالجة الحزم عند وجود Static Route واستكشاف المشكلات الشائعة في تكوين IPv4 Static وDefault Routes.", "lecture": {"duration": "≈ 60 دقيقة", "steps": [{"time": "10 د", "topic": "منطق معالجة الحزمة: Specific Static → Default → Drop."}, {"time": "10 د", "topic": "رحلة الحزمة Router-by-Router وإعادة التغليف والوصول النهائي عبر ARP."}, {"time": "8 د", "topic": "أسباب تغيّر الشبكة والفشل وكيف نبدأ العزل."}, {"time": "12 د", "topic": "أدوات التشخيص الأساسية ووظيفة كل أمر."}, {"time": "12 د", "topic": "سيناريو R1-R2-R3 وتحديد Static Route الخاطئة وتصحيحها."}, {"time": "8 د", "topic": "Decision Tree للمراجعة + تطبيق المنطق نفسه على IPv6 بأوامره المكافئة."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/routing_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة المحتوى مع المحورين الرسميين: Packet Processing with Static Routes وTroubleshoot IPv4 Static and Default Route Configuration.", "حافظت الوحدة على قصرها النسبي ولم تُضخم بتكرار تكوين Static Routes من الوحدة 15.", "المصدر يركز في جزء Troubleshooting النظري على IPv4، بينما أنشطة Packet Tracer تشمل IPv6؛ لذلك أضيفت فقط ملاحظة تطبيق المنهجية نفسها على IPv6 دون إنشاء فصل نظري غير موجود في المصدر.", "تم تصحيح وصف traceroute تقنيًا: في Cisco IOS يعتمد traceroute التقليدي على probes بقيم TTL متزايدة وردود ICMP المرتبطة بانتهاء TTL/الوصول للوجهة، وليس على ICMP Echo Reply كما يذكر جدول المصدر. سُجل ذلك كتوضيح تصحيحي للمصدر.", "لم تُكرر خطوات Packet Tracer أوLab؛ استُخدم سيناريو المصدر فقط لبناء طريقة تفكير تشخيصية.", "جولة المراجعة المتقاطعة: زيدت الأسئلة السيناريوهية، وأضيف سيناريو Default Route خاطئة، وأُبرز Return Path مع الحفاظ على قصر الوحدة."], "cross_review_corrections_applied": true}, "sections": [{"id": "u16s1", "number": "01", "toc_title": "منطق معالجة الحزمة", "title": "Specific Route أولًا، ثم Default Route، ثم Drop", "subtitle": "هذه القاعدة هي نقطة البداية لأي Troubleshooting لمسار ثابت.", "body_html": "<div class=\"flow\">\n  <div class=\"step\"><b>Destination IP<\/b><span>الموجّه يقرأ عنوان الوجهة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Specific Route?<\/b><span>إذا وجدت Route مطابقة أكثر تحديدًا يستخدمها.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Default Route?<\/b><span>إذا لا توجد Specific Route يبحث عن Default.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>No Match<\/b><span>إذا لا توجد Route مناسبة يسقط الحزمة وقد يرسل ICMP إلى المصدر.<\/span><\/div>\n<\/div>\n<div class=\"keyline\"><strong>التشخيص يبدأ من جدول التوجيه:<\/strong> قبل تغيير الكابلات أوالأوامر، اسأل: ما Route التي سيطابقها هذا Destination IP على هذا Router تحديدًا؟<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا وجدت Route /24 وDefault Route /0 للوجهة نفسها، أيهما يستخدم؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Route /24 لأنها Longest Match. Default Route تستخدم فقط عندما لا توجد Route أكثر تحديدًا.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Specific Route<\/span><span class=\"term\">Default Route<\/span><span class=\"term\">Drop<\/span><span class=\"term\">ICMP<\/span><\/div>"}, {"id": "u16s2", "number": "02", "toc_title": "رحلة الحزمة", "title": "كل Router يكرر العملية نفسها حتى تصل الحزمة إلى الشبكة النهائية", "subtitle": "IP Destination يبقى هدف الرحلة، لكن Frame تتغير من وصلة إلى أخرى.", "body_html": "<div class=\"flow\">\n  <div class=\"step\"><b>PC1 → R1<\/b><span>PC1 يرسل إلى Default Gateway.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>R1 → R2<\/b><span>R1 يفك Frame، يبحث في Routing Table، ثم يعيد التغليف.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>R2 → R3<\/b><span>R2 يكرر عملية Route Lookup نفسها.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>R3 → PC3<\/b><span>R3 يرى الشبكة Directly Connected ويستخدم ARP للحصول على MAC الخاص بـPC3.<\/span><\/div>\n<\/div>\n<div class=\"keyline\"><strong>لا تتتبع Frame واحدة من البداية للنهاية:<\/strong> كل Router يزيل Frame الواردة ويبني Frame جديدة مناسبة للوصلة التالية، بينما تبقى حزمة IP هي العنصر الذي يتم توجيهه نحو الوجهة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الذي يتغير عند كل Router: IP Packet أم Layer 2 Frame؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يُعاد بناء Layer 2 Frame لكل وصلة، بينما تستمر حزمة IP نحو الوجهة مع معالجة حقولها اللازمة للتوجيه.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Decapsulation<\/span><span class=\"term\">Re-encapsulation<\/span><span class=\"term\">ARP<\/span><span class=\"term\">Next Hop<\/span><\/div>"}, {"id": "u16s3", "number": "03", "toc_title": "أين تبدأ المشكلة؟", "title": "مشاكل Routing ليست دائمًا Route خاطئة", "subtitle": "Interface أوISP Link أوازدحام أوخطأ تكوين قد ينتج العرض نفسه: لا يوجد اتصال.", "body_html": "<div class=\"grid4\">\n  <div class=\"card\"><h4>Interface Failure<\/h4><p>واجهة Down تمنع Connected Route وقد تكسر المسار.<\/p><\/div>\n  <div class=\"card\"><h4>Provider Failure<\/h4><p>الوصلة مع مزود الخدمة قد تتوقف رغم صحة الإعداد المحلي.<\/p><\/div>\n  <div class=\"card\"><h4>Oversaturation<\/h4><p>ازدحام الرابط قد يؤدي إلى بطء أوفقد حزم.<\/p><\/div>\n  <div class=\"card\"><h4>Misconfiguration<\/h4><p>Prefix أوMask أوNext-Hop خاطئ قد يرسل الحركة للاتجاه الخطأ.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>العزل أهم من التخمين:<\/strong> حدد آخر نقطة ناجحة في المسار وأول نقطة فاشلة، ثم افحص الموجّه أوالرابط بينهما.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا نبدأ مباشرة بحذف Static Routes وإعادة كتابتها؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن المشكلة قد تكون Interface أوLink أوLayer 1/2 أوRoute أخرى. التغيير العشوائي قد يخفي السبب الحقيقي أوينشئ مشكلة جديدة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Fault Isolation<\/span><span class=\"term\">Misconfiguration<\/span><span class=\"term\">Interface Status<\/span><\/div>"}, {"id": "u16s4", "number": "04", "toc_title": "أدوات Troubleshooting", "title": "كل أمر يجيب عن سؤال مختلف", "subtitle": "استخدم الأداة المناسبة بدل تنفيذ مجموعة أوامر بلا هدف.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>ping<\/h4><p><strong>هل يوجد Layer 3 Reachability؟<\/strong> ويمكن Extended Ping أن يحدد Source Interface/Address.<\/p><\/div>\n  <div class=\"card\"><h4>traceroute<\/h4><p><strong>أين تتوقف الرحلة؟<\/strong> يكشف القفزات نحو الوجهة باستخدام probes بقيم TTL متزايدة وردود ICMP المرتبطة بمسار الحزمة.<\/p><\/div>\n  <div class=\"card\"><h4>show ip route<\/h4><p><strong>ما Route التي يملكها الموجّه للوجهة؟<\/strong><\/p><\/div>\n  <div class=\"card\"><h4>show ip interface brief<\/h4><p><strong>هل الواجهات Up/Up وهل عناوين IP صحيحة؟<\/strong><\/p><\/div>\n  <div class=\"card\"><h4>show cdp neighbors<\/h4><p><strong>من متصل مباشرة؟<\/strong> يساعد على التحقق من الجوار وLayer 1/2 في بيئة Cisco.<\/p><\/div>\n  <div class=\"card\"><h4>show running-config<\/h4><p><strong>ما الأمر المكتوب فعليًا؟<\/strong> قارن Config بالتصميم المطلوب.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>تسلسل عملي:<\/strong> Interface Status → Local Ping → Next-Hop Ping → Routing Table → Traceroute → Config Comparison.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال قرار: إذا نجح Ping للـNext-Hop وفشل الوصول للوجهة البعيدة، ما الأمر التالي الأكثر فائدة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">افحص show ip route للوجهة ثم استخدم traceroute لعزل القفزة التي يتوقف عندها المسار.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">ping<\/span><span class=\"term\">Extended Ping<\/span><span class=\"term\">traceroute<\/span><span class=\"term\">show ip route<\/span><span class=\"term\">show ip interface brief<\/span><span class=\"term\">CDP<\/span><\/div>"}, {"id": "u16s5", "number": "05", "toc_title": "سيناريو Route خاطئة", "title": "نجاح Ping إلى الجيران لا يعني أن Remote Route صحيحة", "subtitle": "في سيناريو Cisco المشكلة ظهرت في R2 Routing Table رغم نجاح الوصول بين الموجّهات المجاورة.", "body_html": "<p class=\"core\">في السيناريو، يفشل اتصال PC1 إلى PC3. الاختبارات من R1 إلى R2 وR3 تنجح، وهذا يقلل احتمال أن تكون المشكلة في الوصلات بين الموجّهات. فحص جدول R2 يكشف أن Route إلى شبكة <code>172.16.3.0/24<\/code> تشير إلى Next Hop خاطئ.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Wrong Route on R2<\/div><h4>الاتجاه الخاطئ<\/h4><pre class=\"cmd\">S 172.16.3.0/24 via 192.168.1.1<\/pre><p>هذا Next Hop باتجاه R3 وليس نحو R1 حيث توجد الشبكة 172.16.3.0/24.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Correct Route<\/div><h4>نحو R1<\/h4><pre class=\"cmd\">ip route 172.16.3.0 255.255.255.0 172.16.2.1<\/pre><p>الـNext Hop الصحيح هو R1 على الشبكة 172.16.2.0/24.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>طريقة التفكير:<\/strong> ارسم المسار ذهنيًا ثم اسأل عند كل Router: هل Next Hop المكتوب يقود فعليًا باتجاه Destination Network؟<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال تشخيص: لماذا نجاح Ping إلى R2 وR3 لم يثبت صحة Route إلى 172.16.3.0/24؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنه أثبت Reachability بين الموجّهات فقط؛ ما زال Next-Hop الخاص بالشبكة البعيدة قد يكون خاطئًا.<\/div><\/div>\n<details class=\"expand study-detail\"><summary>سيناريو إضافي · Default Route خاطئة<\/summary><div class=\"expand-body\">إذا كانت الشبكات الداخلية تعمل لكن كل الوجهات غير المعروفة تفشل، تحقق من <code>0.0.0.0/0<\/code> أوGateway of Last Resort: هل الـNext-Hop صحيح وقابل للوصول؟ ثم اختبر الـNext-Hop قبل تغيير بقية Static Routes.<\/div><\/details>\n<div class=\"terms\"><span class=\"term\">Incorrect Next Hop<\/span><span class=\"term\">Routing Table Verification<\/span><span class=\"term\">Connectivity Test<\/span><\/div>"}, {"id": "u16s6", "number": "06", "toc_title": "منهجية المراجعة", "title": "حل المشكلة من المصدر إلى الوجهة ثم تحقق من طريق العودة", "subtitle": "منهجية واحدة تصلح للمسارات الثابتة والافتراضية، ويمكن تطبيقها على IPv6 بأوامره المكافئة.", "body_html": "<div class=\"flow\">\n  <div class=\"step\"><b>1 · Identify<\/b><span>حدد Source وDestination وعنوان Default Gateway.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Local State<\/b><span>تحقق من Interfaces والعناوين.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Hop-by-Hop<\/b><span>اختبر الوصول إلى كل Next Hop.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · Route Lookup<\/b><span>راجع Specific/Default Route في كل Router.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>5 · Return Path<\/b><span>تأكد من وجود Routing عكسي.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>6 · Verify<\/b><span>بعد التصحيح أعد ping/traceroute وتأكد من Routing Table.<\/span><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>وماذا عن IPv6؟<\/summary><div class=\"expand-body\">المحور النظري الرسمي في الوحدة يركز على IPv4، لكن المنهجية نفسها تنطبق على IPv6: استخدم <code>show ipv6 route<\/code> وIPv6 ping/traceroute وتحقق من Prefix وNext-Hop وExit Interface، خصوصًا عند استخدام Link-Local Next Hop.<\/div><\/details>\n<div class=\"keyline\"><strong>الخلاصة:<\/strong> Routing Troubleshooting هو قراءة متسلسلة لقرارات الموجّهات، وليس حفظ أوامر منفصلة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: لماذا يجب فحص Return Path بعد نجاح طريق الذهاب؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن الاتصال ثنائي الاتجاه؛ قد تصل الحزمة إلى الوجهة لكن يفشل الرد إذا لم توجد Route صحيحة للعودة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Troubleshooting Workflow<\/span><span class=\"term\">Return Path<\/span><span class=\"term\">IPv6 Route Verification<\/span><\/div>"}]}]</script><script>

const slides=[{type:'cover',title:'قرار الحزمة: من جدول التوجيه إلى تشخيص المسار'},...modules.flatMap((m,i)=>[{type:'agenda',m,title:'مسار الوحدة '+m.module_number},...m.sections.flatMap(section=>[0,1].map(part=>({type:'section',m,section,part,title:section.title+(part?' · متابعة':'' )}))),...(i===0?[{type:'lpm',title:'اختبر أطول تطابق'}]:i===1?[{type:'static',title:'صمّم Route ثابتة'},{type:'floating',title:'اختبر المسار الاحتياطي'}]:[{type:'trace',title:'شخّص الذهاب والعودة'}])]),{type:'summary',title:'قرارات التوجيه الأساسية'}];

function sectionHTML(m,s,part){let doc=new DOMParser().parseFromString(s.body_html,'text/html');doc.querySelectorAll('script').forEach(x=>x.remove());let nodes=[...doc.body.children].filter(x=>x.textContent.trim());let quiz=nodes.find(x=>x.classList.contains('quiz'));nodes=nodes.filter(x=>x!==quiz);let sizes=nodes.map(x=>x.textContent.trim().length),total=sizes.reduce((a,b)=>a+b,0),cut=1,acc=0,best=Infinity;for(let i=0;i<nodes.length-1;i++){acc+=sizes[i];let diff=Math.abs(total-2*acc);if(diff<best){best=diff;cut=i+1}}let selected=nodes.slice(part?cut:0,part?undefined:cut);if(quiz)quiz.querySelectorAll('[onclick]').forEach(x=>x.removeAttribute('onclick'));return '<div class="kicker">الوحدة '+m.module_number+' · القسم '+esc(s.number)+' · '+(part?'٢/٢':'١/٢')+'</div><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.subtitle)+'</p><div class="body lesson">'+selected.map(x=>x.outerHTML).join('')+(part&&quiz?quiz.outerHTML:'')+'</div><span class="scroll-hint">مرّر داخل الشريحة لاستكمال الشرح ↓</span>'}

const examples=[['192.0.2.18',['192.0.2.0/24 → R1','192.0.2.16/28 → R2','0.0.0.0/0 → ISP'],1],['198.51.100.7',['198.51.100.0/24 → R3','198.51.100.7/32 → R4','0.0.0.0/0 → ISP'],1],['203.0.113.80',['192.0.2.0/24 → R1','198.51.100.0/24 → R3','0.0.0.0/0 → ISP'],2]];
function lpmHTML(){return '<div class="kicker">الوحدة ١٤ · Longest Prefix Match</div><h2>أي Route ستختار الحزمة؟</h2><p class="lead">اختر من الجدول قبل الكشف. عند وجود أكثر من Route للبادئة نفسها، تدخل AD وMetric في مفاضلات أخرى.</p><div class="body scene"><div class="scene-controls"><label>وجهة الحزمة <select id="destination">'+examples.map((e,i)=>'<option value="'+i+'">'+e[0]+'</option>').join('')+'</select></label></div><div class="choice-list" id="routeChoices"></div><div id="routeStatus" class="scene-status" role="status">حدد المسار الذي يملك أطول بادئة مطابقة.</div></div>'}
function staticHTML(){return '<div class="kicker">الوحدة ١٥ · تكوين المسار</div><h2>اختر الغرض وطريقة تحديد Next Hop</h2><p class="lead">الأمثلة بعناوين توثيقية؛ تحقق بعد الأمر من جدول التوجيه وإمكانية الوصول.</p><div class="body scene"><div class="scene-controls"><label>الغرض <select id="purpose"><option value="network">شبكة بعيدة</option><option value="default">مسار افتراضي</option><option value="host">مضيف واحد</option></select></label><label>الصيغة <select id="format"><option value="next">Next-hop IP</option><option value="exit">Exit interface</option><option value="full">Fully specified</option></select></label><button id="buildRoute">كوّن المثال</button></div><div id="staticStatus" class="scene-status" role="status">اختر ثم شاهد مثالًا تعليميًا.</div><p class="source-note">على Ethernet، لا تفترض أن منفذ الخروج وحده مناسب دائمًا؛ تحقق من ARP ومسار الوصول. <a href="https://www.cisco.com/c/en/us/support/docs/dial-access/floating-static-route/118263-technote-nexthop-00.html" target="_blank" rel="noopener noreferrer">Cisco · Static Next Hop</a></p></div>'}
function floatingHTML(){return '<div class="kicker">الوحدة ١٥ · Floating Static Route</div><h2>متى يظهر المسار الاحتياطي؟</h2><p class="lead">للبادئة نفسها، المسار الأساسي AD 1 والاحتياطي AD 5؛ غيّر حالة المسار الأساسي.</p><div class="body scene"><div class="scene-controls"><button data-primary="up">الأساسي متاح</button><button data-primary="down">أزيل الأساسي من الجدول</button></div><div class="scene-flow"><span id="primary" class="active">Primary<br>AD 1</span><span id="backup">Backup<br>AD 5</span><span>Destination<br>203.0.113.0/24</span></div><div id="floatStatus" class="scene-status" role="status">المسار الأساسي ذو AD الأقل هو المفضّل إذا كان مثبتًا.</div><p class="source-note">فشل وجهة بعيدة وحده قد لا يزيل المسار الأساسي دون آلية تتبع. <a href="https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/15986-admin-distance.html" target="_blank" rel="noopener noreferrer">Cisco · Administrative Distance</a></p></div>'}
const pathSteps=[['واجهة المصدر','تأكد من عنوان المصدر وقناع الشبكة والبوابة الافتراضية.'],['R1: جدول التوجيه','حدد أطول بادئة مطابقة وNext Hop؛ راجع حالة واجهة الخروج.'],['R2: الوجهة','كرر الفحص على كل موجّه حتى شبكة الوجهة، ثم تحقق من المضيف.'],['طريق العودة','افحص Route العودة إلى شبكة المصدر؛ نجاح الذهاب وحده لا يضمن نجاح Ping.'],['الإثبات والتوثيق','استخدم show ip route وping وtraceroute وحالة الواجهات، ثم وثق السبب والتصحيح.']];
function traceHTML(){return '<div class="kicker">الوحدة ١٦ · استكشاف العطل</div><h2>الحزمة تصل إلى R2، لكن Ping يفشل</h2><p class="lead">تتبع الذهاب والعودة؛ كل Router يكرر قرار التوجيه، والاستجابة تحتاج طريقًا عائدًا.</p><div class="body scene"><div class="scene-controls"><button id="flowPrev">السابق</button><button id="flowPlay">تشغيل ▶</button><button id="flowNext">الخطوة التالية</button><button id="flowReset">إعادة ↺</button></div><div class="scene-flow">'+pathSteps.map((x,i)=>'<span id="flow'+i+'">'+esc(x[0])+'</span>').join('')+'</div><div id="flowStatus" class="scene-status" role="status"></div></div>'}

function paintFlow(){$('flowStatus').innerHTML='<strong>'+(sceneStep+1)+' / '+pathSteps.length+' · '+esc(pathSteps[sceneStep][0])+'</strong><br>'+esc(pathSteps[sceneStep][1]);pathSteps.forEach((_,i)=>$('flow'+i).classList.toggle('active',i===sceneStep));$('flowPrev').disabled=sceneStep===0;$('flowNext').disabled=sceneStep===pathSteps.length-1}
function drawRoutes(){let e=examples[+$('destination').value];$('routeChoices').innerHTML=e[1].map((v,i)=>'<button class="choice" data-route="'+i+'">'+esc(v)+'</button>').join('');$('routeStatus').textContent='حدد المسار الذي يملك أطول بادئة مطابقة.';$('routeChoices').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{let correct=+b.dataset.route===e[2];$('routeChoices').querySelectorAll('[data-route]').forEach(x=>{x.disabled=true;x.classList.toggle('good',+x.dataset.route===e[2]);x.classList.toggle('bad',x===b&&!correct)});$('routeStatus').textContent=(correct?'صحيح. ':'راجع طول البادئة. ')+e[1][e[2]]+' هو أفضل تطابق للوجهة '+e[0]+'.'})}
function init(){let s=slides[at];if(s.type==='section')$('stage').querySelectorAll('.quiz .chipbtn').forEach(b=>b.onclick=()=>{let a=b.closest('.quiz').querySelector('.answer');a.classList.toggle('open');b.textContent=a.classList.contains('open')?'إخفاء الإجابة':'اعرض الإجابة'});if(s.type==='lpm'){$('destination').onchange=drawRoutes;drawRoutes()}if(s.type==='static')$('buildRoute').onclick=()=>{let prefix={network:'203.0.113.0 255.255.255.0',default:'0.0.0.0 0.0.0.0',host:'203.0.113.10 255.255.255.255'}[$('purpose').value],hop={next:'192.0.2.2',exit:'GigabitEthernet0/1',full:'GigabitEthernet0/1 192.0.2.2'}[$('format').value];$('staticStatus').innerHTML='<strong>مثال IOS</strong><br><code dir="ltr">ip route '+prefix+' '+hop+'</code><br>تحقق من تثبيت Route وحالة الواجهة وإمكانية الوصول إلى Next Hop وطريق العودة.'};if(s.type==='floating')$('stage').querySelectorAll('[data-primary]').forEach(b=>b.onclick=()=>{let up=b.dataset.primary==='up';$('primary').classList.toggle('active',up);$('backup').classList.toggle('active',!up);$('floatStatus').textContent=up?'الأساسي مثبت ويُفضّل لأن AD 1 أقل من AD 5.':'عندما يُزال الأساسي من جدول التوجيه ويصبح الاحتياطي صالحًا، يُستخدم مسار AD 5.'});if(s.type==='trace'){sceneStep=0;let change=d=>{stop();sceneStep=Math.max(0,Math.min(pathSteps.length-1,sceneStep+d));paintFlow()};$('flowPrev').onclick=()=>change(-1);$('flowNext').onclick=()=>change(1);$('flowReset').onclick=()=>{stop();sceneStep=0;paintFlow()};$('flowPlay').onclick=()=>{if(timer){stop();$('flowPlay').textContent='تشغيل ▶';return}if(sceneStep===pathSteps.length-1)sceneStep=0;paintFlow();$('flowPlay').textContent='إيقاف مؤقت ❚❚';timer=setInterval(()=>{if(sceneStep===pathSteps.length-1){stop();$('flowPlay').textContent='تشغيل ▶';return}sceneStep++;paintFlow()},3000)};paintFlow()}}
function render(){stop();let s=slides[at],body='';if(s.type==='cover')body='<div class="kicker">الوحدات ١٤–١٦ · عرض حركي تفاعلي</div><h1>قرار الحزمة: من جدول التوجيه إلى تشخيص المسار</h1><p class="lead">'+esc(modules[0].summary)+'</p><div class="body grid">'+modules.map(m=>'<div class="card"><b>الوحدة '+m.module_number+' · '+esc(m.title_en)+'</b><p>'+esc(m.official_objective)+'</p></div>').join('')+'</div>';else if(s.type==='agenda')body='<div class="kicker">الوحدة '+s.m.module_number+' · '+esc(s.m.lecture.duration)+'</div><h2>'+esc(s.m.title)+'</h2><div class="body grid">'+s.m.lecture.steps.map(x=>'<div class="card"><b>'+esc(x.time)+'</b><p>'+esc(x.topic)+'</p></div>').join('')+'</div>';else if(s.type==='section')body=sectionHTML(s.m,s.section,s.part);else if(s.type==='lpm')body=lpmHTML();else if(s.type==='static')body=staticHTML();else if(s.type==='floating')body=floatingHTML();else if(s.type==='trace')body=traceHTML();else body='<div class="kicker">خلاصة المحاضرة</div><h2>أربع قواعد قبل تغيير الإعدادات</h2><div class="body grid"><div class="card"><b>Longest Match</b><p>اختر البادئة المطابقة الأطول أولًا.</p></div><div class="card"><b>Route مثبتة</b><p>وجود الأمر في التكوين لا يكفي لإثبات وصول الحزمة.</p></div><div class="card"><b>Default / Floating</b><p>المسار الافتراضي ملاذ أخير، والاحتياطي يحتاج AD أعلى وصلاحية عند غياب الأساسي.</p></div><div class="card"><b>اتجاهان</b><p>افحص الذهاب والعودة ونقاط الفشل بالأدلة.</p></div></div>';
$('stage').innerHTML='<article class="slide '+(large?'large':'')+'">'+body+'<footer class="foot"><span>Routing · CCNA 2</span><span>'+(at+1)+' / '+slides.length+'</span></footer></article>';$('count').textContent=(at+1)+' / '+slides.length;$('progress').style.width=(at+1)/slides.length*100+'%';$('prev').disabled=at===0;$('next').disabled=at===slides.length-1;$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';init();history.replaceState(null,'','#slide-'+(at+1))}
function go(i){if(i<0||i>=slides.length)return;at=i;render()}$('prev').onclick=()=>go(at-1);$('next').onclick=()=>go(at+1);$('markBtn').onclick=()=>{marks.has(at)?marks.delete(at):marks.add(at);try{localStorage.setItem('routing_marks',JSON.stringify([...marks]))}catch{}$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';let b=$('menuList').querySelector('[data-slide="'+at+'"]');if(b)b.textContent=(at+1)+' · '+slides[at].title+(marks.has(at)?' ★':'')};$('notesBtn').onclick=()=>{large=!large;$('stage').querySelector('.slide').classList.toggle('large',large);$('notesBtn').classList.toggle('active',large);$('notesBtn').setAttribute('aria-pressed',String(large))};$('themeBtn').onclick=()=>{let day=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=day?'light':'dark';$('themeBtn').innerHTML=day?'☾ <span>ليلي</span>':'☀ <span>نهاري</span>';$('themeBtn').setAttribute('aria-pressed',String(day));$('themeBtn').setAttribute('aria-label',day?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري')};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('menuBtn').onclick=()=>{$('menu').classList.add('open');$('closeMenu').focus()};$('closeMenu').onclick=()=>{$('menu').classList.remove('open');$('menuBtn').focus()};$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('menuList').innerHTML=slides.map((s,i)=>'<button data-slide="'+i+'">'+(i+1)+' · '+esc(s.title)+'</button>').join('');$('menuList').onclick=e=>{let b=e.target.closest('[data-slide]');if(b){$('menu').classList.remove('open');$('menuBtn').focus();go(+b.dataset.slide)}};document.addEventListener('keydown',e=>{if($('menu').classList.contains('open')){if(e.key==='Escape'){$('menu').classList.remove('open');$('menuBtn').focus()}return}if(e.target.closest('button,input,select,textarea,summary'))return;if(['ArrowLeft','PageDown'].includes(e.key))go(at+1);if(['ArrowRight','PageUp'].includes(e.key))go(at-1)});let sx=0,sy=0;$('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select,summary,details,input,textarea,pre,.cmd,.table-scroll'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>1.5*Math.abs(dy))go(at+(dx<0?-1:1))},{passive:true});let m=location.hash.match(/^#slide-(\d+)$/);if(m)at=Math.max(0,Math.min(slides.length-1,+m[1]-1));render()})();

</script></body></html>
