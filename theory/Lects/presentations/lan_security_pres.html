<script type="application/json" id="data">[{"schema_version": 1, "module_number": 10, "group_id": "06_LAN_Security", "title": "الوحدة 10 — LAN Security Concepts (مفاهيم أمان الشبكة المحلية)", "title_en": "LAN Security Concepts", "badge": "LAN Security", "summary": "كيف تُستغل نقاط النهاية والتحكم في الوصول والطبقة الثانية، ولماذا قد يؤدي اختراق Layer 2 إلى تجاوز ضوابط الطبقات الأعلى، ثم كيف تعمل هجمات MAC Flooding وVLAN Hopping وDHCP وARP وAddress Spoofing وSTP وCDP Reconnaissance، وما آليات التخفيف الأساسية المرتبطة بكل منها.", "official_objective": "شرح كيف تؤثر الثغرات في أمان الشبكة المحلية، مع توضيح أمان نقاط النهاية، والتحكم في الوصول باستخدام AAA و802.1X، وثغرات Layer 2، وهجمات جدول عناوين MAC، وهجمات LAN.", "lecture": {"duration": "≈ 90 دقيقة", "steps": [{"time": "10 د", "topic": "التهديدات الحديثة وحماية نقاط النهاية وأجهزة الأمان الأساسية."}, {"time": "12 د", "topic": "AAA وLocal/Server-Based Authentication وRADIUS/TACACS+."}, {"time": "8 د", "topic": "IEEE 802.1X وأدوار Supplicant وAuthenticator وAuthentication Server."}, {"time": "10 د", "topic": "لماذا Layer 2 نقطة حساسة وخريطة هجمات المحوّل وآليات التخفيف."}, {"time": "10 د", "topic": "MAC Address Table Flooding وعلاقته بـUnknown Unicast Flooding وPort Security."}, {"time": "10 د", "topic": "VLAN Hopping وDouble-Tagging والعلاقة مع DTP وNative VLAN."}, {"time": "10 د", "topic": "DHCP Starvation وDHCP Spoofing ودور DHCP Snooping."}, {"time": "10 د", "topic": "ARP Spoofing/Poisoning وAddress Spoofing وDAI/IPSG."}, {"time": "10 د", "topic": "STP Attack وCDP/LLDP Reconnaissance + مراجعة شاملة."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/lan_security_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة الداتا مع المحاور الرسمية الخمسة: Endpoint Security، Access Control، Layer 2 Security Threats، MAC Address Table Attack، وLAN Attacks.", "حافظت الوحدة على طبيعتها المفاهيمية؛ أوامر التكوين تظهر فقط عندما تساعد على فهم التخفيف، بينما يبقى التطبيق التفصيلي في الوحدة 11.", "استُخدمت ترجمة Cisco العربية «المصادقة والتفويض والمحاسبة» لـAAA، و«أمان المنفذ» لـPort Security، و«فحص ARP الديناميكي» لـDAI، و«التطفل على بروتوكول DHCP» لـDHCP Snooping عند تقديم المصطلح رسميًا.", "أنشطة الفيديو وCheck Your Understanding لم تُنسخ؛ حُوّلت أفكارها إلى أسئلة فهم قصيرة داخل الوحدة.", "تم ربط كل هجوم بآلية التخفيف المقابلة دون إدخال تكوينات خارج نطاق Module 10.", "جولة المراجعة المتقاطعة: أضيفت أسئلة للأقسام الناقصة، وخُفف التركيز على أسماء منتجات Cisco، ووُضحت شروط Double-Tagging."], "cross_review_corrections_applied": true}, "sections": [{"id": "u10s1", "number": "01", "toc_title": "Endpoint Security", "title": "حماية الشبكة تبدأ من نقاط النهاية ولا تتوقف عند الجدار الناري", "subtitle": "DDoS وData Breach وMalware توضح أن حماية LAN تحتاج دفاعًا متعدد الطبقات حول المستخدم والجهاز والخدمات.", "body_html": "<p class=\"core\">تذكر Cisco ثلاثة أمثلة بارزة على الهجمات الحديثة: <strong>DDoS<\/strong> لتعطيل الخدمة، و<strong>Data Breach<\/strong> لسرقة المعلومات السرية، و<strong>Malware<\/strong> لإصابة الأنظمة ببرمجيات ضارة. نقاط النهاية مثل الحواسيب والخوادم وهواتف IP وأجهزة الموظفين معرضة بصورة خاصة للتهديدات القادمة عبر البريد والويب.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>DDoS<\/h4><p>هجوم منسق من عدد كبير من الأجهزة بهدف إبطاء أو إيقاف الوصول إلى موارد المؤسسة.<\/p><\/div>\n  <div class=\"card\"><h4>Data Breach<\/h4><p>اختراق خوادم أو مضيفين بهدف سرقة بيانات سرية.<\/p><\/div>\n  <div class=\"card\"><h4>Malware<\/h4><p>برمجيات ضارة قد تتسبب في تشفير الملفات أو التجسس أو تعطيل الأنظمة.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Perimeter<\/div><h4>VPN / NGFW / NAC<\/h4><p>VPN للوصول الآمن عن بعد، وNGFW للفحص المتقدم والتحكم بالتطبيقات، وNAC لإدارة سياسات الوصول.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Endpoint<\/div><h4>AMP / ESA / WSA<\/h4><p>AMP لمكافحة البرمجيات الضارة، وESA لحماية البريد، وWSA لحماية حركة الويب والتحكم فيها.<\/p><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>ما دور ESA وWSA وفق الوحدة؟<\/summary><div class=\"expand-body\"><strong>ESA<\/strong> مثال من منتجات Cisco في العرض يراقب SMTP ويساعد على حجب التهديدات والروابط الضارة وتشفير البريد الصادر عند الحاجة. <strong>WSA<\/strong> مثال من منتجات Cisco في العرض يركز على تهديدات الويب عبر فلترة URL، فحص البرمجيات الضارة، تصنيف المواقع والتحكم بالتطبيقات.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا يكفي الاعتماد على Antivirus وحده؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن التهديدات تأتي عبر مسارات متعددة؛ لذلك تعرض الوحدة حماية متعددة الطبقات تشمل NAC وAMP وحماية البريد والويب وأجهزة حماية الشبكة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Endpoint Security<\/span><span class=\"term\">DDoS<\/span><span class=\"term\">NGFW<\/span><span class=\"term\">NAC<\/span><span class=\"term\">AMP<\/span><\/div>"}, {"id": "u10s2", "number": "02", "toc_title": "AAA", "title": "AAA يجيب عن ثلاثة أسئلة: من أنت؟ ماذا يسمح لك؟ وماذا فعلت؟", "subtitle": "المصادقة والتفويض والمحاسبة هي الإطار الأساسي للتحكم في الوصول إلى أجهزة الشبكة وخدماتها.", "body_html": "<p class=\"core\"><strong>AAA — المصادقة والتفويض والمحاسبة<\/strong> هو إطار للتحكم في الوصول. <strong>Authentication<\/strong> يثبت الهوية، و<strong>Authorization<\/strong> يحدد الصلاحيات بعد نجاح المصادقة، و<strong>Accounting<\/strong> يسجل النشاط والاستخدام لأغراض التدقيق والتتبع.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>Authentication<\/b><span>من المستخدم؟ وهل بيانات اعتماده صحيحة؟<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Authorization<\/b><span>ما الذي يحق له تنفيذه أو الوصول إليه؟<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Accounting<\/b><span>ماذا فعل؟ ومتى؟ وكم استهلك؟<\/span><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Local AAA<\/div><h4>قاعدة محلية<\/h4><p>المستخدمون محفوظون على كل جهاز. مناسبة للشبكات الصغيرة لكنها لا تتوسع بسهولة.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Server-Based AAA<\/div><h4>خادم مركزي<\/h4><p>الأجهزة تتصل بخادم AAA مركزي عبر بروتوكولات مثل RADIUS أو TACACS+، وهو أنسب عند وجود عدة موجّهات ومحوّلات.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Accounting ليس تسجيل دخول:<\/strong> هو سجل تفصيلي قد يتضمن وقت البداية والنهاية، الأوامر المنفذة، وعدد الحزم والبايتات.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي جزء من AAA يحدد ما يستطيع المستخدم فعله بعد نجاح تسجيل الدخول؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Authorization (التفويض).<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">AAA<\/span><span class=\"term\">Authentication<\/span><span class=\"term\">Authorization<\/span><span class=\"term\">Accounting<\/span><span class=\"term\">RADIUS<\/span><span class=\"term\">TACACS+<\/span><\/div>"}, {"id": "u10s3", "number": "03", "toc_title": "IEEE 802.1X", "title": "802.1X يجعل منفذ الوصول بوابة مصادقة قبل السماح بخدمات LAN", "subtitle": "المعيار يقسم العملية إلى Supplicant وAuthenticator وAuthentication Server.", "body_html": "<p class=\"core\"><strong>IEEE 802.1X<\/strong> هو بروتوكول للتحكم في الوصول والمصادقة على مستوى المنفذ. الهدف هو منع محطة غير مصرح لها من استخدام خدمات الشبكة قبل التحقق من هويتها.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>Supplicant<\/b><span>العميل الذي يطلب الوصول ويستجيب لطلبات المصادقة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Authenticator<\/b><span>المحوّل أو نقطة الوصول التي تتوسط بين العميل وخادم المصادقة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Authentication Server<\/b><span>الخادم الذي يتحقق من هوية العميل ويرسل قرار السماح أو الرفض.<\/span><\/div>\n<\/div>\n<div class=\"keyline\"><strong>الفكرة:<\/strong> المحوّل لا يثبت هوية المستخدم بنفسه في النموذج المركزي؛ بل يطلب المعلومات ويمررها إلى خادم المصادقة ثم يطبق القرار.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي جهاز يؤدي عادةً دور Authenticator في شبكة سلكية؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">المحوّل، ويمكن لنقطة الوصول اللاسلكية أن تؤدي الدور نفسه في الشبكات اللاسلكية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">IEEE 802.1X<\/span><span class=\"term\">Supplicant<\/span><span class=\"term\">Authenticator<\/span><span class=\"term\">Authentication Server<\/span><\/div>"}, {"id": "u10s4", "number": "04", "toc_title": "تهديدات Layer 2", "title": "اختراق Layer 2 قد يجعل ضوابط الطبقات الأعلى بلا قيمة عملية", "subtitle": "أمان المحوّل ليس تفصيلًا محليًا؛ فهو الأساس الذي تعتمد عليه الاتصالات في الطبقات الأعلى.", "body_html": "<p class=\"core\">توضح الوحدة أن مسؤولي الشبكات يركزون كثيرًا على الحماية من Layer 3 إلى Layer 7 باستخدام VPN وFirewalls وIPS، لكن إذا تم اختراق <strong>Layer 2<\/strong> واستطاع المهاجم اعتراض الإطارات أو التلاعب بسلوك المحوّل، فإن الحماية الأعلى قد لا تمنع الضرر داخل LAN.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>MAC Table<\/h4><p>MAC Flooding قد يجبر المحوّل على Flooding للحركة غير المعروفة.<\/p><\/div>\n  <div class=\"card\"><h4>VLAN<\/h4><p>VLAN Hopping وDouble-Tagging يحاولان تجاوز حدود الفصل بين VLANs.<\/p><\/div>\n  <div class=\"card\"><h4>DHCP<\/h4><p>Starvation وSpoofing يستغلان آلية توزيع إعدادات IP.<\/p><\/div>\n  <div class=\"card\"><h4>ARP<\/h4><p>Spoofing وPoisoning يزوّران الربط بين IP وMAC.<\/p><\/div>\n  <div class=\"card\"><h4>Address Spoofing<\/h4><p>انتحال MAC أوIP لمحاولة الظهور بهوية جهاز آخر.<\/p><\/div>\n  <div class=\"card\"><h4>STP<\/h4><p>التلاعب بـBPDU لمحاولة تغيير Root Bridge ومسار الحركة.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Attack<\/div><h4>MAC / DHCP / ARP / IP<\/h4><p>تستهدف المعلومات التي يعتمد عليها المحوّل أو المضيف في إعادة التوجيه والتهيئة.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Mitigation<\/div><h4>Port Security / DHCP Snooping / DAI / IPSG<\/h4><p>كل آلية تحمي نقطة مختلفة، ولن تكون فعالة إذا بقيت إدارة الأجهزة نفسها غير مؤمنة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>إدارة الشبكة جزء من الحماية:<\/strong> توصي Cisco باستخدام SSH وSCP وSFTP وSSL/TLS، وشبكة إدارة مستقلة عند الحاجة، وManagement VLAN مخصصة، وACLs.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي آلية تخفيف ترتبط مباشرة بهجوم ARP Spoofing في خريطة Layer 2؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Dynamic ARP Inspection (DAI).<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Layer 2 Security<\/span><span class=\"term\">Port Security<\/span><span class=\"term\">DHCP Snooping<\/span><span class=\"term\">DAI<\/span><span class=\"term\">IPSG<\/span><\/div>"}, {"id": "u10s5", "number": "05", "toc_title": "MAC Flooding", "title": "عند امتلاء جدول MAC يبدأ المحوّل بإغراق Unknown Unicast داخل VLAN", "subtitle": "MAC Address Flooding يستغل السعة المحدودة لجدول MAC بإغراقه بعناوين مصدر مزيفة.", "body_html": "<p class=\"core\">يبني المحوّل <strong>MAC Address Table<\/strong> من عناوين MAC المصدرية. ولأن الجدول محدود السعة، يستطيع مهاجم إرسال عدد كبير من الإطارات بعناوين مصدر مزيفة حتى يمتلئ الجدول. عندها يعامل المحوّل وجهات غير موجودة في الجدول كـ<strong>Unknown Unicast<\/strong> ويغرقها إلى المنافذ الأخرى داخل VLAN نفسها.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Fake MACs<\/b><span>المهاجم يرسل إطارات كثيرة بعناوين مصدر مزيفة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Table Full<\/b><span>جدول MAC يفقد القدرة على تعلم مزيد من الإدخالات.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Flooding<\/b><span>Unknown Unicast يُرسل إلى منافذ VLAN بدل منفذ محدد.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · Capture<\/b><span>المهاجم قد يلتقط حركة محلية لم تكن موجهة إليه.<\/span><\/div>\n<\/div>\n<div class=\"keyline\"><strong>النطاق:<\/strong> الإغراق في هذا السيناريو يبقى داخل LAN/VLAN المحلية التي يتصل بها المهاجم.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما آلية الحماية الأساسية التي تشير إليها الوحدة لمواجهة MAC Table Overflow؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Port Security (أمان المنفذ)، لأنه يحد عدد عناوين MAC المصدرية المسموح بتعلمها على المنفذ.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">MAC Address Flooding<\/span><span class=\"term\">Unknown Unicast<\/span><span class=\"term\">Port Security<\/span><\/div>"}, {"id": "u10s6", "number": "06", "toc_title": "VLAN Attacks", "title": "VLAN Hopping يحاول تجاوز حدود VLAN عبر Trunk غير مصرح أو Double-Tagging", "subtitle": "الهجوم الأول يستغل DTP والتفاوض على Trunk، والثاني يستغل سلوك Native VLAN مع وسم 802.1Q مزدوج.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">VLAN Hopping<\/div><h4>المضيف يتظاهر بأنه محوّل<\/h4><p>يرسل إشارات 802.1Q وDTP محاولًا جعل منفذ الوصول يصبح Trunk، وبذلك يستطيع إرسال واستقبال حركة VLANs متعددة.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Double-Tagging<\/div><h4>وسمان داخل الإطار<\/h4><p>يستخدم وسمًا خارجيًا للـNative VLAN ووسمًا داخليًا للـVLAN المستهدفة حتى يزيل المحوّل الأول الوسم الخارجي ويعالج الثاني الداخلي.<\/p><\/div>\n<\/div>\n<div class=\"flow\">\n  <div class=\"step\"><b>Outer Tag<\/b><span>يساوي Native VLAN على الوصلة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Switch 1<\/b><span>يزيل الوسم الخارجي ولا يعيد وسم حركة Native VLAN.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Inner Tag<\/b><span>يبقى داخل الإطار حتى يصل إلى المحوّل التالي.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Switch 2<\/b><span>يرى الوسم الداخلي ويرسل إلى VLAN المستهدفة.<\/span><\/div>\n<\/div>\n<div class=\"keyline\"><strong>شروط مرتبطة بالهجوم:<\/strong> Double-Tagging يعتمد على أن يكون المهاجم ضمن Native VLAN المستخدمة على الوصلة وأن يمر الإطار عبر Trunk يعامل Native VLAN دون وسم خارجي؛ لذلك لا ينجح بنفس الصورة في أي تصميم VLAN عشوائي.<\/div>\n<div class=\"keyline\"><strong>Mitigation حسب الوحدة:<\/strong> اجعل منافذ المستخدم Access ثابتة، عطّل Auto Trunking، فعّل Trunks يدويًا فقط، ولا تستخدم Native VLAN لحركة المستخدمين.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا يرتبط Double-Tagging بالـNative VLAN؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن المحوّل الأول يزيل الوسم الخارجي الخاص بالـNative VLAN ولا يعيد وسم الإطار، فيبقى الوسم الداخلي ليقرأه المحوّل التالي.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">VLAN Hopping<\/span><span class=\"term\">Double-Tagging<\/span><span class=\"term\">DTP<\/span><span class=\"term\">Native VLAN<\/span><\/div>"}, {"id": "u10s7", "number": "07", "toc_title": "DHCP Attacks", "title": "DHCP Starvation يستنزف العناوين وDHCP Spoofing يوزع إعدادات مزيفة", "subtitle": "الهجومان مختلفان في الهدف لكن كلاهما يرتبط بضرورة التحكم في مصادر DHCP عبر DHCP Snooping.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">DHCP Starvation<\/div><h4>استنزاف Pool<\/h4><p>يرسل المهاجم عددًا كبيرًا من DHCPDISCOVER بعناوين MAC مزيفة ليحاول استئجار جميع العناوين المتاحة ومنع العملاء الشرعيين من الحصول على IP.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">DHCP Spoofing<\/div><h4>Rogue DHCP Server<\/h4><p>خادم DHCP غير مصرح يوزع إعدادات خاطئة مثل Default Gateway أوDNS أوIP لإحداث MITM أوDoS أو توجيه المستخدم إلى وجهة خبيثة.<\/p><\/div>\n<\/div>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>Wrong Gateway<\/h4><p>قد يضع عنوان المهاجم كبوابة ويهيئ Man-in-the-Middle.<\/p><\/div>\n  <div class=\"card\"><h4>Wrong DNS<\/h4><p>قد يوجه العميل إلى DNS مزيف ثم مواقع خبيثة.<\/p><\/div>\n  <div class=\"card\"><h4>Wrong IP<\/h4><p>قد يعطي إعدادًا غير صالح فيقطع الاتصال عن العميل.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>الحماية:<\/strong> DHCP Snooping (التطفل على بروتوكول DHCP) يميز المنافذ الموثوقة وغير الموثوقة ويراقب رسائل DHCP؛ تفاصيل التكوين في الوحدة 11.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق بين DHCP Starvation وDHCP Spoofing؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Starvation يستنزف Pool بالعناوين، بينما Spoofing يقدم خادم DHCP غير مصرح يوزع إعدادات مزيفة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DHCP Starvation<\/span><span class=\"term\">DHCP Spoofing<\/span><span class=\"term\">Rogue DHCP Server<\/span><span class=\"term\">DHCP Snooping<\/span><\/div>"}, {"id": "u10s8", "number": "08", "toc_title": "ARP وAddress Spoofing", "title": "تزوير الربط بين IP وMAC يمكن أن يحول المهاجم إلى وسيط داخل LAN", "subtitle": "ARP Spoofing/Poisoning وMAC/IP Spoofing تستغل ثقة الطبقة الثانية بالمعلومات التي تتلقاها.", "body_html": "<p class=\"core\">يمكن للجهاز إرسال <strong>Gratuitous ARP<\/strong> دون طلب مسبق، وقد تحفظ الأجهزة الأخرى الربط الموجود فيه. يستغل المهاجم ذلك بإرسال ARP Reply مزيف يربط عنوان IP للبوابة الافتراضية بعنوان MAC الخاص به، ما قد يهيئ <strong>Man-in-the-Middle<\/strong>.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">ARP Spoofing / Poisoning<\/div><h4>تزوير IP ↔ MAC<\/h4><p>يرسل المهاجم ردود ARP غير مطلوبة بمعلومات مزيفة. التخفيف: Dynamic ARP Inspection (فحص ARP الديناميكي).<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Address Spoofing<\/div><h4>انتحال هوية جهاز<\/h4><p>يغير المهاجم MAC أوIP ليبدو كجهاز آخر. التخفيف الذي تعرضه الوحدة: IP Source Guard (IPSG).<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>سبب الضعف:<\/strong> المحوّل في Layer 2 لا يملك آلية عامة تثبت أن Source MAC الذي استقبله يمثل فعلًا الجهاز الشرعي.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما آلية التخفيف المرتبطة مباشرة بـARP Spoofing في منهج Cisco؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Dynamic ARP Inspection (DAI).<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Gratuitous ARP<\/span><span class=\"term\">ARP Spoofing<\/span><span class=\"term\">ARP Poisoning<\/span><span class=\"term\">DAI<\/span><span class=\"term\">IPSG<\/span><\/div>"}, {"id": "u10s9", "number": "09", "toc_title": "STP وCDP", "title": "المهاجم قد يغير الشجرة أو يستخدم بروتوكولات الاكتشاف للاستطلاع", "subtitle": "STP Attack يحاول تزوير Root Bridge، بينما CDP/LLDP Reconnaissance يكشف معلومات مفيدة للمهاجم.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">STP Attack<\/div><h4>Root Bridge مزيف<\/h4><p>يبث المهاجم BPDUs بأولوية Bridge أقل لمحاولة الفوز كـRoot Bridge وإجبار الشبكة على إعادة حساب STP، ما قد يجعل الحركة تمر عبره.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">CDP Reconnaissance<\/div><h4>جمع معلومات البنية<\/h4><p>CDP يعلن دوريًا معلومات مثل IP وإصدار IOS والمنصة والقدرات وNative VLAN، وهي معلومات نافعة للإدارة لكنها مفيدة للمهاجم أيضًا.<\/p><\/div>\n<\/div>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>Mitigate STP<\/h4><p>BPDU Guard على منافذ الوصول يمنع جهازًا طرفيًا من إدخال BPDUs غير متوقعة في التصميم.<\/p><\/div>\n  <div class=\"card\"><h4>Limit Discovery<\/h4><p>عطّل CDP أوLLDP على المنافذ أو الأجهزة التي لا تحتاجها، خصوصًا المنافذ المتصلة بأجهزة غير موثوقة.<\/p><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">no cdp run\nno cdp enable\nno lldp run\nno lldp transmit\nno lldp receive<\/pre>\n<div class=\"keyline\"><strong>خريطة الوحدة:<\/strong> افهم أولًا ما الذي يثق به Layer 2، ثم اسأل: كيف يمكن تزوير هذه المعلومة؟ وأي ضابط يعيد الثقة إلى المسار؟<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا قد يكون تعطيل CDP/LLDP مناسبًا على منفذ غير موثوق؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن بروتوكولات الاكتشاف قد تكشف معلومات مفيدة للاستطلاع عندما لا تكون هناك حاجة تشغيلية لها على ذلك المنفذ.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">STP Attack<\/span><span class=\"term\">BPDU Guard<\/span><span class=\"term\">CDP<\/span><span class=\"term\">LLDP<\/span><span class=\"term\">Reconnaissance<\/span><\/div>"}]}, {"schema_version": 1, "module_number": 11, "group_id": "06_LAN_Security", "title": "الوحدة 11 — Switch Security Configuration (تكوين أمان المحوّل)", "title_en": "Switch Security Configuration", "badge": "Switch Security", "summary": "كيف يترجم أمن Layer 2 إلى ضوابط عملية على المحوّل: تأمين المنافذ غير المستخدمة، وتطبيق Port Security وتعلم Secure MAC وAging وViolation Modes، ومنع VLAN Hopping، وتكوين DHCP Snooping وDynamic ARP Inspection، ثم استخدام PortFast وBPDU Guard ضد هجمات STP.", "official_objective": "تكوين أمان المحوّل للتخفيف من هجمات LAN، من خلال تطبيق Port Security، والتخفيف من هجمات VLAN وDHCP وARP وSTP.", "lecture": {"duration": "≈ 90 دقيقة", "steps": [{"time": "8 د", "topic": "تأمين المنافذ غير المستخدمة ومبدأ تقليل سطح الهجوم."}, {"time": "15 د", "topic": "Port Security: التفعيل، الحد الأقصى، Secure MAC، وطرق التعلم Manual/Dynamic/Sticky."}, {"time": "15 د", "topic": "Aging وViolation Modes وerror-disabled وأوامر التحقق الأساسية."}, {"time": "10 د", "topic": "التخفيف من VLAN Hopping: Access/Trunk ثابت، nonegotiate، Native VLAN."}, {"time": "15 د", "topic": "DHCP Snooping: Trusted/Untrusted، Rate Limiting، Binding Table، التحقق."}, {"time": "12 د", "topic": "Dynamic ARP Inspection واعتماده على DHCP Snooping Binding Table."}, {"time": "8 د", "topic": "التحقق الإضافي في DAI: src-mac / dst-mac / ip."}, {"time": "7 د", "topic": "PortFast وBPDU Guard والتخفيف من STP Attacks + مراجعة."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/lan_security_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة الداتا مع المحاور الرسمية الخمسة: Implement Port Security، Mitigate VLAN Attacks، Mitigate DHCP Attacks، Mitigate ARP Attacks، وMitigate STP Attacks.", "تم الحفاظ على الأوامر الأساسية التي تُظهر مفهوم الحماية، مع عدم نسخ خطوات Packet Tracer/Lab حرفيًا.", "سُجل خطأ مصدر في صفحة المصطلحات حيث يظهر عنوان Module 11: LAN Security Concepts بدل Switch Security Configuration.", "سُجل خطأ مصدر في الأمر spanning-tree porfast bpduguard default؛ الصحيح portfast.", "سُجل خطأ تقني في نص BPDU Guard الذي يذكر errdisable recovery cause psecure_violation؛ سبب الاسترداد الخاص بـBPDU Guard هو bpduguard. لم يُنقل الخطأ إلى محتوى الوحدة.", "تم اعتماد ترجمة Cisco العربية «أمان المنفذ» لـPort Security، و«فحص ARP الديناميكي» لـDAI، و«التطفل على بروتوكول DHCP» لـDHCP Snooping عند تقديم المصطلح الرسمي.", "جولة المراجعة المتقاطعة: زيدت أسئلة الفهم، وضُبطت صياغة PortFast، وأضيف رابط نطاق IPSG، وجُعلت أوامر التحقق مرجعية أكثر."], "cross_review_corrections_applied": true}, "sections": [{"id": "u11s1", "number": "01", "toc_title": "المنافذ غير المستخدمة", "title": "أول قاعدة في أمان المحوّل: لا تترك منفذًا غير مستخدم مفتوحًا", "subtitle": "تقليل سطح الهجوم يبدأ بتعطيل المنافذ التي لا تحتاجها وتحديد وظيفة كل منفذ بوضوح.", "body_html": "<p class=\"core\">توصي الوحدة بتأمين جميع منافذ المحوّل قبل التشغيل الفعلي. أبسط إجراء هو تعطيل المنافذ غير المستخدمة باستخدام <code>shutdown<\/code>، ويمكن التعامل مع مجموعة منافذ عبر <code>interface range<\/code>.<\/p>\n<pre class=\"cmd\">interface range fa0/10 - 24\n shutdown<\/pre>\n<div class=\"keyline\"><strong>المبدأ:<\/strong> المنفذ الذي لا يؤدي وظيفة حالية لا يجب أن يبقى نقطة دخول جاهزة لأي جهاز غير مصرح.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا يعد shutdown للمنافذ غير المستخدمة إجراءً أمنيًا وليس تنظيميًا فقط؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنه يزيل مسار وصول فيزيائي غير ضروري إلى LAN ويقلل سطح الهجوم.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">interface range<\/span><span class=\"term\">shutdown<\/span><span class=\"term\">Attack Surface<\/span><\/div>"}, {"id": "u11s2", "number": "02", "toc_title": "Port Security", "title": "Port Security يحدد من يُسمح له باستخدام المنفذ على أساس Source MAC", "subtitle": "يمكن تحديد عدد Secure MAC المسموح بها وتعلمها يدويًا أو ديناميكيًا أو Sticky.", "body_html": "<p class=\"core\"><strong>Port Security (أمان المنفذ)<\/strong> يحد عدد عناوين MAC المصدرية الصالحة على منفذ ويقارن Source MAC في الإطار بقائمة Secure MAC. وهو أبسط وأهم ضابط في الوحدة لمواجهة MAC Address Table Overflow.<\/p>\n<div class=\"keyline\"><strong>شرط مهم:<\/strong> وفق مثال Cisco، يجب أن يكون المنفذ مضبوطًا يدويًا كـAccess أوTrunk قبل استخدام Port Security؛ ويستخدم المثال <code>switchport mode access<\/code>. أمان Trunk خارج نطاق المقرر.<\/div>\n<pre class=\"cmd study-detail\">interface fa0/1\n switchport mode access\n switchport port-security\n switchport port-security maximum 4<\/pre>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>Manual<\/h4><p>يكتب المسؤول Secure MAC صراحةً باستخدام <code>switchport port-security mac-address<\/code>.<\/p><\/div>\n  <div class=\"card\"><h4>Dynamic<\/h4><p>يتعلم المحوّل MAC المتصل لكنه لا يضيفه إلى Running Config، لذلك يحتاج إلى إعادة التعلم بعد إعادة التشغيل.<\/p><\/div>\n  <div class=\"card\"><h4>Sticky<\/h4><p>يتعلم MAC ديناميكيًا ويضيفه إلى Running Config، ويمكن حفظه إلى NVRAM بحفظ التكوين.<\/p><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">switchport port-security mac-address aaaa.bbbb.1234\nswitchport port-security mac-address sticky<\/pre>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق الجوهري بين Dynamic وSticky؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Dynamic يتعلم العنوان مؤقتًا ولا يضيفه إلى Running Config، بينما Sticky يضيف العنوان المتعلم إلى Running Config ويمكن حفظه.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Port Security<\/span><span class=\"term\">Secure MAC<\/span><span class=\"term\">Sticky<\/span><span class=\"term\">maximum<\/span><\/div>"}, {"id": "u11s3", "number": "03", "toc_title": "Aging وViolation", "title": "Aging يدير عمر Secure MAC وViolation Mode يحدد رد فعل المحوّل", "subtitle": "Absolute وInactivity لإزالة العناوين، وShutdown وRestrict وProtect للتعامل مع المخالفة.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Aging<\/div><h4>Absolute<\/h4><p>يحذف Secure MAC بعد انتهاء الزمن المحدد بغض النظر عن نشاطه.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Aging<\/div><h4>Inactivity<\/h4><p>يحذف Secure MAC إذا بقي غير نشط للمدة المحددة.<\/p><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">switchport port-security aging time 10\nswitchport port-security aging type inactivity<\/pre>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>shutdown — الافتراضي<\/h4><p>يدخل المنفذ error-disabled، يطفئ LED، يولد Syslog ويزيد Violation Counter.<\/p><\/div>\n  <div class=\"card\"><h4>restrict<\/h4><p>يسقط الإطارات من مصادر غير معروفة، ويزيد Counter ويولد Syslog دون إغلاق المنفذ بالكامل.<\/p><\/div>\n  <div class=\"card\"><h4>protect<\/h4><p>يسقط الإطارات المخالفة لكنه لا يولد Syslog، ولذلك تصفه الوحدة بأنه الأقل أمانًا من أوضاع المخالفة.<\/p><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">switchport port-security violation {shutdown | restrict | protect}<\/pre>\n<details class=\"expand study-detail\"><summary>ماذا أفعل إذا أصبح المنفذ err-disabled؟<\/summary><div class=\"expand-body\">يجب أولًا تحديد سبب المخالفة وإزالة الجهاز غير المصرح إن وجد، ثم إعادة تفعيل المنفذ بـ<code>shutdown<\/code> ثم <code>no shutdown<\/code>. أوامر التحقق الأساسية تشمل <code>show port-security<\/code> و<code>show port-security interface<\/code> و<code>show port-security address<\/code>.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي Violation Mode هو الافتراضي في Port Security؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">shutdown.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Aging<\/span><span class=\"term\">Absolute<\/span><span class=\"term\">Inactivity<\/span><span class=\"term\">Violation Mode<\/span><span class=\"term\">error-disabled<\/span><\/div>"}, {"id": "u11s4", "number": "04", "toc_title": "VLAN Hopping", "title": "منع VLAN Hopping يعتمد على إلغاء التفاوض غير الضروري وتثبيت أدوار المنافذ", "subtitle": "المنافذ الطرفية Access ثابتة، والـTrunk يُنشأ يدويًا فقط، وDTP يُعطّل حيث لا نحتاجه.", "body_html": "<p class=\"core\">تراجع الوحدة ثلاثة مسارات للهجوم: تزوير DTP من مضيف، إدخال Rogue Switch مع Trunk، وDouble-Tagging. ثم تقدم خمس خطوات عملية للتخفيف.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Access ثابت<\/b><span><code>switchport mode access<\/code> على المنافذ غير المخصصة للـTrunk.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Unused Ports<\/b><span>تعطيلها ووضعها في VLAN غير مستخدمة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Trunk ثابت<\/b><span><code>switchport mode trunk<\/code> فقط عند الحاجة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · No DTP<\/b><span><code>switchport nonegotiate<\/code> على الـTrunk.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>5 · Native VLAN<\/b><span>استخدم VLAN غير VLAN 1 كـNative VLAN.<\/span><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">switchport mode access\nswitchport mode trunk\nswitchport nonegotiate\nswitchport trunk native vlan 999<\/pre>\n<div class=\"keyline\"><strong>القاعدة:<\/strong> لا تجعل المحوّل يقرر تلقائيًا ما إذا كان المنفذ Access أوTrunk في الأماكن الحساسة؛ ثبّت الوظيفة المطلوبة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الأمر الذي يمنع تفاوض DTP على Trunk ثابت؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">switchport nonegotiate.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">VLAN Hopping<\/span><span class=\"term\">DTP<\/span><span class=\"term\">switchport nonegotiate<\/span><span class=\"term\">Native VLAN<\/span><\/div>"}, {"id": "u11s5", "number": "05", "toc_title": "DHCP Snooping", "title": "DHCP Snooping يميز المصادر الموثوقة ويبني Binding Table يعتمد عليها أمن LAN", "subtitle": "المنافذ الموثوقة تستقبل رسائل الخادم، والمنافذ الطرفية غير موثوقة ويمكن تطبيق Rate Limiting عليها.", "body_html": "<p class=\"core\"><strong>DHCP Snooping (التطفل على بروتوكول DHCP)<\/strong> يفلتر رسائل DHCP ويحد معدلها على المنافذ غير الموثوقة. أجهزة البنية التي تخضع للإدارة مثل الموجّهات والمحوّلات والخوادم تعد مصادر موثوقة، لكن الواجهة لا تصبح Trusted تلقائيًا؛ يجب تحديدها صراحةً.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">Trusted<\/div><h4>Upstream / Server-facing<\/h4><p>واجهات نحو خادم DHCP الشرعي أو مسار موثوق يمكن أن تصل منه رسائل الخادم.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">Untrusted<\/div><h4>Access Ports<\/h4><p>منافذ المستخدمين تكون غير موثوقة افتراضيًا ويمكن Rate-Limit لطلبات DHCP عليها.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>DHCP Snooping Binding Table:<\/strong> يسجل الربط بين Source MAC على منفذ غير موثوق وعنوان IP الذي منحه DHCP Server. هذه البيانات تصبح أساسًا لآليات أخرى مثل DAI.<\/div>\n<pre class=\"cmd study-detail\">ip dhcp snooping\nip dhcp snooping vlan 5,10,50\ninterface g0/1\n ip dhcp snooping trust\ninterface range fa0/5 - 24\n ip dhcp snooping limit rate 6<\/pre>\n<pre class=\"cmd study-detail\">show ip dhcp snooping\nshow ip dhcp snooping binding<\/pre>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا يعد Binding Table مهمًا خارج DHCP نفسه؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنه يوفر ربطًا موثوقًا بين IP وMAC يمكن لآليات مثل Dynamic ARP Inspection استخدامه للتحقق من صحة ARP.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DHCP Snooping<\/span><span class=\"term\">Trusted Port<\/span><span class=\"term\">Untrusted Port<\/span><span class=\"term\">Binding Table<\/span><span class=\"term\">Rate Limiting<\/span><\/div>"}, {"id": "u11s6", "number": "06", "toc_title": "DAI", "title": "Dynamic ARP Inspection يرفض ARP غير المتوافق مع روابط IP ↔ MAC الموثوقة", "subtitle": "DAI يعترض ARP على المنافذ غير الموثوقة ويتحقق منه قبل تمريره، ويعتمد في السيناريو القياسي على DHCP Snooping.", "body_html": "<p class=\"core\"><strong>Dynamic ARP Inspection (فحص ARP الديناميكي)<\/strong> يحمي من ARP Spoofing وARP Poisoning عبر اعتراض ARP Requests/Replies على المنافذ غير الموثوقة والتحقق من صحة ربط IP مع MAC قبل السماح بالمرور.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>ARP يصل<\/b><span>الرسالة قادمة من منفذ غير موثوق.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>DAI يعترض<\/b><span>لا يمررها مباشرة داخل VLAN.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Binding Check<\/b><span>يقارن IP ↔ MAC بالمعلومات الموثوقة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Permit / Drop<\/b><span>الصحيح يمر، وغير الصحيح يُسقط ويُسجل.<\/span><\/div>\n<\/div>\n<div class=\"keyline\"><strong>اعتماد مهم:<\/strong> الوحدة تنص على أن DAI يحتاج DHCP Snooping Binding Table للعمل في هذا السيناريو، لذلك يجب تمكين DHCP Snooping أولًا وعلى VLANs المطلوبة.<\/div>\n<pre class=\"cmd study-detail\">ip dhcp snooping\nip dhcp snooping vlan 10\nip arp inspection vlan 10\ninterface g0/1\n ip dhcp snooping trust\n ip arp inspection trust<\/pre>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: على ماذا يعتمد DAI في السيناريو القياسي للتحقق من ربط IP مع MAC؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يعتمد على DHCP Snooping Binding Table للمعلومات الموثوقة.<\/div><\/div>\n<details class=\"expand study-detail\"><summary>أين يندرج IP Source Guard؟<\/summary><div class=\"expand-body\">الوحدة 10 تربط IP Source Guard (IPSG) بتخفيف انتحال عناوين IP/MAC. تكوين IPSG التفصيلي ليس ضمن المحاور الرسمية لهذه الوحدة، لذلك يبقى هنا رابطًا مفاهيميًا فقط.<\/div><\/details>\n<div class=\"terms\"><span class=\"term\">Dynamic ARP Inspection<\/span><span class=\"term\">ARP Spoofing<\/span><span class=\"term\">ARP Poisoning<\/span><span class=\"term\">DHCP Snooping Binding Table<\/span><\/div>"}, {"id": "u11s7", "number": "07", "toc_title": "DAI Validation", "title": "يمكن توسيع DAI ليتحقق من Source MAC وDestination MAC وعناوين IP", "subtitle": "التحقق الإضافي يقارن حقول Ethernet مع حقول ARP ويمنع قيم IP غير المتوقعة.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>src-mac<\/h4><p>يقارن Source MAC في Ethernet Header مع Sender MAC في ARP Body.<\/p><\/div>\n  <div class=\"card\"><h4>dst-mac<\/h4><p>يقارن Destination MAC في Ethernet Header مع Target MAC في ARP Body.<\/p><\/div>\n  <div class=\"card\"><h4>ip<\/h4><p>يتحقق من عناوين IP غير الصالحة أو غير المتوقعة مثل 0.0.0.0 و255.255.255.255 وعناوين Multicast.<\/p><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">ip arp inspection validate src-mac dst-mac ip<\/pre>\n<div class=\"keyline\"><strong>مهم:<\/strong> تذكر Cisco أن إدخال عدة أوامر <code>ip arp inspection validate<\/code> منفصلة يجعل الأمر الأحدث يستبدل السابق؛ إذا أردت أكثر من اختبار، اكتبها في السطر نفسه.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا نكتب ثلاثة أوامر validate منفصلة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن الأمر الأحدث يستبدل إعداد التحقق السابق؛ يجب جمع خيارات التحقق المطلوبة في أمر واحد.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">src-mac<\/span><span class=\"term\">dst-mac<\/span><span class=\"term\">ip arp inspection validate<\/span><\/div>"}, {"id": "u11s8", "number": "08", "toc_title": "PortFast وBPDU Guard", "title": "PortFast يحسن وصول المستخدم وBPDU Guard يمنع جهازًا طرفيًا من العبث بـSTP", "subtitle": "كلاهما يطبق على منافذ الأجهزة النهائية، لكن وظيفة كل واحد مختلفة.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">PortFast<\/div><h4>Forwarding بسرعة<\/h4><p>يتجاوز Listening وLearning لتقليل انتظار منفذ المستخدم عند تشغيله. في سياق هذا المقرر يطبق على المنافذ الطرفية المتصلة بالأجهزة النهائية؛ استخدامه على رابط بين محوّلات قد يسبب Loop.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">BPDU Guard<\/div><h4>حماية STP<\/h4><p>إذا استقبل منفذ محمي BPDU غير متوقعة، يضعه في error-disabled لمنع جهاز غير مصرح من التأثير في STP.<\/p><\/div>\n<\/div>\n<pre class=\"cmd study-detail\">spanning-tree portfast\nspanning-tree portfast default\nspanning-tree bpduguard enable\nspanning-tree portfast bpduguard default<\/pre>\n<details class=\"expand study-detail\"><summary>كيف أتحقق من PortFast؟<\/summary><div class=\"expand-body\">تذكر الوحدة أوامر مثل <code>show spanning-tree summary<\/code> و<code>show running-config interface type/number<\/code> و<code>show spanning-tree interface type/number detail<\/code>.<\/div><\/details>\n<div class=\"keyline\"><strong>تصحيح موثق للمصدر:<\/strong> السطر الذي يذكر <code>errdisable recovery cause psecure_violation<\/code> في سياق BPDU Guard يخص Port Security Violation. سبب الاسترداد المرتبط بـBPDU Guard هو <code>errdisable recovery cause bpduguard<\/code>.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل PortFast نفسه يعطّل المنفذ إذا استقبل BPDU؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. BPDU Guard هو الذي يضع المنفذ في error-disabled عند استقبال BPDU غير متوقعة؛ PortFast وظيفته تسريع الانتقال إلى Forwarding على منافذ الأجهزة النهائية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">PortFast<\/span><span class=\"term\">BPDU Guard<\/span><span class=\"term\">error-disabled<\/span><span class=\"term\">STP Attack<\/span><\/div>"}]}]</script><script>
(()=>{'use strict';const modules=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slides=[{type:'cover',title:'أمن الشبكات المحلية'},...modules.flatMap((m,i)=>[{type:'agenda',m,title:'مسار الوحدة '+m.module_number},...m.sections.flatMap(section=>[0,1].map(part=>({type:'section',m,section,part,title:section.title+(part?' · متابعة':'' )}))),...(i===0?[{type:'map',title:'اختر الدفاع المناسب'}]:[{type:'dhcp',title:'رحلة DHCP Snooping وDAI'},{type:'port',title:'قرار Port Security'}])]),{type:'summary',title:'خريطة الدفاع المتكامل'}];
let at=0,large=false,sceneStep=0,timer=null;const marks=new Set((()=>{try{return JSON.parse(localStorage.getItem('lan_security_marks')||'[]')}catch{return []}})());
function sectionHTML(m,s,part){let doc=new DOMParser().parseFromString(s.body_html,'text/html');doc.querySelectorAll('script').forEach(x=>x.remove());let nodes=[...doc.body.children].filter(x=>x.textContent.trim());let quiz=nodes.find(x=>x.classList.contains('quiz'));nodes=nodes.filter(x=>x!==quiz);let sizes=nodes.map(x=>x.textContent.trim().length),total=sizes.reduce((a,b)=>a+b,0),cut=1,acc=0,best=Infinity;for(let i=0;i<nodes.length-1;i++){acc+=sizes[i];let diff=Math.abs(total-2*acc);if(diff<best){best=diff;cut=i+1}}let selected=nodes.slice(part?cut:0,part?undefined:cut);if(quiz)quiz.querySelectorAll('[onclick]').forEach(x=>x.removeAttribute('onclick'));return '<div class="kicker">الوحدة '+m.module_number+' · القسم '+esc(s.number)+' · '+(part?'٢/٢':'١/٢')+'</div><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.subtitle)+'</p><div class="body lesson">'+selected.map(x=>x.outerHTML).join('')+(part&&quiz?quiz.outerHTML:'')+'</div><span class="scroll-hint">مرّر داخل الشريحة لاستكمال الشرح ↓</span>'}
const attacks=[['إغراق جدول MAC','Port Security يحد عناوين المصدر المسموحة على منفذ الوصول؛ ولا يحل بمفرده كل تهديدات الشبكة.'],['DHCP Spoofing','DHCP Snooping يحجب رسائل الخادم القادمة من منفذ غير موثوق.'],['ARP Spoofing','DAI يفحص ARP الوارد من المنافذ غير الموثوقة مقابل روابط موثوقة؛ الأجهزة ذات العناوين الثابتة تحتاج تخطيطًا مناسبًا مثل ARP ACL.'],['VLAN Hopping','ثبّت وضع Access أو Trunk، عطّل تفاوض DTP على Trunk الثابت، وخطط للـNative VLAN وعدم استخدامها لحركة المستخدم.'],['BPDU غير متوقعة','فعّل PortFast على منافذ الأجهزة الطرفية وBPDU Guard لتعطيل المنفذ عند استقبال BPDU.']];
function mapHTML(){return '<div class="kicker">من التهديد إلى الضبط · نشاط للمحاضر</div><h2>ما الضبط الأقرب لكل سيناريو؟</h2><p class="lead">اختر التهديد، اطلب من الحضور اقتراح إجراء الحماية، ثم اكشف التفسير.</p><div class="body scene"><div class="scene-controls"><select id="attack" aria-label="اختر نوع التهديد">'+attacks.map((a,i)=>'<option value="'+i+'">'+esc(a[0])+'</option>').join('')+'</select><button id="reveal">اكشف الدفاع</button></div><div class="security-map"><div class="device">مصدر الرسالة<br>منفذ وصول</div><div class="device">قرار المحوّل<br>ضوابط Layer 2</div><div class="device">الأثر المحتمل<br>خدمة الشبكة</div></div><div id="mapStatus" class="scene-status" role="status">توقع أولًا: ما نقطة الثقة وما الضبط المناسب؟</div><p class="source-note"><a href="https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html" target="_blank" rel="noopener noreferrer">Cisco · DAI وDHCP Snooping</a></p></div>'}
const flow=[['طلب DHCP','يرسل العميل Discover من منفذ وصول غير موثوق.'],['الرد المشروع','يمر رد الخادم عبر المنفذ الموثوق المخصص لمساره، ثم ينشأ ربط IP وMAC وVLAN والمنفذ عند اكتمال التبادل.'],['سيناريو بديل: رد مزيف','إذا حاول جهاز آخر إرسال Offer أو Ack من منفذ وصول غير موثوق، تُسقط الرسالة؛ هذا ليس جزءًا من معاملة العميل السابقة.'],['فحص ARP','يقارن DAI ادعاء IP↔MAC الوارد من منفذ غير موثوق بالربط الموثوق؛ الإعداد يتطلب مراعاة الأجهزة ذات العناوين الثابتة.']];
function dhcpHTML(){return '<div class="kicker">الوحدة ١١ · محاكاة قرار</div><h2>من DHCP Snooping إلى Dynamic ARP Inspection</h2><p class="lead">تتبع الرسالة وموضع الثقة، ثم لاحظ كيف يُستخدم سجل الربط عند فحص ARP.</p><div class="body scene"><div class="scene-controls"><button id="flowPrev">السابق</button><button id="flowPlay">تشغيل ▶</button><button id="flowNext">الخطوة التالية</button><button id="flowReset">إعادة ↺</button></div><div class="scene-flow">'+flow.map((x,i)=>'<span id="flow'+i+'">'+esc(x[0])+'</span>').join('')+'</div><div id="flowStatus" class="scene-status" role="status"></div><p class="source-note">تبسيط تعليمي؛ قرار الثقة ونوع الربط يعتمدان على تصميم الشبكة. <a href="https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html" target="_blank" rel="noopener noreferrer">Cisco · DAI</a></p></div>'}
const modes={protect:'تُسقط إطارات MAC المخالف من دون عداد مخالفة أو إشعار في النموذج المعتاد.',restrict:'تُسقط إطارات MAC المخالف، وتُسجل المخالفة ويُبلّغ عنها.',shutdown:'يتحول المنفذ إلى حالة err-disabled ويتوقف عن تمرير الحركة؛ وهو الوضع الافتراضي في Port Security.'};
function portHTML(){return '<div class="kicker">الوحدة ١١ · قرار تشغيلي</div><h2>ماذا يحدث عند ظهور MAC غير مسموح؟</h2><p class="lead">تعلم المنفذ عنوانًا آمنًا واحدًا، ثم يصل إطار بعنوان مصدر آخر. اختر Violation Mode وتوقع النتيجة.</p><div class="body scene"><div class="scene-controls"><select id="mode" aria-label="اختر وضع المخالفة"><option value="protect">protect</option><option value="restrict">restrict</option><option value="shutdown">shutdown</option></select><button id="portReveal">اعرض النتيجة</button></div><div class="scene-flow"><span>MAC مسموح<br>AA:AA</span><span>منفذ Access<br>Maximum 1</span><span>MAC جديد<br>BB:BB</span></div><div id="portStatus" class="scene-status" role="status">توقع قرار المحوّل قبل الكشف.</div><p class="source-note"><a href="https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html" target="_blank" rel="noopener noreferrer">Cisco · Port Security violation modes</a></p></div>'}
function stop(){if(timer){clearInterval(timer);timer=null}}
function paintFlow(){$('flowStatus').innerHTML='<strong>'+(sceneStep+1)+' / '+flow.length+' · '+esc(flow[sceneStep][0])+'</strong><br>'+esc(flow[sceneStep][1]);flow.forEach((_,i)=>$('flow'+i).classList.toggle('active',i===sceneStep));$('flowPrev').disabled=sceneStep===0;$('flowNext').disabled=sceneStep===flow.length-1}
function init(){let s=slides[at];if(s.type==='section')$('stage').querySelectorAll('.quiz .chipbtn').forEach(b=>b.onclick=()=>{let a=b.closest('.quiz').querySelector('.answer');a.classList.toggle('open');b.textContent=a.classList.contains('open')?'إخفاء الإجابة':'اعرض الإجابة'});if(s.type==='map'){$('attack').onchange=()=>{$('mapStatus').textContent='توقع أولًا: ما نقطة الثقة وما الضبط المناسب؟';$('stage').querySelectorAll('.device').forEach(x=>x.classList.remove('active'))};$('reveal').onclick=()=>{let a=attacks[+$('attack').value];$('mapStatus').innerHTML='<strong>'+esc(a[0])+'</strong><br>'+esc(a[1]);$('stage').querySelectorAll('.device').forEach((x,i)=>x.classList.toggle('active',i<=1))}}if(s.type==='dhcp'){sceneStep=0;let change=d=>{stop();sceneStep=Math.max(0,Math.min(flow.length-1,sceneStep+d));paintFlow()};$('flowPrev').onclick=()=>change(-1);$('flowNext').onclick=()=>change(1);$('flowReset').onclick=()=>{stop();sceneStep=0;paintFlow()};$('flowPlay').onclick=()=>{if(timer){stop();$('flowPlay').textContent='تشغيل ▶';return}if(sceneStep===flow.length-1)sceneStep=0;paintFlow();$('flowPlay').textContent='إيقاف مؤقت ❚❚';timer=setInterval(()=>{if(sceneStep===flow.length-1){stop();$('flowPlay').textContent='تشغيل ▶';return}sceneStep++;paintFlow()},3000)};paintFlow()}if(s.type==='port'){$('mode').onchange=()=>$('portStatus').textContent='توقع قرار المحوّل قبل الكشف.';$('portReveal').onclick=()=>$('portStatus').innerHTML='<strong>'+esc($('mode').value)+'</strong><br>'+esc(modes[$('mode').value])}}
function render(){stop();let s=slides[at],body='';if(s.type==='cover')body='<div class="kicker">الوحدتان ١٠–١١ · عرض حركي تفاعلي</div><h1>أمن الشبكات المحلية: من التهديد إلى الضبط</h1><p class="lead">'+esc(modules[0].summary)+'</p><div class="body grid"><div class="card"><b>١٠ · مفاهيم أمان LAN</b><p>'+esc(modules[0].official_objective)+'</p></div><div class="card"><b>١١ · تكوين أمان المحوّل</b><p>'+esc(modules[1].official_objective)+'</p></div></div>';else if(s.type==='agenda')body='<div class="kicker">الوحدة '+s.m.module_number+' · '+esc(s.m.lecture.duration)+'</div><h2>'+esc(s.m.title)+'</h2><div class="body grid">'+s.m.lecture.steps.map(x=>'<div class="card"><b>'+esc(x.time)+'</b><p>'+esc(x.topic)+'</p></div>').join('')+'</div>';else if(s.type==='section')body=sectionHTML(s.m,s.section,s.part);else if(s.type==='map')body=mapHTML();else if(s.type==='dhcp')body=dhcpHTML();else if(s.type==='port')body=portHTML();else body='<div class="kicker">خلاصة المحاضرة</div><h2>قرار الدفاع يبدأ بتحديد موضع الثقة</h2><div class="body grid">'+attacks.map(a=>'<div class="card"><b>'+esc(a[0])+'</b><p>'+esc(a[1])+'</p></div>').join('')+'</div>';
$('stage').innerHTML='<article class="slide '+(large?'large':'')+'">'+body+'<footer class="foot"><span>LAN Security · CCNA 2</span><span>'+(at+1)+' / '+slides.length+'</span></footer></article>';$('count').textContent=(at+1)+' / '+slides.length;$('progress').style.width=(at+1)/slides.length*100+'%';$('prev').disabled=at===0;$('next').disabled=at===slides.length-1;$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';init();history.replaceState(null,'','#slide-'+(at+1))}
function go(i){if(i<0||i>=slides.length)return;at=i;render()}$('prev').onclick=()=>go(at-1);$('next').onclick=()=>go(at+1);$('markBtn').onclick=()=>{marks.has(at)?marks.delete(at):marks.add(at);try{localStorage.setItem('lan_security_marks',JSON.stringify([...marks]))}catch{}$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';let b=$('menuList').querySelector('[data-slide="'+at+'"]');if(b)b.textContent=(at+1)+' · '+slides[at].title+(marks.has(at)?' ★':'')};$('notesBtn').onclick=()=>{large=!large;$('stage').querySelector('.slide').classList.toggle('large',large);$('notesBtn').classList.toggle('active',large);$('notesBtn').setAttribute('aria-pressed',String(large))};$('themeBtn').onclick=()=>{let day=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=day?'light':'dark';$('themeBtn').innerHTML=day?'☾ <span>ليلي</span>':'☀ <span>نهاري</span>';$('themeBtn').setAttribute('aria-pressed',String(day));$('themeBtn').setAttribute('aria-label',day?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري')};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('menuBtn').onclick=()=>{$('menu').classList.add('open');$('closeMenu').focus()};$('closeMenu').onclick=()=>{$('menu').classList.remove('open');$('menuBtn').focus()};$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('menuList').innerHTML=slides.map((s,i)=>'<button data-slide="'+i+'">'+(i+1)+' · '+esc(s.title)+'</button>').join('');$('menuList').onclick=e=>{let b=e.target.closest('[data-slide]');if(b){$('menu').classList.remove('open');$('menuBtn').focus();go(+b.dataset.slide)}};document.addEventListener('keydown',e=>{if($('menu').classList.contains('open')){if(e.key==='Escape'){$('menu').classList.remove('open');$('menuBtn').focus()}return}if(e.target.closest('button,input,select,textarea,summary'))return;if(['ArrowLeft','PageDown'].includes(e.key))go(at+1);if(['ArrowRight','PageUp'].includes(e.key))go(at-1)});let sx=0,sy=0;$('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select,summary,details,input,textarea,pre,.cmd,.table-scroll'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>1.5*Math.abs(dy))go(at+(dx<0?-1:1))},{passive:true});let m=location.hash.match(/^#slide-(\d+)$/);if(m)at=Math.max(0,Math.min(slides.length-1,+m[1]-1));render()})();
</script></body></html>
