y في تمرير الطلب إلى الخادم وتحديد شبكة العميل. هذه الإضافات مميزة داخل المحتوى بصيغة «إضافة توضيحية».", "الخدمات الثمانية التي يرحلها ip helper-address افتراضيًا أبقيت كمعلومة جانبية، وليست قائمة حفظ رئيسية.", "لم يتم تعديل التصميم أو JavaScript أو CSS؛ هذه الإضافة بيانات فقط.", "جولة المراجعة المتقاطعة: وُحدت صياغة الموجّه، وأُبقي UDP 67/68 والخدمات الثمانية لـip helper-address كمعلومات مرجعية غير مطلوبة للحفظ."], "cross_review_corrections_applied": true}, "sections": [{"id": "u7s1", "number": "01", "toc_title": "لماذا DHCPv4؟", "title": "العنوان اليدوي يعمل… لكن DHCPv4 يجعل الإدارة قابلة للتوسع", "subtitle": "الخادم يؤجّر عنوان IPv4 ومعلومات الشبكة للعميل من Pool لمدة محددة بدل ضبط كل جهاز يدويًا.", "body_html": "<p class=\"core\"><strong>DHCPv4<\/strong> يوزّع عناوين IPv4 ومعلومات الشبكة تلقائيًا على العملاء. بدل أن يضبط المسؤول عنوان كل جهاز يدويًا، يطلب العميل الإعدادات ويقوم الخادم بتأجير عنوان من <strong>Pool<\/strong> لمدة محددة تسمى <strong>Lease<\/strong>.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>DHCPv4 Server<\/h4><p>يمتلك مجموعة عناوين ويقرر ما الذي سيمنحه لكل عميل، مع معلومات مثل Default Gateway وDNS.<\/p><\/div>\n  <div class=\"card\"><h4>DHCPv4 Client<\/h4><p>الجهاز الذي يطلب إعدادات IPv4 تلقائيًا؛ قد يكون حاسبًا أو هاتفًا أو حتى واجهة الموجّه.<\/p><\/div>\n  <div class=\"card\"><h4>Lease<\/h4><p>العنوان ليس ملكًا دائمًا للعميل؛ يُستأجر لمدة ثم يُجدد أو يعود إلى Pool عند انتهاء الحاجة إليه.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>الفكرة الإدارية:<\/strong> DHCPv4 يقلل الأخطاء اليدوية ويسهّل إضافة ونقل الأجهزة، لأن العنوان ومعلومات الشبكة تُدار مركزيًا بدل تكرار الإعداد على كل عميل.<\/div>\n<details class=\"expand study-detail\"><summary>هل نحتاج دائمًا خادمًا مستقلًا؟<\/summary><div class=\"expand-body\">لا. يوضح المنهج أن المؤسسات الكبيرة قد تستخدم خادم DHCPv4 مخصصًا، بينما يمكن لراوتر Cisco IOS في فرع صغير أو SOHO أن يؤدي وظيفة خادم DHCPv4 كامل.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا يحتفظ الجهاز بعنوان DHCPv4 إلى الأبد؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن العنوان مؤجر. انتهاء Lease يسمح بإعادة العنوان إلى Pool إذا غادر الجهاز الشبكة أو لم يعد يحتاجه.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DHCPv4<\/span><span class=\"term\">Server<\/span><span class=\"term\">Client<\/span><span class=\"term\">Pool<\/span><span class=\"term\">Lease<\/span><\/div>"}, {"id": "u7s2", "number": "02", "toc_title": "DORA والحصول على Lease", "title": "أربع رسائل تبني Lease: Discover → Offer → Request → ACK", "subtitle": "احفظ التسلسل باعتباره حوارًا: العميل يبحث، الخادم يعرض، العميل يختار، والخادم يؤكد.", "body_html": "<p class=\"core\">عند تشغيل عميل DHCPv4 أو انضمامه إلى الشبكة يبدأ عملية من أربع رسائل للحصول على عنوان. الاسم التذكّري الشائع هو <strong>DORA<\/strong>: Discover، Offer، Request، Acknowledgment.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · DHCPDISCOVER<\/b><span>العميل يبحث عن خادم DHCPv4.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · DHCPOFFER<\/b><span>الخادم يعرض عنوانًا وإعدادات محتملة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · DHCPREQUEST<\/b><span>العميل يطلب العرض الذي اختاره رسميًا.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · DHCPACK<\/b><span>الخادم يؤكد التأجير ويصبح العميل قادرًا على استخدام الإعدادات.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>لماذا يبدأ Discover كبث؟<\/h4><p>العميل لم يحصل بعد على عنوان IPv4 ولا يعرف عنوان خادم DHCP، لذلك يبدأ برسالة Broadcast على الشبكة المحلية.<\/p><\/div>\n  <div class=\"card\"><h4>إضافة توضيحية · UDP<\/h4><p>في DHCPv4 يستخدم الخادم UDP 67 ويستخدم العميل UDP 68. عند البداية يرسل العميل من 0.0.0.0 إلى Broadcast لأنه لم يكوّن عنوانًا بعد.<\/p><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>لماذا يكون DHCPREQUEST الأول Broadcast غالبًا؟<\/summary><div class=\"expand-body\">إذا وصل للعميل أكثر من DHCPOFFER، يختار عرضًا ويرسل DHCPREQUEST بصورة Broadcast معلنًا الخادم المختار. بذلك تعرف الخوادم الأخرى أن عروضها لم تُقبل ويمكنها إعادة العناوين المحجوزة مؤقتًا إلى مجمعاتها. <strong>هذه إضافة توضيحية موثقة من Cisco وليست شرحًا مفصلًا في شرائح الوحدة.<\/strong><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>رتّب الرسائل: ACK، Discover، Request، Offer.<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">DHCPDISCOVER → DHCPOFFER → DHCPREQUEST → DHCPACK.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DHCPDISCOVER<\/span><span class=\"term\">DHCPOFFER<\/span><span class=\"term\">DHCPREQUEST<\/span><span class=\"term\">DHCPACK<\/span><span class=\"term\">UDP 67/68<\/span><\/div>"}, {"id": "u7s3", "number": "03", "toc_title": "تجديد Lease", "title": "بعد الحصول على العنوان… العميل يحاول تجديد التأجير قبل انتهائه", "subtitle": "التجديد أبسط من DORA: Request ثم ACK، مع إمكانية العودة إلى Broadcast إذا تعذر الوصول إلى الخادم الأصلي.", "body_html": "<p class=\"core\">قبل انتهاء Lease يحاول العميل تمديد التأجير. في الحالة الطبيعية يرسل <strong>DHCPREQUEST<\/strong> إلى الخادم الذي منحه العنوان، ويؤكد الخادم التجديد برسالة <strong>DHCPACK<\/strong>.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><h4>الحصول الأول على Lease<\/h4><p>أربع مراحل: Discover → Offer → Request → ACK.<\/p><\/div>\n  <div class=\"compare-box\"><h4>تجديد Lease<\/h4><p>غالبًا مرحلتان: Request → ACK.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>إذا لم يرد الخادم الأصلي:<\/strong> يوضح العرض أن العميل يمكن أن يبث DHCPREQUEST لاحقًا حتى يتمكن خادم DHCPv4 آخر من تمديد التأجير.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل تغيير Lease يعني بالضرورة أن العميل سيحصل على عنوان IPv4 مختلف؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. غالبًا يُعاد تأجير العنوان نفسه ما دام متاحًا والخادم يرى أن الاستمرار به مناسب.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Lease Renewal<\/span><span class=\"term\">DHCPREQUEST<\/span><span class=\"term\">DHCPACK<\/span><\/div>"}, {"id": "u7s4", "number": "04", "toc_title": "إعداد DHCPv4 Server", "title": "ثلاثة قرارات أساسية: استبعد، أنشئ Pool، ثم عرّف ما الذي سيحصل عليه العميل", "subtitle": "ابدأ بالعناوين التي لا يجب توزيعها، ثم أنشئ Pool وحدد الشبكة والبوابة وبقية الخيارات.", "body_html": "<div class=\"flow\">\n  <div class=\"step\"><b>1 · Exclude<\/b><span>استبعد عناوين الموجّهات والخوادم والطابعات وأي عناوين ثابتة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Pool<\/b><span>أنشئ DHCP Pool باسم واضح.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Options<\/b><span>حدد Network وDefault Router وDNS ومدة Lease وغيرها.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<details class=\"cmd study-detail\"><summary>مثال أوامر أساسي<\/summary><div class=\"expand-body\"><pre>R1(config)# ip dhcp excluded-address 192.168.10.1 192.168.10.9\nR1(config)# ip dhcp excluded-address 192.168.10.254\nR1(config)# ip dhcp pool LAN-POOL-1\nR1(dhcp-config)# network 192.168.10.0 255.255.255.0\nR1(dhcp-config)# default-router 192.168.10.1\nR1(dhcp-config)# dns-server 192.168.11.5\nR1(dhcp-config)# domain-name example.com<\/pre><\/div><\/details>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>إجباري عمليًا<\/h4><p><strong>network<\/strong> لتحديد شبكة العناوين، و<strong>default-router<\/strong> لتزويد العميل بالبوابة.<\/p><\/div>\n  <div class=\"card\"><h4>خيارات إضافية<\/h4><p>DNS، Domain Name، Lease duration، وNetBIOS WINS حسب حاجة البيئة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة مهمة:<\/strong> العناوين المستثناة لا تدخل في التوزيع الديناميكي. استخدم الاستثناءات للأجهزة التي يجب أن تبقى بعناوين ثابتة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>أين تضع عنوان البوابة 192.168.10.1: داخل Pool أم ضمن excluded-addresses فقط؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يُستبعد من التوزيع حتى لا يُعطى لعميل، ويُذكر أيضًا داخل Pool كـdefault-router ليعرف العملاء بوابتهم.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">ip dhcp excluded-address<\/span><span class=\"term\">ip dhcp pool<\/span><span class=\"term\">network<\/span><span class=\"term\">default-router<\/span><\/div>"}, {"id": "u7s5", "number": "05", "toc_title": "التحقق من DHCPv4", "title": "بعد التكوين لا تفترض النجاح… تحقق من الإعدادات والـBindings والرسائل", "subtitle": "التحقق الجيد يجيب ثلاثة أسئلة: هل الإعداد موجود؟ هل وُزعت عناوين؟ هل الرسائل تتحرك؟", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>الإعداد<\/h4><p><code>show running-config | section dhcp<\/code><br>يعرض أوامر DHCPv4 المطبقة على الموجّه.<\/p><\/div>\n  <div class=\"card\"><h4>Bindings<\/h4><p><code>show ip dhcp binding<\/code><br>يعرض عناوين IPv4 التي ربطها الخادم بالعملاء.<\/p><\/div>\n  <div class=\"card\"><h4>Statistics<\/h4><p><code>show ip dhcp server statistics<\/code><br>يعرض عدادات رسائل DHCPv4 المرسلة والمستلمة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>على العميل:<\/strong> استخدم <code>ipconfig /all<\/code> في Windows للتأكد من IPv4 Address وSubnet Mask وDefault Gateway وDHCP Server وDNS وLease.<\/div>\n<details class=\"expand study-detail\"><summary>ماذا يعني وجود Binding؟<\/summary><div class=\"expand-body\">يعني أن خادم DHCPv4 منح عنوانًا لعميل وسجّل الارتباط. غياب Binding لا يثبت وحده سبب المشكلة، لكنه مؤشر مهم عند بدء التشخيص.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>أي أمر تبدأ به إذا أردت معرفة هل الخادم وزّع عنوانًا فعليًا لعميل؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">show ip dhcp binding.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">show ip dhcp binding<\/span><span class=\"term\">show ip dhcp server statistics<\/span><span class=\"term\">ipconfig /all<\/span><\/div>"}, {"id": "u7s6", "number": "06", "toc_title": "DHCPv4 Relay", "title": "Broadcast يتوقف عند الموجّه… لذلك نحتاج DHCP Relay", "subtitle": "عندما يكون العميل والخادم في شبكتين مختلفتين، يلتقط الموجّه الطلب المحلي ويرسله إلى خادم DHCPv4 المحدد.", "body_html": "<p class=\"core\">عميل DHCPv4 يبدأ برسائل Broadcast محلية، والموجّه لا يمرر Broadcasts بين الشبكات بصورة طبيعية. إذا كان خادم DHCPv4 مركزيًا في شبكة أخرى فلن يصل طلب العميل إليه دون <strong>DHCP Relay<\/strong>.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Client Broadcast<\/b><span>العميل يرسل DHCPDISCOVER على شبكته المحلية.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Relay Agent<\/b><span>واجهة الموجّه المواجهة للعملاء تستقبل الطلب.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Unicast to Server<\/b><span>الموجّه يرسل الطلب إلى عنوان خادم DHCP المحدد.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<details class=\"cmd study-detail\"><summary>الأمر الأساسي<\/summary><div class=\"expand-body\"><pre>R1(config)# interface g0/0/0\nR1(config-if)# ip helper-address 192.168.11.6<\/pre><p>يُضبط الأمر على الواجهة التي تستقبل Broadcast من عملاء DHCPv4.<\/p><\/div><\/details>\n<div class=\"keyline\"><strong>إضافة توضيحية:<\/strong> عند الترحيل يضع الموجّه معلومات تساعد الخادم على معرفة شبكة العميل واختيار Pool المناسب، ثم يرسل الطلب إلى الخادم المحدد. هذه نقطة مهمة لفهم كيف يخدم خادم مركزي عدة Subnets.<\/div>\n<details class=\"expand study-detail\"><summary>هل ip helper-address خاص بـDHCP فقط؟<\/summary><div class=\"expand-body\">لا. يذكر العرض أن الأمر يرحل افتراضيًا ثماني خدمات UDP، منها DHCP/BOOTP وDNS وTFTP وTime وTACACS وبعض خدمات NetBIOS. في هذه الوحدة ركّز على DHCPv4؛ القائمة التفصيلية مرجع وليست محور حفظ.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>أين تضبط ip helper-address: على واجهة الخادم أم الواجهة المواجهة للعملاء؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">على واجهة الموجّه التي تستقبل Broadcast من شبكة العملاء.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DHCP Relay<\/span><span class=\"term\">ip helper-address<\/span><span class=\"term\">Broadcast<\/span><span class=\"term\">Unicast<\/span><\/div>"}, {"id": "u7s7", "number": "07", "toc_title": "الموجّه كعميل DHCPv4", "title": "أحيانًا الموجّه نفسه هو العميل", "subtitle": "واجهة WAN في الموجّه SOHO أو فرع قد تستلم عنوانها تلقائيًا من مزود الخدمة.", "body_html": "<p class=\"core\">ليس كل الموجّه DHCPv4 Server أو Relay. في بعض السيناريوهات يكون الموجّه نفسه <strong>DHCPv4 Client<\/strong>، خصوصًا على واجهة متصلة بمودم Cable/DSL أو بمزود خدمة.<\/p>\n<details class=\"cmd study-detail\"><summary>التكوين والتحقق<\/summary><div class=\"expand-body\"><pre>SOHO(config)# interface g0/0/1\nSOHO(config-if)# ip address dhcp\nSOHO(config-if)# no shutdown\n\nSOHO# show ip interface g0/0/1<\/pre><\/div><\/details>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>SOHO / Branch<\/h4><p>واجهة الإنترنت تحصل على IPv4 Address من DHCP لدى ISP بدل عنوان ثابت.<\/p><\/div>\n  <div class=\"card\"><h4>Home Router<\/h4><p>غالبًا تكون WAN مضبوطة افتراضيًا على Automatic Configuration - DHCP لتسهيل الاتصال.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>هل استخدام ip address dhcp يجعل الموجّه خادم DHCP؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. هذا الأمر يجعل الواجهة عميل DHCPv4 يستلم عنوانًا من خادم آخر.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">ip address dhcp<\/span><span class=\"term\">DHCPv4 Client<\/span><span class=\"term\">ISP<\/span><span class=\"term\">WAN<\/span><\/div>"}, {"id": "u7s8", "number": "08", "toc_title": "الخلاصة", "title": "DHCPv4 = توزيع + تأجير + ترحيل عند الحاجة", "subtitle": "إذا فهمت أدوار Server وClient وRelay وتسلسل DORA فقد فهمت قلب الوحدة.", "body_html": "<div class=\"summary-box\"><h4>ما الذي يجب أن يبقى في ذهنك؟<\/h4><div class=\"summary-list\">\n  <div class=\"summary-item\">DHCPv4 يوزع عناوين IPv4 وإعدادات الشبكة تلقائيًا من Pool.<\/div>\n  <div class=\"summary-item\">الحصول الأول على Lease: DHCPDISCOVER → DHCPOFFER → DHCPREQUEST → DHCPACK.<\/div>\n  <div class=\"summary-item\">الخادم على Cisco IOS يحتاج استثناءات + Pool + Network + Default Gateway، مع خيارات إضافية مثل DNS وLease.<\/div>\n  <div class=\"summary-item\">تحقق من الإعداد، ثم Bindings، ثم Statistics، ثم إعداد العميل.<\/div>\n  <div class=\"summary-item\">إذا كان الخادم في شبكة أخرى استخدم DHCP Relay وip helper-address على الواجهة المواجهة للعملاء.<\/div>\n  <div class=\"summary-item\">الموجّه نفسه قد يكون DHCPv4 Client باستخدام ip address dhcp.<\/div>\n<\/div><\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><h4>Server<\/h4><p>يمنح العنوان والإعدادات.<\/p><\/div>\n  <div class=\"compare-box\"><h4>Relay<\/h4><p>يوصل طلبات العملاء إلى خادم في شبكة أخرى.<\/p><\/div>\n  <div class=\"compare-box\"><h4>Client<\/h4><p>يطلب العنوان والإعدادات.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سيناريو: عميل في VLAN 10 والخادم في شبكة خوادم بعيدة. ما الدور المطلوب على بوابة VLAN 10؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">DHCP Relay باستخدام ip helper-address باتجاه خادم DHCPv4.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DORA<\/span><span class=\"term\">DHCPv4 Server<\/span><span class=\"term\">DHCP Relay<\/span><span class=\"term\">DHCPv4 Client<\/span><\/div>"}]}, {"schema_version": 1, "module_number": 8, "group_id": "04_IP_Address_Assignment", "title": "الوحدة 8 — SLAAC and DHCPv6 (SLAAC وDHCPv6)", "title_en": "SLAAC and DHCPv6", "badge": "IPv6 Auto", "summary": "كيف يحصل مضيف IPv6 على GUA ديناميكيًا عبر رسائل RA، وكيف تحدد رايات A/O/M الاختيار بين SLAAC وStateless DHCPv6 وStateful DHCPv6، ثم كيفية إنشاء Interface ID والتحقق بـDAD، وتشغيل DHCPv6 وتكوين الموجّه كخادم أو عميل أو Relay والتحقق من التشغيل.", "official_objective": "تكوين التوزيع الديناميكي للعناوين في شبكات IPv6، مع شرح اكتساب GUA، وتشغيل SLAAC وDHCPv6، وتكوين خادم DHCPv6 بنمط Stateful وStateless.", "lecture": {"duration": "≈ 90 دقيقة", "steps": [{"time": "10 د", "topic": "الخريطة الكبرى: GUA وLLA وطرق التوزيع الديناميكي Stateless/Stateful."}, {"time": "15 د", "topic": "RA والرايات A/O/M وكيف تختار SLAAC أو Stateless DHCPv6 أو Stateful DHCPv6."}, {"time": "15 د", "topic": "SLAAC: RS/RA، Multicast، Interface ID وDAD."}, {"time": "10 د", "topic": "تسلسل DHCPv6 والرسائل والمنافذ UDP 546/547."}, {"time": "15 د", "topic": "Stateless DHCPv6: العنوان من SLAAC والمعلومات الإضافية من DHCPv6."}, {"time": "15 د", "topic": "Stateful DHCPv6: العنوان من DHCPv6 والبوابة الافتراضية من RA."}, {"time": "10 د", "topic": "Server/Client/Relay وأوامر التحقق + مقارنة ختامية."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/dhcp_ipv6_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة الداتا مع المحاور الرسمية الأربعة: IPv6 Global Unicast Address Assignment، SLAAC، DHCPv6، وConfigure DHCPv6 Server.", "تم جعل رايات A/O/M محورًا تنظيميًا للوحدة لتقليل الالتباس بين SLAAC وStateless DHCPv6 وStateful DHCPv6 دون تغيير الحقائق التي يقدمها المصدر.", "تم تضمين RS/RA، ff02::1 وff02::2، Interface ID، EUI-64، DAD، DHCPv6 message flow، UDP 546/547، وأدوار الموجّه Server/Client/Relay.", "يوجد في Speaker Notes للعرض ذكر Introduction to Networks v7.0 رغم أن عنوان العرض SRWE Module 8؛ اعتبرته اللجنة بقايا Template ولم تنقله للداتا.", "في 8.4.5 يصف العنوان Stateful DHCPv6 Client بينما إحدى الجمل تقول stateless؛ اعتمدت الداتا Stateful لأن الأمر ipv6 address dhcp وبقية القسم كلها متسقة مع Stateful، وسُجل الخطأ بدل تصحيحه بصمت.", "تم تعزيز نقطتين من Cisco الرسمية: DHCPv6 لا يمنح Default Gateway؛ البوابة الديناميكية تأتي من RA، وStateless DHCPv6 يستخدم SLAAC للعنوان وDHCPv6 للمعلومات الإضافية. هذه التوضيحات متوافقة أيضًا مع ملخص الوحدة في المصدر.", "أنشطة المختبر لم تُكرر لأنها تنتمي للمسار العملي، ولم يتم تعديل التصميم أو JavaScript أو CSS.", "جولة المراجعة المتقاطعة: خُففت الإطلاقية في عرض A/O/M، وأُكدت قاعدة أن Default Gateway الديناميكية تأتي من RA لا من DHCPv6."], "cross_review_corrections_applied": true}, "sections": [{"id": "u8s1", "number": "01", "toc_title": "خريطة IPv6 الديناميكية", "title": "في IPv6 لا يوجد طريق واحد للحصول على العنوان", "subtitle": "ابدأ بالخريطة: GUA قد يأتي من SLAAC أو DHCPv6، لكن LLA وRA يظلان جزءًا أساسيًا من القصة.", "body_html": "<p class=\"core\">المضيف في IPv6 يحتاج عادة <strong>GUA (Global Unicast Address)<\/strong> للاتصال خارج الرابط المحلي، ويملك أيضًا <strong>LLA (Link-Local Address)<\/strong> على الواجهة. عند اختيار الإعداد التلقائي يعتمد المضيف على <strong>ICMPv6 Router Advertisement (RA)<\/strong> لمعرفة كيف يحصل على تكوينه.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>SLAAC Only<\/h4><p>المضيف ينشئ GUA بنفسه اعتمادًا على Prefix في RA، ولا يحتاج DHCPv6 لتوزيع العنوان.<\/p><\/div>\n  <div class=\"card\"><h4>Stateless DHCPv6<\/h4><p>العنوان من SLAAC، بينما DHCPv6 يعطي معلومات إضافية مثل DNS وDomain Name.<\/p><\/div>\n  <div class=\"card\"><h4>Stateful DHCPv6<\/h4><p>DHCPv6 يدير عناوين العملاء ويتتبع Bindings ويمنح GUA، بينما Default Gateway يأتي من RA.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة الوحدة:<\/strong> لا تبدأ بحفظ الأوامر. اسأل أولًا: من سيصنع عنوان GUA؟ المضيف عبر SLAAC أم خادم DHCPv6؟<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>هل وجود DHCPv6 يعني أن SLAAC غير موجود دائمًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. Stateless DHCPv6 يعتمد على SLAAC للحصول على العنوان ويستخدم DHCPv6 للمعلومات الإضافية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">GUA<\/span><span class=\"term\">LLA<\/span><span class=\"term\">SLAAC<\/span><span class=\"term\">Stateless DHCPv6<\/span><span class=\"term\">Stateful DHCPv6<\/span><\/div>"}, {"id": "u8s2", "number": "02", "toc_title": "رايات A / O / M", "title": "RA لا يعطي معلومات فقط… بل يخبر المضيف أي طريقة يستخدم", "subtitle": "A وO وM هي مفتاح القرار بين SLAAC وStateless DHCPv6 وStateful DHCPv6.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>A Flag<\/h4><p><strong>Address Autoconfiguration<\/strong><br>A=1 يعني استخدم SLAAC لإنشاء GUA من Prefix المعلن.<\/p><\/div>\n  <div class=\"card\"><h4>O Flag<\/h4><p><strong>Other Configuration<\/strong><br>O=1 يعني توجد معلومات إضافية لدى Stateless DHCPv6.<\/p><\/div>\n  <div class=\"card\"><h4>M Flag<\/h4><p><strong>Managed Address Configuration<\/strong><br>M=1 يعني استخدم Stateful DHCPv6 للحصول على عنوان مُدار.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><h4>SLAAC Only<\/h4><p>A=1<br>O=0<br>M=0<\/p><\/div>\n  <div class=\"compare-box\"><h4>Stateless DHCPv6<\/h4><p>A=1<br>O=1<br>M=0<\/p><\/div>\n  <div class=\"compare-box\"><h4>Stateful DHCPv6<\/h4><p>في سيناريو المنهج: A=0<br>O=0<br>M=1<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>طريقة تعليمية لفهم الخيارات:<\/strong> استخدم قيم A/O/M كما يعرضها المنهج لتحديد مصدر العنوان والمعلومات الإضافية. هذه خريطة تفسيرية لرسائل RA وليست وصفًا بأن الرايات الثلاث تؤدي دائمًا أدوارًا متماثلة في كل سيناريو.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>إذا كانت A=1 وO=1 وM=0، فمن يمنح العنوان؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">المضيف ينشئ العنوان عبر SLAAC، ويستخدم DHCPv6 للحصول على معلومات إضافية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">A Flag<\/span><span class=\"term\">O Flag<\/span><span class=\"term\">M Flag<\/span><span class=\"term\">RA<\/span><\/div>"}, {"id": "u8s3", "number": "03", "toc_title": "SLAAC وRS/RA", "title": "SLAAC يبدأ من الموجّه… أو بطلب سريع من المضيف", "subtitle": "الموجّه يرسل RA دوريًا، والمضيف يستطيع إرسال RS بدل انتظار الإعلان التالي.", "body_html": "<p class=\"core\"><strong>SLAAC<\/strong> خدمة Stateless: لا يوجد خادم يحتفظ بقائمة العناوين التي منحها. الموجّه يرسل RA تحوي معلومات Prefix وغيرها، والمضيف يستخدمها لبناء GUA الخاص به.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · RS<\/b><span>المضيف يرسل Router Solicitation إلى ff02::2 (كل الموجّهات).<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · RA<\/b><span>الموجّه يرسل Router Advertisement غالبًا إلى ff02::1 (كل العقد)، وقد يرسله Unicast ردًا على RS.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Build GUA<\/b><span>المضيف يستخدم Prefix ويُنشئ Interface ID.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>ff02::2<\/h4><p>IPv6 all-routers multicast. يرسل المضيف RS إلى هذه المجموعة عندما يريد RA فورًا.<\/p><\/div>\n  <div class=\"card\"><h4>ff02::1<\/h4><p>IPv6 all-nodes multicast. ترسل RA الدورية عادةً إلى العقد على الرابط، وقد يكون الرد على RS مباشرًا للمضيف.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>وفق العرض:<\/strong> الموجّه Cisco IOS يرسل RA دوريًا كل 200 ثانية تقريبًا، ويمكنه إرسال RA فور استلام RS.<\/div>\n<details class=\"cmd study-detail\"><summary>تمكين RA في سيناريو المنهج<\/summary><div class=\"expand-body\"><pre>R1(config)# ipv6 unicast-routing<\/pre><p>مع واجهة IPv6 مهيأة، يؤدي تمكين IPv6 routing إلى انضمام الموجّه لمجموعة all-routers وبدء سلوك Router Advertisement.<\/p><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>لماذا يرسل المضيف RS بدل الانتظار؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">حتى يطلب RA فورًا ويحصل على معلومات التكوين دون انتظار الإعلان الدوري التالي.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">SLAAC<\/span><span class=\"term\">Router Solicitation<\/span><span class=\"term\">Router Advertisement<\/span><span class=\"term\">ff02::1<\/span><span class=\"term\">ff02::2<\/span><\/div>"}, {"id": "u8s4", "number": "04", "toc_title": "Interface ID وDAD", "title": "Prefix من RA… والنصف الآخر يصنعه المضيف", "subtitle": "بعد معرفة /64 يحتاج المضيف إلى Interface ID فريد، ثم يتحقق من عدم تكرار العنوان عبر DAD.", "body_html": "<p class=\"core\">في سيناريو SLAAC /64 يحصل المضيف على أول 64 بت من Prefix المعلن، ثم يُنشئ <strong>Interface ID<\/strong> بطول 64 بت ليكوّن GUA كاملًا.<\/p>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>Random / Privacy<\/h4><p>أنظمة تشغيل حديثة قد تولد Interface ID عشوائيًا لتقليل ربط عنوان IPv6 مباشرة بعنوان MAC.<\/p><\/div>\n  <div class=\"card\"><h4>EUI-64<\/h4><p>يبني Interface ID من MAC بإضافة FFFE في المنتصف وتعديل البت المناسب. المنهج يذكره كطريقة ممكنة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>DAD (Duplicate Address Detection):<\/strong> قبل استخدام العنوان قد يرسل المضيف Neighbor Solicitation إلى Solicited-Node Multicast. إذا لم يظهر رد أو Neighbor Solicitation آخر يدل على استخدام العنوان نفسه، يمكن استخدام العنوان بعد اكتمال DAD.<\/div>\n<details class=\"expand study-detail\"><summary>ماذا يحدث إذا كشف DAD عنوانًا مكررًا بواسطة NA أو NS؟<\/summary><div class=\"expand-body\">لا يستخدم العنوان المقترح، ويحتاج إلى إنشاء Interface ID مختلف ثم إعادة عملية التحقق.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>هل DHCPv6 هو الذي ينفذ DAD للمضيف؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. DAD آلية IPv6 ينفذها المضيف للتحقق من تفرد عنوان Unicast قبل استخدامه.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Interface ID<\/span><span class=\"term\">EUI-64<\/span><span class=\"term\">DAD<\/span><span class=\"term\">NS<\/span><span class=\"term\">NA<\/span><\/div>"}, {"id": "u8s5", "number": "05", "toc_title": "كيف يعمل DHCPv6؟", "title": "بعد RA: مساران مختلفان لرسائل DHCPv6", "subtitle": "Stateful يطلب عنوانًا عبر SOLICIT وADVERTISE وREQUEST وREPLY؛ أما Stateless فيطلب الخيارات عبر INFORMATION-REQUEST وREPLY.", "body_html": "<p class=\"core\">تخبر RA المضيف بسياسة التكوين. بعد ذلك يختلف حوار DHCPv6 بحسب ما إذا كان الخادم سيدير عنوان GUA أو سيقدم معلومات إضافية فقط.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><h4>Stateful DHCPv6 · عنوان مُدار<\/h4><p>بعد RA: <strong>SOLICIT → ADVERTISE → REQUEST → REPLY<\/strong>. يبحث العميل عن خادم، يتلقى العرض، يطلب العنوان ثم يتلقى الرد.<\/p><\/div>\n  <div class=\"compare-box\"><h4>Stateless DHCPv6 · خيارات إضافية<\/h4><p>العنوان من SLAAC، وبعد RA يطلب العميل خيارات مثل DNS عبر <strong>INFORMATION-REQUEST → REPLY<\/strong>. لا يحتاج تسلسل SOLICIT/ADVERTISE للحصول على هذه الخيارات في الحالة المعتادة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>البوابة الافتراضية:<\/strong> يتعلمها المضيف من RA في النمطين؛ DHCPv6 لا يرسل خيار Default Gateway ضمن هذا السيناريو.<\/div>\n<div class=\"grid2\"><div class=\"card\"><h4>UDP 546<\/h4><p>وجهة رسائل DHCPv6 من Server إلى Client.<\/p><\/div><div class=\"card\"><h4>UDP 547<\/h4><p>وجهة رسائل DHCPv6 من Client إلى Server.<\/p><\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>أي تسلسل يستخدمه العميل عادةً لطلب DNS فقط في Stateless DHCPv6؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">INFORMATION-REQUEST ثم REPLY؛ GUA ينشئه المضيف بواسطة SLAAC، وتحدد RA سياسة التكوين والبوابة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">SOLICIT<\/span><span class=\"term\">ADVERTISE<\/span><span class=\"term\">REQUEST<\/span><span class=\"term\">INFORMATION-REQUEST<\/span><span class=\"term\">REPLY<\/span><span class=\"term\">UDP 546/547<\/span><\/div>"}, {"id": "u8s6", "number": "06", "toc_title": "Stateless DHCPv6", "title": "Stateless = العنوان من SLAAC، والمعلومات الإضافية من DHCPv6", "subtitle": "الخادم لا يدير عناوين العملاء؛ دوره تزويدهم بخيارات إضافية.", "body_html": "<div class=\"compare\">\n  <div class=\"compare-box\"><h4>العنوان<\/h4><p>يُنشئه المضيف عبر SLAAC من Prefix في RA.<\/p><\/div>\n  <div class=\"compare-box\"><h4>المعلومات الإضافية<\/h4><p>تأتي من DHCPv6، مثل DNS Server وDomain Name.<\/p><\/div>\n  <div class=\"compare-box\"><h4>الـBindings<\/h4><p>الخادم Stateless لا يحتفظ بقائمة عناوين GUA الممنوحة، لأنه لا يمنح العنوان أصلًا.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>رايات المنهج:<\/strong> A=1، O=1، M=0.<\/div>\n<details class=\"cmd study-detail\"><summary>خطوات Cisco IOS الأساسية<\/summary><div class=\"expand-body\"><pre>R1(config)# ipv6 unicast-routing\nR1(config)# ipv6 dhcp pool IPV6-STATELESS\nR1(config-dhcpv6)# dns-server 2001:db8::53\nR1(config-dhcpv6)# domain-name example.com\nR1(config)# interface g0/0/1\nR1(config-if)# ipv6 dhcp server IPV6-STATELESS\nR1(config-if)# ipv6 nd other-config-flag<\/pre><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>إذا كان الخادم Stateless، هل show ipv6 dhcp binding يجب أن يعرض عناوين GUA التي وزعها؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا؛ Stateless DHCPv6 لا يوزع عنوان GUA نفسه ولا يحتفظ بقائمة Bindings للعناوين كما يفعل Stateful.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Stateless DHCPv6<\/span><span class=\"term\">ipv6 nd other-config-flag<\/span><span class=\"term\">O Flag<\/span><\/div>"}, {"id": "u8s7", "number": "07", "toc_title": "Stateful DHCPv6", "title": "Stateful = DHCPv6 يدير العناوين… لكن Default Gateway ما زال من RA", "subtitle": "الخادم يحتفظ بحالة العملاء وBindings، والموجّه يوجه المضيف إلى هذا النمط عبر M Flag.", "body_html": "<p class=\"core\">في <strong>Stateful DHCPv6<\/strong> يتولى الخادم توزيع GUA ومعلومات أخرى ويحتفظ بقائمة Bindings. في سيناريو المنهج يطلب الموجّه من المضيف عدم استخدام SLAAC للعنوان ويوجه إلى DHCPv6.<\/p>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>العنوان<\/h4><p>يأتي من Stateful DHCPv6 Server ويظهر ضمن Bindings.<\/p><\/div>\n  <div class=\"card\"><h4>Default Gateway<\/h4><p>لا يأتي من DHCPv6. المضيف يتعلم البوابة ديناميكيًا من Router Advertisement.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>رايات سيناريو المنهج:<\/strong> A=0، O=0، M=1. أهم راية هنا M=1 لأنها تقول للمضيف استخدم DHCPv6 للحصول على عنوان مُدار.<\/div>\n<details class=\"cmd study-detail\"><summary>خطوات Cisco IOS الأساسية<\/summary><div class=\"expand-body\"><pre>R1(config)# ipv6 unicast-routing\nR1(config)# ipv6 dhcp pool IPV6-STATEFUL\nR1(config-dhcpv6)# address prefix 2001:db8:acad:1::/64\nR1(config-dhcpv6)# dns-server 2001:db8::53\nR1(config)# interface g0/0/1\nR1(config-if)# ipv6 dhcp server IPV6-STATEFUL\nR1(config-if)# ipv6 nd managed-config-flag\nR1(config-if)# ipv6 nd prefix default no-autoconfig<\/pre><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال مهم: إذا كان DHCPv6 Stateful، من يعطي Default Gateway؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Router Advertisement من الموجّه، وليس DHCPv6.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Stateful DHCPv6<\/span><span class=\"term\">ipv6 nd managed-config-flag<\/span><span class=\"term\">M Flag<\/span><span class=\"term\">Default Gateway via RA<\/span><\/div>"}, {"id": "u8s8", "number": "08", "toc_title": "Server / Client / Relay", "title": "الموجّه Cisco يمكن أن يكون خادمًا أو عميلًا أو Relay لـDHCPv6", "subtitle": "نفس الجهاز يستطيع أداء ثلاثة أدوار مختلفة حسب مكانه في الشبكة.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>DHCPv6 Server<\/h4><p>يوفر Stateless أو Stateful DHCPv6 حسب Pool والرايات المعلنة على الواجهة.<\/p><\/div>\n  <div class=\"card\"><h4>DHCPv6 Client<\/h4><p>واجهة الموجّه يمكن أن تستخدم <code>ipv6 address autoconfig<\/code> في Stateless/SLAAC أو <code>ipv6 address dhcp<\/code> في Stateful.<\/p><\/div>\n  <div class=\"card\"><h4>DHCPv6 Relay Agent<\/h4><p>يمرر رسائل DHCPv6 عندما يكون العميل والخادم في شبكتين مختلفتين.<\/p><\/div>\n<\/div>\n<details class=\"cmd study-detail\"><summary>أوامر التحقق الأساسية<\/summary><div class=\"expand-body\"><pre>show ipv6 dhcp pool\nshow ipv6 dhcp binding\nshow ipv6 dhcp interface\nshow ipv6 interface brief<\/pre><p><strong>show ipv6 dhcp binding<\/strong> مفيد خصوصًا في Stateful لأن الخادم يحتفظ بحالة العناوين.<\/p><\/div><\/details>\n<div class=\"keyline\"><strong>Relay:<\/strong> إذا كان الخادم بعيدًا يستخدم الموجّه أمر <code>ipv6 dhcp relay destination<\/code> على الواجهة المواجهة للعملاء، مع تحديد واجهة الخروج عندما يكون Next Hop عنوان LLA بحسب سيناريو المنهج.<\/div>\n<details class=\"expand study-detail\"><summary>ملاحظة المصدر 8.4.5<\/summary><div class=\"expand-body\">عنوان القسم هو Stateful DHCPv6 Client ويستخدم الأمر <code>ipv6 address dhcp<\/code>، لكن إحدى جمل العرض تسمي الخطوات Stateless. اعتمدنا Stateful لأنه المتسق مع العنوان والأمر وبقية الشرح، وسجلنا التناقض في مراجعة الوحدة.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>أي أمر يكشف Bindings التي يحتفظ بها Stateful DHCPv6 Server؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">show ipv6 dhcp binding.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DHCPv6 Server<\/span><span class=\"term\">DHCPv6 Client<\/span><span class=\"term\">DHCPv6 Relay Agent<\/span><span class=\"term\">show ipv6 dhcp binding<\/span><\/div>"}, {"id": "u8s9", "number": "09", "toc_title": "المقارنة والخلاصة", "title": "اسأل ثلاثة أسئلة وستحل معظم مسائل الوحدة", "subtitle": "من يعطي العنوان؟ من يعطي المعلومات الإضافية؟ ومن يعطي Default Gateway؟", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>SLAAC Only<\/h4><p><strong>العنوان:<\/strong> SLAAC<br><strong>معلومات إضافية:<\/strong> RA حسب ما هو معلن<br><strong>Gateway:<\/strong> RA<br><strong>Flags:<\/strong> A=1 O=0 M=0<\/p><\/div>\n  <div class=\"card\"><h4>Stateless DHCPv6<\/h4><p><strong>العنوان:<\/strong> SLAAC<br><strong>معلومات إضافية:<\/strong> DHCPv6<br><strong>Gateway:<\/strong> RA<br><strong>Flags:<\/strong> A=1 O=1 M=0<\/p><\/div>\n  <div class=\"card\"><h4>Stateful DHCPv6<\/h4><p><strong>العنوان:<\/strong> DHCPv6<br><strong>معلومات إضافية:<\/strong> DHCPv6<br><strong>Gateway:<\/strong> RA<br><strong>Flags في المنهج:<\/strong> A=0 O=0 M=1<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة ثابتة في هذه الوحدة:<\/strong> DHCPv6 لا يوزع Default Gateway؛ البوابة الديناميكية يتعلمها المضيف من Router Advertisement (RA).<\/div>\n<div class=\"summary-box\"><h4>ما الذي يجب أن يبقى في ذهنك؟<\/h4><div class=\"summary-list\">\n  <div class=\"summary-item\">RA هي نقطة البداية في كل طرق التوزيع الديناميكي التي يغطيها المنهج.<\/div>\n  <div class=\"summary-item\">A/O/M تحدد هل يستخدم المضيف SLAAC أو DHCPv6 أو كليهما.<\/div>\n  <div class=\"summary-item\">SLAAC يبني GUA من Prefix + Interface ID، ثم يستخدم DAD للتحقق من التفرد.<\/div>\n  <div class=\"summary-item\">Stateless: SLAAC للعنوان وDHCPv6 للمعلومات الإضافية.<\/div>\n  <div class=\"summary-item\">Stateful: DHCPv6 للعنوان، لكن Default Gateway يبقى من RA.<\/div>\n  <div class=\"summary-item\">DHCPv6 يستخدم SOLICIT/ADVERTISE/REQUEST/REPLY وUDP 546/547.<\/div>\n  <div class=\"summary-item\">الموجّه Cisco يمكن أن يكون Server أو Client أو Relay.<\/div>\n<\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سيناريو: العميل أنشأ GUA بنفسه لكنه أخذ DNS من DHCPv6. ما النمط؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Stateless DHCPv6: العنوان عبر SLAAC، والمعلومات الإضافية من DHCPv6.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">SLAAC<\/span><span class=\"term\">Stateless DHCPv6<\/span><span class=\"term\">Stateful DHCPv6<\/span><span class=\"term\">A/O/M<\/span><span class=\"term\">RA<\/span><\/div>"}]}]</script><script>
(()=>{'use strict';const modules=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 u8s2:{choices:['SLAAC ينشئ العنوان وDHCPv6 يقدم خيارات إضافية','DHCPv6 يقدم العنوان والبوابة','A=1 يمنع SLAAC'],correct:0},
 u8s3:{choices:['ليحصل على RA فورًا بدل انتظار الإعلان الدوري','ليرسل GUA إلى الخادم','ليطلب Lease من DHCPv4'],correct:0},

};

function sectionHTML(s,part,d){const doc=new DOMParser().parseFromString(s.body_html,'text/html');doc.querySelectorAll('.quiz,script').forEach(x=>x.remove());doc.querySelectorAll('[onclick]').forEach(x=>x.removeAttribute('onclick'));const nodes=[...doc.body.children].filter(x=>x.textContent.trim()),sizes=nodes.map(x=>x.textContent.trim().length),total=sizes.reduce((a,b)=>a+b,0);let acc=0,cut=1,best=Infinity;for(let i=0;i<nodes.length-1;i++){acc+=sizes[i];let diff=Math.abs(total-2*acc);if(diff<best){best=diff;cut=i+1}}const selected=nodes.slice(part?cut:0,part?undefined:cut),q=new DOMParser().parseFromString(s.body_html,'text/html').querySelector('.quiz'),question=q?.querySelector('b')?.textContent||'تحقق من الفهم',answer=q?.querySelector('.answer')?.textContent||'';return '<div class="kicker">الوحدة '+d.module_number+' · القسم '+esc(s.number)+' · '+(part?'٢/٢':'١/٢')+'</div><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.subtitle)+'</p><div class="body lesson">'+selected.map(x=>x.outerHTML).join('')+(part?'<div class="card check"><b>'+esc(question)+'</b><div class="choice-list">'+checks[s.id].choices.map((v,i)=>'<button class="choice" data-check="'+i+'">'+esc(v)+'</button>').join('')+'</div><div class="feedback" role="status" hidden>'+esc(answer)+'</div></div>':'')+'</div><span class="scroll-hint">مرّر داخل الشريحة لاستكمال الشرح ↓</span>'}

function doraHTML(){return '<div class="kicker">الوحدة ٧ · محاكاة رسائل DHCPv4</div><h2>حوار DORA وتجديد التأجير</h2><div class="body journey"><label>مكان الخادم <select id="serverLocation"><option value="local">في الشبكة نفسها</option><option value="remote">في شبكة أخرى عبر Relay</option></select></label>'+journeyControls()+'<div class="message-path"><div class="endpoint">DHCPv4 Client</div><div class="transit" id="transit"></div><div class="endpoint" id="serverNode">DHCPv4 Server</div></div><div class="message-name" id="stepTitle"></div><p class="message-explain" id="stepExplain"></p><span class="badge" id="stepCount"></span><p class="source-note">المحاكاة مفاهيمية؛ عند وجود خادم بعيد يحوّل Relay الطلب المحلي إلى الخادم المحدد عبر <code>ip helper-address</code>. <a href="https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dhcp/configuration/15-s/dhcp-15-s-book/dhcp-relay-agent.html" target="_blank" rel="noopener noreferrer">Cisco · DHCP Relay</a></p></div>'}
const ipv6Steps={

function ipv6HTML(){return '<div class="kicker">الوحدة ٨ · رايات RA ومسار العنوان</div><h2>من يعطي GUA وDNS والبوابة؟</h2><div class="body journey"><div class="presets"><button class="preset" data-mode="slaac">SLAAC فقط</button><button class="preset" data-mode="stateless">Stateless DHCPv6</button><button class="preset" data-mode="stateful">Stateful DHCPv6</button></div><div class="flags" id="flags"></div>'+journeyControls()+'<div class="message-path"><div class="endpoint">IPv6 Host</div><div class="transit" id="transit"></div><div class="endpoint">Router / DHCPv6</div></div><div class="message-name" id="stepTitle"></div><p class="message-explain" id="stepExplain"></p><div class="decision-grid" id="decision"></div><span class="badge" id="stepCount"></span><p class="source-note">الرايات هنا إعدادات أمثلة المنهج، ودعم العملاء للرايات يختلف بين الأنظمة. Default Gateway يأتي من RA. <a href="https://www.cisco.com/c/en/us/support/docs/ip/ip-version-6-ipv6/213272-troubleshoot-ipv6-dynamic-address-assign.html" target="_blank" rel="noopener noreferrer">Cisco · IPv6 Dynamic Address Assignment</a></p></div>'}
function paintJourney(type){let arr=type==='dora'?dora:ipv6Steps[mode],item=arr[step];$('stepTitle').textContent=item[0];$('stepExplain').textContent=item[1];$('stepCount').textContent=(step+1)+' / '+arr.length;$('transit').innerHTML='<span class="pulse"></span><small>'+esc(type==='dora'?item[2]:step===0?'RS / RA':'IPv6')+'</small>';$('prevStep').disabled=step===0;$('nextStep').disabled=step===arr.length-1;if(type==='dora'){$('serverNode').textContent=remote?'DHCP Relay → Server':'DHCPv4 Server'}else{let d=modeInfo[mode];$('flags').innerHTML=['A','O','M'].map((f,i)=>'<span class="flag '+(d.flags[i]?'on':'')+'">'+f+' = '+d.flags[i]+'</span>').join('');$('decision').innerHTML=[['GUA',d.address],['خيارات إضافية',d.other],['Default Gateway',d.gateway]].map(x=>'<div class="card"><b>'+x[0]+'</b>'+x[1]+'</div>').join('');$('stage').querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode))}}
function initJourney(type){step=0;if(type==='dora')remote=false;if(type==='dora')$('serverLocation').onchange=e=>{remote=e.target.value==='remote';paintJourney(type)};else $('stage').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{stop();mode=b.dataset.mode;step=0;paintJourney(type)});$('prevStep').onclick=()=>{stop();step=Math.max(0,step-1);paintJourney(type)};$('nextStep').onclick=()=>{stop();step=Math.min((type==='dora'?dora:ipv6Steps[mode]).length-1,step+1);paintJourney(type)};$('resetStep').onclick=()=>{stop();step=0;paintJourney(type)};$('playStep').onclick=()=>{if(timer){stop();return}let length=(type==='dora'?dora:ipv6Steps[mode]).length;if(step===length-1)step=0;paintJourney(type);$('playStep').textContent='إيقاف مؤقت ❚❚';timer=setInterval(()=>{if(step===length-1){stop();return}step++;paintJourney(type)},2800)};paintJourney(type)}

function render(){stop();let s=slides[at],body='';if(s.type==='cover')body='<div class="kicker">CCNA 2 · الوحدتان ٧–٨</div><h1>كيف يحصل الجهاز على عنوانه؟</h1><p class="lead">في IPv4 حوار DORA وتأجير العنوان. في IPv6 يحدد RA طريقة الحصول على GUA، مع SLAAC أو DHCPv6.</p><div class="body grid"><div class="card"><b>الوحدة ٧ · DHCPv4</b><p>Server وClient وRelay، التكوين والتحقق والتجديد.</p></div><div class="card"><b>الوحدة ٨ · IPv6</b><p>RA والرايات A/O/M وSLAAC وStateless/Stateful DHCPv6.</p></div></div>';else if(s.type==='intro')body='<div class="kicker">الوحدة '+s.module.module_number+' · '+esc(s.module.lecture.duration)+'</div><h1>'+esc(s.module.title)+'</h1><p class="lead">'+esc(s.module.summary)+'</p><div class="body card"><b>الهدف</b><p>'+esc(s.module.official_objective)+'</p></div>';else if(s.type==='agenda')body='<div class="kicker">الوحدة '+s.module.module_number+'</div><h2>مسار المحاضرة</h2><div class="body grid">'+s.module.lecture.steps.map(x=>'<div class="card"><b>'+esc(x.time)+'</b><p>'+esc(x.topic)+'</p></div>').join('')+'</div>';else if(s.type==='section')body=sectionHTML(s.section,s.part,s.module);else if(s.type==='dora')body=doraHTML();else if(s.type==='ipv6')body=ipv6HTML();else if(s.type==='compare')body=compareHTML();else body='<div class="kicker">خلاصة الوحدتين</div><h2>سؤالان يختصران القرار</h2><div class="body grid"><div class="card"><b>IPv4</b><p>هل الخادم محلي أم خلف موجّه؟ إذا كان بعيدًا فافحص DHCP Relay وip helper-address، ثم Bindings والعميل.</p></div><div class="card"><b>IPv6</b><p>ما رايات RA؟ منها تعرف مصدر العنوان والخيارات؛ تبقى البوابة الافتراضية من RA في الأمثلة الثلاثة.</p></div><div class="card"><b>تحقق</b><p>تتبع الرسالة من العميل إلى الخدمة، ثم افحص الإعدادات الفعلية بدل الاكتفاء بوجود الأوامر.</p></div></div>';

function go(i){if(i<0||i>=slides.length)return;at=i;render()}$('prev').onclick=()=>go(at-1);$('next').onclick=()=>go(at+1);$('markBtn').onclick=()=>{marks.has(at)?marks.delete(at):marks.add(at);try{localStorage.setItem(markKey,JSON.stringify([...marks]))}catch{}$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';let b=$('menuList').querySelector('[data-slide="'+at+'"]');if(b)b.textContent=(at+1)+' · '+slides[at].title+(marks.has(at)?' ★':'')};$('notesBtn').onclick=()=>{large=!large;$('stage').querySelector('.slide').classList.toggle('large',large);$('notesBtn').classList.toggle('active',large);$('notesBtn').setAttribute('aria-pressed',String(large))};$('themeBtn').onclick=()=>{let day=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=day?'light':'dark';$('themeBtn').innerHTML=day?'☾ <span>ليلي</span>':'☀ <span>نهاري</span>';$('themeBtn').setAttribute('aria-pressed',String(day));$('themeBtn').setAttribute('aria-label',day?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري')};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('menuBtn').onclick=()=>$('menu').classList.add('open');$('closeMenu').onclick=()=>$('menu').classList.remove('open');$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('menuList').innerHTML=slides.map((s,i)=>'<button data-slide="'+i+'">'+(i+1)+' · '+esc(s.title)+'</button>').join('');$('menuList').onclick=e=>{let b=e.target.closest('[data-slide]');if(b){$('menu').classList.remove('open');go(+b.dataset.slide)}};document.addEventListener('keydown',e=>{if($('menu').classList.contains('open')){if(e.key==='Escape')$('menu').classList.remove('open');return}if(e.target.closest('button,input,select,textarea,summary'))return;if(['ArrowLeft','PageDown'].includes(e.key))go(at+1);if(['ArrowRight','PageUp'].includes(e.key))go(at-1)});let sx=0,sy=0;$('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select,summary,details,input,textarea,pre,.cmd,.table-scroll'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>1.5*Math.abs(dy))go(at+(dx<0?-1:1))},{passive:true});let m=location.hash.match(/^#slide-(\d+)$/);if(m)at=Math.max(0,Math.min(slides.length-1,+m[1]-1));render()})();
