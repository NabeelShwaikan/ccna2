ة؛ تم الاكتفاء بالنطاقين 2.4 و5 GHz ضمن سياق الوحدة.", "لم تُنقل عبارة WPA2 is no longer considered secure بصياغتها المطلقة؛ تم تقديم WPA3 بوصفه الجيل الأحدث عند توفر الدعم.", "أنشطة الفيديو وCheck Your Understanding لم تُنسخ حرفيًا؛ حُولت أفكارها إلى أسئلة فهم داخلية.", "جولة المراجعة المتقاطعة: أضيف سؤال فهم لكل قسم تقريبًا، وصححت إيحاء RTS/CTS، وعززت CAPWAP بصريًا مع إبقاء WPA2/WPA3 بالصياغة المصححة."], "cross_review_corrections_applied": true}, "sections": [{"id": "u12s1", "number": "01", "toc_title": "مقدمة إلى Wireless", "title": "WLAN تعطي المستخدم حرية الحركة داخل مساحة التغطية", "subtitle": "الشبكات اللاسلكية تختلف أساسًا في نطاق التغطية والتقنية المستخدمة.", "body_html": "<p class=\"core\"><strong>Wireless LAN (WLAN)<\/strong> شبكة لاسلكية تُستخدم عادةً في المنازل والمكاتب والحرم الجامعي. ميزتها الأساسية أنها تسمح للمستخدم بالحركة داخل منطقة التغطية مع استمرار الاتصال بالشبكة.<\/p><div class=\"grid4\"><div class=\"card\"><h4>WPAN<\/h4><p>مدى قصير واستهلاك منخفض للطاقة. أمثلة: Bluetooth وZigbee.<\/p><\/div><div class=\"card\"><h4>WLAN<\/h4><p>شبكة محلية تعتمد على IEEE 802.11 وتعمل غالبًا في 2.4 و5 GHz.<\/p><\/div><div class=\"card\"><h4>WMAN<\/h4><p>يغطي مساحة أكبر مثل مدينة أو منطقة حضرية.<\/p><\/div><div class=\"card\"><h4>WWAN<\/h4><p>يغطي مساحات وطنية أو عالمية باستخدام بنى اتصالات واسعة.<\/p><\/div><\/div><div class=\"keyline\"><strong>الفكرة:<\/strong> WLAN هي الفئة التي يركز عليها هذا المقرر.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق الأساسي بين WLAN وWPAN؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">WLAN تغطي مساحة محلية أكبر وتعتمد على IEEE 802.11، بينما WPAN قصيرة المدى وتقنيات مثل Bluetooth.<\/div><\/div><div class=\"terms\"><span class=\"term\">WPAN<\/span><span class=\"term\">WLAN<\/span><span class=\"term\">WMAN<\/span><span class=\"term\">WWAN<\/span><\/div>"}, {"id": "u12s2", "number": "02", "toc_title": "802.11 والترددات", "title": "معايير 802.11 تحدد كيف تستخدم WLAN الترددات الراديوية", "subtitle": "أغلب شبكات WLAN في هذا المنهج تعمل في نطاقي 2.4 GHz و5 GHz.", "body_html": "<div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">2.4 GHz<\/div><h4>مدى أفضل وازدحام أكبر<\/h4><p>يستخدمه 802.11b/g/n/ax.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">5 GHz<\/div><h4>قنوات أكثر وازدحام أقل<\/h4><p>يستخدمه 802.11a/n/ac/ax.<\/p><\/div><\/div><div class=\"grid3\"><div class=\"card\"><h4>IEEE<\/h4><p>يضع معايير 802.11.<\/p><\/div><div class=\"card\"><h4>ITU<\/h4><p>ينظم توزيع الطيف الراديوي والمدارات.<\/p><\/div><div class=\"card\"><h4>Wi‑Fi Alliance<\/h4><p>تعزز التوافق بين المنتجات المبنية على 802.11.<\/p><\/div><\/div><div class=\"keyline\"><strong>الأهم:<\/strong> التعرف على تطور المعايير وربطها بالترددات والتوافق، لا حفظ كل سرعة.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي نطاق يملك عادة قنوات أكثر وأقل ازدحامًا: 2.4 أم 5 GHz؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">5 GHz.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">IEEE 802.11<\/span><span class=\"term\">2.4 GHz<\/span><span class=\"term\">5 GHz<\/span><span class=\"term\">Wi‑Fi Alliance<\/span><\/div>"}, {"id": "u12s3", "number": "03", "toc_title": "مكونات WLAN", "title": "العميل يحتاج Wireless NIC، والشبكة تحتاج AP وهوائيات مناسبة", "subtitle": "في البيئات الصغيرة قد يجمع Wireless Router وظائف AP وSwitch وRouter في جهاز واحد.", "body_html": "<div class=\"grid3\"><div class=\"card\"><h4>Wireless NIC<\/h4><p>مرسل ومستقبل راديوي مدمج أوUSB.<\/p><\/div><div class=\"card\"><h4>Wireless AP<\/h4><p>نقطة الوصول التي يكتشفها العميل ثم يرتبط بها.<\/p><\/div><div class=\"card\"><h4>Wireless Router<\/h4><p>يجمع AP + Switch + Router في المنزل.<\/p><\/div><\/div><div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">Autonomous AP<\/div><h4>إدارة مستقلة<\/h4><p>كل AP يُكوَّن ويدار منفردًا.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">Controller-Based AP<\/div><h4>إدارة مركزية<\/h4><p>Lightweight AP يُدار من WLC.<\/p><\/div><\/div><div class=\"grid3\"><div class=\"card\"><h4>Omnidirectional<\/h4><p>تغطية 360°.<\/p><\/div><div class=\"card\"><h4>Directional<\/h4><p>يركز الإشارة باتجاه محدد.<\/p><\/div><div class=\"card\"><h4>MIMO<\/h4><p>عدة هوائيات لزيادة السعة والأداء.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق الإداري بين Autonomous AP وController-Based AP؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Autonomous AP يُدار منفردًا، بينما Controller-Based AP يُدار مركزيًا عبر WLC.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Wireless NIC<\/span><span class=\"term\">AP<\/span><span class=\"term\">Autonomous AP<\/span><span class=\"term\">Lightweight AP<\/span><span class=\"term\">MIMO<\/span><\/div>"}, {"id": "u12s4", "number": "04", "toc_title": "BSS وESS", "title": "Infrastructure Mode هو النموذج المعتاد، وBSS وESS يصفان نطاقات الخدمة", "subtitle": "Ad Hoc يربط الأجهزة مباشرة، أما Infrastructure فيعتمد على AP.", "body_html": "<div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">Ad Hoc<\/div><h4>Peer-to-Peer<\/h4><p>أجهزة تتصل مباشرة دون AP.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">Infrastructure<\/div><h4>Client ↔ AP ↔ Network<\/h4><p>النموذج المعتاد للوصول إلى الشبكة عبر نقطة وصول.<\/p><\/div><\/div><div class=\"flow\"><div class=\"step\"><b>BSS<\/b><span>AP واحد والعملاء المرتبطون به.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Distribution System<\/b><span>يربط عدة BSS.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>ESS<\/b><span>اتحاد BSS متعددة لتغطية أوسع.<\/span><\/div><\/div><div class=\"keyline\"><strong>Hotspot الهاتف<\/strong> يعمل عادةً كنقطة وصول في Infrastructure Mode؛ اتصال Ad Hoc (IBSS) يربط الأجهزة مباشرة دون AP.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق بين BSS وESS؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">BSS يعتمد على AP واحد، بينما ESS يضم عدة BSS مترابطة لتغطية أوسع.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Ad Hoc<\/span><span class=\"term\">Infrastructure Mode<\/span><span class=\"term\">BSS<\/span><span class=\"term\">ESS<\/span><\/div>"}, {"id": "u12s5", "number": "05", "toc_title": "CSMA/CA والارتباط", "title": "WLAN تتجنب التصادم بدل أن تكتشفه", "subtitle": "WLAN نصف مزدوج ويستخدم CSMA/CA لتقليل احتمال التصادم؛ يعرض المنهج RTS/CTS كتسلسل تعليمي لفهم الآلية.", "body_html": "<p class=\"core\">العميل اللاسلكي لا يستطيع الإرسال والاستماع في اللحظة نفسها، لذلك يعتمد على <strong>CSMA/CA<\/strong>.<\/p><div class=\"flow\"><div class=\"step\"><b>Listen<\/b><span>تحقق أن القناة خالية.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>RTS<\/b><span>طلب الإذن.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>CTS<\/b><span>السماح بالإرسال.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Transmit<\/b><span>إرسال البيانات.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>ACK<\/b><span>تأكيد الاستلام.<\/span><\/div><\/div><div class=\"grid2\"><div class=\"card\"><h4>Passive Discovery<\/h4><p>AP يرسل Beacon دوريًا.<\/p><\/div><div class=\"card\"><h4>Active Discovery<\/h4><p>العميل يرسل Probe Request.<\/p><\/div><\/div><div class=\"keyline\"><strong>تنبيه دقة:<\/strong> التسلسل RTS → CTS في هذا القسم هو النموذج التعليمي الذي يعرضه SRWE لفهم CSMA/CA؛ لا يعني أن كل Frame في كل WLAN تستخدم RTS/CTS حتميًا.<\/div>\n<div class=\"keyline\"><strong>Association:<\/strong> Discover AP → Authenticate → Associate، مع توافق SSID وكلمة المرور والمعيار والأمان والقناة.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل المقصود أن RTS/CTS يحدث حتميًا مع كل إطار WLAN؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. يعرض المنهج RTS/CTS كتسلسل تعليمي لفهم تجنب التصادم؛ استخدامه الفعلي يعتمد على آلية التشغيل والإعدادات.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">CSMA/CA<\/span><span class=\"term\">RTS<\/span><span class=\"term\">CTS<\/span><span class=\"term\">Beacon<\/span><span class=\"term\">Association<\/span><\/div>"}, {"id": "u12s6", "number": "06", "toc_title": "CAPWAP وWLC", "title": "CAPWAP يفصل وظائف WLAN بين AP وWLC ويجعل الإدارة مركزية", "subtitle": "الـAP يهتم بالوظائف القريبة من الراديو، بينما WLC يدير وظائف مركزية.", "body_html": "<div class=\"flow\"><div class=\"step\"><b>AP<\/b><span>وظائف الراديو والعملاء.<\/span><\/div><div class=\"arrow\">⇄<\/div><div class=\"step\"><b>CAPWAP<\/b><span>Control/Data Tunnel.<\/span><\/div><div class=\"arrow\">⇄<\/div><div class=\"step\"><b>WLC<\/b><span>إدارة وسياسات مركزية.<\/span><\/div><\/div>\n<p class=\"core\"><strong>CAPWAP<\/strong> يتيح لـ<strong>WLC<\/strong> إدارة عدة APs وWLANs مركزيًا، وهو التطور اللاحق لـLWAPP.<\/p><div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">AP MAC Functions<\/div><h4>قريب من الراديو<\/h4><p>Beacon/Probe Responses، ACK/Retransmission، Queueing وبعض وظائف التشفير.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">WLC MAC Functions<\/div><h4>إدارة مركزية<\/h4><p>Authentication، Association/Reassociation، وترجمة الإطارات وإنهاء 802.11.<\/p><\/div><\/div><div class=\"grid3\"><div class=\"card\"><h4>UDP 5246<\/h4><p>Control.<\/p><\/div><div class=\"card\"><h4>UDP 5247<\/h4><p>Data.<\/p><\/div><div class=\"card\"><h4>DTLS<\/h4><p>يحمي قناة التحكم بين AP وWLC.<\/p><\/div><\/div><div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">FlexConnect Connected<\/div><p>WLC متاح والـAP متصل عبر CAPWAP.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">FlexConnect Standalone<\/div><p>WLC غير متاح والـAP ينفذ بعض الوظائف محليًا.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفائدة الأساسية من CAPWAP في شبكة مؤسسية؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تمكين WLC من إدارة عدة APs وWLANs مركزيًا.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">CAPWAP<\/span><span class=\"term\">WLC<\/span><span class=\"term\">Split MAC<\/span><span class=\"term\">DTLS<\/span><span class=\"term\">FlexConnect<\/span><\/div>"}, {"id": "u12s7", "number": "07", "toc_title": "إدارة القنوات", "title": "اختيار القناة ومكان AP جزء أساسي من تصميم WLAN", "subtitle": "التداخل والازدحام وعدد المستخدمين ومعدلات البيانات كلها عوامل تصميم.", "body_html": "<p class=\"core\">إذا زاد الطلب على قناة معينة قد تصبح مشبعة وتنخفض جودة الاتصال.<\/p><div class=\"grid3\"><div class=\"card\"><h4>DSSS<\/h4><p>نشر الإشارة على نطاق أوسع.<\/p><\/div><div class=\"card\"><h4>FHSS<\/h4><p>القفز بين عدة قنوات بتسلسل متزامن.<\/p><\/div><div class=\"card\"><h4>OFDM<\/h4><p>تقسيم القناة إلى Subchannels متعددة.<\/p><\/div><\/div><div class=\"keyline\"><strong>2.4 GHz:<\/strong> القنوات 1 و6 و11 هي الاختيار التعليمي الشائع غير المتداخل في المنهج.<\/div><div class=\"grid2\"><div class=\"card\"><h4>Coverage<\/h4><p>المبنى والعوائق وموقع AP وقوة الإرسال.<\/p><\/div><div class=\"card\"><h4>Capacity<\/h4><p>عدد المستخدمين ومعدلات البيانات والقنوات غير المتداخلة.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا تستخدم القنوات 1 و6 و11 تعليميًا في 2.4 GHz؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأنها تمثل في تخطيط المنهج قنوات غير متداخلة تساعد على تقليل التداخل.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">DSSS<\/span><span class=\"term\">FHSS<\/span><span class=\"term\">OFDM<\/span><span class=\"term\">Channels 1/6/11<\/span><\/div>"}, {"id": "u12s8", "number": "08", "toc_title": "تهديدات WLAN", "title": "الهواء وسط مشترك؛ أي جهاز داخل التغطية قد يحاول الاستماع أو التداخل أو الانتحال", "subtitle": "أبرز التهديدات: Interception وIntruders وDoS وRogue AP وEvil Twin.", "body_html": "<div class=\"grid3\"><div class=\"card\"><h4>Interception<\/h4><p>التقاط الحركة إذا كانت الحماية ضعيفة.<\/p><\/div><div class=\"card\"><h4>DoS<\/h4><p>تداخل متعمد أو غير متعمد أو إعدادات خاطئة.<\/p><\/div><div class=\"card\"><h4>Rogue AP<\/h4><p>AP غير مصرح قد يفتح مسارًا للهجوم.<\/p><\/div><\/div><div class=\"keyline\"><strong>Evil Twin:<\/strong> Rogue AP بنفس SSID لشبكة شرعية لجذب العملاء وتنفيذ MITM.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق بين Rogue AP وEvil Twin؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Rogue AP نقطة وصول غير مصرح بها؛ Evil Twin حالة خبيثة تقلد SSID شرعيًا لجذب العملاء.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Rogue AP<\/span><span class=\"term\">Evil Twin<\/span><span class=\"term\">MITM<\/span><span class=\"term\">DoS<\/span><\/div>"}, {"id": "u12s9", "number": "09", "toc_title": "أمان WLAN", "title": "الأمان الحقيقي يعتمد على المصادقة والتشفير لا على إخفاء SSID وحده", "subtitle": "تطور الأمان من WEP إلى WPA ثم WPA2 وWPA3، مع Personal وEnterprise.", "body_html": "<div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">Early Controls<\/div><h4>SSID Cloaking / MAC Filtering<\/h4><p>ليست بديلًا عن مصادقة وتشفير قويين.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">Real Security<\/div><h4>Authentication + Encryption<\/h4><p>الأساس الفعلي لحماية WLAN.<\/p><\/div><\/div><div class=\"flow\"><div class=\"step\"><b>WEP<\/b><span>قديم وغير موصى به.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>WPA<\/b><span>تحسين انتقالي باستخدام TKIP.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>WPA2<\/b><span>AES/CCMP.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>WPA3<\/b><span>الجيل الأحدث مثل SAE وPMF.<\/span><\/div><\/div><div class=\"compare\"><div class=\"compare-box\"><div class=\"micro\">Personal<\/div><h4>PSK<\/h4><p>لا يحتاج خادم مصادقة.<\/p><\/div><div class=\"compare-box\"><div class=\"micro\">Enterprise<\/div><h4>RADIUS + 802.1X/EAP<\/h4><p>مصادقة مركزية وهوية فردية.<\/p><\/div><\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق الأساسي بين Personal وEnterprise في المصادقة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Personal يعتمد PSK مشتركًا، بينما Enterprise يستخدم مصادقة مركزية مثل RADIUS مع 802.1X/EAP.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">WEP<\/span><span class=\"term\">WPA<\/span><span class=\"term\">WPA2<\/span><span class=\"term\">WPA3<\/span><span class=\"term\">PSK<\/span><span class=\"term\">RADIUS<\/span><\/div>"}]}, {"schema_version": 1, "module_number": 13, "group_id": "07_WLAN", "title": "الوحدة 13 — WLAN Configuration (تكوين الشبكات المحلية اللاسلكية)", "title_en": "WLAN Configuration", "badge": "WLAN Config", "summary": "كيف تُنفذ WLAN على مستوى المفهوم: إعداد Wireless Router للموقع البعيد، SSID والقناة والأمان، فهم Mesh وNAT وQoS وPort Forwarding، ثم إدارة عدة APs مركزيًا عبر WLC، إنشاء WLAN وربطها بواجهة VLAN، واستخدام RADIUS وWPA2-Enterprise، ثم اتباع منهجية منظمة لاستكشاف أخطاء WLAN وتحسين الأداء.", "official_objective": "تنفيذ WLAN باستخدام Wireless Router وWLC، مع تكوين WLAN لموقع بعيد، وتكوين Basic WLAN على WLC باستخدام WPA2-PSK، وتكوين WPA2 Enterprise WLAN باستخدام VLAN وDHCP وRADIUS، واستكشاف مشاكل WLAN.", "lecture": {"duration": "≈ 90 دقيقة", "steps": [{"time": "10 د", "topic": "Wireless Router للموقع البعيد وتغيير الإعدادات الافتراضية."}, {"time": "10 د", "topic": "Basic Wireless Setup: Mode وSSID وChannel وSecurity وPassphrase."}, {"time": "10 د", "topic": "Mesh وNAT وQoS وPort Forwarding."}, {"time": "12 د", "topic": "WLC وLightweight AP وبنية WLAN مركزية."}, {"time": "12 د", "topic": "Basic WLAN على WLC."}, {"time": "16 د", "topic": "WPA2 Enterprise: VLAN Interface + DHCP + RADIUS + 802.1X."}, {"time": "10 د", "topic": "منهجية Troubleshooting ذات الخطوات الست."}, {"time": "10 د", "topic": "مشاكل الاتصال والبطء والتغطية والتداخل والFirmware."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/wlan_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة الداتا مع المحاور الرسمية الأربعة للوحدة.", "تم تحويل تسلسل GUI الطويل إلى منطق تكوين قابل للتعليم دون نسخ لقطات الشاشة أو خطوات Packet Tracer.", "تم تصحيح Name Address Translation إلى Network Address Translation (NAT).", "تم الحفاظ على AAA = Authentication, Authorization, Accounting وعدم نقل صياغة الملخص الخاطئة التي تستبدل Authorization بـAuditing.", "تم ربط WLAN بواجهة VLAN وبخادم DHCP وRADIUS بصورة مفاهيمية.", "لم تُكرر خطوات Packet Tracer أوLab.", "جولة المراجعة المتقاطعة: أضيف Quiz لكل قسم، وقُيد تعريف Mesh بسياق SRWE، وأضيف الربط WLAN/SSID → Interface → VLAN → DHCP → RADIUS."], "cross_review_corrections_applied": true}, "sections": [{"id": "u13s1", "number": "01", "toc_title": "Wireless Router", "title": "Wireless Router في الموقع البعيد يجمع عدة وظائف في جهاز واحد", "subtitle": "Switch وAP وRouter وDHCP وNAT ووظائف أمان في منصة واحدة.", "body_html": "<p class=\"core\">في المنزل والمكتب الصغير والموقع البعيد يُستخدم غالبًا <strong>Wireless Router<\/strong> متكامل يجمع منافذ سلكية وWAN وAP وDHCP وNAT وQoS.<\/p><div class=\"keyline\"><strong>أول إجراء أمني:<\/strong> غيّر بيانات الدخول الافتراضية فورًا.<\/div><div class=\"flow\"><div class=\"step\"><b>Login<\/b><span>الدخول إلى GUI.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Change Credentials<\/b><span>استبدال الافتراضي.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>LAN/DHCP<\/b><span>تعديل شبكة LAN ونطاق DHCP.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Renew<\/b><span>تجديد عنوان العميل.<\/span><\/div><\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما أول إجراء أمني بعد الدخول إلى Wireless Router جديد؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تغيير بيانات الإدارة الافتراضية.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Wireless Router<\/span><span class=\"term\">WAN<\/span><span class=\"term\">DHCP<\/span><span class=\"term\">NAT<\/span><\/div>"}, {"id": "u13s2", "number": "02", "toc_title": "Basic Wireless Setup", "title": "أي WLAN أساسية تحتاج خمسة قرارات واضحة", "subtitle": "Mode وSSID وChannel وSecurity Mode وPassphrase.", "body_html": "<div class=\"flow\"><div class=\"step\"><b>Network Mode<\/b><span>معيار 802.11.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>SSID<\/b><span>اسم الشبكة.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Channel<\/b><span>تقليل التداخل.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Security Mode<\/b><span>Open/WPA/WPA2/WPA3.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Passphrase<\/b><span>المفتاح المطلوب.<\/span><\/div><\/div><div class=\"keyline\"><strong>التصميم قبل التكوين:<\/strong> القناة والأمان يؤثران مباشرةً على الجودة والأمان.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي قرارين يؤثران مباشرة في جودة الاتصال وأمانه؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">اختيار Channel مناسب وSecurity Mode مناسب.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">SSID<\/span><span class=\"term\">Channel<\/span><span class=\"term\">Security Mode<\/span><span class=\"term\">Passphrase<\/span><\/div>"}, {"id": "u13s3", "number": "03", "toc_title": "Mesh وNAT وQoS", "title": "الموجّه اللاسلكي قد يقدم خدمات إضافية تتجاوز Wi‑Fi نفسها", "subtitle": "Mesh للتغطية، NAT للإنترنت، QoS للأولوية، وPort Forwarding لاتصالات واردة محددة.", "body_html": "<div class=\"grid4\"><div class=\"card\"><h4>Wireless Mesh<\/h4><p>في سيناريو SRWE للموقع الصغير، يُقدَّم تمديد التغطية بإضافة APs بإعدادات متناسقة وقنوات مختلفة لتقليل التداخل. هذه صورة تعليمية مبسطة وليست تعريفًا عامًا لكل تقنيات Mesh.<\/p><\/div><div class=\"card\"><h4>NAT<\/h4><p>ترجمة العناوين الخاصة إلى عنوان عام.<\/p><\/div><div class=\"card\"><h4>QoS<\/h4><p>أولوية للصوت والفيديو.<\/p><\/div><div class=\"card\"><h4>Port Forwarding<\/h4><p>توجيه حركة واردة محددة إلى جهاز داخلي؛ Port Triggering يفتح مؤقتًا وفق طلب صادر.<\/p><\/div><\/div><div class=\"keyline\"><strong>لا تخلط الوظائف:<\/strong> هذه خدمات في Wireless Router وليست جزءًا من 802.11 نفسها.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل NAT وQoS جزء من معيار 802.11 نفسه؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. هي خدمات قد يقدمها Wireless Router لكنها ليست جزءًا من آلية 802.11.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Wireless Mesh Network<\/span><span class=\"term\">NAT<\/span><span class=\"term\">QoS<\/span><span class=\"term\">Port Forwarding<\/span><\/div>"}, {"id": "u13s4", "number": "04", "toc_title": "WLC وLightweight AP", "title": "WLC يجعل إدارة عدد كبير من APs مركزية بدل تكوين كل AP يدويًا", "subtitle": "Lightweight AP ينضم إلى WLC، والـWLC يدير الشبكات والعملاء والإعدادات.", "body_html": "<p class=\"core\"><strong>WLC<\/strong> محور الإدارة في البيئات ذات عدد كبير من نقاط الوصول.<\/p><div class=\"flow\"><div class=\"step\"><b>WLC<\/b><span>إدارة وسياسات وWLANs.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Controller-Based APs<\/b><span>تُدار مركزيًا.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Clients<\/b><span>يتصلون بالـSSID.<\/span><\/div><\/div><div class=\"keyline\"><strong>التوسع:<\/strong> منفذ WLC يمكنه دعم عدة APs وWLANs، وكل AP قد يخدم عدة WLANs.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الميزة الأساسية لـWLC مقارنة بإدارة APs مستقلة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">الإدارة والسياسات المركزية لعدد كبير من نقاط الوصول.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">WLC<\/span><span class=\"term\">Lightweight AP<\/span><span class=\"term\">Controller-Based AP<\/span><\/div>"}, {"id": "u13s5", "number": "05", "toc_title": "Basic WLAN على WLC", "title": "إنشاء WLAN على WLC هو سلسلة منطقية من سبع خطوات", "subtitle": "Create → Enable → Interface → Security → Verify → Monitor → Clients.", "body_html": "<div class=\"flow\"><div class=\"step\"><b>Create WLAN<\/b><span>Profile/SSID.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Enable<\/b><span>تفعيل WLAN.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Interface<\/b><span>اختيار الواجهة.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Security<\/b><span>تحديد الحماية.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Verify<\/b><span>Operational.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Monitor<\/b><span>مراقبة الشبكة.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>Clients<\/b><span>تفاصيل الأجهزة.<\/span><\/div><\/div><div class=\"keyline\"><strong>العلاقة المفاهيمية:<\/strong> SSID/WLAN → WLC Interface → VLAN → DHCP، ثم تضيف RADIUS/802.1X عندما يكون الأمان Enterprise.<\/div>\n<div class=\"keyline\"><strong>الفكرة:<\/strong> WLAN ليست SSID فقط؛ يجب ربطها بواجهة وأمان ومسار نحو الشبكة السلكية.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا تكفي تسمية SSID وحدها لإنشاء WLAN فعالة على WLC؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن WLAN تحتاج أيضًا ربطًا بواجهة/شبكة سلكية وإعداد أمان والتحقق من التشغيل.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">WLAN Profile<\/span><span class=\"term\">SSID<\/span><span class=\"term\">Interface<\/span><\/div>"}, {"id": "u13s6", "number": "06", "toc_title": "WPA2 Enterprise", "title": "WPA2 Enterprise يربط هوية المستخدم بـRADIUS بدل مفتاح مشترك واحد للجميع", "subtitle": "WLAN → VLAN Interface → DHCP → RADIUS → 802.1X/AES.", "body_html": "<p class=\"core\">في Enterprise WLAN يستخدم WLC خادم <strong>RADIUS<\/strong> للمصادقة المركزية وخدمات AAA، ويجب ربط WLAN بواجهة VLAN وتوفير DHCP ثم تحديد RADIUS.<\/p><div class=\"flow\"><div class=\"step\"><b>Client<\/b><span>بيانات اعتماد المستخدم.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>AP<\/b><span>الوصول اللاسلكي.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>WLC<\/b><span>WLAN/VLAN/Policy.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>RADIUS<\/b><span>التحقق عبر 802.1X.<\/span><\/div><\/div><div class=\"grid3\"><div class=\"card\"><h4>VLAN Interface<\/h4><p>واجهة منطقية لهوية VLAN.<\/p><\/div><div class=\"card\"><h4>DHCP<\/h4><p>عناوين العملاء.<\/p><\/div><div class=\"card\"><h4>RADIUS<\/h4><p>مصادقة مركزية.<\/p><\/div><\/div><div class=\"keyline\"><strong>في مثال Cisco:<\/strong> AES و802.1X هما الإعدادان الافتراضيان عند إنشاء WLAN Enterprise جديدة على WLC.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما دور RADIUS في WPA2 Enterprise؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">المصادقة المركزية للمستخدمين ضمن مسار 802.1X.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">WPA2 Enterprise<\/span><span class=\"term\">RADIUS<\/span><span class=\"term\">802.1X<\/span><span class=\"term\">AES<\/span><span class=\"term\">VLAN Interface<\/span><\/div>"}, {"id": "u13s7", "number": "07", "toc_title": "Troubleshooting Method", "title": "استكشاف الأعطال الناجح عملية منهجية لا تجربة عشوائية", "subtitle": "ست خطوات تبدأ بتحديد المشكلة وتنتهي بالتوثيق.", "body_html": "<div class=\"flow\"><div class=\"step\"><b>1<\/b><span>Identify<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>2<\/b><span>Theory<\/span><\/div><div class=\"arrow\">←<\/div "><strong>Firmware:<\/strong> التحديثات قد تحتوي إصلاحات أعطال وثغرات أمنية.<\/div><div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا كان العميل يرى SSID لكن الأداء ضعيف، ما فئتان تفحصهما قبل تغيير كل الإعدادات؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">التغطية/التداخل والقناة، ثم حالة AP والشبكة السلكية حسب نتيجة العزل.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">BSA<\/span><span class=\"term\">Interference<\/span><span class=\"term\">Dual-Band<\/span><span class=\"term\">Firmware<\/span><\/div>"}]}]</script><script>

function sectionHTML(m,s,part){let doc=new DOMParser().parseFromString(s.body_html,'text/html');doc.querySelectorAll('script').forEach(x=>x.remove());let nodes=[...doc.body.children].filter(x=>x.textContent.trim());let quiz=nodes.find(x=>x.classList.contains('quiz'));nodes=nodes.filter(x=>x!==quiz);let sizes=nodes.map(x=>x.textContent.trim().length),total=sizes.reduce((a,b)=>a+b,0),cut=1,acc=0,best=Infinity;for(let i=0;i<nodes.length-1;i++){acc+=sizes[i];let diff=Math.abs(total-2*acc);if(diff<best){best=diff;cut=i+1}}let selected=nodes.slice(part?cut:0,part?undefined:cut);if(quiz)quiz.querySelectorAll('[onclick]').forEach(x=>x.removeAttribute('onclick'));return '<div class="kicker">الوحدة '+m.module_number+' · القسم '+esc(s.number)+' · '+(part?'٢/٢':'١/٢')+'</div><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.subtitle)+'</p><div class="body lesson">'+selected.map(x=>x.outerHTML).join('')+(part&&quiz?quiz.outerHTML:'')+'</div><span class="scroll-hint">مرّر داخل الشريحة لاستكمال الشرح ↓</span>'}

function accessHTML(){return '<div class="kicker">الوحدة ١٢ · مشهد حركي</div><h2>رحلة العميل: من رؤية SSID إلى استخدام الشبكة</h2><p class="lead">اضغط «الخطوة التالية» واسأل: في أي مرحلة قد يتوقف العميل؟</p><div class="body scene"><div class="scene-controls"><button id="flowPrev">السابق</button><button id="flowPlay">تشغيل ▶</button><button id="flowNext">الخطوة التالية</button><button id="flowReset">إعادة ↺</button></div><div class="scene-flow">'+journey.map((x,i)=>'<span id="flow'+i+'">'+esc(x[0])+'</span>').join('')+'</div><div id="flowStatus" class="scene-status" role="status"></div><p class="source-note">رسم تعليمي يختصر تفاصيل رسائل 802.11 المتغيرة حسب نمط الأمان.</p></div>'}

function paintFlow(){let steps=slides[at].type==='access'?journey:slides[at].type==='csma'?accessSteps:controlSteps;$('flowStatus').innerHTML='<strong>'+(sceneStep+1)+' / '+steps.length+' · '+esc(steps[sceneStep][0])+'</strong><br>'+esc(steps[sceneStep][1]);steps.forEach((_,i)=>$('flow'+i).classList.toggle('active',i===sceneStep));$('flowPrev').disabled=sceneStep===0;$('flowNext').disabled=sceneStep===steps.length-1}
function init(){let s=slides[at];if(s.type==='section')$('stage').querySelectorAll('.quiz .chipbtn').forEach(b=>b.onclick=()=>{let a=b.closest('.quiz').querySelector('.answer');a.classList.toggle('open');b.textContent=a.classList.contains('open')?'إخفاء الإجابة':'اعرض الإجابة'});if(s.type==='access'||s.type==='csma'||s.type==='controller'){sceneStep=0;let steps=s.type==='access'?journey:s.type==='csma'?accessSteps:controlSteps,change=d=>{stop();sceneStep=Math.max(0,Math.min(steps.length-1,sceneStep+d));paintFlow()};$('flowPrev').onclick=()=>change(-1);$('flowNext').onclick=()=>change(1);$('flowReset').onclick=()=>{stop();sceneStep=0;paintFlow()};$('flowPlay').onclick=()=>{if(timer){stop();$('flowPlay').textContent='تشغيل ▶';return}if(sceneStep===steps.length-1)sceneStep=0;paintFlow();$('flowPlay').textContent='إيقاف مؤقت ❚❚';timer=setInterval(()=>{if(sceneStep===steps.length-1){stop();$('flowPlay').textContent='تشغيل ▶';return}sceneStep++;paintFlow()},3000)};paintFlow()}if(s.type==='channel')$('stage').querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{let plan=b.dataset.plan;channels[plan].forEach((v,i)=>$('ch'+i).textContent=v);$('channelStatus').textContent=plan==='same'?'القناة نفسها: تتشارك نقاط الوصول المتجاورة زمن الإرسال؛ راقب الحمل والتداخل في القياس الميداني.':'خطة 1، 6، 11 تفصل القنوات المتجاورة في المثال ذي 20 MHz وتوزع نقاط الوصول المتجاورة على قنوات غير متداخلة، فتخفف تنافسها على القناة نفسها في هذا المثال؛ يبقى المسح الميداني ضروريًا.';$('stage').querySelectorAll('.device').forEach((x,i)=>x.classList.toggle('active',plan==='planned'))});if(s.type==='diagnose'){$('symptom').onchange=()=>$('diagnoseStatus').textContent='حدّد مرحلة التعطل أولًا، ثم تحقق من دليل واحد في كل خطوة.';$('reveal').onclick=()=>{let x=symptoms[+$('symptom').value];$('diagnoseStatus').innerHTML='<strong>'+esc(x[0])+'</strong><br>'+esc(x[1])}}}
function render(){stop();let s=slides[at],body='';if(s.type==='cover')body='<div class="kicker">الوحدتان ١٢–١٣ · عرض حركي تفاعلي</div><h1>WLAN: من الموجة إلى الاتصال الآمن</h1><p class="lead">'+esc(modules[0].summary)+'</p><div class="body grid"><div class="card"><b>١٢ · مفاهيم WLAN</b><p>'+esc(modules[0].official_objective)+'</p></div><div class="card"><b>١٣ · تكوين WLAN</b><p>'+esc(modules[1].official_objective)+'</p></div></div>';else if(s.type==='agenda')body='<div class="kicker">الوحدة '+s.m.module_number+' · '+esc(s.m.lecture.duration)+'</div><h2>'+esc(s.m.title)+'</h2><div class="body grid">'+s.m.lecture.steps.map(x=>'<div class="card"><b>'+esc(x.time)+'</b><p>'+esc(x.topic)+'</p></div>').join('')+'</div>';else if(s.type==='section')body=sectionHTML(s.m,s.section,s.part);else if(s.type==='access')body=accessHTML();else if(s.type==='csma')body=csmaHTML();else if(s.type==='channel')body=channelHTML();else if(s.type==='controller')body=controllerHTML();else if(s.type==='diagnose')body=diagnoseHTML();else body='<div class="kicker">خلاصة المحاضرة</div><h2>من الإشارة إلى الخدمة</h2><div class="body grid">'+symptoms.map(a=>'<div class="card"><b>'+esc(a[0])+'</b><p>'+esc(a[1])+'</p></div>').join('')+'</div>';
$('stage').innerHTML='<article class="slide '+(large?'large':'')+'">'+body+'<footer class="foot"><span>WLAN · CCNA 2</span><span>'+(at+1)+' / '+slides.length+'</span></footer></article>';$('count').textContent=(at+1)+' / '+slides.length;$('progress').style.width=(at+1)/slides.length*100+'%';$('prev').disabled=at===0;$('next').disabled=at===slides.length-1;$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';init();history.replaceState(null,'','#slide-'+(at+1))}
function go(i){if(i<0||i>=slides.length)return;at=i;render()}$('prev').onclick=()=>go(at-1);$('next').onclick=()=>go(at+1);$('markBtn').onclick=()=>{marks.has(at)?marks.delete(at):marks.add(at);try{localStorage.setItem('wlan_marks',JSON.stringify([...marks]))}catch{}$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';let b=$('menuList').querySelector('[data-slide="'+at+'"]');if(b)b.textContent=(at+1)+' · '+slides[at].title+(marks.has(at)?' ★':'')};$('notesBtn').onclick=()=>{large=!large;$('stage').querySelector('.slide').classList.toggle('large',large);$('notesBtn').classList.toggle('active',large);$('notesBtn').setAttribute('aria-pressed',String(large))};$('themeBtn').onclick=()=>{let day=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=day?'light':'dark';$('themeBtn').innerHTML=day?'☾ <span>ليلي</span>':'☀ <span>نهاري</span>';$('themeBtn').setAttribute('aria-pressed',String(day));$('themeBtn').setAttribute('aria-label',day?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري')};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('menuBtn').onclick=()=>{$('menu').classList.add('open');$('closeMenu').focus()};$('closeMenu').onclick=()=>{$('menu').classList.remove('open');$('menuBtn').focus()};$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('menuList').innerHTML=slides.map((s,i)=>'<button data-slide="'+i+'">'+(i+1)+' · '+esc(s.title)+'</button>').join('');$('menuList').onclick=e=>{let b=e.target.closest('[data-slide]');if(b){$('menu').classList.remove('open');$('menuBtn').focus();go(+b.dataset.slide)}};document.addEventListener('keydown',e=>{if($('menu').classList.contains('open')){if(e.key==='Escape'){$('menu').classList.remove('open');$('menuBtn').focus()}return}if(e.target.closest('button,input,select,textarea,summary'))return;if(['ArrowLeft','PageDown'].includes(e.key))go(at+1);if(['ArrowRight','PageUp'].includes(e.key))go(at-1)});let sx=0,sy=0;$('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select,summary,details,input,textarea,pre,.cmd,.table-scroll'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>1.5*Math.abs(dy))go(at+(dx<0?-1:1))},{passive:true});let m=location.hash.match(/^#slide-(\d+)$/);if(m)at=Math.max(0,Math.min(slides.length-1,+m[1]-1));render()})();
</script></body></html>
