<script type="application/json" id="data">{"schema_version": 1, "module_number": 6, "group_id": "03_Redundancy_LinkAggregation", "title": "الوحدة 6 — EtherChannel", "title_en": "EtherChannel", "badge": "EtherChannel", "summary": "كيف يجمع EtherChannel عدة روابط Ethernet فعلية في رابط منطقي واحد لزيادة عرض النطاق والتكرار، وكيف يتعامل معه STP، وما متطلبات تكوينه، والفرق بين PAgP وLACP، ثم كيفية تكوين LACP والتحقق من Port Channel وتشخيص أخطاء القناة.", "official_objective": "استكشاف أخطاء EtherChannel على الروابط المحوّلة، مع وصف تقنية EtherChannel وتكوينها والتحقق منها.", "lecture": {"duration": "≈ 85 دقيقة", "steps": [{"time": "15 د", "topic": "لماذا Link Aggregation؟ فكرة EtherChannel وفوائده وعلاقته بـSTP."}, {"time": "15 د", "topic": "قيود التكوين وتطابق خصائص المنافذ ودور Port Channel."}, {"time": "15 د", "topic": "PAgP: آلية العمل والأوضاع On/Desirable/Auto."}, {"time": "15 د", "topic": "LACP: Active/Passive والمقارنة مع PAgP وتوافق الأوضاع."}, {"time": "15 د", "topic": "تكوين EtherChannel باستخدام LACP وتطبيق إعدادات Trunk على Port Channel."}, {"time": "10 د", "topic": "أوامر التحقق ومسار تشخيص الأخطاء + مراجعة."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/etherchannel_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة الداتا مع المحاور الرسمية الثلاثة: EtherChannel Operation، Configure EtherChannel، وVerify and Troubleshoot EtherChannel.", "تم تضمين الفوائد والقيود، Port Channel، PAgP وLACP ومصفوفات التوافق، إرشادات التكوين، مثال LACP، أوامر التحقق، وأخطاء التكوين الشائعة ومسار التشخيص.", "يوجد في Speaker Notes للصفحة الأولى وصف Module 6 بأنه Basic Device Configuration رغم أن العنوان والمحتوى والأهداف كلها EtherChannel؛ اعتبرته اللجنة خطأً شكليًا في العرض ولم تنقله للداتا.", "هناك عبارتان في العرض تحتاجان قراءة سياقية: قسم القيود يركز على EtherChannel Layer 2 في Catalyst 2960، بينما قسم الإرشادات يذكر أن Port Channel عمومًا يمكن أن يكون Access أو Trunk أو Routed Port؛ عُرضتا بوضوح دون دمجهما كقاعدة واحدة.", "أنشطة Packet Tracer والمختبر لم تُكرر لأنها تنتمي للمسار العملي.", "لم يتم تعديل التصميم أو JavaScript أو CSS؛ الإضافة بيانات فقط.", "جولة المراجعة المتقاطعة: قُيدت أرقام المنصة بسياق Catalyst 2960، وصيغت 802.3ad كسياق منهجي، ووُضح الفرق بين EtherChannel وPort Channel."], "cross_review_corrections_applied": true}, "sections": [{"id": "u6s1", "number": "01", "toc_title": "فكرة EtherChannel وفوائده", "title": "عدة وصلات فعلية… رابط منطقي واحد", "subtitle": "EtherChannel يحل مشكلة زيادة عرض النطاق والتكرار دون أن يتعامل STP مع كل وصلة كمسار مستقل.", "body_html": "<p class=\"core\">إذا وصلنا عدة روابط Ethernet مستقلة بين جهازين، فإن <strong>STP<\/strong> قد يحجب الروابط الزائدة لمنع الحلقة. <strong>EtherChannel (تجميع روابط Ethernet منطقيًا)<\/strong> يجمع عدة وصلات فعلية في <strong>Link Aggregation<\/strong> واحد، فيراه STP كرابط منطقي واحد.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>زيادة عرض النطاق<\/h4><p>تعمل عدة روابط فعلية ضمن قناة واحدة بدل الاعتماد على وصلة واحدة فقط.<\/p><\/div>\n  <div class=\"card\"><h4>Load Sharing<\/h4><p>يمكن توزيع الحركة بين الروابط الأعضاء في EtherChannel.<\/p><\/div>\n  <div class=\"card\"><h4>Fault Tolerance<\/h4><p>فشل وصلة عضو لا يعني سقوط القناة كلها، ولا يغيّر طوبولوجيا STP ما دامت القناة المنطقية قائمة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>EtherChannel = التقنية/التجميع، وPort Channel = الواجهة المنطقية الناتجة.<\/strong><\/div>\n<div class=\"keyline\"><strong>Port Channel:<\/strong> بعد تكوين EtherChannel تظهر واجهة منطقية اسمها Port Channel، وتُجمع الواجهات الفيزيائية داخلها.<\/div>\n<details class=\"expand study-detail\"><summary>كيف يراه STP؟<\/summary><div class=\"expand-body\">إذا كان بين المحوّلين EtherChannel واحد، تكون كل الروابط الفيزيائية داخله فعالة لأن STP يرى رابطًا منطقيًا واحدًا. وإذا وُجد أكثر من EtherChannel مكرر بين الجهازين فقد يحجب STP قناة كاملة لمنع الحلقة، وليس رابطًا عضوًا منفردًا داخل القناة.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا نكتفي بوصل كابلين مستقلين بين محوّلين لزيادة السرعة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن STP سيعامل الرابط الثاني كمسار مكرر وقد يحجبه. EtherChannel يجمع الروابط ويقدمها كرابط منطقي واحد.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">EtherChannel<\/span><span class=\"term\">Link Aggregation<\/span><span class=\"term\">Port Channel<\/span><span class=\"term\">Load Sharing<\/span><\/div>"}, {"id": "u6s2", "number": "02", "toc_title": "القيود وتطابق المنافذ", "title": "EtherChannel لا يجمع أي منافذ عشوائيًا", "subtitle": "أعضاء القناة يجب أن يكونوا متوافقين؛ أي اختلاف مهم قد يمنع تكوين القناة أو يسبب مشكلة تشغيلية.", "body_html": "<div class=\"grid2\">\n  <div class=\"card\"><h4>نوع الواجهة<\/h4><p>لا يخلط العرض Fast Ethernet وGigabit Ethernet داخل EtherChannel واحد.<\/p><\/div>\n  <div class=\"card\"><h4>Speed وDuplex<\/h4><p>يجب أن تعمل الواجهات الأعضاء بالسرعة نفسها وبوضع Duplex نفسه.<\/p><\/div>\n  <div class=\"card\"><h4>VLAN / Trunk<\/h4><p>يجب أن تتطابق Access VLAN، أو تكون المنافذ Trunk مع Native VLAN وAllowed VLANs متطابقة.<\/p><\/div>\n  <div class=\"card\"><h4>Port Channel Configuration<\/h4><p>الإعدادات المطبقة على واجهة Port Channel تنتقل إلى الواجهات الفيزيائية الأعضاء، ولذلك يفضل تعديل خصائص القناة من واجهتها المنطقية.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>أرقام مرتبطة بمنصة العرض:<\/strong> يذكر Instructor Materials في سياق Catalyst 2960 أن EtherChannel الواحد قد يضم حتى 8 منافذ Ethernet متوافقة، وأن الجهاز يدعم حتى 6 EtherChannels. لا تُعمم هذه الأرقام على كل المنصات.<\/div>\n<details class=\"expand study-detail\"><summary>ملاحظة سياقية حول Layer 2 وRouted Port<\/summary><div class=\"expand-body\">في قسم قيود التنفيذ الخاص بسياق Catalyst 2960 يذكر العرض أن أعضاء EtherChannel تكون Layer 2. وفي قسم إرشادات التكوين يوضح بصورة عامة أن Port Channel يمكن أن يكون Access أو Trunk، أو يُستخدم على Routed Port في أجهزة تدعم ذلك. أبقينا النقطتين منفصلتين كما وردتا بدل تحويلهما إلى قاعدة موحدة.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل يمكن أن يكون أحد أعضاء Trunk يسمح VLANs 10,20 والعضو الآخر يسمح 10,30؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. Allowed VLAN range يجب أن يتطابق على أعضاء EtherChannel المكوّن كـTrunk.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Port Channel<\/span><span class=\"term\">Native VLAN<\/span><span class=\"term\">Allowed VLANs<\/span><span class=\"term\">Speed / Duplex<\/span><\/div>"}, {"id": "u6s3", "number": "03", "toc_title": "PAgP", "title": "PAgP: تفاوض EtherChannel الخاص بـCisco", "subtitle": "يتحقق من توافق الروابط ويساعد على تكوين القناة وإدارتها تلقائيًا.", "body_html": "<p class=\"core\"><strong>Port Aggregation Protocol (PAgP)<\/strong> بروتوكول مملوك لـCisco يساعد على إنشاء EtherChannel تلقائيًا. تتبادل المنافذ رسائل PAgP للتحقق من التوافق، ويذكر العرض أن رسائل PAgP تُرسل كل 30 ثانية عند تمكينه.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>desirable<\/h4><p>وضع نشط يبدأ التفاوض ويرسل رسائل PAgP.<\/p><\/div>\n  <div class=\"card\"><h4>auto<\/h4><p>وضع سلبي يستجيب لـPAgP لكنه لا يبدأ التفاوض.<\/p><\/div>\n  <div class=\"card\"><h4>on<\/h4><p>يفرض القناة دون PAgP أو أي تفاوض؛ يجب أن يكون الطرف الآخر on أيضًا.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><h4>تكوين ينجح<\/h4><p>desirable + desirable، أو desirable + auto، أو on + on.<\/p><\/div>\n  <div class=\"compare-box\"><h4>تكوين لا ينجح<\/h4><p>auto + auto لا يبدأ التفاوض، وon لا يتوافق مع desirable/auto لأن طرف on لا يفاوض.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>فائدة التفاوض:<\/strong> PAgP يتحقق من اتساق خصائص المنافذ ويدير إضافة الروابط وفشلها. الوضع on يفقد ميزة التحقق التفاوضي.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا تتكون قناة PAgP إذا كان الطرفان auto؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن الطرفين في وضع سلبي؛ كلاهما ينتظر أن يبدأ الطرف الآخر التفاوض.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">PAgP<\/span><span class=\"term\">desirable<\/span><span class=\"term\">auto<\/span><span class=\"term\">on<\/span><\/div>"}, {"id": "u6s4", "number": "04", "toc_title": "LACP", "title": "LACP: المعيار المفتوح لتجميع الروابط", "subtitle": "يؤدي وظيفة مشابهة لـPAgP لكنه معيار IEEE ويمكن استخدامه في بيئات متعددة الشركات.", "body_html": "<p class=\"core\"><strong>Link Aggregation Control Protocol (LACP)<\/strong> يُقدَّم في SRWE ضمن مرجع IEEE 802.3ad المستخدم في المنهج، ويكوّن قناة من عدة منافذ فعلية عبر التفاوض. على أجهزة Cisco يمكن استخدام LACP أو PAgP.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>active<\/h4><p>وضع نشط يبدأ تفاوض LACP بإرسال رسائل للطرف المقابل.<\/p><\/div>\n  <div class=\"card\"><h4>passive<\/h4><p>وضع سلبي يستجيب لرسائل LACP ولا يبدأ التفاوض.<\/p><\/div>\n  <div class=\"card\"><h4>on<\/h4><p>قناة ثابتة بلا LACP؛ لا تتبادل الواجهات رسائل تفاوض.<\/p><\/div>\n<\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">PAgP<\/div><h4>Cisco Proprietary<\/h4><p>الأوضاع التفاوضية: desirable وauto.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">LACP<\/div><h4>معيار مفتوح متعدد الشركات<\/h4><p>الأوضاع التفاوضية: active وpassive، ومناسب لبيئات متعددة الشركات.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>توافق LACP:<\/strong> active + active ينجح، active + passive ينجح، passive + passive لا ينجح. وon يعمل فقط مع on.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أيهما تختار غالبًا عند الحاجة إلى معيار متعدد الشركات: PAgP أم LACP؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">LACP لأنه معيار IEEE وليس بروتوكولًا خاصًا بـCisco.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">LACP<\/span><span class=\"term\">active<\/span><span class=\"term\">passive<\/span><span class=\"term\">IEEE 802.3ad<\/span><\/div>"}, {"id": "u6s5", "number": "05", "toc_title": "تكوين EtherChannel", "title": "تكوين LACP في ثلاث خطوات", "subtitle": "حدد أعضاء القناة، أنشئ Channel Group، ثم طبّق خصائص Layer 2 على واجهة Port Channel.", "body_html": "<p class=\"core\">مثال المنهج يستخدم <strong>LACP active<\/strong>. الترتيب الأساسي بسيط: تحديد مجموعة الواجهات، إنشاء Channel Group، ثم الدخول إلى واجهة Port Channel لتطبيق إعدادات القناة.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · interface range<\/b><span>حدد كل الواجهات الفيزيائية التي ستنضم إلى EtherChannel.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · channel-group<\/b><span>أنشئ المجموعة وحدد mode active لاستخدام LACP.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · interface port-channel<\/b><span>اضبط Trunk أو Access وAllowed VLANs من الواجهة المنطقية.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية خطوات التكوين<\/div>\n<pre class=\"cmd study-detail\">S1(config)# interface range FastEthernet 0/1 - 2\nS1(config-if-range)# channel-group 1 mode active\nS1(config-if-range)# exit\nS1(config)# interface port-channel 1\nS1(config-if)# switchport mode trunk\nS1(config-if)# switchport trunk allowed vlan 1,2,20<\/pre>\n<div class=\"keyline\"><strong>قاعدة مهمة:<\/strong> إذا احتجت تغيير خصائص القناة بعد إنشائها، فطبّق التغيير على Port Channel. تعديل عضو فيزيائي منفرد قد يسبب عدم توافق بين أعضاء القناة.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أين نضبط Trunk بعد تكوين Port Channel؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">على واجهة Port Channel نفسها، حتى يبقى الإعداد متسقًا على الأعضاء.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">interface range<\/span><span class=\"term\">channel-group<\/span><span class=\"term\">mode active<\/span><span class=\"term\">interface port-channel<\/span><\/div>"}, {"id": "u6s6", "number": "06", "toc_title": "التحقق من EtherChannel", "title": "لا يكفي أن تُنشئ القناة؛ تحقق من حالتها وأعضائها", "subtitle": "أوامر show تكشف حالة Port Channel، البروتوكول، ودور كل واجهة عضو.", "body_html": "<div class=\"grid2\">\n  <div class=\"card\"><h4>show interfaces port-channel<\/h4><p>يعرض الحالة العامة لواجهة Port Channel.<\/p><\/div>\n  <div class=\"card\"><h4>show etherchannel summary<\/h4><p>ملخص سطر واحد لكل Port Channel، وهو أسرع أمر لرؤية القناة وأعضائها.<\/p><\/div>\n  <div class=\"card\"><h4>show etherchannel port-channel<\/h4><p>يعرض معلومات أكثر عن Port Channel محدد.<\/p><\/div>\n  <div class=\"card\"><h4>show interfaces etherchannel<\/h4><p>يساعد في معرفة دور واجهة فيزيائية عضو داخل EtherChannel.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>اقرأ الرموز:<\/strong> في مثال العرض تظهر القناة الناجحة كـPo1(SU) وتظهر الواجهات الأعضاء بالرمز (P). وفي المثال المعطل ظهرت Po1(SD) والواجهات (D)، ما يشير إلى أن القناة ليست في الاستخدام.<\/div>\n<details class=\"expand study-detail\"><summary>أهم الرموز الظاهرة في show etherchannel summary<\/summary><div class=\"expand-body\"><ul><li><strong>S<\/strong> = Layer 2، <strong>R<\/strong> = Layer 3.<\/li><li><strong>U<\/strong> = in use، <strong>D<\/strong> = down.<\/li><li><strong>P<\/strong> = bundled in port-channel.<\/li><li><strong>I<\/strong> = stand-alone، <strong>s<\/strong> = suspended.<\/li><li><strong>H<\/strong> = Hot-standby (LACP only).<\/li><\/ul>المطلوب تعليميًا هو ربط الرمز بحالة القناة بدل حفظ جميع الرموز دون سياق.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي أمر تبدأ به غالبًا للحصول على ملخص سريع عن كل EtherChannel؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">show etherchannel summary<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">show etherchannel summary<\/span><span class=\"term\">Port Channel<\/span><span class=\"term\">P = bundled<\/span><span class=\"term\">U = in use<\/span><\/div>"}, {"id": "u6s7", "number": "07", "toc_title": "الأخطاء الشائعة", "title": "إذا لم تتكون القناة، ابحث أولًا عن عدم التطابق", "subtitle": "معظم أخطاء EtherChannel تأتي من خصائص مختلفة بين الأعضاء أو من أوضاع تفاوض غير متوافقة.", "body_html": "<div class=\"grid2\">\n  <div class=\"card\"><h4>VLAN غير متطابقة<\/h4><p>منافذ Access في VLANs مختلفة، أو Native VLAN مختلفة على Trunk، تمنع التكوين الصحيح.<\/p><\/div>\n  <div class=\"card\"><h4>Trunk غير متسق<\/h4><p>بعض الأعضاء Trunk والبعض ليس كذلك، أو Allowed VLANs مختلفة بين الأعضاء.<\/p><\/div>\n  <div class=\"card\"><h4>Speed / Duplex مختلف<\/h4><p>خصائص الواجهات الفيزيائية يجب أن تكون متوافقة داخل المجموعة.<\/p><\/div>\n  <div class=\"card\"><h4>أوضاع تفاوض غير متوافقة<\/h4><p>مثل auto + auto في PAgP أو passive + passive في LACP، أو استخدام on مقابل وضع تفاوضي.<\/p><\/div>\n<\/div>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Summary<\/b><span>ابدأ بـshow etherchannel summary وحدد هل القناة Down أم Up.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Configuration<\/b><span>راجع Port Channel والأعضاء بـshow running-config وتحقق من Mode وVLANs.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Correct<\/b><span>صحح عدم التوافق مع مراعاة ترتيب أوامر EtherChannel وSTP.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · Verify<\/b><span>أعد show etherchannel summary وتأكد من SU وP في المثال.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية مسار التشخيص<\/div>\n<div class=\"keyline\"><strong>مثال العرض:<\/strong> كان S1 مضبوطًا mode on وS2 على desirable؛ لم تتكون PAgP. بعد تصحيح الوضع وإعادة بناء Port Channel ظهرت القناة نشطة. وينبه العرض إلى أن EtherChannel وSTP مترابطان، لذلك ترتيب أوامر التصحيح مهم لتجنب blocking أو errdisabled.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: القناة لا تعمل والطرفان LACP passive؛ ما أول تصحيح منطقي؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">اجعل أحد الطرفين على الأقل active حتى يبدأ تفاوض LACP.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Troubleshooting<\/span><span class=\"term\">Allowed VLANs<\/span><span class=\"term\">Native VLAN<\/span><span class=\"term\">errdisabled<\/span><\/div>"}, {"id": "u6s8", "number": "08", "toc_title": "الخلاصة", "title": "EtherChannel = اتساق + تفاوض صحيح + تحقق", "subtitle": "المفهوم سهل عندما تربط بين القناة المنطقية ومتطلبات الأعضاء وطريقة التفاوض.", "body_html": "<div class=\"summary-box\"><h4>ما الذي يجب أن يبقى في ذهنك؟<\/h4><div class=\"summary-list\">\n  <div class=\"summary-item\">EtherChannel يجمع عدة روابط Ethernet فعلية في رابط منطقي واحد.<\/div>\n  <div class=\"summary-item\">STP يرى Port Channel كرابط واحد بدل معالجة كل عضو كمسار مكرر مستقل.<\/div>\n  <div class=\"summary-item\">الأعضاء يجب أن تتطابق في Speed وDuplex وVLAN/Trunk وAllowed/Native VLANs.<\/div>\n  <div class=\"summary-item\">PAgP خاص بـCisco: desirable/auto؛ وLACP معيار IEEE: active/passive.<\/div>\n  <div class=\"summary-item\">on لا يفاوض ويحتاج on على الطرف الآخر.<\/div>\n  <div class=\"summary-item\">طبّق تغييرات القناة على interface port-channel، ثم تحقق بـshow etherchannel summary.<\/div>\n  <div class=\"summary-item\">عند الفشل ابدأ بعدم التطابق في الإعدادات وأوضاع التفاوض قبل البحث عن أسباب أعقد.<\/div>\n<\/div><\/div>\n<div class=\"compare\">\n  <div class=\"compare-box\"><h4>PAgP<\/h4><p><strong>desirable + auto<\/strong> يعمل.<br><strong>auto + auto<\/strong> لا يعمل.<\/p><\/div>\n  <div class=\"compare-box\"><h4>LACP<\/h4><p><strong>active + passive<\/strong> يعمل.<br><strong>passive + passive<\/strong> لا يعمل.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: ما العلامة التي تبحث عنها في show etherchannel summary لتعرف أن الأعضاء انضموا فعليًا إلى القناة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">في مثال المنهج تظهر الواجهات الأعضاء بالرمز P (bundled in port-channel)، وتظهر القناة في الاستخدام بالرمز U.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">EtherChannel<\/span><span class=\"term\">PAgP<\/span><span class=\"term\">LACP<\/span><span class=\"term\">Port Channel<\/span><\/div>"}]}</script><script>
(()=>{'use strict';const d=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const checks={u6s1:{choices:['كل رابط مستقل يحجبه STP دائمًا','Port Channel رابط منطقي واحد لدى STP','يلغي EtherChannel عمل STP'],correct:1},u6s2:{choices:['يكفي أن يكون عدد المنافذ متساويًا','يجب توافق السرعة وDuplex وخصائص VLAN/Trunk','يمكن خلط FastEthernet وGigabit بحرية'],correct:1},u6s3:{choices:['كلا الطرفين ينتظر بدء التفاوض','on يمنع القناة في الطرفين','PAgP لا يدعم auto'],correct:0},u6s4:{choices:['PAgP','LACP','on فقط'],correct:1},u6s5:{choices:['interface port-channel','منفذ عضو واحد فقط','واجهة VLAN'],correct:0},u6s6:{choices:['show etherchannel summary','show ip route','show arp'],correct:0},u6s7:{choices:['أبدأ بفحص mode وخصائص الأعضاء','أعيد تشغيل جميع الأجهزة أولًا','أحذف VLANs'],correct:0},u6s8:{choices:['الرمز P لدى الأعضاء','الرمز D لدى الأعضاء','الرمز I لدى الأعضاء'],correct:0}};
const sections=xs=>xs.flatMap(section=>[0,1].map(part=>({type:'section',section,part,title:section.title+(part?' · متابعة':'')})));
const slides=[{type:'cover',title:'EtherChannel: من الروابط إلى القناة'},{type:'agenda',title:'مسار المحاضرة'},...sections(d.sections.slice(0,2)),{type:'scene',title:'شاهد الرابط المنطقي يعمل'},...sections(d.sections.slice(2,4)),{type:'negotiation',title:'اختبر توافق أوضاع التفاوض'},...sections(d.sections.slice(4,7)),{type:'diagnosis',title:'شخّص قناة متوقفة'},...sections(d.sections.slice(7)),{type:'summary',title:'خلاصة وتحقق'}];
let at=0,large=false,sceneStep=0,sceneTimer=null;const markKey='etherchannel_pres_marks',marks=new Set((()=>{try{return JSON.parse(localStorage.getItem(markKey)||'[]')}catch{return []}})());
function sectionHTML(s,part){let doc=new DOMParser().parseFromString(s.body_html,'text/html');doc.querySelectorAll('.quiz,script').forEach(x=>x.remove());doc.querySelectorAll('[onclick]').forEach(x=>x.removeAttribute('onclick'));let nodes=[...doc.body.children].filter(x=>x.textContent.trim()),sizes=nodes.map(x=>x.textContent.trim().length),sum=sizes.reduce((a,b)=>a+b,0),acc=0,cut=1,best=Infinity;for(let i=0;i<nodes.length-1;i++){acc+=sizes[i];let diff=Math.abs(sum-2*acc);if(diff<best){best=diff;cut=i+1}}let selected=nodes.slice(part?cut:0,part?undefined:cut),q=new DOMParser().parseFromString(s.body_html,'text/html').querySelector('.quiz'),question=q?.querySelector('b')?.textContent||'تحقق من الفهم',answer=q?.querySelector('.answer')?.textContent||'';return '<div class="kicker">الوحدة ٦ · القسم '+esc(s.number)+' · '+(part?'٢/٢':'١/٢')+'</div><h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.subtitle)+'</p><div class="body lesson">'+selected.map(x=>x.outerHTML).join('')+(part?'<div class="card check"><b>'+esc(question)+'</b><div class="choice-list">'+checks[s.id].choices.map((v,i)=>'<button class="choice" data-check="'+i+'">'+esc(v)+'</button>').join('')+'</div><div class="feedback" role="status" hidden>'+esc(answer)+'</div></div>':'')+'</div><span class="scroll-hint">مرّر داخل الشريحة لاستكمال الشرح ↓</span>'}

const sceneStates=[['وصلتان منفصلتان', 'قبل التجميع، قد يحجب STP إحدى الوصلتين المتوازيتين لمنع حلقة Layer 2.','separate'],['تجميع Port Channel', 'بعد توافق الأعضاء وتفاوض LACP، يرى STP القناة كرابط منطقي واحد. تبقى الوصلتان العضوان متاحتين.','bundled'],['حركة تدفقات متعددة', 'قد توزّع خوارزمية Load Sharing تدفقات مختلفة على أعضاء مختلفين؛ يبقى تدفق واحد عادة على عضو واحد للمحافظة على ترتيب الإطارات.','flows'],['تعطل عضو واحد', 'تستمر القناة عبر العضو السليم ما دام عضو صالح واحد على الأقل متاحًا، وتنخفض السعة المجمعة.','failure'],['عدم تطابق الإعدادات', 'في هذا المثال لا ينضم العضو الثاني بسبب عدم تطابق إعداداته، وتبقى القناة على العضو الأول. افحص الملخص وإعدادات الطرفين.','mismatch']];
function stopScene(){if(sceneTimer){clearInterval(sceneTimer);sceneTimer=null;let b=$('scenePlay');if(b)b.textContent='تشغيل ▶'}}
function paintScene(){let [title,explain,kind]=sceneStates[sceneStep],links=[0,1].map(i=>{let cls=kind==='separate'&&i===1?'blocked':kind==='failure'&&i===1?'failed':kind==='mismatch'&&i===1?'excluded':'active';let label=cls==='blocked'?'محجوب من STP':cls==='excluded'?'غير منضم':cls==='failed'?'وصلة متعطلة':kind==='separate'?'وصلة '+(i+1):'عضو '+(i+1);let packet=(cls==='active'&&(kind==='flows'||kind==='bundled'||kind==='failure'))?'<i class="packet '+(i===1?'second':'')+'"></i>':'';return '<div class="link '+cls+'"><b>'+label+'</b>'+packet+'</div>'}).join('');$('sceneLinks').innerHTML=links;$('sceneState').textContent=title;$('sceneExplain').textContent=explain;$('sceneCounter').textContent=(sceneStep+1)+' / '+sceneStates.length;$('scenePrev').disabled=sceneStep===0;$('sceneNext').disabled=sceneStep===sceneStates.length-1}
function initScene(){$('scenePrev').onclick=()=>{stopScene();sceneStep=Math.max(0,sceneStep-1);paintScene()};$('sceneNext').onclick=()=>{stopScene();sceneStep=Math.min(sceneStates.length-1,sceneStep+1);paintScene()};$('sceneReset').onclick=()=>{stopScene();sceneStep=0;paintScene()};$('scenePlay').onclick=()=>{if(sceneTimer){stopScene();return}if(sceneStep===sceneStates.length-1)sceneStep=0;paintScene();$('scenePlay').textContent='إيقاف مؤقت ❚❚';sceneTimer=setInterval(()=>{if(sceneStep===sceneStates.length-1){stopScene();return}sceneStep++;paintScene()},3000)};paintScene()}
function negotiationHTML(){return '<div class="kicker">نشاط قرار · PAgP وLACP</div><h2>هل ستتكوّن القناة؟</h2><p class="lead">اختر البروتوكول ووضع كل طرف، ثم توقّع النتيجة قبل كشفها.</p><div class="body"><div class="scene-controls"><label>نمط التفاوض <select id="proto"><option value="lacp">LACP</option><option value="pagp">PAgP</option></select></label><label>Switch A <select id="modeA"></select></label><label>Switch B <select id="modeB"></select></label></div><div class="choice-list"><button class="choice" data-predict="yes">أتوقع أن تتكوّن القناة</button><button class="choice" data-predict="no">أتوقع ألا تتكوّن القناة</button></div><div id="modeFeedback" class="feedback" role="status" hidden></div><div class="table-scroll" id="modeTable" hidden><table class="matrix"><thead><tr><th>البروتوكول</th><th>يتكوّن</th><th>لا يتكوّن</th></tr></thead><tbody><tr><td>LACP</td><td>active + active / active + passive</td><td>passive + passive</td></tr><tr><td>PAgP</td><td>desirable + desirable / desirable + auto</td><td>auto + auto</td></tr><tr><td>ثابت</td><td>on + on إذا تطابقت الإعدادات</td><td>on مع وضع تفاوضي</td></tr></tbody></table></div></div>'}
function initNegotiation(){let opts={lacp:['active','passive','on'],pagp:['desirable','auto','on']},paint=()=>{let p=$('proto').value;for(let id of ['modeA','modeB'])$(id).innerHTML=opts[p].map(x=>'<option>'+x+'</option>').join('');$('modeFeedback').hidden=true;$('modeTable').hidden=true};$('proto').onchange=paint;$('modeA').onchange=$('modeB').onchange=()=>{$('modeFeedback').hidden=true;$('modeTable').hidden=true};paint();$('stage').querySelectorAll('[data-predict]').forEach(b=>b.onclick=()=>{let p=$('proto').value,a=$('modeA').value,c=$('modeB').value,yes=a==='on'||c==='on'?a==='on'&&c==='on':(p==='lacp'?[a,c].includes('active'):[a,c].includes('desirable'));let ok=(b.dataset.predict==='yes')===yes;$('modeFeedback').hidden=false;$('modeTable').hidden=false;$('modeFeedback').textContent=(ok?'توقع صحيح. ':'راجع الأوضاع. ')+(a==='on'||c==='on'?(yes?'on + on قناة ثابتة بلا تفاوض؛ نجاحها يفترض تطابق الإعدادات.':'on لا يتوافق مع وضع تفاوضي على الطرف الآخر.'):(yes?'تتكون القناة لأن أحد الطرفين يبدأ التفاوض.':'الطرفان سلبيان ولا يبدأ أي منهما التفاوض.'))})}

function render(){stopScene();let s=slides[at],body='';if(s.type==='cover')body='<div class="kicker">الوحدة ٦ · عرض حركي تفاعلي</div><h1>EtherChannel: من الروابط إلى القناة</h1><p class="lead">'+esc(d.summary)+'</p><div class="body grid"><div class="card"><b>الهدف</b><p>'+esc(d.official_objective)+'</p></div><div class="card"><b>خط السرد</b><p>شاهد أثر STP على الوصلات المتوازية، ثم اختبر التجميع والتفاوض والتحقق والتشخيص.</p></div></div>';else if(s.type==='agenda')body='<div class="kicker">'+esc(d.lecture.duration)+'</div><h2>مسار المحاضرة</h2><div class="body grid">'+d.lecture.steps.map(x=>'<div class="card"><b>'+esc(x.time)+'</b><p>'+esc(x.topic)+'</p></div>').join('')+'</div>';else if(s.type==='section')body=sectionHTML(s.section,s.part);else if(s.type==='scene')body=sceneHTML();else if(s.type==='negotiation')body=negotiationHTML();else if(s.type==='diagnosis')body=diagnosisHTML();else body='<div class="kicker">خلاصة الوحدة ٦</div><h2>كيف تثبت أن القناة تعمل؟</h2><div class="body grid"><div class="card"><b>المبدأ</b><p>روابط متوافقة تُجمع في Port Channel يراه STP كرابط منطقي واحد.</p></div><div class="card"><b>التفاوض</b><p>LACP: active/passive. ‏PAgP: desirable/auto. ‏on ثابت بلا تفاوض.</p></div><div class="card"><b>التحقق</b><p>ابدأ بـshow etherchannel summary ثم تحقق من رموز القناة والأعضاء وإعدادات الطرفين.</p></div><div class="card"><b>تذكر</b><p>تجميع رابطين يزيد السعة المتاحة لتدفقات متعددة، ولا يضاعف سرعة تدفق مفرد بالضرورة.</p></div></div>';
$('stage').innerHTML='<article class="slide '+(large?'large':'')+'">'+body+'<footer class="foot"><span>EtherChannel · CCNA 2</span><span>'+(at+1)+' / '+slides.length+'</span></footer></article>';$('count').textContent=(at+1)+' / '+slides.length;$('progress').style.width=(at+1)/slides.length*100+'%';$('prev').disabled=at===0;$('next').disabled=at===slides.length-1;$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';if(s.type==='scene')initScene();if(s.type==='negotiation')initNegotiation();if(s.type==='diagnosis')$('stage').querySelectorAll('[data-diag]').forEach(b=>b.onclick=()=>{$('stage').querySelectorAll('[data-diag]').forEach(x=>{x.disabled=true;x.classList.toggle('good',x.dataset.diag==='0');x.classList.toggle('bad',x===b&&x.dataset.diag!=='0')});$('diagFeedback').hidden=false;$('diagFeedback').textContent=(b.dataset.diag==='0'?'صحيح. ':'راجع إعداد الطرفين. ')+'on لا يرسل PAgP، بينما desirable يبدأ PAgP. اجعل الطرفين يستخدمان أوضاع تفاوض متوافقة أو on على الطرفين.'});if(s.type==='section'&&s.part)$('stage').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let q=checks[s.section.id];$('stage').querySelectorAll('[data-check]').forEach(x=>{x.disabled=true;x.classList.toggle('good',+x.dataset.check===q.correct);x.classList.toggle('bad',x===b&&+x.dataset.check!==q.correct)});b.parentElement.nextElementSibling.hidden=false});history.replaceState(null,'','#slide-'+(at+1))}
function go(i){if(i<0||i>=slides.length)return;at=i;render()}$('prev').onclick=()=>go(at-1);$('next').onclick=()=>go(at+1);$('markBtn').onclick=()=>{marks.has(at)?marks.delete(at):marks.add(at);try{localStorage.setItem(markKey,JSON.stringify([...marks]))}catch{}$('markBtn').classList.toggle('marked',marks.has(at));$('markBtn').innerHTML=(marks.has(at)?'★':'☆')+' <span>للمراجعة</span>';let b=$('menuList').querySelector('[data-slide="'+at+'"]');if(b)b.textContent=(at+1)+' · '+slides[at].title+(marks.has(at)?' ★':'')};$('notesBtn').onclick=()=>{large=!large;$('stage').querySelector('.slide').classList.toggle('large',large);$('notesBtn').classList.toggle('active',large);$('notesBtn').setAttribute('aria-pressed',String(large))};$('themeBtn').onclick=()=>{let day=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=day?'light':'dark';$('themeBtn').innerHTML=day?'☾ <span>ليلي</span>':'☀ <span>نهاري</span>';$('themeBtn').setAttribute('aria-pressed',String(day));$('themeBtn').setAttribute('aria-label',day?'تفعيل الوضع الليلي':'تفعيل الوضع النهاري')};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('menuBtn').onclick=()=>$('menu').classList.add('open');$('closeMenu').onclick=()=>$('menu').classList.remove('open');$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('menuList').innerHTML=slides.map((s,i)=>'<button data-slide="'+i+'">'+(i+1)+' · '+esc(s.title)+'</button>').join('');$('menuList').onclick=e=>{let b=e.target.closest('[data-slide]');if(b){$('menu').classList.remove('open');go(+b.dataset.slide)}};document.addEventListener('keydown',e=>{if($('menu').classList.contains('open')){if(e.key==='Escape')$('menu').classList.remove('open');return}if(e.target.closest('button,input,select,textarea,summary'))return;if(['ArrowLeft','PageDown'].includes(e.key))go(at+1);if(['ArrowRight','PageUp'].includes(e.key))go(at-1)});let sx=0,sy=0;$('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('button,select,summary,details,input,textarea'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>85&&Math.abs(dx)>1.5*Math.abs(dy))go(at+(dx<0?-1:1))},{passive:true});let m=location.hash.match(/^#slide-(\d+)$/);if(m)at=Math.max(0,Math.min(slides.length-1,+m[1]-1));render()})();
