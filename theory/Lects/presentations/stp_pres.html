</style><style>/* =========================================================
   STP Interactive Journey
   Scoped بالكامل داخل .stp-animation-host
   ========================================================= */

.stp-animation-host{
  margin-top:14px;
  min-width:0;
}

.stp-animation-placeholder{
  display:grid;
  gap:4px;
  padding:14px;
  border:1px dashed var(--line);
  border-radius:15px;
  background:var(--panel2);
  color:var(--muted);
  font-size:.82rem;
  line-height:1.7;
}
.stp-animation-placeholder strong{color:var(--text)}

.stp-journey{
  --stp-root:#8fe3bc;
  --stp-rp:#59c3ff;
  --stp-dp:#7aa7ff;
  --stp-ap:#ff9292;
  --stp-bpdu:#ffd166;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 0%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 34%),
    var(--panel2);
}

.stp-journey *{box-sizing:border-box}

.stp-journey-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding:15px 16px 13px;
  border-bottom:1px solid var(--line);
}

.stp-journey-kicker{
  color:var(--brand2);
  font-size:.7rem;
  font-weight:900;
  letter-spacing:.02em;
  margin-bottom:4px;
}

.stp-journey-head h4{
  margin:0;
  font-size:1rem;
  line-height:1.55;
}

.stp-journey-head p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:.78rem;
  line-height:1.75;
  max-width:730px;
}

.stp-controls{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  flex:0 0 auto;
  direction:rtl;
}

.stp-btn{
  min-height:38px;
  padding:7px 10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  font:inherit;
  font-size:.72rem;
  font-weight:850;
  cursor:pointer;
}

.stp-btn:hover{border-color:var(--brand)}
.stp-btn:focus-visible{
  outline:3px solid color-mix(in srgb,var(--brand) 32%,transparent);
  outline-offset:2px;
}
.stp-btn[disabled]{opacity:.42;cursor:not-allowed}
.stp-btn.stp-play{
  background:var(--text);
  color:var(--bg);
  border-color:transparent;
}

.stp-main{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(245px,.7fr);
  gap:0;
  min-width:0;
}

.stp-canvas{
  min-width:0;
  padding:10px;
  border-left:1px solid var(--line);
  background:
    linear-gradient(color-mix(in srgb,var(--line) 16%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--line) 16%,transparent) 1px,transparent 1px);
  background-size:28px 28px;
}

.stp-canvas svg{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:900/540;
  overflow:visible;
}

.stp-panel{
  padding:16px;
  min-width:0;
}

.stp-stage-no{
  color:var(--brand);
  font-size:.68rem;
  font-weight:900;
  margin-bottom:6px;
}

.stp-stage-title{
  margin:0;
  font-size:.94rem;
  line-height:1.6;
}

.stp-stage-body{
  margin:8px 0 0;
  color:var(--muted);
  font-size:.79rem;
  line-height:1.9;
}

.stp-decision{
  margin-top:12px;
  padding:10px 11px;
  border:1px solid color-mix(in srgb,var(--brand2) 32%,var(--line));
  border-radius:12px;
  background:color-mix(in srgb,var(--brand2) 6%,var(--panel));
}

.stp-decision-label{
  color:var(--brand2);
  font-size:.65rem;
  font-weight:900;
  margin-bottom:4px;
}

.stp-decision-text{
  color:var(--text);
  font-size:.77rem;
  font-weight:800;
  line-height:1.75;
}

.stp-bid-table{
  margin-top:12px;
  display:grid;
  gap:6px;
}

.stp-bid-row{
  display:grid;
  grid-template-columns:36px 1fr;
  gap:7px;
  align-items:center;
  padding:7px 8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  direction:ltr;
}

.stp-bid-row.is-best{
  border-color:color-mix(in srgb,var(--stp-root) 60%,var(--line));
  background:color-mix(in srgb,var(--stp-root) 7%,var(--panel));
}

.stp-bid-name{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  border-radius:8px;
  background:var(--panel3);
  color:var(--text);
  font-size:.72rem;
  font-weight:900;
}

.stp-bid-values{
  min-width:0;
  display:grid;
  gap:2px;
  color:var(--muted);
  font:650 .65rem/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;
}

.stp-bid-values strong{
  color:var(--text);
  font-weight:850;
}

.stp-progress{
  display:flex;
  align-items:center;
  gap:6px;
  padding:11px 14px;
  border-top:1px solid var(--line);
  overflow:auto;
  scrollbar-width:none;
}
.stp-progress::-webkit-scrollbar{display:none}

.stp-dot{
  flex:1 0 86px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel);
  color:var(--muted);
  min-height:32px;
  padding:6px 9px;
  font:inherit;
  font-size:.65rem;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.stp-dot.current{
  background:var(--text);
  color:var(--bg);
  border-color:var(--text);
}

.stp-dot.done{
  border-color:color-mix(in srgb,var(--brand2) 40%,var(--line));
  color:var(--brand2);
}

/* ---------- SVG ---------- */
.stp-svg text{
  font-family:"Almarai","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  user-select:none;
}

.stp-link{
  stroke:color-mix(in srgb,var(--muted) 58%,transparent);
  stroke-width:6;
  stroke-linecap:round;
  transition:stroke .35s,opacity .35s,stroke-width .35s;
}

.stp-link.is-tree{
  stroke:var(--stp-root);
  stroke-width:8;
}

.stp-link.is-segment{
  stroke:var(--stp-dp);
  stroke-width:7;
}

.stp-link.is-blocked{
  stroke:var(--stp-ap);
  stroke-dasharray:12 9;
  opacity:.72;
}

.stp-switch .sw-body{
  fill:var(--panel);
  stroke:var(--brand);
  stroke-width:3;
  transition:stroke .35s,fill .35s,filter .35s;
}

.stp-switch .sw-name{
  fill:var(--text);
  font-size:22px;
  font-weight:900;
  text-anchor:middle;
}

.stp-switch .sw-sub{
  fill:var(--muted);
  font-size:12px;
  text-anchor:middle;
}

.stp-switch.is-root .sw-body{
  stroke:var(--stp-root);
  stroke-width:5;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--stp-root) 45%,transparent));
}

.stp-switch.is-root .root-pill{opacity:1}
.root-pill{opacity:0;transition:opacity .3s}
.root-pill rect{fill:var(--stp-root)}
.root-pill text{
  fill:#073323;
  font-size:12px;
  font-weight:900;
  text-anchor:middle;
}

.stp-port-label rect{
  fill:color-mix(in srgb,var(--panel) 94%,transparent);
  stroke:var(--line);
}
.stp-port-label text{
  fill:var(--muted);
  font-size:11px;
  font-weight:850;
  text-anchor:middle;
}

.stp-role{opacity:0;transition:opacity .3s,transform .3s}
.stp-role.show{opacity:1}
.stp-role rect{stroke:none}
.stp-role text{
  fill:#07111f;
  font-size:12px;
  font-weight:900;
  text-anchor:middle;
}

.stp-role.rp rect{fill:var(--stp-rp)}
.stp-role.dp rect{fill:var(--stp-dp)}
.stp-role.ap rect{fill:var(--stp-ap)}

.stp-bpdu{opacity:0;pointer-events:none}
.stp-bpdu.show{opacity:1}
.stp-bpdu circle{
  fill:var(--stp-bpdu);
  stroke:#5c4300;
  stroke-width:2;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--stp-bpdu) 55%,transparent));
}
.stp-bpdu text{
  fill:#352600;
  font-size:9px;
  font-weight:1000;
  text-anchor:middle;
}

.stp-frame{opacity:0}
.stp-frame.show{opacity:1}
.stp-frame rect{
  fill:var(--warn);
  stroke:#654700;
  stroke-width:2;
  rx:8;
}
.stp-frame text{
  fill:#352600;
  font-size:10px;
  font-weight:1000;
  text-anchor:middle;
}

.stp-block{
  opacity:0;
  transition:opacity .3s;
}
.stp-block.show{opacity:1}
.stp-block circle{
  fill:var(--panel);
  stroke:var(--stp-ap);
  stroke-width:5;
}
.stp-block line{
  stroke:var(--stp-ap);
  stroke-width:5;
  stroke-linecap:round;
}

.stp-callout{
  opacity:0;
  transition:opacity .3s;
}
.stp-callout.show{opacity:1}
.stp-callout rect{
  fill:color-mix(in srgb,var(--panel) 96%,transparent);
  stroke:var(--line);
}
.stp-callout text{
  fill:var(--text);
  font-size:12px;
  font-weight:800;
  text-anchor:middle;
}
.stp-callout .muted{fill:var(--muted);font-size:10px}

.stp-legend{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}
.stp-leg{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:.65rem;
}
.stp-leg i{
  width:10px;height:10px;border-radius:3px;display:block;
}
.stp-leg.rp i{background:var(--stp-rp)}
.stp-leg.dp i{background:var(--stp-dp)}
.stp-leg.ap i{background:var(--stp-ap)}
.stp-leg.root i{background:var(--stp-root)}

@media(max-width:900px){
  .stp-main{grid-template-columns:1fr}
  .stp-canvas{border-left:0;border-bottom:1px solid var(--line)}
}

@media(max-width:650px){
  .stp-journey-head{flex-direction:column}
  .stp-controls{width:100%}
  .stp-btn{flex:1}
  .stp-canvas{padding:4px}
  .stp-panel{padding:13px}
  .stp-stage-body{font-size:.76rem}
  .stp-progress{padding:9px 10px}
  .stp-dot{flex-basis:74px;font-size:.61rem}
}

@media(prefers-reduced-motion:reduce){
  .stp-link,.stp-switch .sw-body,.stp-role,.stp-block,.stp-callout{
    transition:none!important;
  }
}
</style></head><body><div class="shell"><header class="top"><span class="brand">CCNA 2 · عرض المحاضرة</span><div class="actions"><button class="tool" id="menuBtn" aria-label="فهرس الشرائح">☷ <span>الفهرس</span></button><button class="tool" id="themeBtn" aria-label="تفعيل الوضع النهاري" aria-pressed="false">☀ <span>نهاري</span></button><button class="tool" id="markBtn" aria-label="ضع علامة للعودة لهذه الشريحة">☆ <span>للمراجعة</span></button><button class="tool" id="notesBtn" aria-label="تكبير النص" aria-pressed="false">◫ <span>تكبير النص</span></button><button class="tool" id="fullBtn" aria-label="ملء الشاشة">⛶ <span>ملء الشاشة</span></button></div></header><main class="stage" id="stage" aria-live="polite"></main><nav class="bottom"><button class="nav" id="prev">السابق</button><span class="count" id="count"></span><div class="bar"><i id="progress"></i></div><button class="nav" id="next">التالي</button></nav></div><div class="menu" id="menu"><div class="menu-box" role="dialog" aria-modal="true" aria-label="فهرس الشرائح"><button class="tool" id="closeMenu">إغلاق ✕</button><div class="menu-list" id="menuList"></div></div></div><script type="application/json" id="data">{"schema_version": 1, "module_number": 5, "group_id": "03_Redundancy_LinkAggregation", "title": "الوحدة 5 — STP Concepts (مفاهيم STP)", "title_en": "STP Concepts", "badge": "STP", "summary": "لماذا نحتاج التكرار في Layer 2، ولماذا قد تتحول الروابط المكررة إلى حلقات وعواصف بث، وكيف يبني STP طوبولوجيا خالية من الحلقات عبر Root Bridge وأدوار المنافذ والتكلفة، ثم كيف تطورت الآلية إلى RSTP وRapid PVST+ مع PortFast وBPDU Guard.", "official_objective": "شرح كيف يمكّن STP التكرار في شبكة Layer 2، مع تفسير مشكلات الشبكات المحوّلة ذات المسارات المكررة، وآلية عمل STP، وكيف يعمل Rapid PVST+.", "lecture": {"duration": "≈ 90 دقيقة", "steps": [{"time": "15 د", "topic": "التكرار في Layer 2، الحلقات، عدم استقرار جدول MAC وعاصفة البث."}, {"time": "20 د", "topic": "فكرة STP/STA، رسائل BPDU، وانتخاب Root Bridge باستخدام BID."}, {"time": "15 د", "topic": "Root Path Cost وانتخاب Root Port وDesignated/Alternate Ports وكسر التعادل."}, {"time": "15 د", "topic": "مؤقتات STP وحالات المنافذ وسلوك BPDU وجدول MAC في كل حالة."}, {"time": "15 د", "topic": "PVST+ وRSTP وRapid PVST+ وحالات وأدوار RSTP."}, {"time": "10 د", "topic": "PortFast وBPDU Guard والانتقال نحو Layer 3 + مراجعة."}], "presentation_link": {"label": "عرض المحاضرة", "href": "presentations/stp_pres.html"}}, "review": {"committee": "theory_content_committee", "status": "approved", "approved": true, "review_date": "2026-09-06", "notes": ["تمت مطابقة الداتا مع المحاور الرسمية الثلاثة: Purpose of STP، STP Operations، وEvolution of STP.", "تم تضمين أسباب حلقات Layer 2 وآثارها، STA وBPDUs وBID، انتخاب Root Bridge وأدوار المنافذ والتكلفة وكسر التعادل، المؤقتات والحالات، PVST+/RSTP/Rapid PVST+، وPortFast وBPDU Guard.", "أنشطة الفيديو وPacket Tracer وأسئلة Check Your Understanding لم تُنسخ كأنشطة عملية؛ استُخدمت فقط لتحديد التركيز التعليمي.", "تم الحفاظ على تفاصيل الإصدارات والقيم كما وردت في Instructor Materials، مع استخدام عبارات مثل «وفق العرض» عند الحاجة لتجنب تعميم معلومات مرتبطة بالمنصة أو الإصدار.", "لم يتم تعديل التصميم أو JavaScript أو CSS؛ الإضافة بيانات فقط.", "جولة المراجعة المتقاطعة: عُدلت صياغة PortFast لتكون مرتبطة بمنافذ الأجهزة النهائية في سياق المقرر بدل عبارة مطلقة.", "أضيف عرض حركي تفاعلي داخل صفحة STP يوضح رحلة BPDU وانتخاب Root Bridge في الحالة الافتراضية عند تساوي Bridge Priority وExtended System ID، ثم اختيار Root/Designated/Alternate Ports، بدون استخدام فيديو أو مكتبات خارجية."], "cross_review_corrections_applied": true}, "sections": [{"id": "u5s1", "number": "01", "toc_title": "لماذا نحتاج STP؟", "title": "التكرار مفيد… لكنه قد يصنع حلقة في Layer 2", "subtitle": "المسار البديل يحمي الشبكة من نقطة الفشل الواحدة، لكن Ethernet يحتاج طوبولوجيا منطقية بلا حلقات.", "body_html": "<p class=\"core\"><strong>Redundancy (التكرار)<\/strong> يضيف مسارات بديلة حتى تستمر الخدمة إذا تعطلت وصلة أو جهاز. لكن وجود أكثر من مسار فعّال بين محوّلات Ethernet قد ينشئ <strong>Layer 2 Loop (حلقة في الطبقة الثانية)<\/strong>. عندها يمكن للإطارات أن تستمر بالدوران لأن Ethernet لا يحتوي آلية مماثلة لـTTL في IPv4 أو Hop Limit في IPv6.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>عدم استقرار جدول MAC<\/h4><p>يتغير موقع عنوان MAC باستمرار بين المنافذ بسبب وصول الإطارات نفسها من مسارات مختلفة.<\/p><\/div>\n  <div class=\"card\"><h4>تشبع الوصلات وارتفاع CPU<\/h4><p>الإطارات المتكررة تستهلك عرض النطاق وقد ترفع حمل المعالجة على المحوّلات والأجهزة النهائية.<\/p><\/div>\n  <div class=\"card\"><h4>Broadcast Storm (عاصفة البث)<\/h4><p>قد تتضاعف حركة Broadcast وMulticast وUnknown Unicast بسرعة حتى تصبح الشبكة غير قابلة للاستخدام خلال وقت قصير.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>الفكرة:<\/strong> نريد الاحتفاظ بالمسارات الفيزيائية المكررة، لكن نحتاج آلية تمنع استخدامها كلها منطقيًا في الوقت نفسه. هنا يأتي دور STP.<\/div>\n<details class=\"expand study-detail\"><summary>لماذا لا تنتهي الحلقة من تلقاء نفسها مثل حزمة IP؟<\/summary><div class=\"expand-body\">يذكر العرض أن الموجّه يخفض TTL في IPv4 وHop Limit في IPv6 حتى تُسقط الحزمة عند الصفر. إطار Ethernet في Layer 2 لا يحمل آلية مكافئة تحد عدد مرات إعادة تمريره، لذلك صُمم STP خصيصًا لمنع حلقات Ethernet.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل حذف الروابط المكررة هو الحل الأفضل لمنع الحلقة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. الروابط المكررة مفيدة لاستمرارية الخدمة. STP يسمح ببقائها فيزيائيًا ويمنع الحلقة منطقيًا.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Redundancy<\/span><span class=\"term\">Layer 2 Loop<\/span><span class=\"term\">Broadcast Storm<\/span><span class=\"term\">MAC Address Table<\/span><\/div>"}, {"id": "u5s2", "number": "02", "toc_title": "فكرة STP وSTA", "title": "STP يبقي التكرار ويغلق المسار الزائد منطقيًا", "subtitle": "Spanning Tree Protocol يمنع الحلقات باختيار طوبولوجيا منطقية واحدة قابلة لإعادة الحساب عند حدوث عطل.", "body_html": "<p class=\"core\"><strong>Spanning Tree Protocol (بروتوكول الشجرة الممتدة)<\/strong> بروتوكول لمنع الحلقات يسمح بوجود التكرار، لكنه يحجب منطقيًا المسارات التي قد تكوّن حلقة. إذا تعطّل المسار المستخدم، يعيد STP الحساب ويمكنه فتح منفذ كان محجوبًا ليصبح المسار البديل فعالًا.<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Root Bridge<\/b><span>اختيار محوّل مرجعي تبنى حوله الشجرة.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Root Ports<\/b><span>كل محوّل غير جذري يختار أفضل منفذ نحو الجذر.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Designated Ports<\/b><span>اختيار المنفذ الأفضل لكل Segment.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>4 · Alternate Ports<\/b><span>المسارات الزائدة توضع في حالة لا تمرر بيانات المستخدم.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<div class=\"keyline\"><strong>STA:<\/strong> خوارزمية Spanning Tree Algorithm تنشئ طوبولوجيا خالية من الحلقات بحيث يكون لكل محوّل مسار منطقي واحد نحو Root Bridge، بينما تبقى الروابط الأخرى جاهزة للتعافي.<\/div>\n<div class=\"card\"><h4>BPDU هي رسائل القرار<\/h4><p>تتبادل المحوّلات Bridge Protocol Data Units (BPDUs) لمشاركة معلوماتها واتصالاتها، وتُستخدم هذه الرسائل في انتخاب Root Bridge وتحديد Root وDesignated وAlternate Ports.<\/p><\/div>\n<div class=\"stp-animation-host\" data-stp-animation data-scenario=\"default-bid\"\n     aria-label=\"عرض حركي تفاعلي لانتخاب Root Bridge وأدوار منافذ STP\">\n  <div class=\"stp-animation-placeholder\">\n    <strong>عرض حركي: كيف يتخذ STP القرار؟<\/strong>\n    <span>جاري تجهيز رحلة BPDU…<\/span>\n  <\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ماذا يحدث لمنفذ محجوب إذا فشل المسار الرئيسي؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يعيد STP حساب الطوبولوجيا، وقد يحول المنفذ البديل إلى مسار تمرير فعّال لاستعادة الاتصال.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">STP<\/span><span class=\"term\">STA<\/span><span class=\"term\">BPDU<\/span><span class=\"term\">Root Bridge<\/span><\/div>"}, {"id": "u5s3", "number": "03", "toc_title": "انتخاب Root Bridge", "title": "أقل Bridge ID يفوز بمنصب Root Bridge", "subtitle": "يبدأ القرار من BID: أولوية الجسر + Extended System ID + عنوان MAC.", "body_html": "<p class=\"core\">تبدأ المحوّلات بإرسال <strong>BPDU<\/strong> والمقارنة بينها حتى تتفق على محوّل واحد هو <strong>Root Bridge (المحوّل الجذري)<\/strong>. المعيار الحاسم هو أقل <strong>Bridge ID (BID)<\/strong>.<\/p>\n<div class=\"grid3\">\n  <div class=\"card\"><div class=\"micro\">Bridge Priority<\/div><h4>الأولوية أولًا<\/h4><p>القيمة الافتراضية في العرض 32768، والنطاق 0–61440 بزيادات 4096. القيمة الأقل أفضل.<\/p><\/div>\n  <div class=\"card\"><div class=\"micro\">Extended System ID<\/div><h4>هوية VLAN<\/h4><p>تضاف إلى قيمة الأولوية لتحديد VLAN الخاصة بمثيل Spanning Tree.<\/p><\/div>\n  <div class=\"card\"><div class=\"micro\">MAC Address<\/div><h4>كسر التعادل<\/h4><p>إذا تساوت الأولوية وExtended System ID، يفوز المحوّل ذو عنوان MAC الأقل رقميًا.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>أفضل ممارسة تعليمية:<\/strong> لا تترك اختيار Root Bridge للصدفة اعتمادًا على MAC؛ اضبط المحوّل المطلوب بأولوية أقل.<\/div>\n<details class=\"expand study-detail\"><summary>ماذا يحدث مباشرة بعد تشغيل المحوّلات؟<\/summary><div class=\"expand-body\">وفق العرض، يبدأ كل محوّل باعتبار نفسه Root Bridge ويرسل BPDU كل ثانيتين متضمنة BID الخاص به وRoot ID. مع استمرار التبادل تتعلم المحوّلات أي BID هو الأقل وتتفق على Root Bridge واحد.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: محوّلان لهما نفس الأولوية ونفس VLAN؛ من يصبح Root Bridge؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">المحوّل ذو عنوان MAC الأقل، لأن MAC يصبح عامل كسر التعادل في BID.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Bridge ID (BID)<\/span><span class=\"term\">Bridge Priority<\/span><span class=\"term\">Extended System ID<\/span><span class=\"term\">Root ID<\/span><\/div>"}, {"id": "u5s4", "number": "04", "toc_title": "التكلفة وRoot Port", "title": "أفضل مسار إلى الجذر هو الأقل تكلفة", "subtitle": "بعد انتخاب Root Bridge يحسب كل محوّل مجموع تكاليف المنافذ على الطريق إلى الجذر.", "body_html": "<p class=\"core\"><strong>Root Path Cost (تكلفة المسار إلى الجذر)<\/strong> هي مجموع تكاليف المنافذ على المسار من المحوّل إلى Root Bridge. كل محوّل غير جذري يختار <strong>Root Port (المنفذ الجذري)<\/strong> الذي يقوده إلى أقل تكلفة إجمالية.<\/p>\n<div class=\"grid2\">\n  <div class=\"card\"><h4>مثال المسار<\/h4><p>إذا كان المسار الأول تكلفته 19 والمسار الثاني 38، يصبح المنفذ المؤدي إلى المسار ذي التكلفة 19 هو Root Port.<\/p><\/div>\n  <div class=\"card\"><h4>التكلفة مرتبطة بالسرعة<\/h4><p>كلما زادت سرعة الوصلة انخفضت التكلفة الافتراضية. ويمكن للمدير تغيير Port Cost للتحكم في المسار المفضل.<\/p><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>قيم التكلفة الواردة في العرض<\/summary><div class=\"expand-body\"><ul><li>10 Gbps: ‏2 في 802.1D-1998، و2000 في 802.1w-2004.<\/li><li>1 Gbps: ‏4، و20000.<\/li><li>100 Mbps: ‏19، و200000.<\/li><li>10 Mbps: ‏100، و2000000.<\/li><\/ul>يعرض المنهج الفرق بين Short Path Cost وLong Path Cost؛ الفكرة الأساسية للطالب أن مجموع التكلفة الأقل هو المسار المفضل.<\/div><\/details>\n<div class=\"keyline\"><strong>قاعدة:<\/strong> يوجد Root Port واحد على كل محوّل غير Root Bridge، بينما Root Bridge نفسه لا يحتاج Root Port.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل يختار STP المسار الأقل عددًا من الوصلات دائمًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. القرار يعتمد على مجموع Port Cost، وليس على عدد الوصلات وحده.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Root Path Cost<\/span><span class=\"term\">Port Cost<\/span><span class=\"term\">Root Port<\/span><\/div>"}, {"id": "u5s5", "number": "05", "toc_title": "أدوار المنافذ وكسر التعادل", "title": "Root، Designated، Alternate: لكل منفذ دور", "subtitle": "بعد اختيار الجذر والمسار الأفضل، يحدد STP أي المنافذ تمرر وأيها تبقى بديلة.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><h4>Root Port<\/h4><p>أفضل منفذ نحو Root Bridge على كل محوّل غير جذري.<\/p><\/div>\n  <div class=\"card\"><h4>Designated Port<\/h4><p>المنفذ المعيّن للقطاع، وهو أفضل منفذ لإيصال الحركة من ذلك القطاع نحو Root Bridge، ويمرر إطارات البيانات وBPDUs عندما يكون في حالة Forwarding. منافذ Root Bridge المشاركة في STP تكون Designated في هذا المثال.<\/p><\/div>\n  <div class=\"card\"><h4>Alternate Port<\/h4><p>في طوبولوجيا المثال، المنفذ المتبقي الذي يقدّم مسارًا آخر إلى الجذر يصبح Alternate ولا يمرر إطارات المستخدم في الحالة الطبيعية. توجد أدوار أخرى مثل Backup في حالات طوبولوجية مختلفة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قواعد سريعة:<\/strong> إذا كان أحد طرفي الوصلة Root Port فالطرف الآخر Designated Port، ومنافذ الأجهزة النهائية Designated Ports، وعلى الوصلة بين محوّلين غير جذريين يفوز الطرف ذو المسار الأقل تكلفة إلى الجذر.<\/div>\n<p class=\"core\">إذا تساوت تكلفة مسارين نحو Root Bridge، يكسر STP التعادل بهذا الترتيب:<\/p>\n<div class=\"flow\">\n  <div class=\"step\"><b>1 · Lowest Sender BID<\/b><span>أقل BID للمحوّل المرسل للـBPDU.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>2 · Lowest Sender Port Priority<\/b><span>إذا استمر التعادل، الأقل في أولوية منفذ المرسل.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>3 · Lowest Sender Port ID<\/b><span>آخر معيار: أقل Port ID لدى المرسل.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية معايير كسر التعادل<\/div>\n<div class=\"keyline\"><strong>انتبه:<\/strong> المعيار الأخير يعتمد على Port ID للمرسل، وليس رقم منفذ المستقبل.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: منفذ ليس Root ولا Designated؛ ماذا يصبح؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">في طوبولوجيا المثال يصبح Alternate/Blocked Port، ويبقى كمسار احتياطي دون تمرير حركة المستخدم في الحالة الطبيعية؛ وقد يظهر دور Backup في طوبولوجيات أخرى.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Designated Port<\/span><span class=\"term\">Alternate Port<\/span><span class=\"term\">Port Priority<\/span><span class=\"term\">Port ID<\/span><\/div>"}, {"id": "u5s6", "number": "06", "toc_title": "المؤقتات وحالات STP", "title": "STP لا ينتقل إلى Forwarding مباشرة", "subtitle": "المؤقتات والحالات تمنح المحوّلات وقتًا لفهم الطوبولوجيا قبل السماح بمرور بيانات المستخدم.", "body_html": "<div class=\"grid3\">\n  <div class=\"card\"><div class=\"micro\">Hello Timer<\/div><h4>2 ثانية افتراضيًا<\/h4><p>الفاصل بين BPDUs، ويمكن وفق العرض ضبطه من 1 إلى 10 ثوانٍ.<\/p><\/div>\n  <div class=\"card\"><div class=\"micro\">Forward Delay<\/div><h4>15 ثانية افتراضيًا<\/h4><p>الوقت في Listening والوقت في Learning، ويمكن ضبطه من 4 إلى 30 ثانية.<\/p><\/div>\n  <div class=\"card\"><div class=\"micro\">Max Age<\/div><h4>20 ثانية افتراضيًا<\/h4><p>أقصى وقت انتظار قبل محاولة تغيير طوبولوجيا STP، ويمكن ضبطه من 6 إلى 40 ثانية.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>مرجع المؤقتات:<\/strong> يذكر العرض أن القيم الافتراضية يمكن تغييرها على Root Bridge، وهو الذي يحددها لنطاق STP.<\/div>\n<div class=\"flow\">\n  <div class=\"step\"><b>Blocking<\/b><span>لا تمرير بيانات، لا تحديث لجدول MAC، استقبال BPDU فقط.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Listening<\/b><span>إرسال/استقبال BPDU، بلا تعلم MAC أو تمرير بيانات.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Learning<\/b><span>يتعلم عناوين MAC، لكنه لا يمرر بيانات المستخدم بعد.<\/span><\/div><div class=\"arrow\">←<\/div>\n  <div class=\"step\"><b>Forwarding<\/b><span>يتعلم MAC ويمرر الإطارات.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية حالات STP<\/div>\n<details class=\"expand study-detail\"><summary>وماذا عن Disabled؟<\/summary><div class=\"expand-body\">Disabled حالة غير تشغيلية في الجدول: لا تُرسل أو تُستقبل BPDUs، لا يحدث تحديث لجدول MAC، ولا تمرر إطارات بيانات.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: في أي حالة يبدأ المنفذ بتحديث جدول MAC دون تمرير بيانات المستخدم؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Learning.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Hello Timer<\/span><span class=\"term\">Forward Delay<\/span><span class=\"term\">Max Age<\/span><span class=\"term\">Blocking<\/span><span class=\"term\">Learning<\/span><span class=\"term\">Forwarding<\/span><\/div>"}, {"id": "u5s7", "number": "07", "toc_title": "PVST+ وRSTP وRapid PVST+", "title": "تطور Spanning Tree: من STP إلى RSTP", "subtitle": "الفكرة الأساسية بقيت، لكن التقارب أصبح أسرع وأصبح من الممكن تشغيل مثيل مستقل لكل VLAN.", "body_html": "<p class=\"core\"><strong>PVST+ (الشجرة الممتدة لكل VLAN)<\/strong> يشغّل مثيل STP مستقلًا لكل VLAN، ولذلك يمكن أن يكون لكل VLAN Root Bridge مختلف. ويذكر العرض أن محوّلات Cisco ذات IOS 15.0 أو أحدث تعمل بـPVST+ افتراضيًا، بينما يحتاج وضع Rapid Spanning Tree إلى تفعيل صريح.<\/p>\n<div class=\"compare\">\n  <div class=\"compare-box\"><div class=\"micro\">STP · IEEE 802.1D<\/div><h4>التقارب التقليدي<\/h4><p>يعتمد حالات Blocking وListening وLearning وForwarding، ويستخدم نفس STA لاختيار الأدوار والمسارات.<\/p><\/div>\n  <div class=\"compare-box\"><div class=\"micro\">RSTP · IEEE 802.1w<\/div><h4>تقارب أسرع<\/h4><p>يحافظ على مفاهيم STP الأساسية لكنه يسرّع إعادة الحساب، وقد ينتقل Alternate Port إلى Forwarding بسرعة كبيرة في شبكة مضبوطة جيدًا.<\/p><\/div>\n<\/div>\n<div class=\"grid3\">\n  <div class=\"card\"><h4>Discarding<\/h4><p>في RSTP تندمج حالات Disabled وBlocking وListening التقليدية في حالة واحدة.<\/p><\/div>\n  <div class=\"card\"><h4>Learning<\/h4><p>يبني جدول MAC ولا يمرر بيانات المستخدم بعد.<\/p><\/div>\n  <div class=\"card\"><h4>Forwarding<\/h4><p>يتعلم ويمرر حركة المستخدم.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Rapid PVST+:<\/strong> تطبيق Cisco لـRSTP على أساس Per-VLAN؛ يعمل مثيل مستقل من RSTP لكل VLAN.<\/div>\n<details class=\"expand study-detail\"><summary>بقية الإصدارات الواردة في المنهج<\/summary><div class=\"expand-body\"><ul><li><strong>STP/CST:<\/strong> المثيل الأصلي وفق 802.1D.<\/li><li><strong>PVST+:<\/strong> مثيل 802.1D مستقل لكل VLAN.<\/li><li><strong>RSTP:<\/strong> IEEE 802.1w بتقارب أسرع.<\/li><li><strong>Rapid PVST+:<\/strong> مثيل RSTP مستقل لكل VLAN.<\/li><li><strong>MSTP/MST:<\/strong> تجميع عدة VLANs في عدد أقل من مثيلات Spanning Tree؛ يذكر العرض أن تطبيق Cisco MST يوفر حتى 16 مثيلًا من RSTP.<\/li><\/ul><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الفرق البصري الأبرز في حالات RSTP مقارنة بـSTP؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">RSTP يستخدم ثلاث حالات فقط: Discarding وLearning وForwarding، حيث تندمج Disabled وBlocking وListening القديمة في Discarding.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">PVST+<\/span><span class=\"term\">RSTP<\/span><span class=\"term\">Rapid PVST+<\/span><span class=\"term\">MSTP<\/span><span class=\"term\">Discarding<\/span><\/div>"}, {"id": "u5s8", "number": "08", "toc_title": "PortFast وBPDU Guard", "title": "تسريع منافذ المستخدم مع إبقاء الحماية من الحلقات", "subtitle": "PortFast يزيل انتظار STP على منفذ المستخدم، وBPDU Guard يحميه إذا ظهر عليه محوّل بالخطأ.", "body_html": "<div class=\"grid2\">\n  <div class=\"card\"><h4>PortFast<\/h4><p>يجعل المنفذ الطرفي في سيناريو المقرر ينتقل إلى Forwarding مباشرة بدل انتظار Listening ثم Learning، متجنبًا تأخيرًا تقليديًا قدره نحو 30 ثانية. يفيد خصوصًا أجهزة المستخدم وDHCP.<\/p><\/div>\n  <div class=\"card\"><h4>BPDU Guard<\/h4><p>إذا استقبل منفذ PortFast رسالة BPDU فهذا مؤشر على اتصال محوّل محتمل. BPDU Guard يضع المنفذ فورًا في حالة errdisabled لحماية الشبكة من حلقة محتملة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة أمان:<\/strong> في سياق هذا المقرر، يُستخدم PortFast على المنافذ الطرفية المتصلة بالأجهزة النهائية، وليس على الروابط بين المحوّلات. تمكينه على وصلة محوّلات قد يعرّض الشبكة لحلقة STP.<\/div>\n<details class=\"expand study-detail\"><summary>لماذا تتجه بعض التصاميم إلى Layer 3؟<\/summary><div class=\"expand-body\">يذكر العرض أن Layer 3 Routing يسمح بمسارات مكررة دون الحاجة إلى حجب منافذ كما يفعل Spanning Tree، ولذلك تتجه بعض البيئات إلى جعل الربط بين طبقتي Access وDistribution من Layer 3 مع الإبقاء على Layer 2 قرب الأجهزة النهائية.<\/div><\/details>\n<div class=\"summary-box\"><h4>ما الذي يجب أن يبقى في ذهنك؟<\/h4><div class=\"summary-list\">\n  <div class=\"summary-item\">التكرار يحسن الاستمرارية لكنه قد يصنع Layer 2 Loop.<\/div>\n  <div class=\"summary-item\">STP يمنع الحلقة باختيار Root Bridge ومسار أقل تكلفة وحجب المسار البديل.<\/div>\n  <div class=\"summary-item\">BPDUs وBID وPort Cost هي أساس قرارات STA.<\/div>\n  <div class=\"summary-item\">RSTP وRapid PVST+ يقدمان تقاربًا أسرع مع مفاهيم أدوار مشابهة.<\/div>\n  <div class=\"summary-item\">PortFast يسرّع منافذ المستخدم، وBPDU Guard يحميها من BPDUs غير المتوقعة.<\/div>\n<\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: لماذا نستخدم PortFast وBPDU Guard معًا على منفذ مستخدم؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">PortFast يسرّع وصول الجهاز للشبكة، وBPDU Guard يحمي المنفذ إذا استقبل BPDU تدل على اتصال محوّل أو خطر حلقة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">PortFast<\/span><span class=\"term\">BPDU Guard<\/span><span class=\"term\">errdisabled<\/span><span class=\"term\">Layer 3<\/span><\/div>"}]}</script><script>(() => {

  class STPJourney{
    constructor(host){
      this.host=host;
      this.stage=0;
      this.playing=false;
      this.stageStarted=0;
      this.elapsedBeforePause=0;
      this.raf=0;
      this.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      host.innerHTML=markup();

      this.q=s=>host.querySelector(s);
      this.qa=s=>[...host.querySelectorAll(s)];

      this.prev=this.q('[data-stp-prev]');
      this.play=this.q('[data-stp-play]');
      this.next=this.q('[data-stp-next]');
      this.reset=this.q('[data-stp-reset]');
      this.dots=this.qa('[data-stp-stage]');
      this.tokenA=this.q('[data-token="a"]');
      this.tokenB=this.q('[data-token="b"]');
      this.tokenC=this.q('[data-token="c"]');
      this.frame=this.q('[data-frame]');
      this.ghost=this.q('[data-ghost-frame]');

      this.bind();
      this.applyStage(0,true);
      this.animate= this.animate.bind(this);
      this.raf=requestAnimationFrame(this.animate);
    }

    bind(){
      this.prev.addEventListener('click',()=>this.go(this.stage-1));
      this.next.addEventListener('click',()=>this.go(this.stage+1));
      this.reset.addEventListener('click',()=>{this.pause();this.go(0)});
      this.play.addEventListener('click',()=>this.playing?this.pause():this.start());
      this.dots.forEach(b=>b.addEventListener('click',()=>{
        this.pause();
        this.go(Number(b.dataset.stpStage));
      }));
    }

    start(){
      if(this.stage>=STAGES.length-1 && this.elapsedBeforePause>=DURATIONS[this.stage]){
        this.go(0);
      }
      this.playing=true;
      this.stageStarted=performance.now()-this.elapsedBeforePause;
      this.play.textContent='إيقاف مؤقت ❚❚';
      this.play.setAttribute('aria-label','إيقاف العرض مؤقتًا');
    }

    pause(){
      if(this.playing){
        this.elapsedBeforePause=Math.max(0,performance.now()-this.stageStarted);
      }
      this.playing=false;
      this.play.textContent='تشغيل ▶';
      this.play.setAttribute('aria-label','تشغيل العرض');
    }

    go(index,fromAuto=false){
      const n=Math.max(0,Math.min(STAGES.length-1,index));
      this.stage=n;
      this.elapsedBeforePause=0;
      if(this.playing || fromAuto) this.stageStarted=performance.now();
      this.applyStage(n);
    }

    applyStage(i,initial=false){
      const s=STAGES[i];
      this.q('[data-stage-no]').textContent=`المرحلة ${i+1} من ${STAGES.length}`;
      this.q('[data-stage-title]').textContent=s.title;
      this.q('[data-stage-body]').textContent=s.body;
      this.q('[data-stage-decision]').textContent=s.decision;

      this.prev.disabled=i===0;
      this.next.disabled=i===STAGES.length-1;
      this.dots.forEach((b,n)=>{
        b.classList.toggle('current',n===i);
        b.classList.toggle('done',n<i);
        b.setAttribute('aria-current',n===i?'step':'false');
      });

      const swS2=this.q('[data-switch="S2"]');
      swS2.classList.toggle('is-root',i>=2);

      this.qa('.stp-role').forEach(el=>el.classList.remove('show'));
      if(i>=3){
        this.q('[data-role="S1-F01-role"]').classList.add('show');
        this.q('[data-role="S3-F02-role"]').classList.add('show');
      }
      if(i>=4){
        this.q('[data-role="S2-F01-role"]').classList.add('show');
        this.q('[data-role="S2-F02-role"]').classList.add('show');
        this.q('[data-role="S3-F01-role"]').classList.add('show');
      }
      if(i>=5){
        this.q('[data-role="S1-F02-role"]').classList.add('show');
      }

      const top=this.q('[data-link="S3-S1"]');
      const left=this.q('[data-link="S3-S2"]');
      const right=this.q('[data-link="S2-S1"]');
      [top,left,right].forEach(l=>l.setAttribute('class','stp-link'));
      if(i>=3){
        left.classList.add('is-tree');
        right.classList.add('is-tree');
      }
      if(i===4) top.classList.add('is-segment');
      if(i>=5) top.classList.add('is-blocked');

      this.q('[data-block]').classList.toggle('show',i>=5);

      this.qa('.stp-callout').forEach(c=>c.classList.remove('show'));
      if(i===0){
        this.q('[data-callout="start-S1"]').classList.add('show');
        this.q('[data-callout="start-S2"]').classList.add('show');
        this.q('[data-callout="start-S3"]').classList.add('show');
      }
      if(i===3){
        this.q('[data-callout="cost-S1"]').classList.add('show');
        this.q('[data-callout="cost-S3"]').classList.add('show');
      }

      this.hideMoving();
      if(!initial){
        this.q('.stp-panel')?.animate(
          [{opacity:.72,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],
          {duration:220,easing:'ease-out'}
        );
      }
    }

    hideMoving(){
      [this.tokenA,this.tokenB,this.tokenC,this.frame,this.ghost].forEach(el=>{
        el.classList.remove('show');
        el.style.opacity='';
      });
    }

    setPos(el,p){
      el.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    }

    animate(now){
      if(!this.host.isConnected){
        cancelAnimationFrame(this.raf);
        return;
      }

      const elapsed=this.playing ? Math.max(0,now-this.stageStarted) : this.elapsedBeforePause;
      const dur=DURATIONS[this.stage];
      const t=Math.max(0,Math.min(1,elapsed/dur));

      this.animateStage(this.stage,t,now);

      if(this.playing && elapsed>=dur){
        if(this.stage<STAGES.length-1){
          this.go(this.stage+1,true);
        }else{
          this.pause();
          this.elapsedBeforePause=dur;
        }
      }

      this.raf=requestAnimationFrame(this.animate);
    }

    animateStage(stage,t,now){
      this.hideMoving();

      if(this.reduced){
        if(stage===1 || stage===2 || stage===3){
          this.tokenA.classList.add('show');
          this.setPos(this.tokenA,P.S2);
        }
        if(stage===6){
          this.frame.classList.add('show');
          this.setPos(this.frame,P.S3);
        }
        return;
      }

      if(stage===1){
        // ثلاث BPDUs تتحرك في حلقة ثم تعكس الاتجاه لتجسيد التبادل المستمر.
        const cycle=(t*2.4)%1;
        const rev=Math.floor(t*2.4)%2===1;
        const u=ease(rev?1-cycle:cycle);
        this.tokenA.classList.add('show');
        this.tokenB.classList.add('show');
        this.tokenC.classList.add('show');
        this.setPos(this.tokenA,point(P.S3,P.S1,u));
        this.setPos(this.tokenB,point(P.S1,P.S2,u));
        this.setPos(this.tokenC,point(P.S2,P.S3,u));
      }

      if(stage===2){
        // Superior BPDU from elected S2 propagates to S1 and S3.
        const u=ease(Math.min(1,t*1.3));
        this.tokenA.classList.add('show');
        this.tokenB.classList.add('show');
        this.setPos(this.tokenA,point(P.S2,P.S1,u));
        this.setPos(this.tokenB,point(P.S2,P.S3,u));
      }

      if(stage===3){
        // Root path cost pulses from the Root toward both non-root switches.
        const cycle=(t*1.8)%1;
        const u=ease(cycle);
        this.tokenA.classList.add('show');
        this.tokenB.classList.add('show');
        this.setPos(this.tokenA,point(P.S2,P.S1,u));
        this.setPos(this.tokenB,point(P.S2,P.S3,u));
      }

      if(stage===4){
        // Highlight the upper segment comparison by a BPDU moving from S3 to S1.
        const u=ease((t*1.25)%1);
        this.tokenA.classList.add('show');
        this.setPos(this.tokenA,point(P.S3,P.S1,u));
      }

      if(stage===5){
        // Small BPDU reaches the blocked side and visually stops.
        const u=ease(Math.min(.83,t*1.15));
        this.tokenA.classList.add('show');
        this.setPos(this.tokenA,point(P.S3,P.S1,u));
      }

      if(stage===6){
        // Actual frame travels S1 -> S2 -> S3.
        this.frame.classList.add('show');
        if(t<.5){
          this.setPos(this.frame,point(P.S1,P.S2,ease(t/.5)));
        }else{
          this.setPos(this.frame,point(P.S2,P.S3,ease((t-.5)/.5)));
        }

        // A ghost frame tries the direct path and stops at the blocked port.
        if(t>.08){
          this.ghost.classList.add('show');
          const g=Math.min(.18,ease((t-.08)/.35)*.18);
          this.setPos(this.ghost,point(P.S1,P.S3,g));
          this.ghost.style.opacity=String(Math.max(.12,.55-(t-.08)*.35));
        }
      }
    }
  }

  function mount(host){
    if(!host || host.dataset.stpMounted==='1') return;
    host.dataset.stpMounted='1';
    new STPJourney(host);
  }

  window.STPAnimation={mount};
  document.querySelectorAll('[data-stp-animation]').forEach(mount);
})();
