<script type="application/json" id="data">[{"schema_version":1,"module_number":3,"group_id":"02_VLAN_InterVLAN","title":"الوحدة 3 — VLANs (الشبكات المحلية الافتراضية)","title_en":"VLANs","badge":"VLANs","summary":"كيف تقسّم VLAN (الشبكة المحلية الافتراضية) شبكة Layer 2 إلى مجالات بث منطقية، وكيف تنتقل VLANs بين المحوّلات عبر Trunk ووسم 802.1Q، ثم كيفية إنشاء VLANs وربط المنافذ بها وتكوين Trunks وDTP والتحقق منها.","official_objective":"شرح الغرض من VLANs في الشبكات المحوّلة، وكيف تنتقل الإطارات وفق تكوين VLAN عبر عدة محوّلات، ثم تكوين منافذ Access وTrunk وDTP والتحقق منها.","lecture":{"duration":"≈ 90 دقيقة","steps":[{"time":"15 د","topic":"مفهوم VLAN وفوائد التقسيم وأنواع VLAN الأساسية."},{"time":"15 د","topic":"VLANs عبر عدة محوّلات: Trunk، عزل الحركة، ووسم IEEE 802.1Q."},{"time":"15 د","topic":"Native VLAN وVoice VLAN وكيفية التعامل مع الوسم."},{"time":"20 د","topic":"نطاقات VLAN وإنشاؤها وربط Access Ports وData/Voice VLANs والتحقق."},{"time":"15 د","topic":"تكوين Trunk، Allowed VLANs، Native VLAN والتحقق وإعادة الضبط."},{"time":"10 د","topic":"DTP: أوضاع التفاوض، النتائج، وأفضل ممارسة + مراجعة."}],"presentation_link":{"label":"عرض المحاضرة","href":"presentations/vlan_intervlan_pres.html"}},"sections":[{"id":"u3s1","number":"01","toc_title":"فكرة VLAN وفوائدها","title":"لماذا نستخدم VLAN (الشبكة المحلية الافتراضية)؟","subtitle":"VLAN تقسيم منطقي داخل البنية المحوّلة؛ الأجهزة قد تتشارك المحوّلات نفسها لكنها تصبح ضمن شبكات منطقية مستقلة.","body_html":"<p class=\"core\"><strong>VLAN (الشبكة المحلية الافتراضية)<\/strong> تجمع الأجهزة منطقيًا بدل أن يكون التجميع مرتبطًا بمكانها الفيزيائي فقط. كل VLAN تمثل شبكة منطقية منفصلة، وتُعزل داخلها حركة Broadcast وMulticast وUnicast الخاصة بها.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><h4>مجالات بث أصغر<\/h4><p>تقسيم LAN إلى VLANs يصغّر Broadcast Domain (مجال البث) ويحد من انتشار حركة البث.<\/p><\/div>\n<div class=\"card\"><h4>تنظيم وأمان أفضل<\/h4><p>يمكن جمع الأجهزة حسب الوظيفة أو الفريق أو التطبيق، ولا تتواصل VLANs المختلفة مباشرة من دون Layer 3.<\/p><\/div>\n<div class=\"card\"><h4>أداء وإدارة<\/h4><p>تقليل حركة البث وتحجيم المجموعات يساعدان على تحسين استخدام عرض النطاق وتبسيط الإدارة.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>قاعدة أساسية:<\/strong> لكل VLAN نطاق IP منطقي خاص بها عادةً، والأجهزة في VLAN مختلفة تحتاج Router (الموجّه) أو Layer 3 Switch (محوّل الطبقة الثالثة) حتى تتواصل.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: جهازان موصولان بالمحوّل نفسه لكن كل واحد في VLAN مختلفة؛ هل يمكنهما التواصل مباشرة على Layer 2؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. VLANs تفصل الشبكات منطقيًا، والتواصل بين VLANs يحتاج خدمة Routing (التوجيه) من جهاز Layer 3.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">VLAN (الشبكة المحلية الافتراضية)<\/span><span class=\"term\">Broadcast Domain (مجال البث)<\/span><span class=\"term\">Layer 2<\/span><span class=\"term\">Layer 3<\/span><\/div>"},{"id":"u3s2","number":"02","toc_title":"أنواع VLAN","title":"ليست كل VLANs للغرض نفسه","subtitle":"يميز المنهج بين Default وData وNative وManagement وVoice VLANs؛ ولكل واحدة وظيفة مختلفة.","body_html":"<div class=\"grid2\">\n<div class=\"card\"><h4>Default VLAN<\/h4><p><strong>VLAN 1<\/strong> هي VLAN الافتراضية، وتكون افتراضيًا أيضًا Native VLAN وManagement VLAN، ولا يمكن حذفها أو إعادة تسميتها. توصي Cisco بنقل الوظائف الافتراضية الحساسة إلى VLANs أخرى.<\/p><\/div>\n<div class=\"card\"><h4>Data VLAN<\/h4><p>مخصصة لحركة المستخدم العادية مثل البريد والويب. جميع المنافذ تكون في VLAN 1 افتراضيًا قبل إعادة توزيعها.<\/p><\/div>\n<div class=\"card\"><h4>Native VLAN<\/h4><p>تستخدم على Trunk. في 802.1Q تكون إطارات Native VLAN غير موسومة افتراضيًا، ويجب أن تتطابق Native VLAN على طرفي الوصلة.<\/p><\/div>\n<div class=\"card\"><h4>Management VLAN<\/h4><p>تستخدم لحركة الإدارة مثل SSH/Telnet، وغالبًا تكون هي VLAN التي توجد عليها SVI الخاصة بإدارة Switch (المحوّل).<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Voice VLAN:<\/strong> تحتاج حركة الصوت VLAN منفصلة بسبب حساسيتها للزمن والحاجة إلى عرض نطاق مضمون وأولوية QoS وتجنب الازدحام، ويذكر العرض هدف تأخير أقل من 150 ms من المصدر إلى الوجهة.<\/div>\n<details class=\"expand study-detail\"><summary>كيف يجتمع Data VLAN وVoice VLAN على منفذ Access واحد؟<\/summary><div class=\"expand-body\">يمكن لمنفذ Access أن ينتمي إلى Data VLAN واحدة، ومع ذلك يمكن أن يحدد أيضًا Voice VLAN للهاتف المتصل على المنفذ نفسه. يستخدم Switch بروتوكول CDP لإبلاغ هاتف Cisco بـ Voice VLAN، ويقوم الهاتف بوسم حركة الصوت الخاصة به ويمكنه استخدام CoS كأولوية Layer 2.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا نستخدم VLAN 1 كخيار مفضل للإدارة رغم أنها تعمل افتراضيًا؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن أفضل الممارسات في العرض توصي بفصل وظائف الإدارة والـNative عن VLAN 1 الافتراضية واستخدام VLANs مخصصة.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Data VLAN<\/span><span class=\"term\">Native VLAN<\/span><span class=\"term\">Management VLAN<\/span><span class=\"term\">Voice VLAN<\/span><\/div>"},{"id":"u3s3","number":"03","toc_title":"VLANs وTrunks","title":"كيف تمتد VLAN عبر عدة محوّلات؟","subtitle":"Trunk ينقل حركة أكثر من VLAN على وصلة واحدة بدل تخصيص وصلة منفصلة لكل VLAN.","body_html":"<p class=\"core\"><strong>Trunk (وصلة تنقل عدة VLANs)<\/strong> هي وصلة Point-to-Point بين جهازين شبكيين تسمح بمرور أكثر من VLAN، وتمكّن VLAN نفسها من الامتداد عبر عدة Switches (محولات). افتراضيًا يدعم Trunk جميع VLANs ما لم تُقيّد قائمة VLANs المسموح بها.<\/p>\n<div class=\"compare\">\n<div class=\"compare-box\"><span class=\"tag\">بدون VLANs<\/span><h4>مجال بث واسع<\/h4><p>تنتشر حركة Broadcast عبر الشبكة المحوّلة، ولا يوجد فصل منطقي بين المجموعات.<\/p><\/div>\n<div class=\"compare-box\"><span class=\"tag\">مع VLANs<\/span><h4>الحركة محصورة داخل VLAN<\/h4><p>Broadcast وMulticast وUnicast المرتبطة بالشبكة المنطقية تبقى داخل VLAN المناسبة، ولا تنتقل إلى VLAN أخرى من دون Layer 3.<\/p><\/div>\n<\/div>\n<div class=\"diagram\"><div class=\"diagram-title\">فكرة Trunk: وصلة واحدة بين Switches تحمل VLAN 10 و20 و30 بدل استخدام منفذ مستقل لكل VLAN.<\/div><div class=\"network-row\"><div class=\"lan-zone\"><span class=\"zone-title\">S1<\/span><div class=\"dev\">VLAN 10<\/div><div class=\"dev\">VLAN 20<\/div><\/div><div class=\"wire\"><span class=\"label\">802.1Q Trunk<\/span><\/div><div class=\"lan-zone\"><span class=\"zone-title\">S2<\/span><div class=\"dev\">VLAN 10<\/div><div class=\"dev\">VLAN 20<\/div><\/div><\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا نحتاج Trunk بين محوّلين إذا كانت VLAN 20 موجودة على كليهما؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن Trunk يسمح بتمرير حركة VLAN 20 ـ ومعها VLANs أخرى ـ عبر وصلة واحدة مع الحفاظ على هوية VLAN لكل Frame.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Trunk<\/span><span class=\"term\">Access Port<\/span><span class=\"term\">VLAN Segmentation<\/span><\/div>"},{"id":"u3s4","number":"04","toc_title":"وسم IEEE 802.1Q","title":"كيف يعرف الطرف الآخر لأي VLAN ينتمي Frame؟","subtitle":"802.1Q يضيف Tag إلى Frame أثناء عبوره Trunk ثم يزال قبل وصوله إلى الجهاز الطرفي.","body_html":"<p class=\"core\">يضيف معيار <strong>IEEE 802.1Q<\/strong> وسمًا بحجم <strong>4 Bytes<\/strong> إلى Frame أثناء عبوره Trunk. عند إضافة Tag يجب إعادة حساب FCS، وعند إزالة Tag قبل تسليم Frame إلى الجهاز الطرفي يعاد حساب FCS مرة أخرى.<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><h4>TPID / Type<\/h4><p>حقل 2 Bytes بالقيمة <strong>0x8100<\/strong> للدلالة على وجود وسم 802.1Q.<\/p><\/div>\n<div class=\"card\"><h4>User Priority<\/h4><p>قيمة 3 bits تستخدم للأولوية على Layer 2.<\/p><\/div>\n<div class=\"card\"><h4>CFI<\/h4><p>حقل 1 bit كما يورده العرض ضمن مكونات Tag.<\/p><\/div>\n<div class=\"card\"><h4>VID<\/h4><p>معرّف VLAN بطول 12 bits، ما يسمح نظريًا بـ4096 قيمة مع وجود نطاقات محجوزة/غير مستخدمة تشغيليًا.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>Native VLAN:<\/strong> في Trunk 802.1Q تكون VLAN الأصلية غير موسومة افتراضيًا، ويجب أن تكون Native VLAN نفسها على طرفي Trunk؛ عدم التطابق يؤدي إلى مشكلات.<\/div>\n<details class=\"expand study-detail\"><summary>Voice VLAN والوسم<\/summary><div class=\"expand-body\">هاتف VoIP يعمل كجهاز يحتوي عمليًا على منافذ للربط مع Switch وPC. يبلّغه Switch عن Voice VLAN بواسطة CDP، ويقوم الهاتف بوسم حركة الصوت وقد يضيف قيمة CoS. حركة PC قد تكون موسومة أو غير موسومة وفق التكوين.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أي جزء من 802.1Q يحدد رقم VLAN الذي ينتمي إليه Frame؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">VLAN ID (VID)، وهو حقل بطول 12 bits داخل 802.1Q Tag.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">IEEE 802.1Q<\/span><span class=\"term\">VLAN Tagging<\/span><span class=\"term\">Native VLAN<\/span><span class=\"term\">VID<\/span><\/div>"},{"id":"u3s5","number":"05","toc_title":"إنشاء VLAN وربط المنافذ","title":"من قاعدة البيانات إلى Access Port","subtitle":"ننشيء VLAN أولًا، نسميها، ثم نضع منفذ المستخدم في Access Mode ونربطه برقم VLAN المطلوب.","body_html":"<div class=\"compare\">\n<div class=\"compare-box\"><span class=\"tag\">Normal Range<\/span><h4>VLAN 1–1005<\/h4><ul><li>VLANs 1 و1002–1005 تُنشأ تلقائيًا ولا يمكن حذفها.<\/li><li>التكوين يُخزن في <strong>vlan.dat<\/strong> داخل Flash.<\/li><li>يستخدم عادة في بيئات صغيرة ومتوسطة.<\/li><\/ul><\/div>\n<div class=\"compare-box\"><span class=\"tag\">Extended Range<\/span><h4>VLAN 1006–4095<\/h4><ul><li>يستخدم في بيئات أوسع مثل مزودي الخدمة.<\/li><li>يظهر ضمن Running-Config بحسب العرض.<\/li><li>له اعتبارات VTP وميزات أقل في المنصات التي يتناولها المنهج.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"cmd study-detail\">configure terminal<br/>vlan 20<br/> name student<br/>interface fa0/18<br/> switchport mode access<br/> switchport access vlan 20<br/>end<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><h4>التحقق<\/h4><div class=\"cmd study-detail\">show vlan brief<br/>show vlan id 20<br/>show vlan name student<br/>show vlan summary<br/>show interfaces fa0/18 switchport<\/div><\/div>\n<div class=\"card\"><h4>تغيير العضوية<\/h4><p>أعد تنفيذ <code>switchport access vlan vlan-id<\/code> لاختيار VLAN أخرى. واستخدام <code>no switchport access vlan<\/code> يعيد المنفذ إلى VLAN 1.<\/p><\/div>\n<\/div>\n<details class=\"expand study-detail\"><summary>Data VLAN + Voice VLAN على المنفذ نفسه<\/summary><div class=\"expand-body\"><div class=\"cmd study-detail\">vlan 20<br/> name student<br/>vlan 150<br/> name VOICE<br/>interface fa0/18<br/> switchport mode access<br/> switchport access vlan 20<br/> mls qos trust cos<br/> switchport voice vlan 150<\/div><p>يوضح العرض أن QoS نفسه خارج نطاق المقرر، لكن الأمر يظهر في المثال لتوضيح أولوية الصوت.<\/p><\/div><\/details>\n<details class=\"expand study-detail\"><summary>حذف VLAN: ماذا يحدث للمنافذ؟<\/summary><div class=\"expand-body\"><p>استخدم <code>no vlan vlan-id<\/code> لحذف VLAN محددة. يجب نقل المنافذ منها أولًا. حذف قاعدة VLAN كاملة يتم بـ <code>delete flash:vlan.dat<\/code> أو <code>delete vlan.dat<\/code> ثم Reload وفق سيناريو العرض.<\/p><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أنشأت VLAN 20 لكن PC ما زال ضمن VLAN 1. ما الخطوة الناقصة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تكوين منفذ PC كـAccess Port ثم ربطه بـVLAN 20 باستخدام switchport access vlan 20.<\/div><\/div>"},{"id":"u3s6","number":"06","toc_title":"تكوين Trunk والتحقق","title":"اجعل وصلة Trunk واضحة ومحددة","subtitle":"أفضل التكوينات هي التي تحدد Mode وNative VLAN وAllowed VLANs صراحةً ثم تتحقق من الحالة التشغيلية.","body_html":"<div class=\"cmd study-detail\">interface fa0/1<br/> switchport mode trunk<br/> switchport trunk native vlan 99<br/> switchport trunk allowed vlan 10,20,30,99<br/>end<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><h4>Administrative vs Operational<\/h4><p>التحقق لا يكتفي بما كتبته في الإعداد. يجب أن ترى أن المنفذ <strong>trunk إداريًا وتشغيليًا<\/strong> وأن Encapsulation هو dot1q وأن Native VLAN صحيحة.<\/p><\/div>\n<div class=\"card\"><h4>Allowed VLANs<\/h4><p>يمكن تقييد VLANs التي تعبر Trunk. وإذا لم تُحدد القائمة، يكون السلوك الافتراضي السماح بـVLANs المدعومة على الوصلة بحسب المنصة.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">show interfaces fa0/1 switchport<br/>show interfaces trunk<\/div>\n<details class=\"expand study-detail\"><summary>إعادة Trunk إلى القيم الافتراضية أو إلى Access<\/summary><div class=\"expand-body\"><div class=\"cmd study-detail\">interface fa0/1<br/> no switchport trunk allowed vlan<br/> no switchport trunk native vlan<br/><br/>! لإعادته Access<br/> switchport mode access<\/div><p>بعد إزالة إعداد Native VLAN تعود إلى VLAN 1، وبعد إزالة Allowed VLAN list تعود السياسة الافتراضية. استخدم أوامر show للتحقق.<\/p><\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: كلا الطرفين Trunk لكن كل طرف يستخدم Native VLAN مختلفة. هل التكوين صحيح؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. يجب أن تتطابق Native VLAN على طرفي Trunk حتى لا يحدث Native VLAN mismatch وما يترتب عليه من مشكلات.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Trunk<\/span><span class=\"term\">Allowed VLANs<\/span><span class=\"term\">Native VLAN<\/span><span class=\"term\">802.1Q<\/span><\/div>"},{"id":"u3s7","number":"07","toc_title":"DTP","title":"DTP: متى يصبح الرابط Trunk تلقائيًا؟","subtitle":"DTP بروتوكول Cisco للتفاوض على Trunk، لكن أفضل ممارسة في العرض هي التكوين الثابت وإيقاف التفاوض عند عدم الحاجة.","body_html":"<p class=\"core\"><strong>DTP (Dynamic Trunking Protocol)<\/strong> بروتوكول مملوك لـCisco للتفاوض على وضع الوصلة. وفق Instructor Materials وفي سياق Catalyst 2960/2950 الذي يشرحه العرض، يظهر Dynamic Auto كوضع افتراضي؛ لا تُعامل هذه العبارة كقاعدة عامة لكل منصات Cisco.<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><h4>dynamic auto<\/h4><p>لا يبادر؛ يصبح Trunk إذا كان الطرف الآخر Trunk أو Dynamic Desirable.<\/p><\/div>\n<div class=\"card\"><h4>dynamic desirable<\/h4><p>يبادر بالتفاوض ليصبح Trunk، وينجح مع Auto أو Desirable أو Trunk.<\/p><\/div>\n<div class=\"card\"><h4>trunk<\/h4><p>وضع Trunk دائم، ويستطيع التفاوض مع الطرف الآخر ما لم توقف DTP.<\/p><\/div>\n<div class=\"card\"><h4>access<\/h4><p>وضع Access دائم؛ الجمع بين Trunk ثابت وAccess ثابت يؤدي إلى اتصال محدود/غير صحيح.<\/p><\/div>\n<\/div>\n<div class=\"cmd study-detail\">switchport mode trunk<br/>switchport nonegotiate<br/><br/>! أو<br/>switchport mode dynamic auto<br/><br/>show dtp interface<\/div>\n<div class=\"keyline\"><strong>Best Practice:<\/strong> يوصي العرض بتحديد المنافذ صراحةً كـAccess أو Trunk وإيقاف DTP عندما لا يكون التفاوض مطلوبًا، لتقليل مشكلات التفاوض غير المقصود.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: إذا كان الطرفان Dynamic Auto، ماذا تصبح الوصلة؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Access؛ لأن أي طرف منهما لا يبادر بتكوين Trunk.<\/div><\/div>"},{"id":"u3s8","number":"✓","toc_title":"خلاصة الوحدة 3","title":"ماذا يجب أن يبقى في ذهنك؟","subtitle":"العلاقة بين VLAN وAccess وTrunk و802.1Q وDTP هي جوهر الوحدة.","body_html":"<div class=\"summary-box\"><h4>الخلاصة الذهنية<\/h4><div class=\"summary-list\">\n<div class=\"summary-item\">VLAN تقسيم منطقي يجعل كل VLAN شبكة مستقلة ومجال بث أصغر.<\/div>\n<div class=\"summary-item\">Access Port يخدم Data VLAN واحدة، ويمكن أن يضيف Voice VLAN عند وجود هاتف IP مع جهاز طرفي.<\/div>\n<div class=\"summary-item\">Trunk يحمل أكثر من VLAN بين الأجهزة الشبكية ويستخدم 802.1Q للحفاظ على هوية VLAN.<\/div>\n<div class=\"summary-item\">802.1Q Tag حجمه 4 Bytes ويتضمن VID؛ أما Native VLAN فتكون غير موسومة افتراضيًا ويجب أن تتطابق على الطرفين.<\/div>\n<div class=\"summary-item\">VLANs ذات النطاق الطبيعي تحفظ في vlan.dat وفق المنصات المعروضة، ويمكن إنشاء VLAN وتسميتها ثم ربط منافذ Access بها.<\/div>\n<div class=\"summary-item\">DTP يتفاوض على Trunk، لكن التكوين الثابت مع تعطيل التفاوض هو أفضل ممارسة عندما لا نحتاج DTP.<\/div>\n<\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: ما العلاقة بين Access Port وTrunk و802.1Q؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">Access Port يخدم VLAN بيانات واحدة عادةً، بينما Trunk ينقل عدة VLANs، ويستخدم 802.1Q لوسم الإطارات وتمييز VLAN.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">VLAN<\/span><span class=\"term\">Access Port<\/span><span class=\"term\">Trunk<\/span><span class=\"term\">IEEE 802.1Q<\/span><span class=\"term\">Native VLAN<\/span><span class=\"term\">Voice VLAN<\/span><span class=\"term\">DTP<\/span><\/div>"}],"review":{"committee":"theory_content_committee","status":"approved","approved":true,"review_date":"2026-09-06","notes":["تمت مطابقة الداتا مع المحاور الخمسة في Instructor Materials: Overview of VLANs، Multi-Switched Environment، VLAN Configuration، VLAN Trunks، وDTP.","تم تضمين نطاقات VLAN، 802.1Q Tag، Native/Voice VLAN، أوامر الإنشاء والتعيين والتحقق والحذف، Trunk وDTP ضمن المسار الأساسي أو التفاصيل القابلة للطي.","أنشطة Packet Tracer والمختبرات لم تُنسخ إلى الجزء النظري لأنها موجودة ضمن المسار العملي للمشروع.","توجد في شريحة Module Objectives بالملف عبارة Protocols and Models وهدف غير متعلق بـVLANs؛ اعتبرتها اللجنة خطأً ظاهرًا في العرض واعتمدت Topic Objectives الخاصة بالوحدة لبناء الهدف التعليمي.","لم يتم تعديل التصميم أو إضافة مكونات CSS جديدة.","جولة المراجعة المتقاطعة: خُففت كثافة CLI بجعل تفاصيله مرجعية، وربطت ملاحظة DTP بمنصة العرض، وأضيف سؤال ختامي."],"cross_review_corrections_applied":true}},{"schema_version":1,"module_number":4,"group_id":"02_VLAN_InterVLAN","title":"الوحدة 4 — Inter-VLAN Routing (التوجيه بين شبكات VLAN)","title_en":"Inter-VLAN Routing","badge":"Inter-VLAN Routing","summary":"لماذا لا تتواصل VLANs المختلفة مباشرة، وما الخيارات الثلاثة للتوجيه بينها، وكيف يعمل Router-on-a-Stick وLayer 3 Switch، ثم كيف نتحقق من التكوين ونشخّص أخطاء VLAN وTrunk وAccess وSubinterfaces.","official_objective":"استكشاف أخطاء Inter-VLAN Routing (التوجيه بين شبكات VLAN) على أجهزة Layer 3، مع فهم خيارات التكوين وتطبيق Router-on-a-Stick وLayer 3 Switching.","lecture":{"duration":"≈ 85 دقيقة","steps":[{"time":"15 د","topic":"لماذا نحتاج Inter-VLAN Routing؟ مقارنة Legacy وRouter-on-a-Stick وLayer 3 Switch."},{"time":"20 د","topic":"Router-on-a-Stick: Trunk، Subinterfaces، 802.1Q والبوابات الافتراضية."},{"time":"10 د","topic":"التحقق من Router-on-a-Stick باستخدام ping وshow commands."},{"time":"20 د","topic":"Layer 3 Switch: SVIs، ip routing، Routed Port والاتصال بشبكات Layer 3 أخرى."},{"time":"15 د","topic":"استكشاف الأعطال: VLAN مفقودة، Trunk، Access Port، إعداد Router/Subinterface."},{"time":"5 د","topic":"مراجعة العلاقات الأساسية وخط سير التشخيص."}],"presentation_link":{"label":"عرض المحاضرة","href":"presentations/vlan_intervlan_pres.html"}},"sections":[{"id":"u4s1","number":"01","toc_title":"خيارات Inter-VLAN Routing","title":"كيف تتواصل VLAN مع VLAN أخرى؟","subtitle":"Layer 2 يفصل VLANs؛ وللانتقال من شبكة VLAN إلى أخرى نحتاج قرار Routing على Layer 3.","body_html":"<p class=\"core\"><strong>Inter-VLAN Routing (التوجيه بين شبكات VLAN)<\/strong> هو تمرير حركة الشبكة من VLAN إلى VLAN أخرى. الأجهزة داخل VLAN مختلفة لا تتواصل مباشرة ما لم يوفر Router (الموجّه) أو Layer 3 Switch (محوّل الطبقة الثالثة) خدمة التوجيه.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><div class=\"micro\">Legacy<\/div><h4>واجهة فعلية لكل VLAN<\/h4><p>كل واجهة Ethernet في Router تتصل بمنفذ Switch داخل VLAN مختلفة وتعمل كبوابة افتراضية. تعمل، لكنها لا تتوسع جيدًا بسبب محدودية الواجهات الفيزيائية.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">Small / Medium<\/div><h4>Router-on-a-Stick<\/h4><p>واجهة Ethernet فعلية واحدة تحمل Trunk 802.1Q، وتقسّم منطقيًا إلى Subinterfaces؛ كل واجهة فرعية تمثل VLAN وشبكة IP مختلفة.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">Medium / Large<\/div><h4>Layer 3 Switch<\/h4><p>يستخدم SVIs للتوجيه داخل الجهاز نفسه، وهو الحل الأكثر قابلية للتوسع في الشبكات المؤسسية وفق العرض.<\/p><\/div>\n<\/div>\n<div class=\"keyline\"><strong>اختيار الحل:<\/strong> Legacy للتفسير التاريخي فقط، Router-on-a-Stick مناسب لشبكة صغيرة إلى متوسطة، وLayer 3 Switch هو الحل الحديث الأكثر قابلية للتوسع.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: لماذا لا يكفي Trunk وحده لكي يتواصل PC في VLAN 10 مع PC في VLAN 20؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لأن Trunk ينقل VLANs على Layer 2 فقط. الانتقال بين شبكتين منطقيتين مختلفتين يحتاج Routing على Layer 3.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Inter-VLAN Routing<\/span><span class=\"term\">Router-on-a-Stick<\/span><span class=\"term\">Layer 3 Switch<\/span><span class=\"term\">SVI<\/span><\/div>"},{"id":"u4s2","number":"02","toc_title":"Router-on-a-Stick","title":"واجهة فعلية واحدة، وعدة Subinterfaces","subtitle":"الفكرة الأساسية: Trunk يصل إلى Router، وكل VLAN تُربط بواجهة فرعية لها عنوان IP يمثل Default Gateway لتلك VLAN.","body_html":"<p class=\"core\">في <strong>Router-on-a-Stick (التوجيه عبر واجهة الموجّه واحدة)<\/strong> يتصل Router بـSwitch باستخدام وصلة 802.1Q Trunk واحدة. تُقسّم الواجهة الفيزيائية إلى <strong>Subinterfaces (واجهات فرعية)<\/strong>، وكل Subinterface مرتبطة بـVLAN واحدة وشبكة IP مستقلة.<\/p>\n<div class=\"flow\">\n<div class=\"step\"><b>1 · Frame من VLAN 10<\/b><span>يصل موسومًا عبر Trunk.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>2 · Subinterface 10<\/b><span>يفك Router سياق VLAN ويستقبل Packet على واجهة VLAN المناسبة.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>3 · Routing Decision<\/b><span>يقرر الوجهة اعتمادًا على شبكة IP.<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>4 · Subinterface 20<\/b><span>يعيد تغليف Frame بوسم VLAN 20 ويعيده عبر الواجهة نفسها.<\/span><\/div>\n<\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية المسار<\/div>\n<div class=\"keyline\"><strong>قابلية التوسع:<\/strong> وفق عرض Cisco في هذا المقرر، يُذكر أن Router-on-a-Stick لا يتوسع جيدًا بعد نحو <strong>50 VLAN<\/strong>. هذه قيمة تعليمية مرتبطة بسياق العرض وليست حدًا هندسيًا ثابتًا لكل تصميم.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: هل Subinterface منفذ فيزيائي مستقل؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">لا. هي واجهة منطقية Software-based مرتبطة بواجهة Ethernet فيزيائية واحدة.<\/div><\/div>"},{"id":"u4s3","number":"03","toc_title":"تكوين Router-on-a-Stick","title":"تكوين الطرفين: Switch ثم Router","subtitle":"نجاح Router-on-a-Stick يعتمد على VLANs وAccess Ports وTrunk من جهة، وSubinterfaces صحيحة من جهة Router.","body_html":"<div class=\"grid2\">\n<div class=\"card\"><h4>على Switch<\/h4><ol><li>إنشاء VLANs وتسميتها.<\/li><li>إنشاء Management SVI عند الحاجة.<\/li><li>ربط منافذ المستخدمين بـVLANs الصحيحة.<\/li><li>تكوين المنفذ المتجه إلى Router كـTrunk.<\/li><\/ol><\/div>\n<div class=\"card\"><h4>على Router<\/h4><ol><li>إنشاء Subinterface لكل VLAN تحتاج Routing.<\/li><li>تحديد 802.1Q VLAN ID بواسطة <code>encapsulation dot1q<\/code>.<\/li><li>إعطاء كل Subinterface عنوانًا من شبكة VLAN ليصبح Default Gateway.<\/li><li>تفعيل الواجهة الفيزيائية بـ<code>no shutdown<\/code>.<\/li><\/ol><\/div>\n<\/div>\n<div class=\"cmd study-detail\">interface g0/0/1.10<br/> description Default Gateway for VLAN 10<br/> encapsulation dot1q 10<br/> ip address 192.168.10.1 255.255.255.0<br/><br/>interface g0/0/1.20<br/> description Default Gateway for VLAN 20<br/> encapsulation dot1q 20<br/> ip address 192.168.20.1 255.255.255.0<br/><br/>interface g0/0/1.99<br/> encapsulation dot1q 99<br/> ip address 192.168.99.1 255.255.255.0<br/><br/>interface g0/0/1<br/> no shutdown<\/div>\n<details class=\"expand study-detail\"><summary>Native VLAN على Router-on-a-Stick<\/summary><div class=\"expand-body\">صيغة الأمر هي <code>encapsulation dot1q vlan-id [native]<\/code>. تستخدم كلمة <code>native<\/code> عندما تريد تحديد Subinterface التي تستقبل Native VLAN غير الموسومة إذا كانت Native VLAN مختلفة عن السلوك الافتراضي.<\/div><\/details>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: أنشأت جميع Subinterfaces صحيحة لكن الواجهة الفيزيائية g0/0/1 ما زالت shutdown. ماذا يحدث؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تتوقف جميع Subinterfaces التابعة لها؛ يجب تفعيل الواجهة الفيزيائية بـno shutdown.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Subinterface<\/span><span class=\"term\">encapsulation dot1q<\/span><span class=\"term\">Default Gateway<\/span><\/div>"},{"id":"u4s4","number":"04","toc_title":"التحقق من Router-on-a-Stick","title":"لا تعتبر التكوين ناجحًا قبل التحقق من الطرفين","subtitle":"ابدأ من Host ثم Router ثم Switch؛ ping يخبرك بوجود المشكلة، وأوامر show تساعدك على تحديد مكانها.","body_html":"<div class=\"grid2\">\n<div class=\"card\"><div class=\"micro\">Host<\/div><h4>ipconfig + ping<\/h4><p>تحقق من عنوان الجهاز وقناعه والبوابة الافتراضية، ثم اختبر الوصول إلى جهاز في VLAN أخرى.<\/p><\/div>\n<div class=\"card\"><div class=\"micro\">Router<\/div><h4>واجهات ومسارات<\/h4><div class=\"cmd\">show ip route<br/>show ip interface brief<br/>show interfaces<\/div><\/div>\n<div class=\"card\"><div class=\"micro\">Switch<\/div><h4>حالة Trunk<\/h4><div class=\"cmd\">show interfaces trunk<br/>show interfaces switchport<\/div><\/div>\n<div class=\"card\"><div class=\"micro\">الهدف<\/div><h4>اختبر خطوة بخطوة<\/h4><p>اختبر البوابة المحلية أولًا، ثم VLAN الأخرى، ثم أجهزة الإدارة. لا تنتقل إلى فرضية معقدة قبل التأكد من الطبقات الأساسية.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: PC لا يصل إلى VLAN أخرى. أي أمر على Switch يؤكد أن الوصلة إلى Router تعمل كـTrunk؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">show interfaces trunk، ثم يمكن فحص إعداد المنفذ نفسه عند الحاجة.<\/div><\/div>"},{"id":"u4s5","number":"05","toc_title":"Layer 3 Switch وSVIs","title":"التوجيه داخل Switch نفسه","subtitle":"في Layer 3 Switch تصبح SVI الخاصة بكل VLAN هي بوابتها الافتراضية، ويقوم الجهاز بالتحويل والتوجيه Hardware-based.","body_html":"<p class=\"core\">يستخدم <strong>Layer 3 Switch (محوّل الطبقة الثالثة)<\/strong> عدة <strong>SVIs<\/strong> للتوجيه بين VLANs. تنشأ SVI لكل VLAN قابلة للتوجيه، ويكون عنوان IP على SVI هو Default Gateway للأجهزة داخل تلك VLAN.<\/p>\n<div class=\"flow\"><div class=\"step\"><b>1 · أنشئ VLANs<\/b><span>مثل VLAN 10 و20.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>2 · أنشئ SVIs<\/b><span>عنوان IP لكل VLAN.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>3 · Access Ports<\/b><span>ضع المستخدمين في VLANs الصحيحة.<\/span><\/div><div class=\"arrow\">←<\/div><div class=\"step\"><b>4 · ip routing<\/b><span>فعّل IPv4 Routing بين SVIs.<\/span><\/div><\/div>\n<div class=\"swipe-hint\">↔ اسحب لرؤية بقية الخطوات<\/div>\n<div class=\"cmd study-detail\">vlan 10<br/>vlan 20<br/><br/>interface vlan 10<br/> ip address 192.168.10.1 255.255.255.0<br/> no shutdown<br/><br/>interface vlan 20<br/> ip address 192.168.20.1 255.255.255.0<br/> no shutdown<br/><br/>ip routing<\/div>\n<div class=\"grid2\">\n<div class=\"card\"><h4>مزايا<\/h4><ul><li>معالجة Hardware-based أسرع.<\/li><li>لا تحتاج وصلة خارجية إلى Router للتوجيه بين VLANs المحلية.<\/li><li>Latency أقل.<\/li><li>قابلية توسع أعلى ويمكن استخدام EtherChannel بين المحوّلات لزيادة عرض النطاق.<\/li><\/ul><\/div>\n<div class=\"card\"><h4>المقابل<\/h4><p>العيب الذي يذكره العرض هو أن Layer 3 Switch أعلى تكلفة من الحلول الأبسط.<\/p><\/div>\n<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ما الأمر الذي يحول Layer 3 Switch من مجرد وجود SVIs إلى تنفيذ IPv4 Routing بينها؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">الأمر global configuration: ip routing.<\/div><\/div>"},{"id":"u4s6","number":"06","toc_title":"Routed Port والربط الخارجي","title":"عندما يحتاج Layer 3 Switch إلى شبكة Layer 3 أخرى","subtitle":"يمكن تحويل منفذ Layer 2 إلى Routed Port ليصبح شبيهًا بواجهة Router فعلية.","body_html":"<p class=\"core\">إذا احتاج Layer 3 Switch إلى الاتصال بـRouter أو Layer 3 Switch آخر، يمكن تحويل منفذ من Switchport إلى <strong>Routed Port (منفذ موجّه)<\/strong> باستخدام <code>no switchport<\/code>، ثم إعطائه عنوان IPv4 وتفعيله.<\/p>\n<div class=\"cmd study-detail\">interface g1/0/1<br/> no switchport<br/> ip address 10.10.10.2 255.255.255.0<br/> no shutdown<br/>exit<br/>ip routing<\/div>\n<div class=\"keyline\"><strong>بعد ذلك:<\/strong> الشبكات المحلية خلف Layer 3 Switch تحتاج طريقة Routing حتى تصبح معروفة لدى أجهزة Layer 3 الأخرى: Static أو Dynamic Routing. يستخدم العرض OSPF كمثال، لكنه يوضح أن فهم تكوين OSPF نفسه ليس مطلوبًا في هذه الوحدة.<\/div>\n<div class=\"grid2 study-detail\"><div class=\"card\"><h4>التحقق من Routing<\/h4><div class=\"cmd study-detail\">show ip route<\/div><\/div><div class=\"card\"><h4>التحقق من Reachability<\/h4><div class=\"cmd study-detail\">ping &lt;destination-ip&gt;<\/div><\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: ماذا يفعل no switchport على منفذ Layer 3 Switch؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">يعطل وظيفة Layer 2 Switchport ويحوّل المنفذ إلى Layer 3 Routed Port يمكن إعطاؤه عنوان IP.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Routed Port<\/span><span class=\"term\">no switchport<\/span><span class=\"term\">ip routing<\/span><\/div>"},{"id":"u4s7","number":"07","toc_title":"استكشاف أخطاء Inter-VLAN","title":"شخّص من الأسفل إلى الأعلى","subtitle":"أغلب الأعطال ترجع إلى VLAN مفقودة، أو Trunk غير صحيح، أو Access Port في VLAN خاطئة، أو Subinterface غير مطابقة.","body_html":"<div class=\"flow\">\n<div class=\"step\"><b>VLAN<\/b><span>هل VLAN موجودة ومسموح بها؟<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>Access Port<\/b><span>هل المنفذ في VLAN الصحيحة؟<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>Trunk<\/b><span>هل الوصلة Trunk والـNative/Allowed متطابقة؟<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>Subinterface / SVI<\/b><span>هل 802.1Q والعنوان صحيحان؟<\/span><\/div><div class=\"arrow\">←<\/div>\n<div class=\"step\"><b>Gateway / Routing<\/b><span>هل البوابة وخدمة التوجيه تعملان؟<\/span><\/div>\n<\/div>\n<p class=\"core\">ابدأ دائمًا بالطبقة الفيزيائية: الكابل والمنفذ. إذا كان الاتصال الفيزيائي صحيحًا، انتقل إلى VLAN وAccess وTrunk ثم Router/Subinterfaces.<\/p>\n<div class=\"grid2\">\n<div class=\"card\"><h4>1 · Missing VLAN<\/h4><p>قد تكون VLAN غير منشأة، محذوفة، أو غير مسموح بها على Trunk. عند حذف VLAN تصبح المنافذ المرتبطة بها inactive حتى تعيد إنشاء VLAN أو تنقلها إلى VLAN أخرى.<\/p><div class=\"cmd\">show vlan brief<br/>show interfaces fa0/6 switchport<\/div><\/div>\n<div class=\"card\"><h4>2 · Trunk Issue<\/h4><p>في Router-on-a-Stick يعد Trunk الخاطئ سببًا شائعًا. تحقق أن منفذ Router ظاهر ضمن Trunks وأن VLANs المطلوبة مسموحة.<\/p><div class=\"cmd\">show interfaces trunk<br/>show running-config interface fa0/1<\/div><\/div>\n<div class=\"card\"><h4>3 · Access Port Issue<\/h4><p>إذا كان PC مضبوطًا بعنوان وقناع وبوابة صحيحة لكنه لا يستطيع Ping للبوابة، تحقق من VLAN الخاصة بمنفذ Access.<\/p><div class=\"cmd\">show vlan brief<br/>show interfaces fa0/6 switchport<br/>show running-config interface fa0/6<\/div><\/div>\n<div class=\"card\"><h4>4 · Router/Subinterface Issue<\/h4><p>تحقق من حالة Subinterfaces، عناوين IP، وVLAN ID داخل encapsulation dot1q.<\/p><div class=\"cmd\">show ip interface brief<br/>show interfaces | include Gig|802.1Q<\/div><\/div>\n<\/div>\n<div class=\"keyline\"><strong>تسلسل عملي:<\/strong> Physical → VLAN موجودة → Access Port صحيح → Trunk صحيح → Subinterface/Encapsulation صحيح → IP/Gateway صحيح → Routing/Connectivity.<\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال فهم: PC عنوانه والبوابة صحيحة، لكنه لا يستطيع Ping للبوابة نفسها. ما أول إعداد Layer 2 يستحق الفحص؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">عضوية VLAN لمنفذ Access الخاص بالـPC، ثم وجود VLAN وحالتها.<\/div><\/div>"},{"id":"u4s8","number":"✓","toc_title":"خلاصة الوحدة 4","title":"ماذا يجب أن يبقى في ذهنك؟","subtitle":"أي Inter-VLAN Routing ناجح يحتاج تطابق Layer 2 مع Layer 3.","body_html":"<div class=\"summary-box\"><h4>الخلاصة الذهنية<\/h4><div class=\"summary-list\">\n<div class=\"summary-item\">VLANs لا تتواصل مع بعضها مباشرة؛ Inter-VLAN Routing يحتاج Router أو Layer 3 Switch.<\/div>\n<div class=\"summary-item\">Legacy يستخدم واجهة Router فعلية لكل VLAN وهو غير قابل للتوسع عمليًا.<\/div>\n<div class=\"summary-item\">Router-on-a-Stick يستخدم Trunk واحدًا وعدة Subinterfaces، وكل Subinterface ترتبط بـVLAN وشبكة IP مختلفة.<\/div>\n<div class=\"summary-item\">Layer 3 Switch يستخدم SVI لكل VLAN ويفعّل التوجيه بأمر ip routing.<\/div>\n<div class=\"summary-item\">no switchport يحول منفذًا إلى Routed Port للاتصال بأجهزة Layer 3 أخرى.<\/div>\n<div class=\"summary-item\">استكشاف الأخطاء يبدأ من VLAN/Access/Trunk ثم Subinterface وIP، وليس بتغيير الإعدادات عشوائيًا.<\/div>\n<\/div><\/div>\n<div class=\"quiz\"><div class=\"quiz-row\"><b>سؤال ختامي: إذا نجح الاتصال داخل VLAN وفشل بين VLANs، ما أول نقطة Layer 3 تتحقق منها؟<\/b><button class=\"chipbtn\" onclick=\"toggleAnswer(this)\">اعرض الإجابة<\/button><\/div><div class=\"answer\">تحقق من Default Gateway وSubinterface/SVI الخاصة بكل VLAN ثم من خدمة Routing.<\/div><\/div>\n<div class=\"terms\"><span class=\"term\">Inter-VLAN Routing<\/span><span class=\"term\">Router-on-a-Stick<\/span><span class=\"term\">Subinterface<\/span><span class=\"term\">Layer 3 Switch<\/span><span class=\"term\">SVI<\/span><span class=\"term\">Routed Port<\/span><\/div>"}],"review":{"committee":"theory_content_committee","status":"approved","approved":true,"review_date":"2026-09-06","notes":["تمت مطابقة الداتا مع المحاور الأربعة الرسمية: Inter-VLAN Routing Operation، Router-on-a-Stick، Layer 3 Switches، وTroubleshooting.","تم تضمين الخيارات الثلاثة، Subinterfaces و802.1Q، التحقق، SVIs وip routing، Routed Port وno switchport، ومسار استكشاف الأخطاء.","ذُكر OSPF فقط كمرجع سياقي لأن العرض نفسه ينص على أن فهم تكوين OSPF ليس مطلوبًا في هذه الوحدة.","أنشطة Packet Tracer والمختبرات لم تُنسخ إلى الجزء النظري لأنها تنتمي للمسار العملي.","لم يتم تعديل التصميم أو إضافة مكونات CSS جديدة.","جولة المراجعة المتقاطعة: تم تقييد قيمة 50 VLAN بسياق العرض، وخُففت كثافة CLI، وأضيف مسار تشخيص VLAN → Access → Trunk → Subinterface/SVI → Gateway/Routing."],"cross_review_corrections_applied":true}}]</script><script>

const quizzes={3:{q:'هل يستطيع جهاز في VLAN 10 إرسال بث Layer 2 إلى جهاز في VLAN 20 عبر Trunk فقط؟',answers:['نعم، لأن Trunk يحمل VLANs متعددة','لا، تحتاج الشبكتان إلى توجيه Layer 3 للاتصال، ولا يُنقل إطار البث بينهما','نعم، إذا تطابقت Native VLAN'],correct:1,reason:'كل VLAN مجال بث منفصل. Trunk ينقل حركة كل VLAN مع الحفاظ على هويتها؛ التوجيه بين الشبكات يحتاج جهاز Layer 3.'},4:{q:'في Router-on-a-Stick، ما الذي يجب أن يطابق رقم VLAN على وصلة Trunk؟',answers:['اسم الجهاز المضيف فقط','encapsulation dot1Q على الواجهة الفرعية في Router','سرعة منفذ Access فقط'],correct:1,reason:'تستخدم كل واجهة فرعية رقم VLAN مطابقًا لوسم 802.1Q، وعنوانها يمثل بوابة تلك VLAN.'}};

function sceneMarkup(s){const isTrunk=s.type==='trunk';return `<div class="kicker">الوحدة ${s.module.module_number} · عرض حركي تفاعلي</div><h2>${escape(s.title)}</h2><div class="scene"><div class="scene-controls">${isTrunk?'<label>VLAN <select id="vlan"><option value="10">10</option><option value="20">20</option><option value="99">99 (Native)</option></select></label><label>منفذ المستقبِل <select id="target"><option value="10">VLAN 10</option><option value="20">VLAN 20</option><option value="99">VLAN 99</option></select></label>':'<label>طريقة التوجيه <select id="method"><option value="none">دون توجيه (للمقارنة)</option><option value="legacy">Legacy · منافذ فعلية</option><option value="router">Router-on-a-Stick</option><option value="l3">Layer 3 Switch</option></select></label><label>الوجهة <select id="target"><option value="20">VLAN 20</option><option value="10">VLAN 10</option></select></label>'}<button id="toggle" type="button">تشغيل ▶</button><button id="backStep" type="button">السابق</button><button id="nextStep" type="button">الخطوة التالية</button><button id="reset" type="button">إعادة ↺</button></div><div class="scene-view" id="sceneView"></div><div class="state" id="sceneState" role="status"></div><p class="explain" id="sceneExplain"></p><span class="step-count" id="stepCount"></span></div><div class="source">المرجع: <a href="${sceneMeta[s.type].source}" target="_blank" rel="noopener noreferrer">${sceneMeta[s.type].label}</a> · محاكاة مفاهيمية، وليست زمن تحويل فعليًا.</div>`}
function node(name,sub,active){return `<div class="node ${active?'active':''}"><b>${escape(name)}</b><em>${escape(sub)}</em></div>`}
function frameComparison(vlan,native,step,same){
 const field=(name,value,extra='')=>`<div class="frame-field ${extra}"><b>${name}</b><small>${value}</small></div>`;
 const fields=tag=>`${field('Destination MAC',same?'02:00:00:00:10:0B':'02:00:00:00:10:01 · البوابة')}${field('Source MAC','02:00:00:00:10:0A')}${tag?field('802.1Q','4 B · VLAN '+vlan,'tagged'):''}${field('EtherType','0x0800 · IPv4')}${field('Payload','بيانات IP')}${field('FCS','CRC-32 · يعاد حسابه')}`;
 const trunkTag=!native;
 return `<div class="frame-comparison"><div class="frame-version ${step===0||step===3?'focus':''}"><div class="frame-caption">① PC-A → منفذ Access: إطار Ethernet بلا وسم</div><div class="frame-fields" dir="ltr">${fields(false)}</div></div><div class="frame-version ${step===1||step===2?'focus':''}"><div class="frame-caption">② Switch A → Trunk: ${trunkTag?'إضافة وسم IEEE 802.1Q':'Native VLAN 99 · يبقى بلا وسم'}</div><div class="frame-fields" dir="ltr">${fields(trunkTag)}</div></div><p class="tag-breakdown">${trunkTag?`وسم 802.1Q = TPID ‏0x8100 ‏(2 B) + TCI ‏(2 B): ‏PCP ‏3 bits، ‏DEI ‏1 bit، ‏VLAN ID ‏12 bits (= ${vlan}). يُعاد حساب FCS بعد الإدراج.`:'استثناء المثال: Native VLAN 99 متطابقة على طرفَي Trunk؛ لا يُضاف لها وسم في الإعداد المعتاد.'}</p><div class="frame-version ${step===3?'focus':''}"><div class="frame-caption">③ Switch B → منفذ Access → PC-B: ${trunkTag?'إزالة الوسم':'يبقى غير موسوم'}</div><div class="frame-fields" dir="ltr">${fields(false)}</div></div></div>`;
}
function paintScene(type){
 const target=$('target').value,isTrunk=type==='trunk';let title,explanation,diagram;
 if(isTrunk){
  const vlan=$('vlan').value,native=vlan==='99',same=target===vlan;
  const states=[
   ['من الجهاز إلى منفذ Access',`يُنشئ PC-A إطار Ethernet؛ عنوان الوجهة ${same?'MAC جهاز PC-B داخل VLAN نفسها':'MAC بوابته الافتراضية لأن PC-B في شبكة أخرى'}. يصل إلى Switch A دون وسم VLAN؛ منفذ Access يحدد VLAN ${vlan}.`],
   ['الخروج من Switch A إلى Trunk',native?'في هذا المثال VLAN 99 هي Native على الطرفين؛ يخرج الإطار على Trunk دون وسم افتراضيًا.':`عند إخراج الإطار عبر Trunk، يُدرج Switch A وسم IEEE 802.1Q يحمل رقم VLAN ${vlan}، ويعيد حساب FCS.`],
   ['العبور إلى Switch B',native?'يستقبل Switch B الإطار غير الموسوم ويصنفه ضمن Native VLAN 99، بشرط تطابق إعداد Native VLAN في الطرفين.':`يقرأ Switch B وسم 802.1Q فيصنف الإطار ضمن VLAN ${vlan}؛ لا يحوّله الوسم إلى VLAN أخرى.`],
   ['الخروج من منفذ Access',same?`إذا عُرف منفذ الوجهة وكان ضمن VLAN ${vlan}، ${native?'يظل الإطار غير موسوم لأن هذه Native VLAN':'يزيل Switch B وسم 802.1Q قبل الإرسال عبر Access'}، ثم يسلّم إطار Ethernet إلى PC-B.`:`المنفذ المختار ضمن VLAN ${target} مختلف. لا يخرج هذا الإطار إليه؛ التواصل بين VLANs يحتاج توجيه Layer 3.`]
  ];
  [title,explanation]=states[step];
  diagram=`<div class="frame-journey"><div class="topology path-row">${node('PC-A','VLAN '+vlan,step===0)}<span class="arrow ${step===0?'lit':''}">←</span>${node('Switch A','Access → Trunk',step===1)}<span class="arrow ${step===1?'lit':''}">←</span>${node('Trunk',native?'Native: بلا وسم':'802.1Q: VLAN '+vlan,step===2)}<span class="arrow ${step===2?'lit':''}">←</span>${node('Switch B',same?'Access → PC-B':'منفذ غير مطابق',step===3)}</div>${frameComparison(vlan,native,step,same)}<div class="frame-outcome ${step===3&&!same?'blocked':''}">${step===3?(same?(native?'✓ تسليم إطار غير موسوم إلى PC-B':'✓ إزالة الوسم ثم التسليم إلى PC-B'):'⛔ لا يُسلَّم إلى VLAN '+target):step<1?'إطار عادي بلا وسم':'وسم VLAN على Trunk فقط'}</div></div>`;
 }else{
  const method=$('method').value,same=target==='10';
  const methodLabel={none:'لا يوجد توجيه',legacy:'Legacy · منفذ لكل VLAN',router:'Router-on-a-Stick',l3:'Layer 3 Switch'}[method];
  const decision={none:'لا يوجد جهاز Layer 3؛ لا يمكن العبور إلى VLAN 20.',legacy:'يستقبل Router الإطار على منفذه الفيزيائي المتصل بـVLAN 10، ثم يوجّه الحزمة ويخرج من منفذ فيزيائي آخر إلى VLAN 20. الوصلتان Access منفصلتان.',router:'يستقبل Router الإطار عبر Trunk على الواجهة الفرعية لـVLAN 10، ثم يوجّه الحزمة ويعيد إرسالها عبر واجهة VLAN 20 الفرعية على الوصلة نفسها.',l3:'تستقبل SVI الخاصة بـVLAN 10 الحزمة داخل Layer 3 Switch؛ مع ip routing يوجّه الجهاز إلى SVI الخاصة بـVLAN 20.'};
  const delivery={none:'تعذر الاتصال لأن Layer 2 لا يوجّه بين VLANs.',legacy:'يسلّم Router الإطار الجديد إلى VLAN 20 عبر منفذه الفيزيائي الثاني.',router:'يعود الإطار عبر Trunk موسومًا لـVLAN 20، ثم يخرج من منفذ Access إلى المستقبِل بلا وسم.',l3:'يُعيد Layer 3 Switch تغليف الحزمة لإرسالها داخل VLAN 20 إلى المستقبِل.'};
  const states=[['المرسل والبوابة','PC-A في VLAN 10 يرسل إلى عنوان خارج شبكته؛ يوجّه الإطار أولًا إلى MAC بوابته الافتراضية.'],['حد VLAN','VLAN 10 وVLAN 20 مجالا بث منفصلان؛ التبديل في Layer 2 وحده لا يكفي.'],['قرار '+methodLabel,decision[method]],['الوصول إلى VLAN 20',delivery[method]]];
  [title,explanation]=states[step];if(same){title='الوجهة في VLAN 10 نفسها';explanation='يستخدم المضيف Layer 2 داخل VLAN 10؛ لا يحتاج إلى Inter-VLAN Routing.'}
  const routeNode=same?'لا يلزم توجيه':method==='legacy'?'Router · منفذان فعليان':method==='router'?'Router · Subinterfaces':method==='l3'?'SVI 10 → SVI 20':'لا يوجد موجّه';
  const routeLink=method==='router'?'Trunk واحد':method==='legacy'?'وصلتا Access':'داخل المحوّل';
  diagram=`<div class="topology">${node('PC-A','VLAN 10',step===0)}<span class="arrow">←</span>${node('Switch',routeLink,step===1)}<span class="arrow">←</span>${node(routeNode,same?'Layer 2':method==='none'?'توقف':'Layer 3',step===2)}<span class="arrow">←</span>${node('PC-B','VLAN '+target,step===3)}</div>`;
 }
 $('sceneView').innerHTML=diagram;$('sceneState').textContent=`${step+1} / 4 · ${title}`;$('sceneExplain').textContent=explanation;$('stepCount').textContent=`الخطوة ${step+1} من 4`;$('backStep').disabled=step===0;$('nextStep').disabled=step===3;
}
function pause() {if(timer){clearInterval(timer);timer=null;const b=$('toggle');if(b)b.textContent='تشغيل ▶'}}
function initScene(type){step=0;const update=()=>{pause();step=0;paintScene(type)};$('sceneView').parentElement.querySelectorAll('select').forEach(x=>x.onchange=update);$('backStep').onclick=()=>{pause();step=Math.max(0,step-1);paintScene(type)};$('nextStep').onclick=()=>{pause();step=Math.min(3,step+1);paintScene(type)};$('reset').onclick=()=>{pause();step=0;paintScene(type)};$('toggle').onclick=()=>{if(timer){pause();return}if(step===3)step=0;paintScene(type);$('toggle').textContent='إيقاف مؤقت ❚❚';timer=setInterval(()=>{if(step===3){pause();return}step++;paintScene(type)},2600)};paintScene(type)}
function compareMarkup(){return `<div class="kicker">الوحدة ٤ · الخيارات الثلاثة</div><h2>كيف نربط شبكات VLAN؟</h2><p class="lead">طرق مختلفة تؤدي وظيفة التوجيه نفسها، لكنها تختلف في الوصلات وسهولة التوسع.</p><div class="body"><div class="comparison-table-wrap"><table class="method-table"><thead><tr><th>الجانب</th><th>Legacy</th><th>Router-on-a-Stick</th><th>Layer 3 Switch</th></tr></thead><tbody><tr><th>الربط</th><td>منفذ فعلي وكابل Access لكل VLAN على Router</td><td>منفذ فعلي واحد إلى Router عبر Trunk</td><td>التوجيه داخل المحوّل بواسطة SVIs</td></tr><tr><th>بوابة كل VLAN</th><td>IP على منفذ Router الفيزيائي</td><td>IP على Subinterface مع dot1Q</td><td>IP على SVI مع تفعيل ip routing</td></tr><tr><th>التوسع</th><td>محدود بعدد منافذ Router والكابلات</td><td>VLANs عديدة على رابط واحد؛ الرابط والـRouter موردان مشتركان</td><td>ملائم لتوجيه VLANs داخل بيئة التحويل حسب قدرات الجهاز</td></tr><tr><th>نقطة تحقق</th><td>حالة المنافذ وVLAN لكل وصلة</td><td>Trunk وdot1Q وواجهات Router الفرعية</td><td>SVIs وحالة VLAN وip routing</td></tr></tbody></table></div><div class="grid"><div class="card"><b>Legacy</b><p>للتوضيح التاريخي أو عدد صغير من VLANs؛ يستهلك منفذًا وكابلًا لكل VLAN.</p></div><div class="card"><b>Router-on-a-Stick</b><p>يختصر المنافذ باستخدام Trunk واحد، لكنه يشارك الوصلة في حركة الشبكات.</p></div><div class="card"><b>Layer 3 Switch</b><p>يضع بوابات VLANs في المحوّل نفسه عبر SVIs ويتيح التوجيه داخليًا.</p></div></div><p class="source">المصدر: <a href="https://www.ciscopress.com/articles/article.asp?p=3089357&seqNum=4" target="_blank" rel="noopener noreferrer">Cisco Press · Inter-VLAN Routing Operation</a></p></div>`}
function diagnoseMarkup(){return `<div class="kicker">الوحدة ٤ · نشاط تشخيص</div><h2>شخّص مسار الاتصال</h2><p class="lead">PC في VLAN 10 لا يصل إلى PC في VLAN 20. اختر أول نقطة فحص، ثم تابع.</p><div class="body"><div class="choice-list" id="diagChoices"></div><div class="feedback" id="diagFeedback" hidden></div></div>`}
const diag=[['هل المنفذ Access في VLAN الصحيحة؟','افحص show vlan brief وحالة منفذ المصدر.'],['هل Trunk يعمل ويسمح بالـVLAN المطلوبة؟','افحص show interfaces trunk وNative/Allowed VLANs.'],['هل Subinterface أو SVI والبوابة صحيحة؟','افحص dot1Q وعناوين IP وip routing عند Layer 3 Switch.'],['هل التوجيه وحالة الواجهات سليمان؟','تحقق من الواجهات والمسارات ثم أعد الاختبار من المضيف.']];
function initDiagnose(){let i=0;const paint=()=>{$('diagChoices').innerHTML=diag.map((x,n)=>`<button class="choice" data-diag="${n}">${n+1} · ${escape(x[0])}</button>`).join('');$('diagChoices').querySelectorAll('button').forEach((b,n)=>{b.disabled=n!==i;b.classList.toggle('correct',n<i)});$('diagChoices').onclick=e=>{const b=e.target.closest('[data-diag]');if(!b||+b.dataset.diag!==i)return;$('diagFeedback').hidden=false;$('diagFeedback').textContent=diag[i][1];i++;paint()}};paint()}
function quizMarkup(s){const q=quizzes[s.module.module_number];return `<div class="kicker">الوحدة ${s.module.module_number} · تحقّق من الفهم</div><h2>${escape(q.q)}</h2><div class="body"><div class="choice-list">${q.answers.map((x,i)=>`<button class="choice" data-answer="${i}">${escape(x)}</button>`).join('')}</div><div class="feedback" id="quizFeedback" hidden></div></div>`}
function render(){pause();const s=slides[at];let main='';if(s.type==='cover')main=`<div class="kicker">CCNA 2 · الوحدتان ٣–٤</div><h1>VLAN وInter-VLAN Routing</h1><p class="lead">من عزل حركة Layer 2 إلى بناء طريق آمن وواضح بين الشبكات. اختر الشرائح من الفهرس أو تنقل بالأسهم، وتفاعل مع المشهدين خطوة بخطوة.</p><div class="body grid"><div class="card"><b>الوحدة ٣ · VLANs</b><p>Access، Trunk، IEEE 802.1Q، Native VLAN وDTP.</p></div><div class="card"><b>الوحدة ٤ · Inter-VLAN Routing</b><p>Router-on-a-Stick، SVI، Layer 3 Switch والتشخيص.</p></div></div>`;else if(s.type==='intro')main=`<div class="kicker">الوحدة ${s.module.module_number} · ${escape(s.module.lecture.duration)}</div><h1>${escape(s.module.title)}</h1><p class="lead">${escape(s.module.summary)}</p><div class="body"><div class="card"><b>هدف الوحدة</b><p>${escape(s.module.official_objective)}</p></div></div>`;else if(s.type==='agenda')main=`<div class="kicker">الوحدة ${s.module.module_number}</div><h2>مسار المحاضرة</h2><div class="body agenda">${s.steps.map(x=>`<div><b>${escape(x.time)}</b>${escape(x.topic)}</div>`).join('')}</div>`;else if(s.type==='section')main=sectionHtml(s);else if(s.type==='trunk'||s.type==='routing')main=sceneMarkup(s);else if(s.type==='diagnose')main=diagnoseMarkup();else if(s.type==='compare')main=compareMarkup();else main=quizMarkup(s);$('stage').innerHTML=`<article class="slide">${main}<footer class="foot"><span>${escape(s.module?.title_en||'VLAN & Inter-VLAN Routing')}</span><span>${at+1} / ${slides.length}</span></footer></article>`;$('count').textContent=`${at+1} / ${slides.length}`;$('progress').style.width=((at+1)/slides.length*100)+'%';$('prev').disabled=at===0;$('next').disabled=at===slides.length-1;if(s.type==='trunk'||s.type==='routing')initScene(s.type);if(s.type==='diagnose')initDiagnose();if(s.type==='quiz')$('stage').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const q=quizzes[s.module.module_number];$('stage').querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;x.classList.toggle('correct',+x.dataset.answer===q.correct);x.classList.toggle('wrong',x===b&&+x.dataset.answer!==q.correct)});$('quizFeedback').hidden=false;$('quizFeedback').textContent=(+b.dataset.answer===q.correct?'صحيح. ':'راجع الفكرة. ')+q.reason});history.replaceState(null,'',`#slide-${at+1}`)}
function go(i){if(i<0||i>=slides.length)return;at=i;render()}$('prev').onclick=()=>go(at-1);$('next').onclick=()=>go(at+1);$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('menuBtn').onclick=()=>$('menu').classList.add('open');$('closeMenu').onclick=()=>$('menu').classList.remove('open');$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('open')};$('menuList').innerHTML=slides.map((s,i)=>`<button data-slide="${i}">${i+1} · ${escape(s.title||s.section?.title||'عرض المحاضرة')}</button>`).join('');$('menuList').onclick=e=>{const b=e.target.closest('[data-slide]');if(b){$('menu').classList.remove('open');go(+b.dataset.slide)}};document.addEventListener('keydown',e=>{if(e.target.closest('button,input,select,textarea,summary'))return;if($('menu').classList.contains('open')){if(e.key==='Escape')$('menu').classList.remove('open');return}if(['ArrowLeft','PageDown'].includes(e.key))go(at+1);if(['ArrowRight','PageUp'].includes(e.key))go(at-1)});let startX=0,startY=0;$('stage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('.body,.scene,button,select,summary'))return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>85&&Math.abs(dx)>1.5*Math.abs(dy))go(at+(dx<0?-1:1))},{passive:true});const match=location.hash.match(/^#slide-(\d+)$/);if(match)at=Math.max(0,Math.min(slides.length-1,+match[1]-1));render();
})();</script></body></html>
