<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="مراجعة LAN Security وSwitch Security Configuration ضمن مقرر CCNA2 / SRWE">
  <title>LAN Security | CCNA2</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/quiz.css">
</head>
<body data-section="lan-security" data-source="../data/lan-security.json">
  <header class="quiz-header">
    <div class="shell quiz-header-row">
      <div>
        <a class="back-link" href="../index.html">→ العودة إلى الأقسام</a>
        <h1 class="quiz-title" id="sectionTitle">LAN Security</h1>
        <p class="quiz-subtitle" id="sectionSubtitle">LAN Security Concepts · Switch Security Configuration</p>
      </div>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="تبديل المظهر">◐</button>
    </div>
  </header>

  <main class="shell quiz-layout">
    <aside class="panel settings" aria-label="إعدادات المراجعة">
      <h2>الإعدادات</h2>

      <div class="field">
        <label for="modeSelect">الوضع</label>
        <select id="modeSelect">
          <option value="review">مراجعة</option>
          <option value="exam">اختبار</option>
        </select>
      </div>

      <div class="field">
        <label for="displaySelect">طريقة العرض</label>
        <select id="displaySelect">
          <option value="single">سؤال واحد كل مرة</option>
          <option value="batch">مجموعة أسئلة</option>
          <option value="all">جميع الأسئلة</option>
        </select>
      </div>

      <div class="field">
        <label for="countSelect">عدد الأسئلة</label>
        <select id="countSelect">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
        </select>
      </div>

      <div class="field">
        <label for="topicFilter">الموضوع</label>
        <select id="topicFilter"><option value="">كل الموضوعات</option></select>
      </div>

      <div class="field">
        <label for="difficultyFilter">المستوى</label>
        <select id="difficultyFilter"><option value="">كل المستويات</option></select>
      </div>

      <div class="field">
        <label for="skillFilter">المهارة</label>
        <select id="skillFilter"><option value="">كل المهارات</option></select>
      </div>

      <button class="action-btn" id="startBtn" type="button">ابدأ</button>
      <button class="action-btn secondary" id="resetBtn" type="button">إعادة ضبط التقدم</button>
    </aside>

    <section class="panel content-panel" id="quizContent" aria-live="polite">
      <div class="empty-state"><div class="box"><h2>جاري تحميل القسم…</h2></div></div>
    </section>
  </main>

  <script src="../js/app.js" defer></script>
  <script src="../js/quiz-engine.js" defer></script>
</body>
</html>
